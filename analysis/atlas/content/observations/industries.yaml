# The industries lens (section 6 of the notebook): one row per ANZSIC division and financial year. Markup and rules
# as in firms.yaml.

- id: U73
  lens: industries
  about: data
  headline: The industry data cover 19 industries over 37 years, but business and R&D counts cover only recent years
  statement: >-
    IP columns and gross value added are filled for every division and year, FY1990 to FY2026. Business counts cover
    FY2023 to FY2026, business R&D only FY2024, wages FY1998 to FY2026 (18 divisions; the index leaves out
    agriculture) and creative value added FY2016 to FY2025 for 10 divisions.
  figures:
    - value: "19"
      label: industry divisions
    - value: "FY2024"
      label: the only year of business R&D by division
  points:
    - "So Stage 2 can relate IP to businesses over four years and to R&D in one, across 19 divisions: few points, so
      comparisons are of patterns, not models."
    - "Gross value added (from the national accounts, added after Stage 2) grows from $829,808 million (FY1990) to
      $2,358,315 million (FY2026) across the divisions. Manufacturing was the largest division in FY1990 (14.2%) and is
      6.0% by FY2026, when mining is largest (12.5%)."
    - "Value added gives 37 years for every division, enough to follow change within a division; Stage 2 used it in
      one year only ({B57}), so the longer comparison is open for Stage 3."
  questions:
    - q: 2
      how: Industry is one of the dimensions Q2 asks about; this says how much can be compared, and when.
    - q: 3
      how: R&D by industry is a complementary capability; there is only one year of it.
  sources: [iprapid, abs_cabee, abs_rd_vc, abs_prices, bcarr_creative, abs_national_accounts]
  chart:
    type: range
    title: Which years each industry measure covers
    x: {type: category, values: [IP applications, Gross value added, Wages (WPI), Creative value added, Businesses (CABEE), Business R&D (BERD)]}
    y: {name: Financial year, min: 1985, max: 2030, format: year}
    series:
      - name: Years covered
        data: [[1990, 2026], [1990, 2026], [1998, 2026], [2016, 2025], [2023, 2026], [2024, 2024]]
    source: IP RAPID; ABS national accounts, CABEE, BERD and WPI; BCARR (lens industries)
    note: Business R&D covers a single year (2023-24).
  prep:
    - what: "One row per broad industry (ANZSIC division) and financial year, from 1989–90 to 2025–26."
      why: "Overseas applicants' countries are rarely recorded in the earliest years ({U67})."
  steps:
    - For each column, find the first and last year with values, and the divisions it covers.
  assumptions:
    - The ABS's division codes are the same across its releases.
  limits:
    - Short series for businesses and R&D limit what can be tested.
  next: >-
    Stage 2 compares patterns across divisions, not models.
  terms: [anzsic, gerd, cabee]
  related: [U74, U77, U78]

- id: U74
  lens: industries
  about: data
  headline: Nearly every right can be assigned to an industry, and for patents the broad industry is usually clear
  statement: >-
    The published crosswalks carry 98.42% to 99.73% of standard patents (FY1990 to FY2024) and 99.82% to 99.93% of trade
    marks to an industry. A standard patent's largest division share has a median of 0.996, but its largest subdivision
    share only 0.727. A trade mark's division is less clear (median 0.792).
  figures:
    - value: "0.996"
      label: "typical share of a patent assigned to its main broad industry"
    - value: "0.727"
      label: "typical share assigned to its main narrower industry"
  points:
    - "77.9% of standard patents put 90% or more in one division; 39.28% of trade marks do."
    - "Patent classes unknown to the crosswalk fell from 12,143 to 71 after mapping new or retired classes to their
      predecessors."
    - "So division counts for patents are close to certain; subdivision counts and all trade mark counts are spread
      estimates."
  questions:
    - q: 2
      how: Says how precisely IP can be placed in industries, which limits every industry comparison.
  sources: [concordances, iprapid]
  chart:
    type: bar
    horizontal: true
    title: How decisively a right is placed in one industry
    subtitle: The median share of a right in its largest industry (1 = entirely in one)
    x: {type: category, values: ["Standard patent, division", "Trade mark, division", "Standard patent, subdivision"]}
    y: {name: Median largest share, min: 0, max: 1, format: num, digits: 3}
    series:
      - name: Median largest share
        data: [0.996, 0.792, 0.727]
    source: IP RAPID; ALP crosswalks; ABS ANZSIC 2006 (lens industries)
  prep:
    - what: "Each right is shared equally across its classes, and each class is shared across industries using
            published probabilities."
      why: No firm in the corpus has an industry, so IP reaches industries only through what it protects (ADR 0020).
    - what: The step between two industry classifications gives weight to full links first.
      why: "Sharing across weak links had sent half of the pharmaceutical patents to textile finishing."
  steps:
    - For each right, add up its shares by division and by subdivision.
    - Take each right's largest share, and summarise across rights.
    - "Count the share of rights that can be assigned to an industry, by year."
  assumptions:
    - "The published probabilities, from research elsewhere, fit Australian rights as well as the rights they were
      built from."
  limits:
    - An industry here is what a right protects, not who filed it or who uses it.
  next: >-
    Stage 2 reports patents by division, and treats subdivisions as estimates.
  terms: [crosswalk, expected-count, anzsic]
  related: [U75]

- id: U75
  lens: industries
  about: system
  headline: Nine in ten patents are assigned to manufacturing, partly because the method leaves out services
  statement: >-
    Of standard patents filed FY2017 to FY2026, manufacturing is allocated 90.78%, utilities 4.76% and agriculture
    2.04%; no service industry gets more than 0.23%, because the crosswalk used here leaves services out. A patent's
    industry says what kind of product its technology is, not who files or uses it. Trade marks spread more widely:
    manufacturing 55.65%, professional services 11.05%.
  figures:
    - value: "90.78%"
      label: of standard patents fall in manufacturing
    - value: "55.65%"
      label: of trade marks fall in manufacturing
  points:
    - "Within manufacturing: machinery and equipment 31.18% of all standard patents, chemicals (including
      pharmaceuticals) 30.17%."
    - "Manufacturing's share of trade marks fell from 73.94% (FY1990) to 56.51% (FY2000) and has stayed near 55%."
    - "**With services in the crosswalk** (added after Stage 2, {U114}), manufacturing's share over FY2016 to FY2025 is
      79.67% rather than 90.63%."
    - "**The 2002 break:** accommodation and food services have no trade marks to FY2001 and 1.67% from FY2003. That
      matches the Nice classification's 8th edition, which split class 42 into classes 42 to 45 in January 2002, so
      trade mark shares are compared from FY2003 on, or across the break with that caveat."
  questions:
    - q: 2
      how: "Which industries IP serves is part of who benefits. Any answer must state the limit of the method that
           assigns patents to industries."
    - q: 3
      how: Industry is one condition that may decide whether protection produces value.
  sources: [iprapid, concordances]
  chart: U75
  notebook_charts: [0, 1]
  prep:
    - what: "Each right is shared across industries by published probabilities, giving estimated counts, for 2016–17
            to 2025–26."
      why: A right can belong partly to several industries ({U74}).
  steps:
    - "Add up each industry's estimated count of standard patents and trade marks."
    - Work out each division's share.
    - Follow each division's share over time, and look for breaks.
  assumptions:
    - A patent's division says what kind of product its technology is.
  limits:
    - Industry counts are allocations by technology, not counts of what each industry's businesses file.
    - "The main method gives service industries almost no patents. A version that includes services is compared in
      {U114}."
  next: "Stage 2 compares trade marks from 2002–03. Stage 3 also runs the industry comparisons with the version that
        includes services."
  terms: [crosswalk, expected-count, anzsic, nice]
  related: [U74, U76, U77]

- id: U76
  lens: industries
  about: system
  headline: Australians file a small share of patents in every industry, but most trade marks in services
  statement: >-
    Of the standard patents allocated to manufacturing, Australian filers made 7.94%; of agriculture's 9.02%, utilities'
    10.68% and construction's 17.4%. Of trade marks, they made 47.67% to 58.95% of those allocated to the goods
    industries and 67.13% to 79.83% of those allocated to services.
  figures:
    - value: "7.94%"
      label: of manufacturing's patents filed by Australians
    - value: "67.13% to 79.83%"
      label: of services' trade marks filed by Australians
  points:
    - "Patent shares are given only where a division's expected count is above 50."
    - "Professional services are the lowest of the services divisions for trade marks, other services the highest."
  questions:
    - q: 2
      how: "Australians file a small share of the patents assigned to every industry. Most of the trade marks assigned
           to services are Australians'."
  sources: [iprapid, concordances]
  chart: U76
  prep:
    - what: "Patent shares are shown only where an industry's estimated count is above 50."
      why: A share of a handful of patents is not meaningful.
  steps:
    - "For each industry, divide Australians' estimated count by the total, for patents and trade marks."
  assumptions:
    - "An application is Australian if any original applicant was in Australia, IP Australia's own definition (ADR
      0037). Counting the current owner instead lowers each share by up to 0.71 percentage points."
  limits:
    - "These are estimated counts from what each right protects, not counts of filings by businesses in each
      industry."
  next: >-
    Stage 2 relates these shares to each industry's businesses and R&D.
  terms: [expected-count]
  related: [U75, U7]

- id: U77
  lens: industries
  about: system
  headline: Construction, professional services and property hold two in five businesses; manufacturing holds 3.2%
  statement: >-
    In June 2026, construction had 478,651 businesses (17.0%), professional, scientific and technical services 366,289
    (13.0%) and rental, hiring and real estate 319,717 (11.4%). Manufacturing had 90,879 (3.2%).
  figures:
    - value: "478,651"
      label: construction businesses, the largest division
    - value: "3.2%"
      label: of businesses are in manufacturing
  points:
    - "Growth FY2023 to FY2026: health care 30.7%, transport 24.5%; agriculture −2.9%."
    - "Entry rates in FY2026 run from 7.4% (agriculture) to 26.5% (transport); exit rates from 7.9% to 21.7%."
    - "So a rate of IP per business would set manufacturing's many patents against few businesses."
  questions:
    - q: 2
      how: Where businesses are tells Stage 2 what IP per business in each industry would mean.
  sources: [abs_cabee]
  chart: U77
  notebook_charts: [0]
  prep:
    - what: Business counts come from CABEE by division, at the start and end of each financial year.
      why: CABEE is the ABS's count of businesses actively trading, by industry.
  steps:
    - Take each division's businesses in June 2026, and its share.
    - "Work out growth since 2022–23, and the rates at which businesses start and close."
  assumptions:
    - A business's industry is as the ABS records it.
  limits:
    - Four years of counts only.
  next: "Stage 2 reads IP per business with the limits of the industry method in mind ({U75})."
  terms: [cabee, anzsic]
  related: [U75, U78]

- id: U78
  lens: industries
  about: system
  headline: Professional services spend the most on R&D, and mining the most per business
  statement: >-
    Business R&D was $24.41 billion in 2023-24: professional, scientific and technical services 37.6%, manufacturing
    20.7% and finance 14.3%. Per business, mining spent $142,100 and manufacturing $55,770, against $3,175 in agriculture.
  figures:
    - value: "$24.41 billion"
      label: business R&D in 2023-24
    - value: "37.6%"
      label: of it in professional services
  points:
    - "Wages rose 44.5% (rental, hiring and real estate) to 56.8% (utilities) from FY2010 to FY2025."
    - "Creative value added (nominal): professional services $16,950 million (FY2016) to $28,630 million (FY2025)."
  questions:
    - q: 3
      how: R&D is a complementary capability; its spread shows where invention effort is, beside where patents fall.
    - q: 4
      how: "Industries that spend on R&D but receive few patents are worth following up in Stage 2."
  sources: [abs_rd_vc, abs_prices, bcarr_creative, abs_cabee]
  chart: U78
  notebook_charts: [0]
  prep:
    - what: R&D per business uses June 2024 business counts.
      why: It matches the R&D year.
  steps:
    - Take each division's business R&D for 2023-24, and its share.
    - Divide by the division's businesses.
    - "Work out wage growth from 2009–10 to 2024–25."
  assumptions:
    - Business R&D is recorded under the industry of the business that spends it.
  limits:
    - One year of R&D; nominal dollars.
  next: >-
    Stage 2 sets R&D beside IP by industry.
  terms: [gerd, nominal]
  related: [U73, U77]

- id: U79
  lens: industries
  about: system
  headline: About a fifth of businesses introduced a new good or service in 2023
  statement: >-
    21.7% of businesses introduced a new good or service in 2023 (22.0% in 2021), from 9.9% in agriculture to 31.9% in
    information media. 61.9% of businesses operating in June 2022 survived to June 2026, from 47.3% in transport to 74.5%
    in agriculture.
  figures:
    - value: "21.7%"
      label: of businesses introduced a new good or service (2023)
    - value: "61.9%"
      label: of businesses survived June 2022 to June 2026
  points:
    - "The attachments hold 1,425,157 rows, most of them CABEE's counts by class, state and area; 15,282 come from the
      2024-25 business survey cubes added after Stage 2 ({U119})."
    - "A row is not always a number: the business survey flags 36.2% of its values for sampling error, and 25% are not
      available for publication."
    - "BCARR's two releases agree within 1.2% where they overlap; they stay separate."
  questions:
    - q: 1
      how: Innovation without IP is part of the picture the research goal insists on; this measures it by industry.
    - q: 3
      how: Innovation beside IP use is the comparison Q3 needs.
  sources: [abs_bcs, abs_cabee, bcarr_creative, abs_bcs_cubes]
  chart: U79
  prep:
    - what: Every value the ABS and BCARR publish by industry is kept in a long companion table, with the ABS's flags.
      why: "It keeps every value, with its reliability, without crowding the main industry table (ADR 0020)."
  steps:
    - Count values by source.
    - Take the share of businesses that introduced a new good or service, by division.
    - Take the share of June 2022's businesses that survived to June 2026.
  assumptions:
    - Survey estimates are as reliable as the ABS's flags say.
  limits:
    - Many survey values have large sampling errors.
  next: >-
    Stage 2 sets innovation beside IP by industry.
  terms: [bcs, cabee, attachment]
  related: [U73, U77]

- id: U114
  lens: industries
  about: data
  headline: Letting patents go to services spreads them over all 19 industries and cuts manufacturing's share to 79.67%
  statement: >-
    The full crosswalk sends 5.15% of its weight to service industries; the recommended one, which the lens uses,
    none. With services, standard patent applications (FY2016 to FY2025) reach 19 divisions instead of 8, and
    manufacturing's share falls from 90.63% to 79.67%.
  figures:
    - value: "8 → 19"
      label: divisions with patents, without and with services
    - value: "90.63% → 79.67%"
      label: manufacturing's share of standard patents
    - value: "5.15%"
      label: "of patents assigned to services by the version that includes them"
  points:
    - "The totals agree (301,515 and 301,513 expected applications)."
    - "Information media gains 3.96% of applications, health care 2.94%, wholesale trade 1.48%, professional services
      0.53% (from 0.03%)."
    - "Australians' applications: manufacturing 87.65% to 75.12%; arts and recreation gains 2.86% and wholesale trade
      2.75%."
    - "The crosswalk without services stays the main measure; the counts with services sit beside it, never added."
  questions:
    - q: 3
      how: Lets industry-level patent pairs include services, which most of the economy is.
  sources: [concordances, iprapid]
  chart:
    type: bar
    title: Manufacturing's share of standard patent applications
    subtitle: FY2016 to FY2025, through ALP's crosswalk without and with services
    x: {type: category, values: [All applications, Australians' applications]}
    y: {name: "% of applications", min: 0, max: 100, format: pct, digits: 2}
    series:
      - name: Without services
        data: [90.63, 87.65]
        colour: muted
      - name: With services
        data: [79.67, 75.12]
    source: IP RAPID; ALP crosswalks (lens industries)
  prep:
    - what: "A published version of the industry method that also assigns patents to services, added beside the main
            one."
      why: "The main method gives services no patents ({U75})."
  steps:
    - "Share standard patent applications across industries using both versions."
    - Compare the totals and each division's share.
  assumptions:
    - ALP's service weights are sound, though its authors recommend the version without them.
  limits:
    - "These are estimated counts from what each patent protects, not counts of firms in each industry."
  next: >-
    Stage 2 redoes the industry pairs with both ({B53}, {B54}).
  terms: [crosswalk, expected-count, anzsic]
  related: [B53, B54, U75]

- id: U119
  lens: industries
  about: data
  headline: The share of businesses that innovate fell after 2020-21 and has not recovered
  statement: >-
    12 data cubes with 849 indicators for 17 divisions. Businesses with any innovation activity: 51.9% (2020-21),
    45.7% (2022-23) and 45.6% (2024-25). In 2024-25 from 27.6% in transport, postal and warehousing to 59.4% in
    retail.
  figures:
    - value: "51.9% → 45.6%"
      label: businesses with any innovation activity, 2020-21 to 2024-25
    - value: "849"
      label: indicators in 12 data cubes
  points:
    - "Professional services fell from 60.2% to 44.4% and administrative services from 53.5% to 36.3% over the three
      surveys."
    - "The ABS published no 2023-24 release, and the survey leaves out public administration and education."
    - "Each is a sample estimate, so differences of a few points are not reliable ({U79})."
  questions:
    - q: 3
      how: A third survey year to set innovation beside IP by industry ({B60}).
  sources: [abs_bcs_cubes]
  chart:
    type: bar
    title: Businesses with any innovation activity
    subtitle: All businesses, by survey year
    x: {type: category, values: [2020-21, 2022-23, 2024-25]}
    y: {name: "% of businesses", min: 0, max: 60, format: pct, digits: 1}
    series:
      - name: Innovation-active
        data: [51.9, 45.7, 45.6]
    source: ABS Business Characteristics Survey, data cubes (lens industries)
  prep:
    - what: "The survey's detailed tables, added to the industry data beside the figures already there, and never
            added to them."
      why: The cubes hold the 2024-25 release the API does not.
  steps:
    - "Read every table, keeping track of which businesses each covers (all, those innovating, or those not)."
  assumptions:
    - The cubes' definitions match the earlier releases'.
  limits:
    - Sample estimates; small differences are not reliable.
  next: >-
    Stage 2 repeats {B42} with it ({B60}).
  terms: [bcs, anzsic]
  related: [B60, U79]
