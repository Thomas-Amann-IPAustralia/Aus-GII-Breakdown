# The review against IP Australia's published evidence, as the atlas shows it (ADR 0024, 0025, 0052): Stage 1's
# U0 to U98 (27 October 2026) and the later observations with Stages 2 and 3 (4 November 2026).
# Plain English, Australian spelling, sentence case. Markup: **bold**, [[term]], {U44}, OQ numbers.
# The record is docs/audit-ip-australia.md: each observation's verdict is read from its tables, and every number
# written here must appear in the record or in the benchmark's outputs (analysis/audit/output), or the build fails.

title: Checked against IP Australia
eyebrow: Review · every stage against the publisher's own figures
as_at: "2026-11-04"
lead: >-
  IP Australia publishes its own figures on the IP system every year, in its Australian IP Reports, and its own
  research. This review checks the observations against them: where IP Australia has published the same thing, do
  the two agree? Where it has drawn a conclusion, what does the evidence here add?

banner: >-
  **Two passes, one record.** The review of 27 October 2026 checked Stage 1's observations U0 to U98; on 4 November
  2026 the same check was made of the 130 observations since (U99 to U127, and Stages 2 and 3), so all 229 now have a
  verdict. Neither pass changed an observation. Since then, IP Australia's own register has settled
  one of its four disagreements and narrowed another, and the observations it bore on were restated in the notebook
  beside their first wording, at the research owner's decision. Each verdict below is as the review gave it; "Since
  the review" and the notes on each disagreement say where things now stand.

stats:
  - value: "208"
    label: figures IP Australia published, recounted from the project's data
  - value: "168"
    label: agree within the tolerance
  - value: "229"
    label: observations with a verdict, in two passes
  - value: "0"
    label: observations contradicted

in_brief:
  - >-
    **Stage 1's counts hold up.** IP Australia's own yearly figures are reproduced from Stage 1's data for every kind
    of right. Standard patent applications agree in all 12 years from 2014 to 2025, within 0.34%; provisional
    applications within 0.25%; standard patents granted within 0.03%.
  - >-
    **No observation is contradicted.** 23 are corroborated, 9 are consistent with what IP Australia says, 1 is
    disputed in part, and 66 cannot be tested because IP Australia publishes nothing comparable.
  - >-
    **Four things do not agree** (below). Three change how an observation should be read; none overturns one.
  - >-
    **Two questions close or narrow.** The jump in innovation patents in 2016 ({U67}) was a real rise that IP
    Australia reported itself. The fall in first observed trade mark filers ({U45}) is mostly a fall in linking filers
    to their ABNs, not in filing.
  - >-
    **The later observations and Stages 2 and 3** (checked on 4 November 2026): 13 more published figures were
    recounted, and all 13 agree, among them the 2015 fees and the register's origin for designs. Of the 130
    observations, 3 are corroborated, 28 consistent and 6 qualified; 93 cannot be tested, mostly because IP Australia
    publishes few associations between two or more things. None is disputed or contradicted.
  - >-
    **Since the first review,** IP Australia's register has settled the designs of unknown origin (D1) and shown that IP
    RAPID is not the odd one out for 2018's trade marks (D2). The individuals' 55.6% (D3) is still open. Rebuilt on 4
    November 2026, the lenses give the same 195 figures and the same 155 agreements.

since_intro: >-
  What has happened to the review's findings since 27 October 2026. IP Australia's register was checked against IP
  RAPID the same week, and the gaps it found were filled in the lenses at the research owner's decision; Stages 2 and
  3 have since tested several of the conclusions IP Australia draws.

since:
  - title: Designs of unknown origin (D1)
    status: Settled
    text: >-
      IP Australia's register gives a country for 25,018 of the 40,748 designs IP RAPID leaves without one, Australia
      for 20,870. Added to Stage 1's count, they give 2,601, 2,660 and 3,078 Australian designs in 2021, 2023 and
      2025, against IP Australia's 2,595, 2,652 and 3,078. The lenses now carry the register's country beside IP
      RAPID's: 32.64% of designs filed FY2017 to FY2026 are Australian, and 0.083% are of unknown origin ({U102}).
  - title: Trade marks filed in 2018 (D2)
    status: Narrowed
    text: >-
      WIPO's count of Madrid designations agrees with IP RAPID (0.9933), and so does IP Australia's own register:
      78,643 by the date lodged, 77,726 by the date filed, neither near the report's 79,490. Three sources now stand
      against the report's 2018 figure, so IP RAPID is unlikely to be the one that is short. 2018 stays flagged, and
      OQ13 asks what the report counted.
  - title: Individuals' 55.6% of resident applications (D3)
    status: Still open
    text: IP Australia has not yet said what the figure counts (OQ12). {U13} and {U48} stand on Stage 1's evidence.
  - title: Observations restated beside their first wording
    status: Done
    text: >-
      {U7}, {U13}, {U34} and {U45} were restated in the notebook with the register's evidence ({U99} to {U104}), and
      later reviews restated others. For trade marks filed since July 2024 with no ABN in IP RAPID, the register
      holds an ABN, or a company number linked to one, for 83.8% ({U100}, {U101}).
  - title: IP Australia's conclusions, tested further
    status: Done
    text: >-
      Stage 3 held other factors together for three of them. The link between fast-track examination and patents
      kept longer, from IP Australia's commissioned study, does not survive the filer, field and route held together
      (C3, {M5}). FY2025's fall in provisionals followed up is in new and heavy individual filers (C1, {M35}).
      Raising the Bar's rush holds with trend and season held (C5, {M25}).
  - title: The later observations and Stages 2 and 3
    status: Done
    text: >-
      Checked on 4 November 2026, as the first review was: {U99} to {U127}, {B1} to {B63} and {M1} to {M38}. The
      verdicts are in their own section below.

method:
  - title: Find what IP Australia has published
    text: >-
      Its twelve Australian IP Reports (2015 to 2026), its research papers and its analytic notes, as the project's
      companion repository holds them, page by page. The IP Report 2026 was read in full; the others were searched
      topic by topic, and every passage that bears on an observation was read in context.
  - title: Count the same thing the same way
    text: >-
      IP Australia counts calendar years, and counts an application as Australian if one of its filers gave an
      Australian origin. Stage 1's data were recounted the same way. This reproduces IP Australia's count of
      Australian standard patent applications exactly in 2022 and 2025 (2,494 and 2,810).
  - title: Allow for small differences
    text: >-
      A count agrees if it is within 2% of IP Australia's, a share if it is within 1 percentage point. IP Australia
      revises its figures between editions, so the latest edition to give a year is used.
  - title: Give each observation a verdict
    text: >-
      Each observation is marked by how it stands against IP Australia's evidence, from corroborated to not testable.
      A match says Stage 1 reads the register as IP Australia does; it says nothing about why.
  - title: Keep it checkable
    text: >-
      The 195 figures, each with its report and page, and the code that recounts them, are kept in the repository. A
      test fails if they fall out of step with the data.

verdict_words:
  corroborated: IP Australia publishes the same figure, and Stage 1's data reproduce it once both count it the same way.
  consistent: IP Australia publishes a related figure or finding that points the same way, but not the same figure.
  qualified: IP Australia's figures agree, but show a caveat the observation does not state.
  disputed: IP Australia gives a figure for what reads as the same thing, and Stage 1's data cannot reproduce it.
  contradicted: IP Australia's figure disagrees, and no difference in how it was counted explains it.
  not testable: IP Australia has published nothing that can be compared.

measures_intro: >-
  Each row is a kind of figure IP Australia publishes year by year. "Agree" counts the years within the tolerance.
  Most of the figures outside it differ only because IP Australia counted them another way; the four that do not are
  set out below. By state, for example, IP Australia counts an application in the state of each of its Australian
  applicants and Stage 1's data in the first filer's, so the counts differ while each state's share agrees within 0.2
  points.

measures:
  - label: Standard patent applications
    measures: [std_apps]
  - label: Australians' standard patent applications
    measures: [std_apps_res]
  - label: Overseas applicants' standard patent applications
    measures: [std_apps_nonres]
  - label: Applications from the United States and China
    measures: [std_apps_us, std_apps_cn]
  - label: Applications through the PCT, and direct
    measures: [std_apps_pct, std_apps_direct]
  - label: Australians' applications by state
    measures: [std_res_state_nsw, std_res_state_vic, std_res_state_qld, std_res_state_wa, std_res_state_sa,
               std_res_state_act, std_res_state_tas, std_res_state_nt]
  - label: Applications in pharmaceuticals, medical technology and biotechnology
    measures: [std_field_pharma, std_field_medtech, std_field_biotech]
  - label: Leading filers' applications (Aristocrat, CSIRO)
    measures: [std_apps_aristocrat, std_apps_csiro]
  - label: Standard patents granted
    measures: [std_grants, std_grants_res]
  - label: Overseas applications with two or more applicants
    measures: [std_apps_nonres_multi]
  - label: Provisional applications
    measures: [prov_apps, prov_apps_res]
  - label: Innovation patent applications
    measures: [second_tier_apps]
  - label: Trade mark applications
    measures: [tm_apps, tm_apps_res]
  - label: Trade marks through the Madrid system, and direct
    measures: [tm_apps_madrid, tm_apps_direct]
  - label: Trade marks registered, and in force
    measures: [tm_registered, tm_in_force]
  - label: Design applications and certifications
    measures: [des_apps, des_certified]
  - label: Australians' design applications
    measures: [des_apps_res]
  - label: Plant breeder's rights
    measures: [pbr_apps, pbr_apps_res, pbr_registered]
  - label: Shares (per cent of a total)
    measures: [std_pct_share, tm_madrid_share, tm_madrid_share_of_overseas, prov_individual_share,
               std_res_individual_share, tm_res_individual_share, second_tier_nonres_share]
  - label: Time from asking for examination to acceptance
    measures: [std_exam_to_accept_median_years]
  - label: "Added on 4 November 2026: Australians' designs, with the register's country"
    measures: [des_apps_res_filled]
  - label: "Added on 4 November 2026: the official fees in 2015"
    measures: [fee_patent_filing, fee_design_filing, fee_design_examination, fee_pbr_application, fee_pbr_examination,
               fee_tm_filing]
  - label: "Added on 4 November 2026: divisional applications behind 2019's fall"
    measures: [std_div_direct_change, std_orig_direct_change, std_res_fall_divisional_share]

closeness_intro: >-
  Each dot is one figure IP Australia published, placed by its value (across) and by the same figure recounted from
  Stage 1's data (up). On the line, the two are equal. Both scales are logarithmic, so a small count and a large one
  can be read on the same chart.

findings:
  - id: D1
    title: Most designs with no recorded origin are Australian
    affects: [U7, U13]
    figures: [des_apps_res 2014, des_apps_res 2021, des_apps_res 2023, des_apps_res 2025]
    chart: audit-d1
    text: >-
      IP Australia counts 2,595 Australian design applications in 2021, 2,652 in 2023 and 3,078 in 2025. Stage 1's
      data find 2,331, 2,358 and 2,653 with an Australian filer, while the totals agree. The difference is the designs
      IP RAPID publishes with no applicant country: IP Australia counts about three in four of them as Australian.
    means: >-
      A share of designs among those of known origin understates Australians, by about 2 to 3 points in recent years.
      It is a [[lower-bound]].
    status: settled
    now: >-
      IP Australia's register gives the country for most of these designs, and with it Stage 1's counts match IP
      Australia's (2,601, 2,660 and 3,078 against 2,595, 2,652 and 3,078). The lenses now carry it beside IP RAPID's:
      the filled share is no longer a lower bound, while IP RAPID's own share still is ({U102}).
  - id: D2
    title: "Trade marks filed in 2018: IP RAPID holds fewer than IP Australia's report"
    affects: [U5, U25, U90]
    figures: [tm_apps 2018, tm_madrid_share 2018]
    chart: audit-d2
    text: >-
      IP Australia reported 79,490 trade mark applications in 2018; Stage 1's data hold 77,496, or 1,994 fewer. Every
      other year from 2015 to 2025 agrees within 0.05%. The missing ones are [[madrid|Madrid]] applications: IP Australia
      reported them rising by around 13 per cent that year, while IP RAPID's stay level. Why is not known.
    means: >-
      Stage 2 flags 2018 in any trade mark series, and reads Madrid counts across it with care.
    status: narrowed
    now: >-
      WIPO counts 15,943 designations of Australia in 2018 against IP RAPID's 15,836 Madrid marks, and IP Australia's
      own register 78,643 trade marks by the date lodged. Neither reaches the report's 79,490, and the 2,292 trade mark
      numbers missing from IP RAPID were not used. So the report's figure is the odd one out, not IP RAPID. 2018 stays
      flagged until IP Australia says what it counted (OQ13).
  - id: D3
    title: One IP Australia figure cannot be reproduced
    affects: [U13, U48]
    figures: [std_res_individual_share 2022]
    text: >-
      IP Australia's IP Report 2023 says that in 2022, 55.6% of resident applications were filed by individuals
      rather than organisations. Stage 1's data give 20.65% of Australians' standard patent applications with an
      individual as the first filer, and 26.76% of their applicants. No other way of counting comes near 55.6%.
    means: >-
      {U13} and {U48} stand on Stage 1's evidence. IP Australia has been asked what the 55.6% counts (OQ12).
    status: still open
    now: IP Australia has not yet answered OQ12.
  - id: D4
    title: Trade marks in force in 2005, for context only
    affects: []
    figures: [tm_in_force 2005]
    text: >-
      IP Australia counts 391,450 trade marks in force in 2005 and 635,355 in 2017. Stage 1's data give 367,344 and
      645,872: 2017 agrees, and 2005 is 6% lower, which fits the register's incomplete records of older rights.
    means: >-
      No observation quotes a count of marks in force, so nothing changes.
    status: unchanged
    now: Still no observation quotes a count of marks in force.

notes:
  U1: >-
    IP Australia's yearly counts of every kind of right match the ones Stage 1's data give, so the register is as
    complete as this observation says for 2014 to 2025. For designs, IP Australia knows the origin of more
    applications than IP RAPID publishes (D1).
  U3: >-
    IP Australia also describes the rush to file before [[raising-the-bar|Raising the Bar]] in 2013 and the 13% fall in 2014 that
    followed, and the rush before the innovation patent closed.
  U5: >-
    IP Australia's yearly application counts match, with one exception: trade marks filed in 2018, of which IP RAPID
    holds 1,994 fewer (D2). WIPO and IP Australia's own register have since sided with IP RAPID.
  U6: >-
    The latest complete year agrees. In 2025: standard patents 30,448 against IP Australia's 30,348, trade marks
    97,343 against 97,345, designs 10,303 against 10,296, and provisional applications 6,874 against 6,867.
  U7: >-
    The Australian share of standard patents, provisional applications, trade marks and plant breeder's rights
    matches IP Australia's figures. Designs are the exception: IP Australia counts most designs of unknown origin as
    Australian, so the share among designs of known origin is a lower bound (D1). Since filled from IP Australia's
    register ({U102}).
  U8: >-
    IP Australia reports the same jump, from 4,343 provisional applications in 2024 to 6,867 in 2025 (Stage 1's
    data: 6,874), with individuals close to half of them. It reads the rise as consistent with digital tools,
    including AI, making a first filing cheaper and easier. That is IP Australia's interpretation, not a finding
    here, and the few very heavy filers this observation found are not in IP Australia's account.
  U10: >-
    IP Australia's yearly counts of standard patents granted match exactly, in all 10 years it published. It does not
    publish grant rates by year of application, so those are not tested.
  U13: >-
    Who files matches: US applicants 12,374 in 2025 on IP Australia's count against 12,185 in Stage 1's data, China
    2,938 against 2,962. One IP Australia figure cannot be reproduced: that 55.6% of residents' applications in 2022
    were filed by individuals. Stage 1's data give 20.65% (D3).
  U14: >-
    IP Australia finds the same lead for health: pharmaceuticals, medical technology and biotechnology were 33.3% of
    standard patent filings in 2025.
  U15: >-
    Each state's share of Australians' standard patent applications agrees with IP Australia's within 0.2 points, in
    2021, 2023 and 2025.
  U16: >-
    The repair that takes a missing state from the postcode is borne out: with it, the states' shares match IP
    Australia's in years when IP RAPID leaves the state out for 34.96% of Australian standard patents.
  U25: >-
    The growth and the falls match IP Australia's yearly figures: the fall in 2009 after the global financial crisis,
    the 11.2% fall in trade marks in 2022, and record design filings in 2024 and 2025.
  U27: >-
    IP Australia's counts of standard patents granted match exactly, peaking at 23,743 in 2016. This observation's
    25,687 for 2016 counts innovation patents too; standard patents alone give 23,744.
  U28: >-
    IP Australia reports the same responses to Raising the Bar (Australians' applications fell 35% in 2014) and to
    the innovation patent's closure. It adds one this observation does not list: Australians' standard patents rose
    24.8% in 2021, filed early so they could still be turned into innovation patents. Stage 1's data show the same
    24.8%.
  U32: >-
    IP Australia's counts of designs certified in 2021, 2023 and 2025 match exactly.
  U33: >-
    IP Australia reports a [[median]] of 1.3 years from asking for examination to acceptance, for requests made in
    2020; Stage 1's data give 1.23. Its research also confirms that applicants asked for examination before Raising
    the Bar to keep the old rules.
  U36: >-
    IP Australia found the same fall in trade mark [[renewal|renewals]]: around 70 per cent were renewed after their
    first ten years in the 1980s, and 50 per cent in the 2000s. This observation found 67.0% (filed 1983 to 1989) and
    46.9% (2000s) still in force after ten years.
  U44: >-
    IP Australia also describes Australian patenting as concentrated: around 3,100 businesses hold a patent in a year.
  U45: >-
    IP Australia reports record trade mark filings by Australians in 2025 (55,913). Counted by applicant rather than
    by ABN, first-time Australian trade mark filers rose from 22,838 in 2024 to 28,626 in 2025. So most of the fall
    this observation found is in linking filers to their ABNs, not in filing; IP Australia's own register restores
    most of the link ({U100}), and first observed filers are now counted with it ({U101}).
  U48: >-
    Shares the figure disputed under {U13}: IP Australia's 55.6% of residents' applications filed by individuals in
    2022, which Stage 1's data cannot reproduce (D3).
  U52: >-
    IP Australia names Aristocrat as Australia's leading patent filer in 2017, 2021 and 2025, with counts that match
    Stage 1's (123 in 2025 on both counts). The other firms this observation found behind single postcodes are in IP
    Australia's lists of leading filers too.
  U67: >-
    Closes this observation's question about innovation patents in 2016: IP Australia itself reported a 27% rise that
    year, from overseas applicants. The gap is between IP Australia's count and WIPO's, not a fault in IP RAPID.
  U69: >-
    WIPO's own page for Australia gives the same ranks: 20th of 139, 13th on inputs and 24th on outputs.
  U70: >-
    IP Australia gives 8,091 patent applications filed abroad by Australians in 2024, the figure this observation's
    numbers imply. Its figures also show China level with Australians in 2024 and ahead of them in 2025.
  U75: >-
    IP Australia's research on firms finds IP users concentrated in manufacturing and wholesale trade. Wholesale is a
    service industry, which supports this observation's warning that the [[crosswalk]] leaves services out.
  U76: >-
    IP Australia also finds Australians' trade marks weighted towards services.
  U81: >-
    IP Australia names NewSouth Innovations as UNSW's commercialisation arm among Australia's leading filers, as the
    link assumes.
  U84: >-
    IP Australia found a similar share of universities' international patent applications filed with a collaborator
    (21%, 2000 to 2015), and notes that universities were less prominent among leading filers in 2025.
  U89: >-
    IP Australia's counts of patents arriving through the [[pct|PCT]] match within 0.35%.
  U90: >-
    IP Australia reports the same shift away from the PCT (66.7% of standard applications in 2025) and says direct
    filings have expanded, particularly among domestic innovators, which supports this observation's lead.
  U91: >-
    IP Australia reports Australians using the Madrid system more to take their trade marks abroad, measured another
    way.
  U97: >-
    IP Australia gives women as 14.6% of Australian inventors in 2021 and 2022: the WIPO figure this observation
    checked its estimate against.
  U98: >-
    IP Australia's figures (14.6% on international applications in 2022, about 12% in 2016) are in line with about
    one inventor in seven.
  U99: >-
    With IP Australia's register filling in the country IP RAPID leaves blank, Stage 1's count of Australians' design
    applications matches IP Australia's within 0.57% in every year it published: 3,072 against 3,078 in 2025. IP
    Australia publishes no counts of business numbers, so the business-number fills are not tested.
  U100: >-
    IP Australia reports record trade mark filings by Australians in 2025 (55,913), so filing did not fall as IP RAPID's
    business numbers did. With the register, 90.9% of FY2026's trade marks have a filer's business number, against IP
    RAPID's 59.9%.
  U101: >-
    Points the same way as IP Australia's record trade mark filings in 2025. Counted by applicant, first-time
    Australian trade mark filers rose from 22,838 in 2024 to 28,626 in 2025.
  U102: >-
    Corroborated: with the register's country, Australians' design counts match IP Australia's in all four years it
    published (2,596 against 2,595 in 2021, 3,072 against 3,078 in 2025). So the filled share is not a
    [[lower-bound]]; IP RAPID's own share still is.
  U105: >-
    IP Australia's yearly counts of provisional applications agree with IP RAPID's within 0.25% in all 11 years
    published, as a complete record would.
  U108: >-
    IP Australia's report of 2015 lists the fees then charged: $370 to file a standard patent, $250 for a design and
    $420 to examine it, $345 for a plant breeder's right and $1,610 to examine it, and $120 a class for a trade mark.
    The fee series gives all six exactly. IP Australia publishes no history of its fees, so the later fee observations
    are not tested.
  U114: >-
    IP Australia's research on firms puts professional, scientific and technical services among the three industries
    where patenting is concentrated: firms' patenting is not only manufacturing's, as a [[crosswalk]] without services
    would suggest.
  U115: >-
    IP Australia, using WIPO's data, reports that Australians file several times as many patent applications abroad as
    at home (9,012 against 3,061 in 2013), which fits Australian inventions that never reach IP Australia.
  B10: >-
    For designs, IP Australia also finds that overseas filers register, certify and renew more designs than
    Australians where the two differ most. It publishes no trade mark renewals by origin.
  B13: >-
    IP Australia's commissioned study finds that applicants who speed up examination are more likely to renew their
    patents, as this observation finds expedited patents slightly more often still in force at 10 years. See {M5}.
  B15: >-
    The divisional count behind this observation reproduces IP Australia's own figures for 2019: among direct filings,
    divisionals fell 2.92% (IP Australia: 2.9%), and divisionals were 86.21% of the fall in Australians' applications
    (87%). IP Australia does not publish the shares by decade.
  B17: >-
    IP Australia also finds that women's share among inventors varies by field: women are named on 61% of
    international applications in biotechnology and 59% in pharmaceuticals.
  B22: >-
    IP Australia's research on business data finds that firms owning IP are on average older (13 years against 8) and
    larger (105 employees against 6), as this observation finds filing going with age.
  B23: >-
    IP Australia's research finds R&D spending "positively and significantly associated" with patenting, with age,
    size and industry held. It gives no size of link to set beside "only weakly".
  B37: >-
    IP Australia reports the same rush to file before [[raising-the-bar|Raising the Bar]] and before the innovation
    patent closed.
  B38: >-
    IP Australia warns of "higher volumes of speculative filings" among 2025's provisional applications, which fits
    fewer being followed up within 12 months (6.66% against 12.24% to 14.15%).
  B41: >-
    IP Australia's research on firms finds manufacturing holds eight of the ten most patent-intensive industries. It
    counts firms' own industries, where this observation counts what the patents protect.
  B45: >-
    Agrees in part with IP Australia's research, which finds that more research funding brings more patent
    applications, collaborative grants most: here ARC grants per 1,000 works go with patents per work (0.637 and
    0.628). The collaborative link is not seen across universities, but IP Australia followed each organisation over
    time, a different design that a comparison across about 40 universities cannot rule out.
  B47: >-
    IP Australia's note on trade marks explains this observation's clearest break: the Trade Marks Act 1995 let one
    application cover several classes, so applications fell in 1996 while what they covered did not. The note scales
    later filings up by a factor of 1.11 for it.
  B50: >-
    IP Australia's research on business data also finds that large firms stand out "as the most active filers", with
    age and industry held.
  B51: >-
    IP Australia's research also finds patenting concentrated in manufacturing, wholesale trade and professional
    services, with size held.
  B54: >-
    As {U114}: IP Australia's research on firms finds professional services among the industries where patenting is
    concentrated, as the crosswalk with services allows.
  B55: >-
    IP Australia's counts of Australians' patent applications abroad are steady (9,012 in 2013, 8,737 in 2016), with a
    split between routes "largely stable over the last 10 years", which fits a gap in older records rather than a
    change in practice.
  B56: >-
    A caveat from IP Australia's note on trade marks: filings rise and fall with the economy and lead real GDP, a 10%
    rise in a quarter predicting 1.8% more GDP the next quarter and 2.7% the quarter after. This observation compares
    changes in the same quarter, so it does not test that lead.
  B63: >-
    As {B56}. Overseas applicants' trade marks move against unemployment (-0.561, then -0.224), as IP Australia's note
    would expect; Australians' trade marks moving against employment is not what it would predict for the same
    quarter.
  M5: >-
    Not a dispute with IP Australia's commissioned study: the two measure different things. The study's "speeding up"
    includes asking for examination early, which 41.9% of granted patents do; this observation's expedited requests
    are a few per cent. The study also finds that delay goes with better outcomes for small innovators, as this
    observation finds Australian individuals' expedited patents end sooner.
  M7: >-
    As {B17}: IP Australia also finds the field sorts women's share among inventors.
  M8: >-
    As {B22} and {B23}. IP Australia's research also finds that among firms already using the patent system, younger
    ones file more patents a year, which fits this observation's caveat that older firms have simply had longer to
    file.
  M11: >-
    As {B50} and {B51}: IP Australia's research finds large firms and manufacturing standing out, with the other held.
  M17: >-
    WIPO's own page for Australia ranks school life expectancy (2nd) and tertiary enrolment (7th) among its strengths
    and production and export complexity (72nd) among its weaknesses, as this observation places Australia.
  M23: >-
    As {B45}: IP Australia's research, following each research organisation over time, finds grants bring patent
    applications. Held together across about 40 universities, the research measures here are largely one.
  M25: >-
    IP Australia reports the same rush before [[raising-the-bar|Raising the Bar]] and a 35% fall in Australians'
    applications in 2014.
  M26: >-
    As {B15}: the divisional count reproduces IP Australia's figures for 2019.
  M29: >-
    As {B22} for company form and age. IP Australia's profit figures (IP owners earn $48,368 per employee against
    $23,404) are not the reported income of large taxpayers, which is not tested.
  M34: >-
    As {B47}: IP Australia's note gives the reason the Trade Marks Act 1995 reads as a fall, not a rush: one
    application could now cover several classes.
  M35: >-
    IP Australia reports that new filers were 63% of provisional applicants in 2025 and self-filers 52%, which fits
    this observation's finding that the fall in follow-up is among new and heavy filers.
  M36: >-
    As {B56}: IP Australia's note finds trade marks lead the economy by a quarter or two, which changes in the same
    quarter do not test.

later_intro: >-
  The same check, made on 4 November 2026 of the 130 observations added since the first review: Stage 1's later
  observations, and Stages 2 and 3. Stages 2 and 3 read associations, two at a time and then with other factors held.
  IP Australia publishes few of those, and where its own research reaches the same question it mostly uses other data
  (the ABS's business data) or another design. So "consistent" here usually means the two point the same way, not that
  one confirms the other's size.

later_untestable_intro: >-
  IP Australia publishes nothing these can be compared with: the register's detail by filer, firms matched to other
  registers, places below the states, countries, the economy's other series, industries and research institutions.

untestable_intro: >-
  IP Australia does not publish these things, so they stand on Stage 1's own checks. Most are about the data's
  structure and the repairs made to it, the register's fine detail, or sources other than IP Australia's.

conclusions_intro: >-
  What IP Australia concludes, how strongly it says it, and what the evidence here adds (C1 to C12 from the first
  review; C13 to C16 from the second). None of IP Australia's
  conclusions is adopted here: that is the research owner's decision.

conclusions:
  - id: C1
    claim: The rise in provisional applications reflects digital tools, including AI, lowering the cost of a first filing.
    strength: '"Consistent with"; "an important focus for ongoing analysis".'
    adds: >-
      {U8}: the rise is broad (single-filing individuals 1,538 to 2,507) and concentrated (54 individuals filed
      1,528). Both fit; neither proves it. Since then, FY2025's fall in provisionals followed up within 12 months
      (6.66%, against 12.24% to 14.15% in FY2022 to FY2024) is in new and heavy individual filers ({B38}, {M35}).
  - id: C2
    claim: A firm's first patent or trade mark coincides with lasting gains in income and productivity.
    strength: '"Dynamic associations, not definitive causal effects."'
    adds: Nothing to test. Stage 1 has no data on firms' performance.
  - id: C3
    claim: Patents whose examination is sped up are renewed, used in products and built on more.
    strength: Research commissioned by IP Australia; an association.
    adds: >-
      {U34} (expedited requests, 1.87% to 10.31%) and {U36} (years in force) are the same two measures: a pair for
      Stage 2 that would repeat the finding with open data. Stage 2 found expedited patents slightly more often in
      force after 10 years, pooled, in both periods; the link differs by filer and is not explained by who asks, and
      "expedited" mixes urgent requests with work-sharing ({B13}). Stage 3 held the filer, field, route, cohort,
      co-filers and classes together: the link is not detected in FY2010 to FY2016 (a [[hazard-ratio|hazard ratio]]
      of 1.021) and reverses in FY2003 to FY2009 (1.124), and Australian individuals' expedited patents are more
      likely to end in both periods ({M5}). The open data do not repeat the study's finding.
  - id: C4
    claim: The innovation patent did not meet its goal of serving small businesses.
    strength: IP Australia's and the Productivity Commission's research.
    adds: >-
      {U7}: Australians' share of second-tier patents fell from 79.2% to 87.4% (FY1990 to FY2010) to about one in six
      in FY2021, when overseas applicants filed before the closure.
  - id: C5
    claim: Raising the Bar increased competition and follow-on invention, unevenly across fields.
    strength: Research commissioned by IP Australia.
    adds: >-
      {U28} and {U33} show the rush and the early examination requests that any evaluation must allow for. With
      trend and season held, the rush (0.605 in logs) and a lower level after it (-0.334) hold ({M25}).
  - id: C6
    claim: Clutter on the trade mark register is not an immediate concern, though falling renewals are a possible source.
    strength: IP Australia's own measures.
    adds: "{U36} shows the fall in the share of trade marks still in force after ten years; Stage 1 cannot measure whether marks are used."
  - id: C7
    claim: IP rights do not significantly raise market concentration.
    strength: A statistical model; an association.
    adds: Not testable here. Stage 1's concentration is of filing ({U44}, {U52}), a different thing.
  - id: C8
    claim: The 2021 rise in Australians' patent applications was brought forward by the innovation patent's closure.
    strength: '"Likely".'
    adds: >-
      Corroborated by the counts ({U28}). Stage 2 found the closure's rush (1.459) beyond every placebo month
      ({B37}).
  - id: C9
    claim: Chinese patent filings in Australia stalled in 2021 and fell 8.2% in 2022, after China stopped paying for filings abroad.
    strength: '"Most likely".'
    adds: Not in an observation; Stage 2's comparisons by origin ({U13}, {U70}) should allow for it.
  - id: C10
    claim: The rise in direct patent filing in 2025 partly reflects which countries file.
    strength: Descriptive.
    adds: "{U90}: Australians' own direct filing rose, which a change in countries cannot explain."
  - id: C11
    claim: Women are under-represented among Australian inventors, below the world average.
    strength: WIPO's international data.
    adds: "{U97} and {U98} agree on the level."
  - id: C12
    claim: Collaboration between universities and industry is "not a crisis"; Australia is 13th of 35 OECD countries.
    strength: IP Australia's analysis of jointly filed IP.
    adds: "{U84}'s joint filing is the same kind of measure; Stage 2 can bring it up to date."
  - id: C13
    claim: Trade mark filings rise and fall with the economy, and lead real GDP by one or two quarters.
    strength: '"Predicts"; an analytical note''s preliminary results.'
    adds: >-
      {B56}, {B63} and {M36} compare changes in the same quarter, not a lead. Overseas applicants' trade marks move
      against unemployment (-0.561, then -0.224), as the note would expect; Australians' trade marks move against
      employment. The lead itself is untested here.
  - id: C14
    claim: Larger and older firms are more likely to use IP; R&D spending goes with patenting.
    strength: '"Our analysis does not imply causation."'
    adds: "{B22}, {B23}, {B50}, {B51}, {M8}, {M11} and {M29} point the same way, on other registers."
  - id: C15
    claim: More public research funding brings more patent applications from research organisations, and collaborative grants more.
    strength: '"Likely to boost"; organisations followed over time.'
    adds: >-
      Across universities, ARC grants per 1,000 works go with patents per work (0.637 and 0.628, {B45}); the
      collaborative-grant link is not seen across about 40 universities ({B45}, {M23}), a different design.
  - id: C16
    claim: The fall in trade mark filings in 1996 reflects the Trade Marks Act 1995's applications covering several classes.
    strength: Attributed to earlier research, and adjusted for in IP Australia's own series.
    adds: "{B47} and {M34} find the Act's fall; this is its likely mechanism."

changes_intro: >-
  What the review changed for Stages 2 and 3, and where each change now stands. The review itself changed no
  observation; the restatements since came from the register check (see the note at the top).

changes:
  - "Design shares among designs of known origin are read as lower bounds (D1). Done, then superseded: the lenses now carry the register's country, and the filled share is not a lower bound ({U102})."
  - "Trade mark series flag 2018 (D2). Still so: WIPO and IP Australia's register side with IP RAPID, but the report's figure is unexplained."
  - Innovation patent counts include standard patents converted into innovation patents, as IP Australia's later reports do ({U67}).
  - Stage 2's look at the innovation patent's closure includes Australians' standard patents in 2021 and 2022 ({U28}).
  - "From FY2025, first observed filers are counted with the business numbers IP Australia's register holds ({U45}, {U101}). Done."
  - "A new pair for Stage 2: expedited examination against how long patents are kept (C3). Done: slightly more often in force, pooled, in both periods, and it differs by filer ({B13}); not detected or reversed once other factors are held ({M5})."
  - Any comparison with IP Australia's figures counts calendar years, and Australian applications the way IP Australia does.

questions_intro: >-
  Three questions the review raised, added to the research owner's request to IP Australia on 27 October 2026 and
  reworded the same day after the register check. All three are still open.

questions:
  - id: OQ12
    text: What does IP Australia's "55.6% of resident applications were filed by individuals" (2022) count? (D3)
  - id: OQ13
    text: IP Australia's register counts 78,643 trade marks lodged in 2018, IP RAPID 77,496, and WIPO's count of Madrid designations agrees with IP RAPID; the IP Report 2019 counted 79,490. What did the report's 2018 count include, and does IP Australia still stand by it? (D2)
  - id: OQ14
    text: IP Australia's register holds the owner's country for 61.4% of the designs IP RAPID leaves without one. Could IP RAPID publish it? (D1)

limits:
  - title: Not independent
    text: >-
      IP Australia's reports come from its own register, as IP RAPID does. Agreement shows Stage 1 reads the register
      as IP Australia does, not that the register is right. The independent checks are WIPO's and the World Bank's,
      and they agree too.
  - title: Two reports are scanned
    text: >-
      The 2018 and 2021 reports have no text layer, so their text was read by OCR. Every figure used from them agrees
      or is explained, which checks both.
  - title: Searched, not read in full
    text: >-
      Beyond the 2026 report, the documents were searched topic by topic, so a statement in words the searches did not
      reach may be missed.
  - title: Associations have little to check against
    text: >-
      IP Australia publishes few associations, and its research on firms uses the ABS's business data, which this
      project cannot use. A "consistent" verdict on a Stage 2 or Stage 3 observation is about direction, on other data;
      a Stage 3 verdict checks the signal it revisits, not its model.
  - title: Much cannot be tested this way
    text: >-
      66 of the first 99 observations, and 93 of the later 130, concern things IP Australia does not publish. They
      stand on the project's own checks.
