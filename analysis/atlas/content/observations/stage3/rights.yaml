  headline: Granted Australian-founded patents are more often now held only overseas, at the same reach and filer type
  statement: >-
    Of standard patents first filed by an Australian applicant, the granted are more often now held only overseas than
    those never granted, with reach, the filer's type, field, route, year and co-filers held together: +5.6 points
    (FY2003 to FY2011) and +2.8 (FY2012 to FY2021). The wide patents' higher rate is more than halved once grant and
    type are held, and organisations' gap goes in the later period.
  figures:
    - value: "+5.6 and +2.8 points"
      label: granted against never granted, held together (raw +8.8 and +3.9)
    - value: "40.1% and 43.7%"
      label: of the wide patents' raw gap left once held
    - value: "+0.05 points"
      label: organisations against individuals, later period, held together (not detected)
  points:
    - "**Granted against never granted:** +8.8 raw and +5.6 held together; +3.9 and +2.8. Holds in both, 63.9% and
      70.4% left."
    - "**Five or more offices against Australia only:** +10.8 and +4.3; +5.1 and +2.2. Weakened: much of the wide
      patents' higher rate goes with their being granted and organisations'."
    - "**Organisations against individuals:** +5.3 and +2.6, weakened; +1.0 and +0.05, not detected once held in the
      later period."
    - "**Two endpoints, not transfers:** grant and reach are seen today, not necessarily before the holder changed, and
      nothing here says where value goes. The later period has had less time for holders to change."
  revisits:
    - id: B19
      signal: Australian-founded patents now held only overseas
      verdict: mixed
      what: >-
        Granted patents hold (+5.6 and +2.8 points held together); wide patents weaken (40.1% and 43.7% of the raw
        gap left); organisations weaken, then are not detected in FY2012 to FY2021.
  held: [grant, family reach, the filer's type, the technology field, the route of filing, the filing year, several founding applicants]
  verdicts:
