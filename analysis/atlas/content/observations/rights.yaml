  terms: [assignment]
  related: [U17, U18]

- id: U36
  lens: rights
  attachment: Events
  about: system
  featured: true
  headline: Newer patents more often stay in force for ten years; about half of trade marks do
  statement: >-
    Of standard patents granted in the 1980s, 53.2% were still in force 10 years after their date of patent; of those
    from the 2000s and 2010s, 67.5% and 67.3%. The median time in force rose from 10.6 years (1980s and 1990s) to 13.5
    (2000s and 2010s). For trade marks the share still in force after 10 years fell, from 67.0% of those filed 1983 to
    1989 to 46.9% of the 2000s' and 47.5% of the 2010s'.
  figures:
    - value: "10.6 → 13.5"
      label: "typical years a standard patent stays in force, 1980s to 2000s"
    - value: "67.5%"
      label: of 2000s standard patents still in force after 10 years
    - value: "46.9%"
      label: of 2000s trade marks still in force after 10 years
  points:
    - "**Standard patents** still in force after 15 years: 27.7%, 31.2%, 41.1% and 41.8% (1980s to 2010s); to just
      before the 20-year end of term, 12.6%, 15.0% and 20.1% (1980s to 2000s)."
    - "**Trade marks:** the median time in force fell from 21 years to 17 and then 10. Marks filed 1983 to 1989 had a
      first term of 7 years under the 1955 Act."
    - "**Designs** filed under the Designs Act 2003 (from 17 June 2004): 51.8% of those filed to 2009 were still in
      force after the renewal at 5 years, 58.0% of the 2010s' and 61.8% of the 2020s' so far. Designs filed from 2000 to
      16 June 2004, under the 1906 Act, were 87.0% in force after 5 years and 48.5% after 10."
    - "**Second-tier patents:** innovation patents 35.7% in force after 5 years (median 3.5 years), petty patents 68.3%
      (median 6). **Plant breeder's rights** pay annual fees: 42.4% (1990s), 47.8% (2000s) and 59.7% (2010s) in force
      after 10 years."
    - "**What this is not.** These are shares still on the register. An end can be an unpaid renewal fee, a surrender,
      a revocation or the end of the term, and the holder may not be the filer ({U17}). They are not renewal decisions,
      and not value."
  questions:
    - q: 1
      how: "A right stays in force only while someone pays to keep it, so the share still in force is a common, if
           rough, sign of private value in research. The owner adopted years in force as a working measure for Stage
           2, beside other signs."
  sources: [iprapid]
  chart: U36
  notebook_charts: [0]
  prep:
    - what: Only granted or registered rights are counted, each from its grant or registration to the day it ended;
        rights still in force count as unfinished (ADR 0041).
      why: A right cannot end in force before it is granted, and dropping rights still alive would leave out the
        longest-lived and understate lifetimes (ADR 0015).
    - what: "Standard patents are grouped by the date of patent, and trade marks by earliest filing. Designs are
            grouped by the law in force at filing (the Designs Act 2003 from 17 June 2004), and second-tier patents by
            their recorded type (innovation or petty)."
      why: A right's term and renewal steps follow those dates and Acts, so mixing them would blur the steps.
    - what: "Groups start where the register's records are complete (patents from 1980, trade marks from 1983, designs
            from 1986). Ends recorded after the record is complete (31 March 2026 for trade marks and designs, 22
            October 2026 for patents) count as unfinished. 629 rights recorded as ending before their own grant or
            registration are left out."
      why: Earlier years hold survivors only ({U23}), and recent ends are not yet all recorded ({U31}).
  steps:
    - For each granted or registered right, take its years in force from grant or registration, and whether it has
      ended.
    - "Group rights by the date their term runs from."
    - "For each group, work out the share still in force after each number of years. Rights still running count for as
      long as they have run (a [[survival-curve|survival curve]]). Readings with fewer than 30 rights still running
      are left blank."
    - "Read off the typical lifetime and the shares in force after 10 and 15 years. A patent ends on the record six
      months after the anniversary it was not renewed at, so \"after 10 years\" means after the ninth anniversary's
      renewal. A trade mark ends at the anniversary, so \"after 10 years\" means after the tenth anniversary's renewal
      fell due."
  assumptions:
    - "Rights still in force at the cut-off date would behave like others in their group that had lasted as long."
  limits:
    - A share still in force measures what holders pay to keep, not what society gains.
    - Holders keep or drop rights for many reasons, including strategy and portfolio pruning; a long life is a sign of
      value, not proof of it.
  next: "Stage 2 compares the shares still in force by origin, applicant and technology, among rights of the same age,
        beside overseas reach and citations."
  terms: [survival-curve, unfinished, cohort, renewal, median]
  related: [U31, U93, U94]

- id: U37
  lens: rights
  attachment: Events
  about: system
  headline: Extra patent term for medicines is rare, with a wave in 1999 and 2000
  statement: >-
    1,450 standard patents (0.24% of those granted) have had their term extended. Grants of extension numbered 108 in
    1999 and 114 in 2000, when the current scheme began, against 1 to 30 a year in 1991 to 1998 and 14 to 76 a year
    since.
  figures:
    - value: "1,450"
      label: standard patents with an extended term
    - value: "24.09 years"
      label: "typical life of the extended patents that have ended"
  points:
    - "616 extended patents ended after more than 20 years; 701 are still in force; the longest lasted 25.01 years."
  questions:
    - q: 1
      how: Extensions trade a longer monopoly on medicines against earlier competition, a direct public cost and benefit question.
  sources: [iprapid]
  chart: U37
  notebook_charts: [0]
  prep:
    - what: An extension is the event of an extension being granted to a standard patent.
      why: That is the event that changes the patent's term.
  steps:
    - Count extensions granted by calendar year.
    - For extended patents, summarise how long they lasted.
  assumptions:
    - Extensions are recorded on the register for every patent that received one.
  limits:
