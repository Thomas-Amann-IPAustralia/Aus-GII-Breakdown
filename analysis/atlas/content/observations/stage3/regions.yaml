  questions:
    - q: 2
      how: Separates what goes with filing beyond the advantage gradient (business counts by size and industry) from what only follows it (health, most of the Census).
  sources: [abs_census, phidu, abs_regions, abs_cabee, ato_postcode, abs_census_tsp, cer, iprapid]
  prep:
    - what: "B28's test of every local measure, now with all seven sources. Each measure is taken in the period
            covering the most areas, with counts put per resident, and the summary measures and remoteness are allowed
            for."
      why: Stage 2 asked which go with filing beyond the gradient.
  steps:
    - "Test every measure against filing on its own, as B28 did."
    - "Test them again allowing for the summary measures and remoteness, under B28's rule (found in both halves)."
    - "Count the patterns still standing by source, and read the strongest."
  assumptions:
    - "B28's rule marks a pattern worth following up. It must pass the check for many comparisons in the first half,
      then point the same way, at 0.1 or more, in the second."
  limits:
    - "Many measures are versions of one another, so the patterns are not independent."
