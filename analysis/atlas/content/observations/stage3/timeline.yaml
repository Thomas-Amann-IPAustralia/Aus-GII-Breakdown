    Resampled in blocks of 8 quarters, few of the cycle's quarterly pairs are clear of zero, and none in both periods.
    The cash rate (0.460) and unemployment (-0.561) moved with overseas applicants' trade marks before 2008, not after.
    The cycle remains a third factor to hold in before-and-after comparisons, not a signal.
