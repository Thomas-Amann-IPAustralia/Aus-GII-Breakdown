# The judged relations between observations (ADR 0058). Each is one plain sentence a reader can follow, shown on both
# observations' pages; any number in it must be on one of the two pages (the numbers rule).
#
#   from, to   the observations; the relation reads "from <type> to" (M24 outmodes B62)
#   type       supports | refines | contests | outmodes | disproves
#   why        what the one shows about the other, as it now stands: never what a page used to say (the build
#              refuses amendment history outside "Follow the evidence")
#   settle     contests only: what would settle it (an area for further exploration)
#   asked      outmodes and disproves only: the open owner question that asks to retire `to` (docs/owner-questions.md)
#   found      the date the relation was judged
#
# Stage 3's revisits whose verdict is holds, weakened or refined become relations on their own (supports, refines);
# every other verdict needs a judged relation here. An outmoded or disproved observation is proposed for retirement
# at once; only the owner's approval, recorded in ledger.yaml, retires it.

# ------------------------------------------------------------------- the baseline review of 11 November 2026: proposal
- from: M24
  to: B62
  type: outmodes
  why: "B62 reads its links between disclosures, patents and licence income as holding in both periods, but they were
    correlations of measures all divided by the same research budget. M24 compares institutions at the same research
    spend and finds disclosures go with patents, and patents with start-ups, in 2010 to 2015 only, and patents with
    licences and licence income in neither period. M24 says everything B62 says that still stands."
  asked: OQ36
  found: 2026-11-11
- from: M5
  to: B13
  type: refines
  why: "B13's raw advantage for fast-tracked patents does not survive comparing like with like: holding the field,
    route and cohort with the filer, M5 finds no link for 2009–10 to 2015–16 and a reversed one for 2002–03 to 2008–09
    (1.124, likely range 1.030 to 1.228). The rest of B13 stands: who asks for faster examination and for what,
    which M5 does not cover, and that Australian individuals' fast-tracked patents last less long, which M5 confirms."
  found: 2026-11-11

# -------------------------------------------------------------------------- open for further exploration (contests)
- from: M22
  to: B40
  type: contests
  why: "B40 finds industries with more business R&D per business receive more trade marks per business. M22 finds that
    link shrinks once value added per business is allowed for (0.423 and 0.392 against 0.609 and 0.582), with likely
    ranges that just include zero, so it may be output rather than R&D."
  settle: "Business R&D for more years than 2023–24, or a finer industry level than the 19 divisions, to narrow the
    likely range; or the same test on another year's value added."
  found: 2026-11-11
- from: M36
  to: B56
  type: contests
  why: "B56 finds economic growth goes with overseas applicants' patents, more strongly from 2008. M36 allows for
    neighbouring quarters behaving alike and finds neither period's link clear (0.158 and 0.380), which points against
    B56 without ruling the link out."
  settle: "A test of whether growth leads overseas patent filing, with lags, over the longest series (as M39 does for
    trade marks)."
  found: 2026-11-11
- from: M38
  to: M23
  type: contests
  why: "M38 finds, across every kind of institution, that research patents cite goes with more patents per work in both
    periods with kind, size, citations and grants held. M23 finds, among universities alone, that the same measure
    stands out only in 2010 to 2016 once size, citations and grants are held. M38 notes the difference; neither
    settles whether the link holds within universities in 2017 to 2023."
  settle: "M38's model fitted to the 40 universities alone for 2017 to 2023, or with the kind of institution allowed to
    change the patent-cited link; the institutions link itself awaits review (OQ11)."
  found: 2026-11-11

