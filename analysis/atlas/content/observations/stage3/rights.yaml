- id: M28
  lens: rights
  about: system
  headline: Owners did not let rights go more often at the anniversary after a renewal fee changed
  statement: >-
    At each right's own anniversary, owners did not let patents, trade marks or designs go more often after any of
    nine changes in the renewal fee from 2000 (rises of 11% to 33% and a 10% cut), once the trend either side, the
    anniversary, the filer, the field and the founders are held. For patents the intervals rule out more than about
    1.4 [[percentage-point|points]] either way: a precise null.
  figures:
    - value: "None"
      label: of the nine fee changes from 2000 is followed by a detected change in letting go
    - value: "+0.08 points"
      label: patents, September 2002 (+15.27%), held together (raw +1.94)
    - value: "-0.06 points"
      label: patents, October 2020 (+29.55%), held together
  points:
    - "**Patents**, held together: September 2002 +0.08; March 2007 (-10%) -0.57; August 2010 (+12.92%) -0.12; July 2012
      (+11.11%) +0.05; October 2016 (+10.87%) +0.43; October 2020 (+29.55%) -0.06. Not detected after any."
    - "**The raw gaps of 2002, 2007 and 2010 are each period's trend:** anniversaries whose fee did not change in August
      2010 show one too (-1.68 raw), and it goes once the trend is held (+0.72)."
    - "**Trade marks**, October 2016 (+33.33% at the 10-year renewal): -0.99 held. **Designs**, July 2012 (+16.36%)
      +6.24 and October 2020 (+25%) -2.49, about 11,000 and 12,600 designs: not detected, with wide intervals."
    - "**Not a cause either way:** an owner can pay before the anniversary at the old fee, and a change announced months
      ahead may move decisions outside the window."
  revisits:
    - id: B49
      signal: Renewal fees and letting rights go
      verdict: not detected once held
      what: >-
        At each right's own anniversary no response is seen after any of nine fee changes; for patents within about
        1.4 points either way. B49's cessations beyond every placebo month are not seen at the anniversary ({M34}
        reads the national series again).
  held: [a straight-line trend either side of the change, the anniversary number, the filer's origin and type, the field or main class, several founders or classes]
  verdicts:
    - signal: Patents, six fee changes from September 2002 to October 2020
      detail: held together from -0.57 to +0.43 points; every interval includes zero
      verdict: not detected once held
    - signal: Trade marks, October 2016 (+33.33%)
      detail: +0.50 raw, -0.99 held together
      verdict: not detected either way
    - signal: Designs, July 2012 and October 2020
      detail: +6.24 and -2.49 held together, with wide intervals
      verdict: not detected either way
  chart:
    type: effect
    title: Letting a right go at the anniversary after a renewal fee changed, against the anniversary before
    subtitle: Difference in the share let go, in percentage points, with the trend either side, the anniversary, the filer, field and founders held; 95% intervals clustered by the filer
    x: {values: ["Patents, September 2002 (+15.27%)", "Patents, March 2007 (-10%)", "Patents, August 2010 (+12.92%)", "Patents, July 2012 (+11.11%)", "Patents, October 2016 (+10.87%)", "Patents, October 2020 (+29.55%)", "Trade marks, October 2016 (+33.33%)", "Designs, July 2012 (+16.36%)", "Designs, October 2020 (+25%)"]}
    y: {name: After minus before (percentage points), format: signed}
    ref: 0
    ref_label: no change
    series:
      - name: Raw
        colour: muted
        data: [[1.94, 1.17, 2.71], [-1.19, null, null], [-2.35, null, null], [0.01, null, null], [-0.03, null, null], [-0.44, null, null], [0.50, null, null], null, null]
      - name: Held together
        colour: 0
        data: [[0.08, -0.82, 0.98], [-0.57, -1.27, 0.12], [-0.12, -1.23, 1.00], [0.05, -0.79, 0.90], [0.43, -0.55, 1.41], [-0.06, -0.84, 0.72], [-0.99, -2.78, 0.80], [6.24, -0.74, 13.21], [-2.49, -9.29, 4.32]]
    source: IP Australia, IP RAPID; Federal Register of Legislation, fee regulations (lens rights); notebook 3, section 1.9
    note: Every held interval crosses the dashed line. The designs' intervals are wide because few designs reach each change.
  questions:
    - q: 4
      how: At this design's power, owners' decisions at the anniversary did not respond to these fee changes, so renewal fees look a weak lever on letting rights go (the fourteenth early signal).
    - q: 5
      how: A precise null for patents that any projection of a fee change's effect would have to respect.
  sources: [iprapid, frl_fees]
  prep:
    - what: For each change in renewal fees from 2000, every right whose changed anniversary fell in the 12 months before or after the change, granted before it and not ended before it, is a row; October 2024 is too recent to have its year after.
      why: Compares owners deciding just before and just after the change, at the same kind of anniversary.
    - what: A right is [[let-go|let go]] if it ceased at that anniversary (for patents, a cessation dated 3 to 12 months after it, since cessations are dated at the end of the six-month grace period).
      why: The register dates a lapse at the end of the grace period, not at the anniversary.
  steps:
    - Compare the share let go at anniversaries after the change with those before (raw).
    - Hold a straight-line trend with its own slope on each side, the anniversary number, the filer, the field or class and the founders together, clustered by the filer.
    - Check the method on anniversaries whose fee did not change (August 2010 and October 2016), which should show nothing once the trend is held.
  assumptions:
    - Owners deciding just before and just after a change are alike in every way but the fee.
  limits:
    - An owner can pay before the anniversary at the fee then in force, so this tests the decision at the anniversary, not the price each owner paid.
    - A change announced months ahead may move decisions outside the window.
  next: >-
    The fourteenth early signal: owners' payment dates (early payment at the old fee), and the fee's share of a
    patent's cost of keeping, to read fees as a lever.
  terms: [let-go, trend-either-side, held-together, renewal, placebo, verdict-words]
  related: [B49, M34, B47]

- id: M40
  lens: rights
  about: system
  headline: Asking for examination before being directed goes with patents more likely to end, not less, against IP Australia's commissioned study
  statement: >-
    IP Australia's commissioned study counts a request for examination made before the Commissioner directs one as a
    way of speeding examination up, and reports that applicants who speed up are more likely to renew their patents.
    Built from the open data, the same measure covers 41.39% of granted patents (the study: 41.9%). But with the
    filer, field, route, cohort and expedited examination held together, those patents are more likely to end in a
    given year after grant, in both periods ([[hazard-ratio|hazard ratios]] 1.276 and 1.383).
  figures:
    - value: "41.39%"
      label: of granted standard patents, 2004 to 2016, asked for examination before any direction (the study, 41.9%)
    - value: "1.276"
      label: "all filers, FY2010 to FY2016, held together (raw 1.214): more likely to end"
    - value: "1.383"
      label: "all filers, FY2003 to FY2009, held together (raw 1.366)"
  points:
    - "**The measure reproduces the study's share:** 303,486 standard patents with a date of patent in 2004 to 2016,
      divisionals left out, of which 191,477 granted; 41.28% were never directed. The share rose between the periods:
      overseas organisations 0.273 to 0.5148, Australian organisations 0.2357 to 0.4602."
    - "**By filer, held together:** overseas organisations 1.282, then 1.388; overseas individuals 1.298, then 1.340;
      Australian organisations 1.005 (not detected either way), then 1.587; Australian individuals 1.169 (not detected
      once held), then 1.486."
    - "**Why it may differ from the study:** its outcome (\"the lifetime over which the applicant renews the patent\")
      and its controls are not in IP Australia's report. Here each patent is followed from its grant, so the
      comparison is among patents alive at the same age."
    - "**One reading, to test:** applicants who wait use the years to drop weak applications before grant, the study's
      own point about delay as an option, so the granted patents of those who were directed are already filtered."
  revisits:
    - id: B13
      signal: Speeding up examination and staying in force
      verdict: refined
      what: >-
        On IP Australia's commissioned study's wider measure, a request made before any direction (41.39% of granted
        patents), the link with a longer life is not found either: those patents are more likely to end, held
        together (1.276 and 1.383).
  held: [the filer's origin and type, the technology field, the route of filing, the cohort, several founding applicants, the number of classes, expedited examination]
  verdicts:
    - signal: All filers, FY2010 to FY2016
      detail: 1.214 raw, 1.276 held together (more likely to end)
      verdict: holds
    - signal: All filers, FY2003 to FY2009
      detail: 1.366 raw, 1.383 held together
      verdict: holds
    - signal: Australian organisations, FY2010 to FY2016
      detail: 1.126 raw, 1.005 held together
      verdict: not detected either way
    - signal: Australian individuals, FY2010 to FY2016
      detail: 1.427 raw, 1.169 held together
      verdict: not detected once held
  chart:
    type: effect
    title: How likely patents examined on an unprompted request are to end, against those examined after a direction
    subtitle: Hazard ratios to 10 years from the date of patent (above 1 means more likely to end), with 95% intervals; FY2010 to FY2016 and FY2003 to FY2009
    x: {values: ["All filers, FY2010 to FY2016", "All filers, FY2003 to FY2009", "Overseas organisations, FY2010 to FY2016", "Overseas organisations, FY2003 to FY2009", "Overseas individuals, FY2010 to FY2016", "Overseas individuals, FY2003 to FY2009", "Australian organisations, FY2010 to FY2016", "Australian organisations, FY2003 to FY2009", "Australian individuals, FY2010 to FY2016", "Australian individuals, FY2003 to FY2009"]}
    y: {name: "Hazard ratio, unprompted against directed", format: ratio, digits: 2}
    ref: 1
    ref_label: equally likely to end
    series:
      - name: Raw
        colour: muted
        data: [[1.214, 1.116, 1.321], [1.366, 1.252, 1.490], [1.212, 1.105, 1.330], [1.343, 1.217, 1.483], [1.273, 1.158, 1.400], [1.431, 1.250, 1.638], [1.126, 0.965, 1.313], [1.477, 1.150, 1.897], [1.427, 1.162, 1.754], [1.661, 1.424, 1.936]]
      - name: Held together
        colour: 0
        data: [[1.276, 1.172, 1.389], [1.383, 1.286, 1.487], [1.282, 1.171, 1.404], [1.388, 1.281, 1.503], [1.298, 1.168, 1.443], [1.340, 1.170, 1.536], [1.005, 0.856, 1.180], [1.587, 1.235, 2.038], [1.169, 0.907, 1.505], [1.486, 1.217, 1.815]]
    source: IP Australia, IP RAPID (lens rights; its directions to request examination); notebook 3, section 1.11
  questions:
    - q: 1
      how: Asking for examination sooner does not mark a patent that is kept longer, on either the narrow measure (M5) or IP Australia's study's wider one.
    - q: 4
      how: Bears on how IP Australia reads its own study; the difference from the study is a question for IP Australia about its model.
  sources: [iprapid]
  prep:
    - what: "A request is unprompted if IP RAPID's first request for examination is dated before any direction to request examination (its exam_direction_to_request_exam events), as the study defines early and unprompted requests. Granted standard patents with a request, divisionals left out as the study left them, cohorts by the date of patent as in {M5}."
      why: The audit against IP Australia found that {M5} tested only expedited requests, a few per cent of patents, while the study's measure covers 41.9% of granted patents.
  steps:
    - Check that the measure gives the study's share of granted patents.
    - Compare unprompted with directed requests as a hazard ratio, raw, then with the filer, field, route, cohort, co-filers, classes and expedited examination held together.
    - Fit the same model within each filer group, and give each outcome.
  assumptions:
    - A request made before any direction is the applicant's own choice; a direction is IP Australia's, to manage its workload.
  limits:
    - The study's model and outcome are not published in the report, so this tests its measure, not its result.
  next: >-
    Ask IP Australia how the study measured the renewal lifetime and what it held (with the owner's request), and
    read M40 beside {M5} in the third early signal.
  terms: [unprompted-request, hazard-ratio, expedited, held-together, verdict-words]
  related: [B13, M5]
