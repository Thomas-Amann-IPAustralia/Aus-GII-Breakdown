that reason alone.", "cell": 182}, {"id": "U67", "lens": "national", "title": "IP RAPID, the World Bank and WIPO count Australia's patent applications alike; the World Bank's trade mark series count classes, not applications.", "body": "- **Standard patents, 1989 to 2024:** IP RAPID's count is within 1.5% of the World Bank's for Australian applicants\n  (median ratio 1.002; lowest 0.907, in 2008) and within 2.2% for overseas ones (0.985 to 1.022). The World Bank's\n  count is WIPO's exactly (ratio 1 in every year). Before 1989 IP RAPID's overseas count falls short (0.072 of the\n  World Bank's in 1980, 0.427 in 1985, 0.906 in 1988), because it records few overseas applicants' countries then\n  (U7: they are \"origin unknown\").\n- **Innovation and petty patents** against WIPO's utility models: median ratio 1.013, but 1.331 in 2016: a lead.\n- **Trade marks:** IP RAPID's Australian applications are 0.545 to 0.659 of the World Bank's \"trade mark applications,\n  resident, by count\", but its classes are 0.938 to 0.998 of it: the World Bank counts classes, as WIPO does. The\n  register now says so.\n- **So** the lenses agree with the international sources, and comparisons of trade marks across countries use class\n  counts on both sides.", "cell": 185}, {"id": "U68", "lens": "national", "title": "The attachments hold 41,218,170 values in 148,736 indicators; nearly all are the OECD's cross-border patent and business tables, and five OECD flows have no Australian values.", "body": "- **By source:** the OECD 40,707,162 rows (140,383 indicators, 101 places), WIPO 441,586 (271, with the direct and PCT national phase applications and the share of women inventors\n  added with the `rights` attachments, ADR 0022), the GII 45,828 (524,\n  139 economies), Closing the Gap 11,349 (4,731 series), Measuring What Matters 5,159 (198), and the ABS's 5,027\n  (2,463) and BCARR's 2,059 (166) Australia-wide tables, added with the `industries` lens (6.4).\n- **Most of it** is the three cross-border patent tables (6,625,600 rows each) and business survival (7,546,335) and\n  births and deaths (5,571,658): one indicator for every combination of office, date, unit, partner country, industry\n  and size.\n- **Not for Australia:** business births and deaths, survival and high growth, innovation and IP methods, and IP tax\n  regimes (Australia has no patent box). Venture capital ends for Australia in 2019 (other members to 2025).\n- **Flags:** 28.7% of the R&D statistics (MSTI) are flagged (estimates, breaks, definitions that differ) and 13.2% to\n  17.8% of business demography values; 3.2% to 5.0% of business demography values are suppressed and so empty.", "cell": 187}, {"id": "U69", "lens": "national", "title": "Australia ranks 20th of 139 economies in the GII 2026: 13th on innovation inputs and 24th on outputs.", "body": "- **Pillars:** human capital and research 9th, institutions 12th, market sophistication 17th, business sophistication\n  23rd, knowledge and technology outputs 26th, creative outputs 26th and infrastructure 29th.\n- **WIPO's strengths for Australia** are education and universities: school life expectancy (2nd), university,\n  industry and international engagement (4th), the QS university ranking (4th), tertiary inbound mobility (5th) and\n  cluster development (5th). **Its weaknesses** are outputs and trade: ICT services exports (99th), low-carbon energy\n  use (91st), graduates in science and engineering (90th), labour productivity growth (85th), and production and\n  export complexity (72nd). Against other high-income economies, patent families per dollar of GDP (29th) and public\n  research and industry co-publications (38th) are weaknesses too.\n- **Completeness:** 6 of Australia's 79 indicators are missing and 8 are outdated (the median economy: 6 and 9). The\n  missing include researchers per million people (the series that ends in 2010, U63), GERD financed by business and\n  utility models by origin.\n- A rank on a composite index reflects WIPO's choice of indicators and weights; the indicators beneath it are the\n  evidence, and each is in `national_indicators`.", "cell": 189}, {"id": "U70", "lens": "national", "title": "The United States files about four in ten patent applications at IP Australia; China now files as many as Australians do; three-quarters of Australians' applications are made abroad.", "body": "- **Origins at IP Australia:** the United States 41.2% (1995), 45.6% (2004) and 41.9% (2024); Australia 12.7%, 11.2%\n  and 8.3%; China 0.0%, 0.3% and 8.3%; Japan 8.6% to 4.9%; Germany 6.0% to 4.0%. Before 1995, 87.3% to 88.6% have an\n  unknown origin (U64).\n- **Australians abroad:** Australian residents' applications at every office were 4,389 (1995), 10,630 (2005) and\n  10,633 (2024), against 1,784, 2,555 and 2,542 at IP Australia: 59.4%, 76.0% and 76.1% abroad.\n- **IP Australia beside other OECD offices** (2024): 405 patent examiners (median office 83.5) and 134 trade mark\n  examiners (20.5); 347 days from a patent examination request to the first action (median 210); trade marks 37 days\n  from filing to the first action (30) and 97 to a final decision (140); 879,300 trade marks in force (248,300); 69\n  post-grant patent oppositions (12).\n- **The 222-day lead (U11):** WIPO gives IP Australia's average time from filing to registration for trade marks as\n  222 days (2016), the peak U11 found in IP RAPID. The peak is the office's usual path to registration, not an\n  artefact.", "cell": 191}, {"id": "U71", "lens": "national", "title": "In the OECD's cross-border patent tables \"World\" is the country's total; Australia's main partner is the United States, and China's share has varied.", "body": "- **How the tables read:** with \"World\" as the partner, the foreign ownership and co-inventor tables give the same\n  figure (2,117 PCT applications invented in Australia in 2015), and the domestic ownership table gives those owned in\n  Australia (1,762). These totals are the base for each partner's share. 2022, the latest year shown, is lower (1,720\n  and 1,489).\n- **Partners (2020):** of inventions made in Australia, 7.0% were owned by US residents, 3.7% by Chinese and 1.6% by\n  Swiss; 7.1% had a US co-inventor and 3.5% a Chinese one. Of Australian-owned inventions, 4.0% were made in the United\n  States. China's share of foreign ownership was 0.0% (2000), 3.7% (2020) and 0.5% (2022).\n- **Coverage:** Australia is in 19 of the 24 flows, with every OECD member reporting in most; IP tax regimes cover 19\n  members and innovation and IP methods 28.", "cell": 193}, {"id": "U72", "lens": "national", "title": "Measuring What Matters is mostly monthly labour statistics held elsewhere; Closing the Gap mixes observations with projections.", "body": "- **Measuring What Matters:** 3,767 of its 5,159 values are monthly (28 series: employment, unemployment and wages,\n  copies of the ABS series in `abs_labour` and `abs_prices`, which stay the main measures), 972 are for years, 273 for\n  financial years and 35 for groups with no period. Its two stacked tables now carry their blocks (30 and 24 values).\n- **Closing the Gap:** 11,349 values from 1991 to 2031; 353 are projections (trajectories to each target, to 2031),\n  443 model estimates (land and sea, by linear regression) and 75 assessments; 809 are not available or not\n  published; the Australian Government's land and sea (85 values) are restored.\n- **So** a projected value is never read as an observation (`status` says which), and Measuring What Matters' monthly\n  series are comparisons, never added to the ABS's.", "cell": 195}, {"id": "U73", "lens": "industries", "title": "The lens covers 19 divisions over 37 years, but only IP runs through all of them; the ABS's series cover one to four recent years, except wages.", "body": "- IP columns are filled for every division and year, FY1990 to FY2026. Businesses, entries and exits cover FY2023 to\n  FY2026, business R&D FY2024 only, wages FY1998 to FY2026 (18 divisions: the index leaves out agriculture), and\n  creative value added FY2016 to FY2025 for the 10 divisions with such activity.\n- **So** in Stage 2, IP can be related to businesses over four years and to R&D in one, across 19 divisions: few\n  points, so comparisons are of patterns, not models.", "cell": 228}, {"id": "U74", "lens": "industries", "title": "The crosswalks carry nearly every right, and a patent's division is usually clear, but its subdivision often is not.", "body": "- **Carried:** 98.42% to 99.73% of standard patents (FY1990 to FY2024; 92.71% in FY2026, whose filings are not all\n  classified yet), 99.82% to 99.93% of trade marks, and second-tier patents from 52.69% (FY1990, many petty patents\n  unclassified) to 100% (FY2024).\n- **B6:** subclass marks unknown to the crosswalk fall from 12,143 to 71 (of 2,518,546), and patents with no known\n  subclass from 3,853 to 20 (of 1,341,818): under the review's target of 0.1%.\n- **How decisive:** a standard patent's largest division share has a median of 0.996, and 77.9% put 90% or more in\n  one division; but its largest subdivision share has a median of 0.727 (77.08% put half or more in one). A trade\n  mark's division is less clear (median 0.792; 39.28% with 90% or more in one division).\n- **So** division counts for patents are close to certain, subdivision counts are spread estimates, and trade mark\n  counts are spread at both levels.", "cell": 228}, {"id": "U75", "lens": "industries", "title": "Nine in ten patents fall in manufacturing, because the patent crosswalk leaves out services; trade marks spread across industries, with a break in 2002.", "body": "- **Standard patents, FY2017 to FY2026:** manufacturing 90.78%, utilities 4.76%, agriculture 2.04%, mining 1.15%,\n  construction 0.94%; no service division above 0.23%. The corpus holds ALP's crosswalk *excluding services*, which\n  assigns patents only to goods-producing industries, so a patent's division says what kind of product its technology\n  is, not who uses it. The shares hardly move: manufacturing 90.93% (FY1990), 89.97% (FY2010), 90.82% (FY2026).\n- **Within manufacturing:** machinery and equipment 31.18% of all standard patents and basic chemicals and chemical\n  products (including pharmaceuticals) 30.17%, then food products 5.07% and polymer products 4.81%.\n- **Trade marks:** manufacturing 55.65%, professional, scientific and technical services 11.05%, information media\n  4.55%, administrative services 4.22%, finance 2.94%. Manufacturing's share fell from 73.94% (FY1990) to 56.51%\n  (FY2000) and has stayed near 55%.\n- **The 2002 break:** accommodation and food services have no trade marks to FY2001 and 1.67% from FY2003, health\n  care 0.46% (FY2001) to 1.59%, while professional services fall from 12.95% to 8.43%: the Nice classification's 8th\n  edition split class 42 into 42 to 45 in January 2002. Trade mark shares are compared within FY2003 on, or across\n  the break with that caveat.", "cell": 231}, {"id": "U76", "lens": "industries", "title": "Australians file a small share of patents in every industry, and about half of manufacturing's trade marks against three-quarters of services'.", "body": "- **Patents:** Australian applicants file 7.87% of manufacturing's standard patents, 9.05% of agriculture's, 10.62% of\n  utilities' and 17.29% of construction's (where the expected count is above 50).\n- **Trade marks:** 47.46% to 58.24% in the goods divisions (utilities, mining, manufacturing, agriculture), and 66.99%\n  to 79.75% in the services divisions (professional services lowest, other services highest).", "cell": 231}, {"id": "U77", "lens": "industries", "title": "Construction, professional services and property hold two in five businesses; manufacturing, which receives nine in ten patents, holds 3.2%.", "body": "- **June 2026:** construction 478,651 businesses (17.0%), professional, scientific and technical services 366,289\n  (13.0%), rental, hiring and real estate 319,717 (11.4%); manufacturing 90,879 (3.2%); mining 8,755 (0.3%).\n- **Growth FY2023 to FY2026:** health care 30.7% and transport 24.5% (with the highest entry rate, 26.5%, and exit\n  rate, 21.7%); agriculture −2.9% and retail −0.7%; manufacturing 1.8%.\n- **Churn:** entry rates run from 7.4% (agriculture) to 26.5% (transport) in FY2026, exit rates from 7.9% to 21.7%.\n- **So** a rate of IP per business by division would set patents' manufacturing against few businesses and services'\n  trade marks against many: Stage 2 reads it beside the crosswalks' limits (U75).", "cell": 233}, {"id": "U78", "lens": "industries", "title": "Professional services spend the most on R&D, mining the most per business; wages grew fastest in utilities and health care; creative value added is mostly in professional services and information media.", "body": "- **BERD, 2023-24:** $24.41 billion. Professional, scientific and technical services 37.6%, manufacturing 20.7%,\n  finance 14.3%, mining 5.0%, wholesale 4.9%. Per business (June 2024): mining $142,100, manufacturing $55,770,\n  utilities $54,870, information media $36,650, professional services $26,600, agriculture $3,175.\n- **Wages:** the index rose 44.5% (rental, hiring and real estate) to 56.8% (utilities) from FY2010 to FY2025; health\n  care 55.3%, education 53.9%, manufacturing 52.4%.\n- **Creative value added (nominal):** professional services $16,950 million (FY2016) to $28,630 million (FY2025),\n  information media $18,320 million to $24,960 million (it fell to $16,520 million in FY2020); manufacturing about\n  $2,600 to $3,000 million throughout.", "cell": 235}, {"id": "U79", "lens": "industries", "title": "The attachments hold 1,409,875 values, most of them CABEE's counts by class, state and area; the surveys are short and often flagged.", "body": "- **By source:** CABEE 1,250,325 (484,592 indicators: business counts by state, class and size, survival by\n  subdivision, and by local government area and division), the BCS 115,681 (2018 to 2023; 36.2% flagged for sampling\n  error, 25% not available for publication), the WPI 34,800 (quarterly, 1998 to 2026), IP by subdivision 4,459, BERD\n  3,560 (2023-24) and BCARR 1,050.\n- **Innovation (BCS):** 21.7% of businesses introduced a new good or service in 2023 (22.0% in 2021); from 9.9%\n  (agriculture) to 31.9% (information media), 31.1% (wholesale and retail) and 28.4% (manufacturing).\n- **BCARR's two releases** agree to within 1.2% where they overlap (FY2016 to FY2023), the newer slightly lower from\n  FY2021; they stay separate indicators, never spliced.\n- **Survival:** 61.9% of businesses operating in June 2022 survived to June 2026; from 47.3% (transport) to 74.5%\n  (agriculture).\n- **Australia-wide tables** (in `national_indicators`): CABEE's 2,014 values (FY2023 to FY2026), venture capital 1,775\n  (to 2018-19), higher education R&D 682, government and non-profit R&D 322, business R&D summaries 234, and BCARR's\n  creative domains in its two releases (1,233 and 826).", "cell": 239}, {"id": "U80", "lens": "institutions", "title": "The lens holds 130 institutions over 37 years; IP and grants run back further than research output, which OpenAlex gives only from 2010.", "body": "- **Who:** 46 medical research institutes, 44 universities, 18 other grant holders, 11 public research agencies, 7\n  health services and 4 other research institutes. \n- **Coverage:** works and citations from 2010 (129 institutions have some); ARC grants from 2001 (72 institutions hold\n  one), NHMRC grants from the 2013 round (88); AusTender contracts from 2005 (97 institutions; few before 2007);\n  IP and patent families for every year (84 institutions filed a standard patent, 112 a trade mark).\n- **So** Stage 2 can relate research to IP over 2010 to 2024, and grants to IP over 2001 (ARC) or 2013 (NHMRC) to\n  2024.", "cell": 244}, {"id": "U81", "lens": "institutions", "title": "The link finds 31,528 institution-rights, almost all by name and ABN together; universities patent through companies to very different degrees.", "body": "- **How matched:** 22,448 patent links by name and ABN, 4,158 by name alone (21.19% of them with no recorded country,\n  old filings), 62 by ABN alone; trade marks 4,160, 397 and 191. The names that came in by ABN alone are the\n  institutions' own under other names (Australian Hearing Services, the Anti-Cancer Council of Victoria, Orygen\n  Research Centre).\n- **Companies:** UNSW files 96.5% of its patent applications through NewSouth Innovations (formerly Unisearch), the\n  University of Newcastle 72.8% through Newcastle Innovation (formerly TUNRA), Adelaide 43.9% (Adelaide Research &\n  Innovation), Macquarie 19.1%, Flinders 15.7%, Queensland 2.1% (UniQuest); Sydney, Monash and QUT under 1%.\n- **Unmatched grants:** 14 ARC grants and 15 NHMRC grants (learned academies' secretariats, local health networks not\n  in the lens, a foundation and a baboon colony).\n- **So** counting a university's IP needs its companies: without them UNSW would show 3.5% of its patents. Whether\n  the list is complete is OQ11.", "cell": 244}, {"id": "U82", "lens": "institutions", "title": "Universities produce 86.8% of the institutions' works; five universities produce a third.", "body": "- **2015 to 2024:** universities 86.8% of works, medical research institutes 7.1%, public research agencies 3.9%,\n  health services 1.5% (works counted once for each institution).\n- **Leaders:** Melbourne 7.97%, Sydney 7.44%, Monash 6.90%, UNSW 6.38%, Queensland 6.28%; the Group of Eight 45.35%.\n  CSIRO is 12th (2.50%). Citations per work run from 27.92 (Deakin) to 35.09 (Adelaide) among the top 12.\n- **Growth:** 99,259 works in 2010, 225,865 in 2020 and 252,456 in 2024 (2026 is a part year, 216,108).\n- **Overlap:** Data61 (788 works in 2024) is CSIRO's child; its works are counted in its own row and, where its\n  authors also name CSIRO, in CSIRO's (5,340).", "cell": 247}, {"id": "U83", "lens": "institutions", "title": "Grants are concentrated: the Group of Eight hold two-thirds of ARC and NHMRC funding; a fifth of ARC funding is for research with industry.", "body": "- **Totals:** ARC funding $360.8 million (2002), $757.9 million (2010), $1,070 million (2020), $886.2 million\n  (2025); NHMRC $892.4 million (2015 round) to $1,079 million (2025). Both move year to year with large schemes.\n- **Who:** universities hold 100% of ARC funding and 78.8% of NHMRC funding (2015 to 2024); medical research\n  institutes 20.8% of NHMRC's.\n- **Concentration (2015 to 2024):** the top five hold 51.5% of ARC funding (Queensland the largest, 12.63%) and 55.9%\n  of NHMRC funding (Melbourne, 14.20%); the Group of Eight 66.3% and 63.5%. 44 institutions hold ARC funding, 77\n  NHMRC funding.\n- **With industry:** the industry-partner schemes take 9.7% (2017) to 29.2% (2024) of ARC funding.", "cell": 250}, {"id": "U84", "lens": "institutions", "title": "The institutions file a small and slowly rising share of Australian patents: 4.80% of standard patents filed from Australia in 1990 to 1994, 8.96% in 2020 to 2024; CSIRO files the most.", "body": "- **Share:** standard patents 4.80% (1990 to 1994), 7.33% (2000 to 2004), 7.98% (2015 to 2019), 8.96% (2020 to\n  2024); provisionals 6.01% to 9.83% over the same periods, then 4.86% in 2025 and 2026, when individuals' provisional\n  filing doubled (U8).\n- **By kind, 2017 to 2026:** universities 1,532 standard patents, public research agencies 523, medical research\n  institutes 375, health services 29; universities also 3,181 provisionals and 941 trade marks.\n- **Concentration:** 70 of 130 institutions filed a standard patent; CSIRO 481, UNSW 196, Monash 185, Sydney 156,\n  Queensland 150 (the top 5, 47.4%; the top 10, 63.4%).\n- **Filing with others:** 16.63% of CSIRO's standard patents have another founding applicant, Sydney's 42.95% and\n  South Australia's 43.40%; across the lens 24.3% to 34.2% by five-year period. Universities file 1.8 to 2.7\n  provisionals per standard application; QIMR Berghofer and CSIRO about one.\n- **So** the institutions are a minority of Australia's patenting, concentrated in a few, and their joint filings are\n  a measure of collaboration to test in Stage 2.", "cell": 253}, {"id": "U85", "lens": "institutions", "title": "US patents cite the institutions' research often, but rarely from Australian inventions; medical research institutes' works are cited most per work.", "body": "- **Citations:** works published in 2010 drew 26,933 US patent citations, 2015's 27,269, 2020's 7,819 and 2024's 268:\n  citations accumulate for years, so recent years are not comparable. 6.40% of the citations come from patents with\n  an Australian applicant or inventor.\n- **Per 1,000 works (2010 to 2014):** medical research institutes 107.7 are cited by a US patent, other research\n  institutes 74.39, public research agencies 64.56, health services 60.65, universities 43.26. Peter MacCallum 161.5,\n  QIMR Berghofer 140.9, the Florey 119.3, Data61 115.1; Melbourne leads the universities (64.25).\n- **Families:** 97.0% of the institutions' standard applications filed 2000 to 2024 are found in Google Patents, but\n  only 4.3% of their provisionals, which are rarely published. Of families first filed 2005 to 2019, 55.95% of the\n  public research agencies' were granted in the US, 51.37% of universities' and 44.70% of medical research\n  institutes'; the agencies' are cited most (7.25 families citing them within five years, universities 5.62).\n- **So** the research-to-invention link runs mostly through foreign patents (Q1): 93.6% of the patent citations to\n  Australian institutions' work come from inventions with no Australian applicant or inventor.", "cell": 256}, {"id": "U86", "lens": "institutions", "title": "Universities hold 77.9% of the institutions' contract value, public research agencies 19.0%; UNSW and CSIRO hold the most.", "body": "- **2017 to 2026:** universities 13,223 contracts ($5,834 million), public research agencies 1,723 ($1,426 million),\n  medical research institutes 215 ($121.9 million).\n- **Leaders:** UNSW $1,433 million (1,909 contracts), CSIRO $1,184 million (1,420), Melbourne $518.4 million, ANU\n  $472.7 million, Adelaide $443.2 million.\n- **Over time:** 38 contracts in 2005 and 90 in 2006, then 1,000 to 1,835 a year from 2008: the institutions' records\n  start in earnest in 2007. Single large contracts move the yearly value ($1,637 million in 2019).", "cell": 259}, {"id": "U87", "lens": "institutions", "title": "Half the universities' standard patents carry a postcode that is not a postal area, and the institutions account for nearly three-quarters of such codes.", "body": "- **FY2017 to FY2026:** 50.34% of the universities' standard patent applications with a filer's postcode (742 of\n  1,474) carry a real postcode with no residents, against 16.80% of the medical research institutes', 0% of the public\n  research agencies' and 1.31% of everyone else's.\n- **Which:** 2052 (UNSW, 210), 3800 (Monash, 151), 4072 (Queensland, 112), 3010 (Melbourne, 100), 2006 (Sydney, 95).\n  (Corrected on 26 October 2026: the table counted an application once for each institution filing it and named an\n  arbitrary one for each postcode; it now counts each application once and names the institution with the most.)\n- The institutions hold 71.58% of all the real codes with no residents.\n- **So** the `regions` lens's postal-area counts miss half the universities' patents, which stay in the state totals.\n  Stage 2 can place them through `institution_rights` and the institutions' locations (ROR), rather than a lookup of\n  postcodes (the open item in the handover).", "cell": 262}, {"id": "U88", "lens": "rights", "title": "Eight columns from IP RAPID's links, with the PCT country label read past.", "body": "- `filing_route` is filled for 93.69% of rights: every right but provisional applications and plant breeder's rights,\n  which claim nothing. 65.8% of rights claim no priority; the most claimed priority office is the United States\n  (44.6% of rights with one).\n- **The PCT country check.** IP RAPID labels 93.88% of its 614,973 PCT numbers `au`, and 15,568 of its 1,367,808\n  convention priorities carry another office's number under the label `au` (PCT numbers, and Brazilian, Indian,\n  Korean and Chinese formats). So a patent priority's office is read from its number (ADR 0022): after that, 0.7% of\n  standard patents with a priority have an office that cannot be read. 8 link dates are placeholders (1800, 1900) and\n  are not used to order priorities.", "cell": 96}, {"id": "U89", "lens": "rights", "title": "The PCT route agrees with WIPO's count of national phase entries, year by year.", "body": "From 1995 to\n2024, patents entering through the PCT are a median 1.001 of WIPO's PCT national phase entries at IP Australia\n(0.981 in 2006 to 1.007 in 2008, every other year within 0.4%), and the other standard patents are 0.989 to 1.019 of\nWIPO's direct applications. So the links are complete for patents, and IP RAPID reproduces WIPO's split between the\ntwo routes.", "cell": 96}, {"id": "U90", "lens": "rights", "title": "Overseas applicants come through the PCT; Australians have moved from provisionals to the PCT, divisionals and direct filing.", "body": "- **Overseas standard patents:** the PCT carried 6.1% in FY1985, 53.2% in FY1995 and 81.0% in FY2010, then 69.3% in\n  FY2026; a priority claimed abroad without the PCT fell from 81.0% to 10.0%; divisionals rose from 1.6% to 19.9%.\n- **Australian standard patents:** claiming only an Australian application (usually a provisional) fell from 81.2%\n  (FY1985) to 41.7% (FY2000), 20.2% (FY2020) and 11.4% (FY2026); the PCT rose from 7.8% to 45.2% (FY2020) and 34.6%\n  (FY2026); divisionals from 2.0% to 22.2%. Direct filing, claiming nothing, was 11.3% in FY2020 and 28.3% in FY2026: a\n  lead (a change in practice, or priority claims recorded late).\n- **Trade marks:** Australians' are 97.9% to 99.1% direct in every year shown. From overseas, the Madrid system carried\n  36.7% in FY2005, 57.2% in FY2020 and 44.0% in FY2026.\n- **Designs from overseas** claim a priority abroad for 70.7% (FY1985) to 87.5% (FY2010) and 75.8% (FY2026).", "cell": 96}, {"id": "U91", "lens": "rights", "title": "Where the inventions were first filed, and Australian brands taken abroad.", "body": "Standard patents\nfiled FY2017 to FY2026:\n- **From overseas:** the earliest priority was filed in the United States for 53.42%, at the European Patent Office for\n  10.43%, in China 7.76%, Japan 5.35% and the United Kingdom 5.23%. The PCT application was filed in the United States\n  for 44.35%, at the EPO 19.24%, in China 8.6% and at WIPO's International Bureau 6.99%.\n- **From Australia:** 88.3% of priorities are Australian applications (7.97% American), and 91.24% of PCT applications\n  were filed at IP Australia.\n- **Madrid:** Australian trade marks that became the basis of a Madrid application numbered 268 (filed 2001), 1,941\n  (2015), 2,258 (2020) and 1,455 (2025), 0.96% to 4.48% of Australians' marks; WIPO counts 2,064 (2015) and 2,151 (2020)\n  Madrid applications by Australian holders. The two agree in size, though a mark is counted at its own filing and WIPO\n  at the international application. Recent marks have had less time to be taken abroad.", "cell": 96}, {"id": "U92", "lens": "rights", "title": "Google Patents finds the family of nearly every standard patent filed since the 1980s.", "body": "- **Found:** standard patents 81.17% (filed in the 1970s), 98.78% (1980s), 98.99% (1990s), 94.81% (2000s), 99.23%\n  (2010s) and 98.14% (2020s); second-tier patents 58.38% (1980s) to 96.68% (2020s); provisional applications, which are\n  rarely published, 0% but for 11.06% of the 2000s'. The review measured 41.9% to 84.9% by decade (F06) on all patent\n  numbers, provisionals and designs included.\n- 734 Australian application numbers fall in two families (the lower is taken). 23.14% of standard patents filed FY2010\n  to FY2019 share a family with another Australian application, 88.29% of them through a divisional: family measures\n  repeat across those applications.\n- **Follow-up:** five years of citations are complete for every family of a standard patent filed to FY2019, and for\n  96.12% of FY2021's (3.88% empty) and 16.31% of FY2024's (83.69% empty), because a PCT application's family began about\n  30 months earlier.", "cell": 100}, {"id": "U93", "lens": "rights", "title": "Overseas applicants' patents belong to wide families; Australians' are mostly narrow.", "body": "Standard\npatents filed FY2010 to FY2019:\n- **Overseas applicants:** a median 6 offices; 8.28% filed only in Australia and 68.9% in five or more; 66.66% granted\n  in the United States.\n- **Australian applicants:** a median 2 offices; 45.53% filed only in Australia, 19.34% in five or more; 29.09% granted\n  in the United States. Australian individuals filed 59.91% of theirs only in Australia, organisations 40.71%.\n- Reach is chosen by the owner, and costs money in every office, so it is a common sign of expected value: a measure\n  for Stage 2, alongside years in force (U36).", "cell": 100}, {"id": "U94", "lens": "rights", "title": "Citations are spread unevenly, and Australians' patents are cited less.", "body": "Families citing a\nstandard patent's family within five years (filed FY2010 to FY2019): a median 6 for overseas applicants' (13.29% never\ncited, the 99th percentile 136) and 1 for Australians' (43.99% never cited, 99th percentile 44). The spread is a long\ntail (the chart's log scale), so Stage 2 compares citations as ranks or logs, within cohorts and technology fields, and\nbeside family size, since a family filed in more offices is more often cited.", "cell": 100}, {"id": "U95", "lens": "rights", "title": "Inventors are named for nearly every patent with a family, but their countries are missing for patents filed only in Australia.", "body": "- `inventors` is filled for 25.7% of rights (patents with a family that names inventors); standard patents filed FY2017\n  to FY2026 name a median 3 (mean 3.5; 22.46% one inventor; the most 133).\n- **Countries:** an inventor's country is known for 87.57% to 97.06% of overseas filers' standard patents in each decade\n  from the 1990s, but for 11.71% (1990s), 22.3% (2000s), 56.98% (2010s) and 64.27% (2020s) of Australian filers'. Of\n  Australian filers' patents with inventors but no country, 94.33% to 99.18% were filed only in Australia: Google\n  Patents' Australian publications give no inventor countries.\n- **So** `invented_in_australia` describes Australian filers' patents that were also filed abroad, and leaves out most\n  of those filed only here (ADR 0022).", "cell": 106}, {"id": "U96", "lens": "rights", "title": "Inventions filed from Australia are made here; few filed from overseas are.", "body": "Standard patents\nfiled FY2017 to FY2026 whose inventors' countries are known: 94.47% of those filed from Australia have an inventor in\nAustralia (16,062; 941 have none), against 0.85% of those filed from overseas (2,278). By year, overseas filers' patents\nwith an inventor in Australia numbered 28 (FY1990), 222 (FY2010), 212 (FY2020) and 222 (FY2026).", "cell": 106}, {"id": "U97", "lens": "rights", "title": "The gender estimates match WIPO's for Australia, but run high for most other countries, and far too high for China and Korea.", "body": "- **By country** (inventors of PCT families first filed 2015 to 2022, against WIPO's share of women among inventors in\n  PCT applications, 2016 to 2023): Australia 14.6% against 13.8% (0.8 points); the Netherlands, Spain, New Zealand,\n  Finland and Ireland are within 2 points. The median country is 4.5 points high: the United States 20.0% against\n  15.3%, Germany 16.6% against 10.7%, Japan 16.3% against 9.0%.\n- **China and Korea:** China 34.6% against 23.4% (11.2 points), with 49.1% of names between 10% and 90% likely to be a\n  woman's; Korea 37.0% against 15.7% (21.3 points), with only 53.3% of inventors given an estimate.\n- **Australia by year:** 11.8% against 13.1% (2001), 13.6% against 12.3% (2015), 14.9% against 14.6% (2021), then 17.2%\n  against 14.4% (2023) and 18.4% against 17.2% (2024).\n- **Decision** (ADR 0022): gender estimates are read as levels for inventors in Australia only; for other countries only\n  within one country over time; for China and Korea not at all.", "cell": 106}, {"id": "U98", "lens": "rights", "title": "About one inventor in seven in Australia is estimated to be a woman.", "body": "Of the inventors in\nAustralia named on standard patents filed FY2017 to FY2026 (each counted once per patent), an estimated 14.34% are\nwomen on patents filed by Australian organisations, 12.43% by Australian individuals and 12.75% by overseas filers. It\nis an expected count from names, not a record of anyone's gender.", "cell": 106}];

{id:1,title:'What public value does the IP system create?',short:'Public value',text:'Examine economic, social, technological and environmental outcomes, alongside the costs to rights holders and the wider public. Registration counts alone cannot establish that value.',stage:'Stage 1 describes activity and candidate measures. It does not establish a net benefit.'},
{id:2,title:'Who benefits, and who is underserved?',short:'Who benefits?',text:'Investigate differences between businesses, industries, regions and population groups, including barriers to access and unrealised innovation potential.',stage:'Stage 1 shows how recorded activity is distributed. Filing more does not necessarily mean benefiting more.'},
