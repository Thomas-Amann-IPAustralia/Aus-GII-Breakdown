- id: U113
  lens: timeline
  about: data
  headline: The Reserve Bank's cash rate and exchange rates are complete and monthly
  statement: >-
    The cash rate target runs from August 1990 (434 months), the interbank cash rate from May 1976, the dollar in US
    dollars from July 1969 and its trade-weighted index from May 1970, with no month missing. The cash rate target
    was 14% (September 1990), 0.1% (December 2020) and 4.36% (September 2026).
  figures:
    - value: "434"
      label: months of the cash rate target
    - value: "14% → 0.1% → 4.36%"
      label: the cash rate target, 1990, 2020 and 2026
    - value: "0.826 → 1.095 → 0.698"
      label: the dollar in US dollars
  points:
    - "Read as monthly averages (the cash rates) and month-end values (the dollar), as the RBA gives them."
  questions:
    - q: 5
      how: The cycle and the dollar's value are context for any before-and-after comparison of policy.
  sources: [rba]
  prep:
    - what: The RBA's statistical tables joined to the timeline by month.
      why: The timeline is monthly.
  steps:
    - Read each series, and check that no month is missing.
  assumptions:
    - The RBA's series are consistent over time.
  limits:
    - Context, not a measure of IP.
  next: >-
    Stage 2 relates them to filing from overseas ({B52}).
  terms: [cash-rate]
  related: [B52]

- id: U116
  lens: timeline
  about: data
  headline: The national accounts are complete and quarterly; real growth has slowed decade by decade
  statement: >-
    GDP has 268 quarters (September 1959 to June 2026) and each state's final demand 164, from September 1985. Real
    GDP grew a median 3.98% a year from 1960 to 1989, 3.01% from 1990 to 2019 and 2.14% from 2020 to 2026. In FY2025
    mining added the most value (12.59%), then health care (9.5%).
  figures:
    - value: "3.98% → 3.01% → 2.14%"
      label: median real GDP growth a year, by period
    - value: "-5.85%"
      label: the June quarter 2020
    - value: "12.59%"
      label: mining's share of value added (FY2025)
  points:
    - "Professional services 8.49%, finance 8.42%, manufacturing 6.12%, arts and recreation 0.89%."
    - "GDP and the states' demand join the timeline quarterly; value added joins the industries lens by financial
      year."
  questions:
    - q: 1
      how: The economy's size and mix, against which IP's contribution is later read.
    - q: 5
      how: Growth is context for before-and-after comparisons.
  sources: [abs_national_accounts]
  chart:
    type: bar
    title: Real GDP growth
    subtitle: Median yearly growth, by period
    x: {type: category, values: [1960 to 1989, 1990 to 2019, 2020 to 2026]}
    y: {name: "% a year", min: 0, format: pct, digits: 2}
    series:
      - name: Median growth
        data: [3.98, 3.01, 2.14]
    source: ABS Australian National Accounts (lens timeline)
  prep:
    - what: Key aggregates, state final demand and value added by industry from the ABS.
      why: GDP and demand are the economy's measures of activity; value added is by industry.
  steps:
    - Read each series and join it at its own frequency.
    - Summarise growth by period and value added by division.
  assumptions:
    - Chain volume measures are real growth.
  limits:
    - Context, not a measure of IP.
  next: >-
    Stage 2 sets them beside filing ({B56}, {B57}).
  terms: [gdp]
  related: [B56, B57]

- id: U123
  lens: timeline
  about: data
  headline: Section 100 is about 30% of the PBS's government cost and rising; the corpus's yearly files leave it out
  statement: >-
    From FY2023 to FY2026, the government's PBS cost rose from $17.04 billion to $20.5 billion; Section 100's share was
    29.94% to 30.88%, from 1.06% to 1.41% of prescriptions. The yearly files by pharmacy type hold $11.94 billion to
    $14.17 billion of the same years: the difference is Section 100.
  figures:
    - value: "29.94% to 30.88%"
      label: Section 100's share of the government's PBS cost
    - value: "1.06% to 1.41%"
      label: its share of prescriptions
  points:
    - "In FY2026 Section 100's largest costs are cancer immunotherapies and a cystic fibrosis treatment: pembrolizumab
      $0.665 billion (10.5%), nivolumab $0.458 billion (7.241%)."
    - "The timeline gains four PBS columns from July 2022; the yearly files' series stays apart, never added."
    - "The medicine case study (OQ8) is where these are used; Stage 2 has no pair for them."
  questions:
    - q: 1
      how: Medicines under patent are one place where IP's public cost and benefit meet; this sizes the spending.
  sources: [pbs]
  chart:
    type: bar
    title: Section 100's share of the PBS
    subtitle: FY2023 to FY2026, lowest and highest
    x: {type: category, values: [Share of government cost, Share of prescriptions]}
    y: {name: "%", min: 0, max: 40, format: pct, digits: 2}
    series:
      - name: Lowest
        data: [29.94, 1.06]
        colour: muted
      - name: Highest
        data: [30.88, 1.41]
    source: PBS monthly report (lens timeline)
  prep:
    - what: The PBS's monthly workbook, every section, from July 2022.
      why: The yearly files by pharmacy type leave out Section 100.
  steps:
    - Read each month's prescriptions and cost by section.
    - Compare with the yearly files.
  assumptions:
    - The monthly report and the yearly files count the same prescriptions where they overlap.
  limits:
    - 48 months, and no medicine patents linked yet.
  next: >-
    Used in the medicine case study, after Stage 3.
  terms: []
  related: []
