  sources: [iprapid, google_patents]
  prep:
    - what: Australian-founded standard patents (the founding applicant in Australia), filed FY2003 to FY2011 and FY2012 to FY2021, as in B19; "now held only overseas" means every current holder is overseas.
      why: Ownership is read at two endpoints, filing and today, not as a history of transfers (ADR 0040).
  steps:
    - Compare the share now held only overseas by grant, by reach and by the filer's type, each with nothing held (raw).
