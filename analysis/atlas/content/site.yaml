    - signal: At the same research spend, more patents are not seen to go with more licences or licence income; across every kind of institution, research that patents cite goes with the institution's own patenting, kind and size held
      ids: [B44, B62, M24, M38]
      strength: Observational, about 65 to 84 institutions (a lead)
      questions: [2]
      next: The sector review of the institutions link (OQ11); commercialisation data by field
    - signal: Raising the Bar's rush, and Australians' lower level of standard patents after it, hold with trend and season held; the Designs Act's overseas step does not stand apart from a rise in a control
      ids: [U28, B37, M25]
      strength: Observational
      questions: [4, 5]
      next: A design for Q5 around Raising the Bar (who rushed, and what their rushed applications became)
    - signal: Divisionals doubled among organisations' standard patents, within the same filers (Australian +19.18 points, overseas +10.97)
      ids: [B15, M26]
