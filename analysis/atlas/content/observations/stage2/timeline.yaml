  statement: >-
    As changes from one year to the next, by quarter, real [[gdp|GDP]] goes with overseas applicants' standard patents
    at 0.158 to mid-2008 and 0.38 after; with Australians' standard patents at -0.056 and 0.191. Of 16 pairs of a
    state's final demand with Australians' filing, two keep their sign at 0.1 or more in both periods, a number chance
    could give (not computed here).
  figures:
    - value: "0.158 → 0.38"
      label: real GDP with overseas applicants' standard patents, before and after mid-2008
    - value: "Two of 16"
      label: pairs of a state's demand with Australians' filing that keep their sign
  points:
    - "Overseas applicants' trade marks and designs: 0.051 to 0.205. Australians' trade marks 0.207 and -0.201."
    - "The two that keep their sign are the Northern Territory's (patents 0.143 and 0.14, trade marks -0.178 and -0.29)."
    - "**So** the business cycle ({B52}) and real growth go with filing from overseas more than with Australians' filing,
      though Australians' standard patents reach 0.191 with GDP since 2008. These are changes that depend on the
      quarters before, with no interval, so each is a weak reading."
  questions:
    - q: 1
