      next: IP Australia on when priority claims are recorded (OQ18), and PCT follow-ups at national phase, about 30 months on
  recorded: >-
    The business cycle ({B52}, {B56}, {B63}, {M36}): with block resampling only overseas applicants' trade marks before
    2008 move with it. A third factor for before-and-after comparisons, not a signal.
  gaps_intro: >-
    Stage 3's second table: the gaps in the data that limit the signals above, with a possible source and cost for
    each. Sourcing any that cost money or need an account is the owner's call.
  data_gaps:
    - gap: Size and industry for small firms
      why: The main third factor every firm signal lacks ({M8}, {M9}, {M11}, {M29})
      source: ABS DataLab (BLADE; ruled out, OQ9), or industry estimated from each firm's IP classes and name (OQ20)
      cost: A fee and an approval; or free, as an estimate
    - gap: The ABNs IP RAPID leaves out
      why: Recent counts of firms by year; the name match closes most of the fall but links only 17.7% to 35.3% of the unlinked rights ({M12})
      source: IP Australia (OQ7)
      cost: Free (the request)
    - gap: Trading and business names
      why: The name match uses ABN main names and ASIC company names only
      source: "ASIC's business names register (bulk data, free)"
      cost: Free
    - gap: Kinds of expedited request
      why: "\"Expedited\" mixes applicants' requests with work-sharing ({M5})"
      source: IP Australia (OQ25)
      cost: Free (the request)
    - gap: Dated ownership changes and holders
      why: Ownership is read at two endpoints only ({M6}, {M30}); who files all-Australian teams' patents from overseas ({M27})
      source: "IP Australia's register (assignment events)"
      cost: Free; harvest time
    - gap: Older Australian families
      why: Reach and citations are read from FY2010 only ({M3}, {M4}, {B55})
      source: "EPO's patent family service (OQ21)"
      cost: Free (an account)
    - gap: A working-day calendar
      why: Shared shocks across monthly series may be calendar effects ({M20})
      source: Public holiday calendars by state
      cost: Free
    - gap: A review of the institutions link
      why: Every institutions result rests on it ({M23}, {M24}, {M38})
      source: Someone in the sector (OQ11)
      cost: Staff time
    - gap: Business R&D by division in more than one year
      why: The industry results rest on FY2024 alone ({M22}, {M37})
      source: ABS business R&D (earlier releases)
      cost: Free
    - gap: Renewal payment dates
      why: Whether owners paid early at the old fee, which the anniversary test cannot see ({M28})
      source: "IP Australia's register (payment events)"
      cost: Free (the request)
    - gap: "Divisionals' parents and examination dates"
      why: Whether divisionals keep claims pending longer ({B15}, {M26})
      source: "IP RAPID's links with examination events; IP Australia"
      cost: Free
    - gap: Court judgments after 10 March 2025
      why: The IP judgments end with the corpus ({U124}, OQ22)
      source: "The Federal Court's listings"
      cost: Free; access refused from here
    - gap: "The CER's and AusTender's monthly series in the timeline"
      why: Planned timeline attachments not built (both sources are in other lenses, so every source still reaches a lens)
      source: The corpus's own tables
      cost: Free; a build change
  puzzles_intro: >-
    Things the analysis has found but cannot yet explain. They are kept in view, not explained away. Several are
    closed or narrowed: IP RAPID's innovation patents in 2016 ({U67}), by the review against IP Australia; the trade
    mark expedite fall of November 2018 ({U34}), by IP Australia's own register ({U103}); most of the fall in
    Australian organisations' patents filed only in Australia ({B11}), by a gap in older records ({B55}); and about half
    of the recent fall in first patent filers, by the name match ({M12}).
  puzzles:
    - Australians' direct filing of standard patents rose to 28.3% in FY2026 ({U90}), and provisionals filed in FY2025 were followed up less often, mostly by new and heavy individual filers ({B38}, {M35}); both could be priority claims recorded late (OQ18).
    - The share of divisional applications about doubled among both Australian and overseas organisations, within the same filers ({B15}, {M26}); why is not in the data.
    - Firms with a first observed patent fell from 1,167 (FY2021) to 810 (FY2024); innovation patents closed in August 2021 ({U45}). About half of the later fall is linking ({M12}).
    - Plant breeder's rights applications were the decade's lowest in FY2025 and FY2026, which may be real or a delay in recording ({U6}).
    - The World Bank's share of the labour force with advanced education steps up around 2010 ({U65}).
    - Plant breeder's rights change hands more often in recent years ({U17}).
    - Petty patents filed in FY1986 to FY1988 mostly have no acceptance recorded ({U32}).
    - Patent cessations stepped up after September 2002 in the national series, but not at each patent's own anniversary ({M34}, {M28}); and why a 2% rise would move trade mark cessations in 1993 is not shown.
  open_intro: >-
    Some questions only the research owner, or IP Australia, can answer. They are listed so that nothing depends on
    an unstated guess.
  owner:
    - "**Review Stage 3's two tables**: the fifteen early signals and thirteen data gaps above, before the questions are answered."
    - "**The name match** (OQ26): whether to adopt the matched business numbers into the firms' counts, or keep them beside the counts ({M12})."
    - "**A sector check of the institutions link** (OQ11): a half-hour review by someone who knows the sector, which every institutions result rests on ({M23}, {M24}, {M38})."
    - "**Firms' size and industry for small firms** (OQ20): known only for employers of 100 or more; small firms need a paid or requested source."
    - "**Older Australian patent families** (OQ21): repair the links from the EPO's patent family service (free, but an account in your name), or read family measures from FY2010 only."
    - "**Court judgments after March 2025** (OQ22) and ABS TableBuilder (OQ4, on hold)."
  ipa:
    - What evidence supports IP Australia's reading that digital tools, including AI, drove the rise in provisional applications, and are the few very heavy filers part of it? (OQ5, {U8}, {M35})
    - IP Australia's register records "Examination expedited" for nearly every trade mark claiming an overseas filing date, and for a growing share of other marks where no one asked; IP RAPID stopped publishing the event in November 2018. What does it mean where no one asked, and could IP RAPID publish it? (OQ6, {U34})
    - IP Australia's register holds a business number for most of the recent applications that have none in IP RAPID. Why does IP RAPID leave them out, and could it publish them? (OQ7, {U45}, {M12})
    - What does IP Australia's figure of 55.6% of resident applications filed by individuals in 2022 count? (OQ12, {U13}, {U48})
    - "IP Australia's own register, IP RAPID and WIPO agree on 2018's trade marks, about 2,000 fewer than IP Australia's report: what did the report's 2018 count include? (OQ13, {U5})"
    - IP Australia's register holds the owner's country for most designs IP RAPID leaves without one. Could IP RAPID publish it? (OQ14, {U7})
    - Are inventors added to a provisional application later, or no longer recorded for some? (OQ17, {B18})
    - "When does IP RAPID record a patent application's priority claims: when it is filed, or later? (OQ18, {B38}, {M35})"
    - "Can IP RAPID tell applicants' own requests for expedited examination from work-sharing requests (the Patent Prosecution Highway)? (OQ25, {M5})"
  after:
    - The research owner reviews Stage 3's early signals and data gaps, and decides on the name match (OQ26).
    - Source the data worth adding for the gaps (free first; any cost proposed with an estimate).
    - Only then design the analyses that answer the five questions, with natural experiments wherever an additional benefit is claimed.

