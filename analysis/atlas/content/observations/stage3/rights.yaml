      later divisionals, +7.1."
    - "**Overseas organisations:** +8.5 raw, +8.8 held together; without their ten largest +8.4. Their ten largest hold
      8.51% of the later divisionals."
    - "So Stage 2's doubling is not a change in the mix of fields or filers: the same organisations file more
      divisionals."
    - "Why is not in the data. Stage 2's lead, that a divisional keeps claims pending longer, needs the dates of each
      divisional's parent and its examination."
  revisits:
