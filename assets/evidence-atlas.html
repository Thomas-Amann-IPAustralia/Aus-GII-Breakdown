{id:'U44',title:'A small share of firms accounts for most standard patents.',summary:'The top 1% of identified filing firms account for 55.3% of their standard patent applications. A typical filing firm has just one.',qs:[2,3],period:'All recorded filings in the firm profile',population:'23,971 identified standard-patent filing firms',chart:'concentration',labels:['Standard patents','Trade marks','Designs'],values:[55.3,25.9,35.8],unit:'% of applications filed by the top 1% of filing firms',source:'IP RAPID → rights lens → firms lens',method:'Count applications credited to the first founding applicant with an ABN. For each type of right, keep firms with at least one application, rank their counts and calculate the share filed by the largest 1%.',logic:'For standard patents, the notebook identifies 23,971 filing firms and 183,989 applications. It selects the largest 240 firms (1% of 23,971, rounded) and divides their combined applications by 183,989. The reported result is 55.3%.',why:'A national average can conceal who participates. This establishes concentration in recorded filing, a starting point for examining who uses the system and under what conditions.',limits:'These are firms identified by ABN, not every applicant or every Australian business. Missing links make counts lower bounds. The first-applicant rule does not allocate joint filings to all collaborators. Patent counts do not measure profit, innovation quality or public benefit.',assumption:'An ABN is used as the firm identifier; corporate groups can contain several ABNs. “Top 1%” is calculated separately for each type of right.',next:'Relate firms’ IP use to their R&D, age, type and contracts. Use medians, ranks or a compressed scale so a handful of large filers do not dominate the summary.',gloss:'The median is the middle firm after sorting firms by their application count. It gives a better picture of a typical firm when a few firms file very large numbers.',sourceURL:'https://data.gov.au/data/dataset/iprapid'},
{id:'U4',title:'More than half of all recorded rights are trade marks.',summary:'A combined IP total mostly describes trade marks. Standard, provisional and second-tier patents also need to be kept distinct.',qs:[1,2],period:'Full rights snapshot; historical coverage varies',population:'4,368,006 recorded IP rights',chart:'types',labels:['Trade marks','Patents','Designs','Plant breeder’s rights'],values:[2335064,1752428,268782,11732],unit:'Recorded rights',source:'IP RAPID → rights lens',method:'Count each right once, grouped by right type. Split patents into standard, provisional and second-tier rights before interpreting patent totals.',logic:'Of 4,368,006 rights, 2,335,064 are trade marks: 53.5% after rounding. Among patents, 82.17% are standard patents.',why:'Different rights protect different things. Their composition matters before using a headline total to describe participation or public value.',limits:'This is the stored historical register, with different coverage periods for each right type. It is not a count of active rights, unique inventions or economic benefits.',assumption:'Each recorded application is a unit of activity, not an equivalent unit of value.',next:'Compare types separately. Use standard patents for patent headlines and investigate relationships within appropriate groups.',gloss:'A provisional application reserves a filing position; it is not itself granted as a patent.',sourceURL:'https://data.gov.au/data/dataset/iprapid'},
{id:'U45',title:'A recent decline may be in the links, not the filing.',summary:'Fewer Australian organisations’ trade marks are linked to a founding applicant’s ABN in the latest years.',qs:[2,3],period:'FY2024–FY2026',population:'Australian organisations’ trade mark applications',chart:'line',labels:['FY2024','FY2025','FY2026'],values:[84.1,71.4,59.9],unit:'% linked to a founding applicant’s ABN',source:'IP RAPID → rights lens → firms lens',method:'For each financial year, keep trade marks with an Australian organisational founding applicant. Calculate the proportion with a recorded founding ABN.',logic:'The recorded linking rate falls from 84.1% to 59.9% over these three years: a 24.2 percentage-point drop. Counts of identified filing firms cannot be read as an unqualified trend in participation.',why:'An apparent decline in participation could misdirect attention towards a barrier that the data have not established.',limits:'The reason for weaker links is unresolved. Delayed ABN attachment and changes in collection are possible explanations, not established causes.',assumption:'A missing ABN means a missing link; it does not establish that the applicant did not file or has no ABN.',next:'Compare firm-level filing by year only to FY2024 until the linking issue is resolved (ADR 0016; open question OQ7).',gloss:'A percentage point is the difference between two percentages. Moving from 84.1% to 59.9% is a fall of 24.2 percentage points.',sourceURL:'https://data.gov.au/data/dataset/iprapid'},
{id:'U52',title:'Geographic concentration can be one large firm’s footprint.',summary:'The tenth of postal areas with the most standard patents account for 72.5% of them, but 29.2% of people.',qs:[2],period:'FY2017–FY2026 filing window',population:'2,641 postal areas; top 264 by patent count',chart:'bars',labels:['Standard patents','Population'],values:[72.5,29.2],unit:'% in the top tenth of postal areas by standard-patent count',source:'IP RAPID + ABS geography → regions lens',method:'Rank postal areas by standard-patent count, breaking ties by postcode. Sum patents and population within the top 264 areas, then compare their shares of each total.',logic:'These same areas contain 72.5% of the standard patents and 29.2% of people. In some areas, a single firm accounts for most of the filing.',why:'This locates recorded activity and prompts questions about its distribution. It also warns against treating an area total as widespread local participation.',limits:'Applicant addresses need not locate the research or the people who benefit. Large firms can dominate an area. Area-level patterns cannot be assigned to every resident.',assumption:'Postal areas are useful geographic units, but do not define a shared innovation ecosystem.',next:'Read area counts beside the firms behind them; investigate relationships with remoteness, advantage and business mix.',gloss:'An area can have a high patent count even when almost all its patents come from one organisation.',sourceURL:'https://data.gov.au/data/dataset/iprapid'},
{id:'U65',title:'Australia’s R&D intensity is below its 2008 peak.',summary:'Recorded gross R&D spending fell from 2.24% of GDP in 2008 to 1.68% in 2023.',qs:[1,4],period:'Selected reported years, 1990–2023',population:'Australia; gross domestic R&D expenditure',chart:'line',labels:['1990','2008','2015','2023'],values:[1.26,2.24,1.87,1.68],years:[1990,2008,2015,2023],unit:'Gross R&D expenditure as % of GDP',source:'OECD / World Bank series → national lens',method:'Express gross R&D expenditure relative to GDP. The national lens holds OECD and World Bank series separately; do not splice them into a continuous series.',logic:'The notebook reports 1.26%, 2.24%, 1.87% and 1.68% for these years. This chart uses only those selected reported points; its connecting lines are guides, not annual estimates.',why:'R&D provides context for Australia’s innovation activity. It helps frame later comparisons, without treating R&D or patenting as a complete measure of innovation.',limits:'A falling ratio does not necessarily mean spending fell in dollars. This chart does not explain the change or attribute it to IP policy. The exact indicator and release should be bound from the execution manifest.',assumption:'R&D as a share of GDP is a context measure, not a direct measure of public value.',next:'Compare Australia with OECD members using consistent series and ratios to people or GDP. Investigate potential relationships without assuming causation.',gloss:'R&D intensity compares research and development spending with the size of the economy. 1.68% means $1.68 of R&D for each $100 of GDP.',sourceURL:'https://sdmx.oecd.org/public/rest/'},
{id:'U75',title:'A manufacturing-heavy result partly reflects the classification.',summary:'90.78% of standard patents are assigned to manufacturing under a crosswalk that excludes services.',qs:[2,4],period:'FY2017–FY2026',population:'Standard patents assigned to industry divisions',chart:'bars',labels:['Manufacturing','Utilities','Agriculture','Mining','Construction'],values:[90.78,4.76,2.04,1.15,.94],unit:'% of standard patents · selected divisions',source:'IP RAPID + classification crosswalk → industries lens',method:'Translate patent technology classes into industry divisions using the corpus’s ALP crosswalk, which excludes services.',logic:'The mapping places 90.78% in manufacturing. The industry label describes the product associated with the technology; it does not identify every industry that uses it.',why:'Industry comparisons can suggest opportunities only when we understand what the categories actually measure.',limits:'This does not show that services produce almost no innovation or use almost no patents. Classification design strongly shapes the result.',assumption:'The existing mapping is fit for describing goods-related technology; service-sector interpretations require another approach.',next:'Assess an alternative crosswalk including services before drawing service-sector comparisons. Keep trade mark comparisons within FY2003 onwards or disclose the classification break.',gloss:'A crosswalk is a lookup that translates one classification into another, much like a dictionary between two sets of categories.',sourceURL:'https://www.wipo.int/'},
{id:'U81',title:'A university’s patents may sit with its commercialisation company.',summary:'UNSW files 96.5% of its patent applications through NewSouth Innovations. Other institutions use companies to very different degrees.',qs:[1,4],period:'Institution-linkage snapshot; not a common annual cohort',population:'Institution-linked patent applications',chart:'bars',labels:['UNSW','Newcastle','Adelaide','Queensland'],values:[96.5,72.8,43.9,2.1],unit:'% of each institution’s patent applications through its company',source:'IP RAPID + institution identity matching → institutions lens',method:'Link founding applicants to institutions using names and ABNs, including known commercialisation companies and historical names.',logic:'Without its linked company, UNSW would appear to account for only 3.5% of its recorded patent applications. A name-only comparison would treat institutions inconsistently.',why:'Consistent institutional coverage is needed before examining how research connects to invention and wider outcomes.',limits:'Company lists may be incomplete (OQ11). These percentages reflect organisational arrangements, not a ranking of research performance.',assumption:'The matched commercialisation companies appropriately belong within each institution’s analytical boundary.',next:'Check the institutional company list, then relate research to IP over 2010–2024 and examine joint filing and industry-partner grants.',gloss:'An analytical boundary defines which related entities are counted as part of the organisation being studied.',sourceURL:'https://data.gov.au/data/dataset/iprapid'},
{id:'U26',title:'January is a quieter filing month for Australian applicants.',summary:'In 2010–2019, Australian standard-patent filing in January was 75% of an ordinary month; overseas filing was 95%.',qs:[4,5],period:'2010–2019',population:'Standard-patent applications by applicant origin',chart:'bars',labels:['Australian applicants','Overseas applicants'],values:[75,95],unit:'January filings as % of an ordinary month',source:'IP RAPID → timeline lens',method:'Compare filing in each calendar month with an ordinary month within the period, keeping Australian and overseas applicants separate.',logic:'The reported January index is 75 for Australian standard patents and 95 for overseas applicants. The benchmark of an ordinary month is 100.',why:'Seasonal patterns matter when examining possible changes around a policy event. The calendar can otherwise resemble an intervention effect.',limits:'This is a repeated seasonal pattern; it does not establish why January differs. Filing activity is distinct from the office’s processing output.',assumption:'The chosen period provides a useful seasonal baseline. Patterns should be checked again for other periods.',next:'Compare the same month a year earlier, or 12-month totals, instead of adjacent months. Investigate policy-event timing with comparison dates.',gloss:'An index of 100 means an ordinary month; 75 means three-quarters of that level.',sourceURL:'https://data.gov.au/data/dataset/iprapid'}
];
const curatedById=Object.fromEntries(CURATED.map(x=>[x.id,x]));
const archiveById=Object.fromEntries(ARCHIVE.map(x=>[x.id,x]));
const state={page:'explore',lens:'all',query:'',q:'all',mode:'curated',saved:new Set(),selected:null,tab:'overview',chartView:'chart',measure:'share'};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const num=n=>Number(n).toLocaleString('en-AU',{maximumFractionDigits:2});
function sourceLink(path,label){return `<a href="${REPO+path}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`}
function meta(o){const l=LENSES[o.lens];return `<span class="id">${o.id}</span><span class="dot" style="--accent:${l.color}"></span><span>${l.name}</span><span>·</span><span>${o.id==='U0'?'Reconciliation needed':'Descriptive'}</span>`}
function record(id){return {...archiveById[id],...curatedById[id]};}
function questionTags(o){return (o.qs||[]).map(q=>`Q${q} · ${QUESTIONS[q-1].short}`).join(' &nbsp; ')}
function shortText(s){return s.replace(/\*\*|`/g,'').replace(/^[-#]\s*/gm,'').replace(/\s+/g,' ').slice(0,170)}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2500)}
function bookmarkButton(id){return `<button class="bookmark" data-save="${id}" aria-label="${state.saved.has(id)?'Remove':'Save'} ${id} ${state.saved.has(id)?'from':'to'} shortlist" aria-pressed="${state.saved.has(id)}">${icon('bookmark')}</button>`}
function barChart(o,detail=false){let vals=o.values,labels=o.labels,unit=o.unit,max=100;
 if(o.chart==='types'){if(state.measure==='count'&&detail){max=Math.max(...vals);unit='Number of recorded rights'}else{vals=vals.map(v=>100*v/4368006);unit='% of all recorded rights'}}
 const digits=o.id==='U75'?2:1;
 return `<div role="img" aria-label="${esc(unit)}. ${labels.map((l,i)=>`${esc(l)}: ${num(vals[i])}`).join('; ')}">${labels.map((l,i)=>`<div class="barrow"><span>${esc(l)}</span><div class="bartrack"><div class="barfill" style="width:${Math.min(100,vals[i]/max*100)}%"></div></div><strong>${o.chart==='types'&&state.measure==='count'&&detail?num(vals[i]):num(+vals[i].toFixed(digits))+(o.chart==='types'?'%':'')}</strong></div>`).join('')}</div><div class="chart-note">${esc(unit)}${o.id==='U26'?' · ordinary month = 100':''}</div>`;
}
function lineChart(o){const W=500,H=190,left=40,right=36,top=25,bottom=37;const max=o.id==='U65'?3:100;const years=o.years||o.values.map((_,i)=>i);const x=i=>left+(years[i]-years[0])/(years.at(-1)-years[0])*(W-left-right),y=v=>top+(1-v/max)*(H-top-bottom);const pts=o.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.unit)}: ${o.labels.map((l,i)=>`${l} ${o.values[i]}`).join(', ')}"><title>${esc(o.unit)}</title>${[0,max/2,max].map(v=>`<line x1="${left}" x2="${W-right}" y1="${y(v)}" y2="${y(v)}" stroke="#d9e2d8" stroke-dasharray="3 4"/><text x="${left-10}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}<polyline points="${pts}" fill="none" stroke="${LENSES[o.lens].color}" stroke-width="3"/>${o.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${LENSES[o.lens].color}" stroke="white" stroke-width="2"/><text class="value" x="${x(i)+(i===0?6:i===o.values.length-1?-6:0)}" y="${y(v)-13}" text-anchor="${i===0?'start':i===o.values.length-1?'end':'middle'}">${v}%</text><text x="${x(i)}" y="${H-11}" text-anchor="middle">${o.labels[i]}</text>`).join('')}</svg><div class="chart-note">${esc(o.unit)}${o.id==='U65'?' · selected years only; lines guide the eye':''}</div>`;
}
function chart(o,detail=false){return o.chart==='line'?lineChart(o):barChart(o,detail)}
function feature(){return `<div class="sectionhead"><div><h2>A place to start</h2><p>One observation. Follow it all the way back to the evidence.</p></div><small>Featured · U44</small></div><article class="feature"><div class="feature-copy"><div class="metarow">${meta(record('U44'))}</div><h2>A small share of firms.<br>A large share of patents.</h2><p>The top 1% of identified filing firms account for more than half of their standard patent applications. What does that tell us — and what doesn’t it?</p><div class="linkrow"><button class="primary" data-open="U44">Explore the evidence ${icon('arrow')}</button><span class="qtag">Q2 · Who benefits?<br>Q3 · Conditions for value</span></div></div><div class="feature-viz"><div class="viz-title">Share of standard-patent applications filed by the top 1%</div><div class="bigstat">55.3<span>%</span></div><div class="small">Among firms with an identified ABN and at least one filing</div><div class="hundred" role="img" aria-label="55.3% of applications from the top 1% of identified filing firms; the remaining 99% account for 44.7%.">${Array.from({length:100},(_,i)=>`<i${i<55?' class="on"':i===55?' style="background:linear-gradient(to right,#195d55 30%,#d5dfcd 30%)"':''}></i>`).join('')}</div><div class="legend"><span><i class="key"></i>Top 1% of filing firms</span><span><i class="key" style="background:#d5dfcd"></i>Remaining 99%</span></div><div class="caption">Each square = 1% of applications · 23,971 filing firms · IP RAPID, firms lens<br>Reported notebook figure; not independently recomputed.</div></div></article>`}
function card(o,archive=false){const l=LENSES[o.lens];return `<article class="card ${archive?'archive-card':''}" style="--accent:${l.color};--tint:${l.tint}"><div class="metarow">${meta(o)}</div>${bookmarkButton(o.id)}<h3>${esc(o.title)}</h3><p class="${archive?'excerpt':''}">${esc(o.summary||shortText(o.body))}</p>${!archive&&o.chart?`<div class="mini-chart">${chart(o)}</div>`:''}${o.id==='U0'?'<p><span class="review">Narrative and output counts disagree</span></p>':''}<div class="card-bottom"><span class="qtag">${o.qs?questionTags(o):'Notebook observation · source text'}</span><button data-open="${o.id}">${archive&&!o.chart?'Read observation':'Follow the evidence'} ${icon('arrow')}</button></div></article>`}
function footer(){return `<footer class="endnote"><span>Evidence Atlas · A design framework for Australia’s IP research<br>Source snapshot: notebook dated 26 October 2026 · Retrieved 27 October 2026</span><span>Descriptive evidence ≠ causal evidence<br>${sourceLink('docs/research-goal.md','Read the research purpose')}</span></footer>`}
function renderExplore(saved=false){$('#main').innerHTML=`<div class="hero"><div><div class="eyebrow">${saved?'Your reading list':'Stage 1 / Understand the data'}</div><h1>${saved?'Keep the important threads.':'Follow the evidence.'}</h1><p>${saved?'A shortlist for this session. Export your selected observations to keep a record.':'Explore what Australia’s IP data shows, how we know it, and where the evidence stops. Start with an observation. Go deeper when you’re ready.'}</p></div><div class="hero-metrics"><div><strong>99</strong><small>Observations</small></div><div><strong>7</strong><small>Analytical lenses</small></div><div><strong>5</strong><small>Research questions</small></div></div></div>${saved?`<button class="primary" id="export-btn">${icon('download')} Export shortlist</button><p class="small">Saved in memory for this session; refreshing clears the shortlist.</p>`:`<div class="stage-strip"><div class="stage-active"><span class="stage-n">1</span>Describe, then investigate</div><p>Stage 1 profiles each variable. It does not show what causes an outcome or whether IP creates public value.</p><button data-page="next">See the research journey →</button></div>${state.lens==='all'&&state.q==='all'&&!state.query&&state.mode==='curated'?feature():''}`}
<div class="sectionhead"><div><h2>${saved?'Saved observations':'Explore the observations'}</h2><p>Choose a lens — the kind of thing being counted.</p></div></div><div class="lensbar" aria-label="Filter by analytical lens">${Object.entries(LENSES).filter(([k])=>k!=='corpus').map(([k,l])=>`<button data-lens="${k}" class="${state.lens===k?'active':''}" aria-pressed="${state.lens===k}">${k!=='all'?`<span class="dot" style="--accent:${l.color}"></span>`:''}${l.name}</button>`).join('')}</div><div class="tools"><label class="search">${icon('search')}<input id="search" type="search" placeholder="Search observations, e.g. ABN, manufacturing, U44" value="${esc(state.query)}" aria-label="Search observations"></label><select id="question-filter" aria-label="Filter by research question"><option value="all">All research questions</option>${QUESTIONS.map(q=>`<option value="${q.id}" ${state.q==q.id?'selected':''}>Q${q.id} · ${q.short}</option>`).join('')}</select>${saved?'':`<div class="segmented" aria-label="Observation collection"><button data-mode="curated" class="${state.mode==='curated'?'active':''}" aria-pressed="${state.mode==='curated'}">Curated 8</button><button data-mode="all" class="${state.mode==='all'?'active':''}" aria-pressed="${state.mode==='all'}">All 99</button></div>`}</div><div class="resultline"><span id="result-count" role="status" aria-live="polite"></span><button class="text-button" id="clear-filters">Reset filters</button></div><div id="cards" class="cards"></div><div class="notice">${icon('info')}<p><strong>Participation is not the same as benefit.</strong> More applications do not automatically mean more innovation, better business outcomes or greater public value. These observations help us decide what to investigate next.</p></div>${footer()}`;renderCards();}
function filtered(){let list=state.page==='saved'?ARCHIVE.filter(o=>state.saved.has(o.id)).map(o=>record(o.id)):state.mode==='curated'?CURATED.map(o=>record(o.id)):ARCHIVE.map(o=>record(o.id));return list.filter(o=>(state.lens==='all'||o.lens===state.lens)&&(state.q==='all'||o.qs?.includes(+state.q))&&(!state.query||`${o.id} ${o.title} ${o.summary||''} ${o.body} ${LENSES[o.lens].name}`.toLowerCase().includes(state.query.toLowerCase())))}
function renderCards(){const list=filtered();$('#cards').innerHTML=list.length?list.map(o=>card(o,state.mode==='all'||!o.chart)).join(''):`<div class="empty"><h3>${state.page==='saved'?'No matching saved observations.':'No observations match these filters.'}</h3><p>${state.page==='saved'?'Use the bookmark on an observation to keep it here.':'Try a different lens or search term. Question filters currently cover the eight curated observations.'}</p><button id="empty-reset">Reset filters</button></div>`;$('#result-count').textContent=`${list.length} ${list.length===1?'observation':'observations'} · ${state.mode==='all'?'Complete ID catalogue; detailed charts and question mappings for 8 examples':'Curated examples across all 7 lenses'}${state.q!=='all'?' · question mapping available for curated examples only':''}`;}
function renderQuestions(){state.page='questions';$('#main').innerHTML=`<div class="eyebrow">The purpose behind the analysis</div><div class="hero"><div><h1>From activity to public value.</h1><p>The programme asks where, how and for whom IP Australia’s interventions could generate the greatest additional public value.</p></div></div><p class="pageintro">The connections are questions to investigate. We do not assume that registration creates value, or that more of it is inherently better.</p><div class="question-grid">${QUESTIONS.map(q=>`<article class="question"><div class="num">Q${q.id}</div><div><h2>${q.title}</h2><p>${q.text}</p><p style="margin-top:12px"><strong>What Stage 1 contributes:</strong> ${q.stage}</p></div><button data-qjump="${q.id}">Explore linked leads →</button></article>`).join('')}</div><div class="notice">${icon('info')}<p><strong>Additional benefit needs a comparison.</strong> To say an intervention helped, we need to know what would plausibly have happened without it. A descriptive profile cannot provide that comparison.</p></div>${sourceLink('docs/research-goal.md','Read the full research goal')}${footer()}`;}
function renderSources(){$('#main').innerHTML=`<div class="eyebrow">Data & provenance</div><div class="hero"><div><h1>Nothing should be a black box.</h1><p>Every observation should have an understandable route back to its original source, the stored data and the decisions made along the way.</p></div></div><div class="source-cards"><article><span class="badge">01 · Published</span><h2>Original sources</h2><p>The source register records publishers, dataset links, coverage and licences. IP RAPID, the Australian Business Register, ABS, OECD and World Bank are among the sources used across the lenses.</p>${sourceLink('config/sources.yaml','Open source register')}</article><article><span class="badge">02 · Stored</span><h2>A versioned research corpus</h2><p>Small processed tables live in the repository. Large tables live in Cloudflare R2. The manifest records file checksums, sizes and locations; the catalogue describes the tables. Parquet is a compact, column-based table format.</p>${sourceLink('docs/catalogue.md','Open data catalogue')}<br><br>${sourceLink('data/manifest.json','Open file manifest')}</article><article><span class="badge">03 · Prepared</span><h2>Seven consistent lenses</h2><p>A lens defines what one row represents: a right, a firm, a postal area, or another unit. Preparation joins sources, repairs identified problems and makes exclusions explicit. Each observation must identify the rules it inherits.</p>${sourceLink('analysis/eda/variables.yaml','Open variable dictionary')}</article><article><span class="badge">04 · Interpreted</span><h2>Outputs become observations</h2><p>The notebook pairs calculations with numbered observations. The interface should keep the observation distinct from the calculation, its assumptions and the decision it informs.</p><button class="primary" data-open="U44" data-tab="trail">Walk through a complete example ${icon('arrow')}</button></article></div><div class="notice">${icon('info')}<p><strong>A discrepancy to reconcile: U0.</strong> Its narrative says 152 tables from 38 sources, while the preceding saved output says 162 tables from 41 sources. Their total row counts also differ. This prototype does not promote either set into a headline. <button class="text-button" data-open="U0">Inspect the discrepancy →</button></p></div><details><summary>What is live in this design framework?</summary><div>The eight curated charts use notebook-reported figures; none are recomputed here. All 99 observation IDs are available. Full table-level release information, hashes and execution links are integration stubs, not verified provenance. The HTML comments describe the intended manifest contract for implementation.</div></details>${footer()}`;}
function renderNext(){$('#main').innerHTML=`<div class="eyebrow">The research journey</div><div class="hero"><div><h1>Better questions come next.</h1><p>Stage 1 prepares the ground. The next stages examine relationships before the programme designs studies that can answer its five research questions.</p></div></div><div class="journey"><article style="--accent:#195d55"><span class="badge">01 · Current notebook</span><h2>Understand each variable</h2><p>What is recorded? What is typical? What is missing or misleading?</p><ul><li>Describe coverage and distributions.</li><li>Check unusual values and collection changes.</li><li>Carry forward rules and unresolved questions.</li></ul><strong class="small">Output: descriptive observations</strong></article><article style="--accent:#cf754e"><span class="badge" style="background:#fff0e4;color:#80502e">02 · Planned in the EDA</span><h2>Examine pairs</h2><p>How does one measure vary alongside another?</p><ul><li>Compare firms’ IP use with R&D and age.</li><li>Examine filing alongside policy-event timing.</li><li>Report the size and uncertainty of differences.</li></ul><strong class="small">Output: associations and leads, not automatic causal claims</strong></article><article style="--accent:#8170ac"><span class="badge" style="background:#eee8f6;color:#655280">03 · Planned in the EDA</span><h2>Consider several factors</h2><p>Does a pattern remain when other measured factors are considered together?</p><ul><li>Investigate groups, structure and competing explanations.</li><li>Check whether results hold in another period or sample.</li><li>Identify what the available data cannot resolve.</li></ul><strong class="small">Output: stronger exploratory understanding</strong></article></div><div class="tintbox"><h3>After exploration: design the studies that answer the questions</h3><p>Review the signals and gaps, source additional data where useful, then choose a credible research design. Claims about an intervention’s effect require a defensible comparison with what would otherwise have happened. Considering several variables does not, by itself, establish causation.</p></div><div class="sectionhead"><h2>Threads already worth following</h2></div><div class="cards">${['U44','U45','U75','U26'].map(id=>{const o=record(id);return `<article class="whitebox"><div class="metarow">${meta(o)}</div><h3 style="margin-top:15px">${o.title}</h3><p>${o.next}</p><button data-open="${id}" data-tab="limits">Read limits & next step →</button></article>`}).join('')}</div><details><summary>Plain-English note: uncertainty and repeated testing</summary><div>An uncertainty interval shows a range compatible with an estimate and its assumptions. If we test many possible relationships, some will look striking by chance. Later stages should account for that and check whether promising patterns appear again in other data. This does not turn an association into a cause.</div></details>${sourceLink('docs/eda-plan.md','Read the EDA plan')}${footer()}`;}
function navigate(page){state.page=page;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.dataset.page===page?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});$('#breadcrumb').textContent=({explore:'Stage 1 exploration',questions:'Research questions',sources:'Data & provenance',next:'Research journey',saved:'My shortlist'})[page];if(page==='explore'||page==='saved')renderExplore(page==='saved');if(page==='questions')renderQuestions();if(page==='sources')renderSources();if(page==='next')renderNext();window.scrollTo(0,0);}
function dataTable(o){const typeCount=o.chart==='types';return `<table class="data-table"><caption style="text-align:left;padding:8px">${esc(o.unit)} · notebook-reported values</caption><thead><tr><th scope="col">${o.chart==='line'?'Year':'Category'}</th><th scope="col">${typeCount?'Recorded rights':'Value (%)'}</th>${typeCount?'<th scope="col">Share of all rights</th>':''}</tr></thead><tbody>${o.labels.map((l,i)=>`<tr><th scope="row" style="text-transform:none;letter-spacing:0">${esc(l)}</th><td>${num(o.values[i])}</td>${typeCount?`<td>${(o.values[i]/4368006*100).toFixed(2)}%</td>`:''}</tr>`).join('')}</tbody></table>`}
// Minimal safe markdown renderer for embedded notebook prose. Raw HTML is never interpreted.
function markdown(s){let out=esc(s).replace(/\*\*([\s\S]*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return out.split(/\n\n+/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}
function original(o){return `<details><summary>Read the original notebook observation · ${o.id}</summary><div class="note-original">${markdown(archiveById[o.id].body)}<p>${sourceLink('analysis/notebooks/01_univariate.ipynb',`Notebook · ${o.id}, cell ${o.cell+1} (1-based)`)}</p></div></details>`}
function openObservation(id,tab='overview'){state.selected=id;state.tab=tab;state.chartView='chart';state.measure='share';const o=record(id);$('#dialog-meta').innerHTML=meta(o);$('#dialog-title').textContent=o.title;$('#dialog-context').innerHTML=`<span>${esc(LENSES[o.lens].unit)}</span>${o.period?`<span>${esc(o.period)}</span>`:'<span>Source text · detailed integration pending</span>'}`;renderDialog();if(!$('#detail').open)$('#detail').showModal();$('#close-dialog').focus();}
function renderDialog(){const o=record(state.selected),tabs=[['overview','The observation'],['trail','Follow the evidence'],['limits','Limits & next steps']];$('#dialog-tabs').innerHTML=tabs.map(([k,n])=>`<button role="tab" id="tab-${k}" aria-controls="dialog-body" aria-selected="${state.tab===k}" tabindex="${state.tab===k?0:-1}" class="${state.tab===k?'active':''}" data-tab-select="${k}">${n}</button>`).join('');$('#dialog-body').setAttribute('aria-labelledby',`tab-${state.tab}`);$('#dialog-body').innerHTML=!o.chart?archiveDetail(o):state.tab==='overview'?overview(o):state.tab==='trail'?trail(o):limits(o);$('#dialog-body').scrollTop=0;}
function overview(o){return `<div class="detail-grid"><div><div class="whitebox"><span class="badge">Observation · descriptive</span><p class="statement">${o.summary}</p><div class="chart-switches"><button data-chartview="chart" class="${state.chartView==='chart'?'active':''}" aria-pressed="${state.chartView==='chart'}">Chart</button><button data-chartview="table" class="${state.chartView==='table'?'active':''}" aria-pressed="${state.chartView==='table'}">Data table</button>${o.chart==='types'&&state.chartView==='chart'?`<label>Show</label><button data-measure="share" class="${state.measure==='share'?'active':''}">Share</button><button data-measure="count" class="${state.measure==='count'?'active':''}">Count</button>`:''}</div><div class="detail-chart" style="--accent:${LENSES[o.lens].color}">${state.chartView==='table'?dataTable(o):chart(o,true)}</div><p class="small"><strong>Population:</strong> ${o.population}<br><strong>Source:</strong> ${o.source} · ${o.id}<br>Reported values transcribed from the notebook; not recalculated here.</p></div><details><summary>Explain the terminology</summary><div>${o.gloss}</div></details>${original(o)}</div><div><div class="tintbox"><h3>Why this matters to the research</h3><p>${o.why}</p><p style="margin-top:14px;font-size:11px">${questionTags(o)}</p></div><div class="whitebox"><h3>What this does not tell us</h3><p>${o.limits}</p></div><button style="margin-top:16px;width:100%;justify-content:space-between" class="primary" data-tab-select="trail">Show how we got here ${icon('arrow')}</button></div></div>`}
function trail(o){const is44=o.id==='U44';return `<div class="eyebrow">Evidence trail · ${o.id}</div><p class="small" style="margin-top:0;margin-bottom:20px">An explanatory trail reconstructed from the notebook and repository documentation. Full release and execution metadata still need to be connected.</p><div class="steps"><article class="step"><div><h3>Start with the published records</h3><p>${is44?'IP Australia publishes application and applicant records through IP RAPID. The firm profile draws its filing counts from those records; the broader firm spine brings together ABNs found in several sources.':o.source+'. The source register identifies the upstream publishers and dataset entry points.'}</p><a href="${o.sourceURL}" target="_blank" rel="noopener noreferrer">Original publisher / dataset entry point ↗</a></div></article><article class="step"><div><h3>Keep a traceable stored copy</h3><p>The repository stores small processed tables as Parquet files; larger tables are stored in Cloudflare R2. A manifest records checksums and locations. The analysis uses a prepared ${LENSES[o.lens].name.toLowerCase()} table.</p><details><summary>Release and file-level record · integration pending</summary><div>Publisher release, ingestion timestamp, exact object location, checksum and execution ID must be resolved from the manifest for this observation. They were not independently verified for this prototype. ${sourceLink('data/manifest.json','View repository manifest')}</div></details></div></article><article class="step"><div><h3>Prepare a consistent unit of analysis</h3><p>${o.method}</p>${is44?'<p><strong>Why:</strong> crediting one founding ABN per right avoids counting the same right repeatedly in this particular firm-level total. It is a choice about attribution, not a claim about which collaborator created the value. Provisional and second-tier patents are kept separate from standard patents.</p>':''}<p><strong>Unit:</strong> ${LENSES[o.lens].unit}. <strong>Scope:</strong> ${o.population}.</p>${sourceLink('analysis/eda/variables.yaml','Variable definitions')}${is44?' · '+sourceLink('analysis/eda/build.py','Implementation reference for maintainers'):''}</div></article><article class="step"><div><h3>Calculate the descriptive result</h3><p>${o.logic}</p>${is44?'<details><summary>Show the arithmetic in words</summary><div>1. Keep the 23,971 firms with at least one standard-patent application.<br>2. Order them by their application counts.<br>3. Take 240 firms: 23,971 × 1%, rounded to a whole firm.<br>4. Add their applications, divide by all 183,989 applications in this identified-firm group, then multiply by 100.<br>5. The notebook reports 55.3%, rounded to one decimal place. The unrounded numerator is not supplied in this prototype.</div></details>':''}</div></article><article class="step"><div><h3>State the observation — within its limits</h3><p><strong>${o.summary}</strong></p><p>${o.why}</p><button data-tab-select="limits">Read the assumptions and next step →</button></div></article></div>`}
function limits(o){return `<div class="detail-grid"><div><div class="whitebox"><h3>Limits of this observation</h3><p>${o.limits}</p></div><div class="whitebox" style="margin-top:16px"><h3>Assumptions and choices</h3><p>${o.assumption}</p><p><strong>Evidence level:</strong> descriptive. This summarises the recorded data under the stated definitions. It does not identify an effect caused by IP protection.</p></div>${original(o)}</div><div><div class="tintbox"><h3>Carried into the next stage</h3><p>${o.next}</p></div><div class="whitebox"><h3>Progress towards the questions</h3><p>${o.why}</p><p>${questionTags(o)}</p><p><strong>Still needed:</strong> appropriate comparisons, checks on alternative explanations and, for causal claims, a research design capable of testing additional benefit.</p></div></div></div>`}
function archiveDetail(o){if(o.id==='U0')return `<div class="notice">${icon('info')}<p><strong>Do not publish a settled total yet.</strong> The saved narrative and the preceding output disagree. This interface displays the discrepancy instead of selecting a preferred figure.</p></div><div class="whitebox"><h3>Two versions in the same notebook</h3><table class="data-table"><thead><tr><th>Measure</th><th>U0 narrative</th><th>Preceding output</th></tr></thead><tbody><tr><th>Tables</th><td>152</td><td>162</td></tr><tr><th>Sources</th><td>38</td><td>41</td></tr><tr><th>Rows</th><td>314,742,745</td><td>317,792,796</td></tr></tbody></table><p>Re-run or inspect the relevant profiling inputs, establish which snapshot is intended, then update the narrative and stored outputs together. These figures count records, not research importance.</p>${sourceLink('analysis/notebooks/01_univariate.ipynb','Inspect section 0 and observation U0')}</div>`;
if(state.tab==='overview')return `<div class="whitebox"><span class="badge">Original notebook text</span><div class="note-original">${markdown(o.body)}</div><p class="small">Notebook cell ${o.cell+1} (1-based) · ${o.id} · ${LENSES[o.lens].name}. Source wording is preserved; inclusion is not an independent validation of each claim.</p>${sourceLink('analysis/notebooks/01_univariate.ipynb','Open the source notebook')}</div><div class="notice">${icon('info')}<p><strong>Catalogue example.</strong> This observation is included for browsing and search. Its bespoke chart, plain-English method, research-question mapping and file-level evidence trail have not yet been integrated.</p></div>`;
return `<div class="whitebox"><span class="badge prototype">Integration stub</span><h3 style="margin-top:18px">${state.tab==='trail'?'A complete evidence trail belongs here.':'The observation needs its own explicit boundaries.'}</h3><p>${state.tab==='trail'?'Connect the original publisher, source release, stored file, lens-building decisions and the exact output supporting this observation. The notebook text alone is not a substitute for that chain.':'Extract and review the applicable exclusions, assumptions, unresolved issues and next-stage actions. Do not infer a causal claim or reuse another observation’s caveats without checking them.'}</p><p>This prototype provides fully written examples for U4, U26, U44, U45, U52, U65, U75 and U81.</p><button data-open="U44" data-tab="${state.tab}">See the U44 example →</button></div>${original(o)}`;}
function about(){state.selected=null;$('#dialog-meta').innerHTML='<span class="badge prototype">About this prototype</span>';$('#dialog-title').textContent='A framework for following the evidence.';$('#dialog-context').innerHTML='';$('#dialog-tabs').innerHTML='';$('#dialog-body').removeAttribute('aria-labelledby');$('#dialog-body').innerHTML=`<div class="whitebox"><h3>Real notebook content. Demonstration interface.</h3><p>This single HTML file is a functional design framework for Claude Code. It contains all 99 numbered observations and eight curated examples with redesigned charts, plain-English explanations and progressive disclosure.</p><p><strong>Data status:</strong> figures were transcribed from the notebook fetched on 27 October 2026. The notebook identifies its status as 26 October 2026. No analysis was rerun and no claim of independent statistical validation is made.</p><p><strong>Working interactions:</strong> search, lens filters, curated question filters, complete catalogue, detail tabs, chart/table views, shortlist and Markdown export. The shortlist lasts only for the current page session.</p><p><strong>Integration stubs:</strong> exact source releases, file hashes, execution IDs and full provenance for catalogue-only records. Editorial question tags cover the eight curated examples only. Future-stage descriptions refer to the plan, not a verified live completion status.</p><p>Source documents inspected: the univariate notebook, research goal, EDA plan, Stage 1 summary, source register, README and lens-building implementation.</p>${sourceLink('analysis/notebooks/01_univariate.ipynb','Source notebook')} · ${sourceLink('docs/research-goal.md','Research goal')}</div>`;if(!$('#detail').open)$('#detail').showModal();$('#close-dialog').focus();}
function exportShortlist(){if(!state.saved.size){toast('Save an observation before exporting.');return;}const rows=[...state.saved].map(id=>{const o=record(id);return `## ${id}: ${o.title}\n\nLens: ${LENSES[o.lens].name}\n\n${o.summary||archiveById[id].body}\n\n${o.limits?'Limits: '+o.limits+'\n\n':''}Source: ${NB}\nNotebook cell: ${o.cell+1} (1-based)\n`;});const text=`# Evidence Atlas — shortlist\n\nDesign-prototype export. Notebook snapshot dated 26 October 2026; retrieved 27 October 2026. Reported values have not been independently recomputed. Question mappings and curated summaries are editorial.\n\n${rows.join('\n---\n\n')}`;const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='evidence-atlas-shortlist.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Shortlist exported as Markdown.');}
function reset(){state.lens='all';state.q='all';state.query='';renderExplore(state.page==='saved')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return;}if(b.dataset.open){openObservation(b.dataset.open,b.dataset.tab||'overview');return;}if(b.dataset.save){const id=b.dataset.save;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);$('#saved-count').textContent=state.saved.size;renderCards();const replacement=document.querySelector(`[data-save="${id}"]`);replacement?.focus();toast(state.saved.has(id)?`${id} added to your shortlist.`:`${id} removed from your shortlist.`);return;}if(b.dataset.lens){state.lens=b.dataset.lens;renderExplore(state.page==='saved');document.querySelector(`[data-lens="${state.lens}"]`)?.focus();return;}if(b.dataset.mode){state.mode=b.dataset.mode;renderExplore();document.querySelector(`[data-mode="${state.mode}"]`)?.focus();return;}if(b.dataset.qjump){state.q=b.dataset.qjump;state.lens='all';state.query='';state.mode='curated';navigate('explore');return;}if(b.dataset.tabSelect){state.tab=b.dataset.tabSelect;renderDialog();document.querySelector(`#tab-${state.tab}`).focus();return;}if(b.dataset.chartview){state.chartView=b.dataset.chartview;renderDialog();document.querySelector(`[data-chartview="${state.chartView}"]`).focus();return;}if(b.dataset.measure){state.measure=b.dataset.measure;renderDialog();document.querySelector(`[data-measure="${state.measure}"]`).focus();return;}if(['clear-filters','empty-reset'].includes(b.id))reset();if(b.id==='about-btn')about();if(b.id==='close-dialog')$('#detail').close();if(b.id==='export-btn')exportShortlist();});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;renderCards()}});
document.addEventListener('change',e=>{if(e.target.id==='question-filter'){state.q=e.target.value;renderCards()}});
$('#dialog-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=['overview','trail','limits'];let i=keys.indexOf(state.tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;state.tab=keys[i];renderDialog();$('#tab-'+state.tab).focus()});
$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#detail').close();}});
navigate('explore');
</script>
