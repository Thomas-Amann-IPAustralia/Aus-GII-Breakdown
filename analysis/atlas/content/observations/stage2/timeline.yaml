# Stage 2, the timeline lens (section 5 of the bivariate notebook). Markup and rules as in ../firms.yaml.

- id: B36
  lens: timeline
  about: system
  headline: As changes, the quarterly series were seldom seen to move together; the one pair that holds is the trade mark process itself
  statement: >-
    Every pair of the timeline's series was compared as year-on-year changes by quarter, in two periods. Only one pair
    is a [[lead]]: trade mark registrations and trade mark oppositions (a rank [[correlation]] of 0.658, and 0.588 in
    the other period). More marks reaching the end of examination may mean more to register and more to oppose in the
    same quarters, but that is a hypothesis: acceptances are not in the data.
  figures:
    - value: "1"
      label: lead among the pairs of series
    - value: "0.658"
      label: trade mark registrations with oppositions
    - value: "197"
      label: pairs with no association detected after the correction for many tests
  points:
    - "68 quarters in the first period and 72 in the second: 1 lead, 2 pairs that hold in one period only, 178
      negligible, 197 below the correction and 28 measured in too few quarters."
    - "**Not seen to move together:** Australians' and overseas applicants' filings, and filings and the consumer price
      index. That is [[no-association|no association detected]], not evidence of none: changes from one year to the
      next depend on the quarters before, so 68 and 72 quarters hold less information than they seem."
    - "Links at a lag, such as filings and the events that follow them, were not tested."
    - "**Added after Stage 2:** the economy's quarterly series do show a shared cycle in overseas applicants' filing
      (the cash rate with their trade marks, {B52}; real GDP with their standard patents, {B56}). For Australians'
      filing the reading stands."
    - "The opposition series also counts requests to remove unused marks, which concern registered marks."
  questions:
    - q: 5
      how: The timeline's own series rarely move together as changes, so each policy change is read against its own
        series; the economy's cycle is a third factor for overseas filing ({B52}, {B56}).
  sources: [iprapid, abs_prices]
  chart:
    type: bar
    horizontal: true
    title: What the screen of the timeline's series found
    subtitle: Pairs of series compared as year-on-year changes by quarter, in two periods
    x: {type: category, values: [A lead (holds in both periods), Holds in one period only, Negligible, Below the correction for many tests, Too few quarters to measure]}
    y: {name: Pairs of series, min: 0}
    series:
      - name: Pairs
        data: [1, 2, 178, 197, 28]
    source: IP Australia, IP RAPID; ABS consumer price index (lens timeline)
  prep:
    - what: Each monthly series is turned into year-on-year changes of its quarterly totals.
      why: Levels of almost any two growing series go together; changes do not unless they are linked.
    - what: The intervals come from quarters resampled as if independent.
      why: That is the standard first pass, but changes from one year to the next overlap, so the intervals are too
        narrow; Stage 3 uses block resampling.
  steps:
    - Screen every pair of series' changes in each period.
    - Keep pairs past the size threshold and the correction in both periods.
  assumptions:
    - Quarterly changes smooth the monthly noise without hiding real links.
  limits:
    - Links at a lag were not tested, and the small number of independent quarters makes weak links hard to detect.
  next: >-
    The policy changes are tested one by one in {B37}.
  terms: [screen, growth-rate, cpi, no-association]
  related: [B37, B39, B52, B56]

- id: B37
  lens: timeline
  about: system
  headline: Seven of eight policy changes moved a series further than any comparison month; most of those breaks were certain by law, and few show applicants' behaviour
  statement: >-
    For each policy change, the size of the jump or step in the series it targets was compared with the same measure
    at up to 72 [[placebo|placebo]] months, five years either side. Seven of the eight changes moved at least one target series
    further than any placebo month; the Patents Act 1990 did not. Most of these breaks were made certain by the law or
    the office's processing (no expiries under a longer term, no applications once a right closed). Those that show
    applicants' behaviour are the rush before Raising the Bar and, perhaps, overseas applicants' step under the Designs
    Act 2003.
  figures:
    - value: "Seven of eight"
      label: changes beyond every placebo month in at least one target series
    - value: "4.41 times"
      label: Australians' usual month of patent filing, in April 2013 (none of 72 placebo months as large)
    - value: "93.06%"
      label: of placebo months had a step as large as the Patents Act 1990's (ordinary)
  points:
    - "**Behaviour: Raising the Bar (April 2013).** Australians' and overseas applicants' standard patents both jumped
      further than in any of 72 placebo months, and Australians' filing stayed lower in the year after. Series it should
      not have moved (Australians' designs, plant breeder's rights) did not: 37.5% to 81.94% of placebo months moved as
      much."
    - "**Behaviour or administration: the Designs Act 2003 (June 2004).** Overseas applicants' designs stepped up further
      than in any placebo month; Australians' designs did not step beyond the ordinary (61.11% of placebo months as
      large)."
    - "**The innovation patent's closure (August 2021):** a rush and then a step down, both beyond every placebo month,
      but the step is mechanical (no new applications could be made). Australians' designs also stepped down, so the
      year after holds more than the closure."
    - "**Certain by law:** the 20-year term (July 1995, patent expiries), the extension of term regime (January 1999)
      and the innovation patent's introduction (May 2001)."
    - "**Administrative:** the Trade Marks Act 1995 (January 1996) paused registrations and Australians' applications
      beyond every placebo month, while its controls were quiet (48.61% to 73.61% of placebo months as large). The
      Patents Act 1990 (April 1991): patent grants were ordinary (33.33% and 93.06%)."
    - "**How to read the shares.** A placebo share is a rank among overlapping windows, not a probability. It shows that
      a series broke at the change, not why; where the law makes a break certain, it says nothing about behaviour."
  questions:
    - q: 5
      how: What each change could identify, in a later design - Raising the Bar, applicants' timing under a change of
        standard; the Designs Act, overseas applicants' response to a new process; the 20-year term, renewal around the
        20th year; the closure, a switch towards standard patents.
    - q: 4
      how: Shows which kinds of policy change visibly moved filing, and which breaks were simply the law taking effect.
  sources: [iprapid, policy_events]
  prep:
    - what: For each change, the jump (the change month against the year before) and the step (the year after against
        the year before), as [[log-change|log changes]].
      why: Logs make a change of the same proportion the same size in a large and a small series.
    - what: Each change is classed by what it could show (behavioural, administrative or mechanical) and set beside two
        series it should not have moved (controls) (ADR 0042).
      why: A break that the law makes certain, or that also appears in unrelated series, is not evidence of a response.
  steps:
    - Measure each change's jump and step in the series it targets, and in its two controls.
    - Repeat at up to 72 placebo months from five years either side.
    - Report the share of placebo months with a change at least as large.
  assumptions:
    - Placebo months show how large an ordinary change can be in that series.
  limits:
    - A placebo test shows a break is unusual, not what caused it; other events in the same window can contribute.
    - The expiry series starts in January 1995, so the 20-year term's own window is shorter than the placebos'.
  next: >-
    Raising the Bar and the Designs Act are carried to Stage 3 as starting points for
    [[natural-experiment|natural experiments]]; the mechanical breaks are context. The fee changes are compared in
    {B47} to {B49}.
  terms: [placebo, natural-experiment, raising-the-bar, log-change]
  related: [B36, B47, U28]

- id: B38
  lens: timeline
  about: data
  headline: Provisionals filed in FY2025 were followed up less often, individuals' by about half, but late recording cannot be ruled out
  statement: >-
    6.66% of Australian individuals' provisionals filed in FY2025 were followed by an Australian complete application
    within 12 months, against 12.24% to 14.15% in FY2022 to FY2024, the comparable years after innovation patents
    closed; organisations' 9.49%, against 10.63% to 12.23%. But Australian filers' standard patents claiming an
    Australian application also fell, to 40.48% in FY2026, so if claims are recorded late, both would fall whatever
    applicants did.
  figures:
    - value: "6.66%"
      label: individuals' FY2025 provisionals followed up within 12 months
    - value: "12.24% to 14.15%"
      label: the same, FY2022 to FY2024
    - value: "55.31% → 40.48%"
      label: Australians' standard patents claiming an Australian application, FY2018 to FY2026
  points:
    - "**A break in the measure.** A provisional counts as followed up if any patent claims it, an innovation patent
      included. From 26 August 2021 no new innovation patent could be filed, so provisionals from FY2022 lost a route
      earlier years had; FY2021's highs (18.76% for individuals, 20.68% for organisations) came with the rush before
      the closure. FY2022 to FY2024 are the comparable base."
    - "**The claims themselves are thinning:** Australian filers' standard patents claiming an Australian application
      were 55.31% to 60.61% in FY2018 to FY2023, then 53.53%, 49.15% and 40.48%, the same pattern {U90} read as a rise
      in direct filing."
    - "**Three readings, not yet told apart:** the surge in individuals' provisionals ({U8}) being ones not pursued (the
      individuals' fall is the larger, 12.27% to 6.66%, against 12.04% to 9.49%); claims recorded late; or a move to
      the PCT, which a 12-month measure of Australian applications cannot see. This is a lead, not a finding."
    - "It adds a question for IP Australia (OQ18): whether priority claims are recorded when an application is filed or
      only later."
  questions:
    - q: 4
      how: If real, more recent provisionals go no further in Australia within a year (some may go to the PCT, which
        this measure cannot see), a possible point for guidance to new filers.
    - q: 2
      how: Individuals' provisionals are followed up least.
  sources: [iprapid]
  chart:
    type: bar
    title: Provisionals followed by an Australian complete application within 12 months
    subtitle: Australian filers' provisionals filed in FY2024 and FY2025
    x: {type: category, values: [Individuals, Organisations]}
    y: {name: "% followed up", min: 0, max: 20, format: pct, digits: 2}
    series:
      - name: FY2024
        data: [12.27, 12.04]
        colour: muted
      - name: FY2025
        data: [6.66, 9.49]
    source: IP Australia, IP RAPID (lens rights, read monthly)
  prep:
    - what: Each provisional linked to any later complete application claiming it, from IP RAPID's links.
      why: A provisional lapses after 12 months unless a complete application claims it.
  steps:
    - For each year's provisionals, find the share claimed by an Australian complete application within 12 months, with intervals.
    - Check the share of standard patents claiming an Australian application in the same years.
  assumptions:
    - The links record every claim; for the latest years this may not hold.
  limits:
    - Late recording would produce the same fall; OQ18 asks IP Australia.
  next: >-
    Read as a lead only for FY2024 on, until IP Australia answers.
  terms: [provisional, priority]
  related: [U8, U90, B15]

- id: B39
  lens: timeline
  about: system
  headline: Quarter to quarter, Australians' and overseas applicants' filings were not seen to move together; year to year, their trade marks rise and fall together
  statement: >-
    As changes from one year to the next, by quarter, Australians' and overseas applicants' filings were not seen to
    move together: trade marks 0.287 then 0.129, designs 0.05 and 0.069, standard patents -0.055 then 0.444 (rank
    correlations in two periods). That is [[no-association|no association detected]], not evidence of none. As annual
    changes, Australians' trade marks rise and fall with overseas applicants' marks in Australia (0.785 over 20 years),
    the strongest of the 4 of 568 pairs with Australia-only annual series that pass the correction for many tests.
  figures:
    - value: "4 of 568"
      label: pairs with Australia-only annual series that pass the correction
    - value: "0.785"
      label: Australians' trade marks with overseas applicants' trade marks in Australia, year to year
  points:
    - "The other three that pass are other counts of Australians' own filing: the World Bank's residents' patent
      applications (0.627 over 44 years), its residents' trade marks (0.734) and residents' trade mark classes at every
      office (0.744)."
    - "336 series have 8 or more years of changes. 56 pairs reach 0.5 or more, but on short series (the strongest shown
      have 9 to 14 years), which the correction does not let through."
    - "Overseas filings follow the PCT's 30-month delay and foreign cycles ({U6})."
    - "**So** the Australia-only sources add context (what Measuring What Matters or BCARR say about the economy), not
      year-to-year signals about filing."
    - "**Added after Stage 2:** the Reserve Bank's and the national accounts' quarterly series also show nothing clear
      for Australians' filing, and a cycle in overseas applicants' ({B52}, {B56})."
  questions:
    - q: 5
      how: Australia-only economic series are for the context of Stage 3's designs, not for pairing with filing.
  sources: [iprapid, mwm, wdi]
  chart:
    type: bar
    horizontal: true
    title: The four annual series that move with Australians' filing
    subtitle: Rank correlation of year-on-year changes (1 = rise and fall together); all four pass the correction
    x: {type: category, values: ["Overseas applicants' trade marks in Australia (with Australians' trade marks)", "Residents' trade mark classes at every office", "World Bank: residents' trade marks", "World Bank: residents' patent applications"]}
    y: {name: Rank correlation, min: 0, max: 1, format: ratio}
    series:
      - name: Rank correlation of changes
        data: [0.785, 0.744, 0.734, 0.627]
    source: IP Australia, IP RAPID; World Bank WDI; WIPO (lens timeline and national_indicators)
    note: The last three are other counts of Australians' own filing; only the first is a different group of filers.
  prep:
    - what: Each annual series for Australia alone (Measuring What Matters, BCARR and others) as year-on-year changes.
      why: Annual series need changes, as the monthly ones do.
    - what: The filer's origin is a founding applicant in Australia (ADR 0037).
      why: IP Australia's definition of a resident application.
  steps:
    - Relate Australians' and overseas applicants' quarterly changes, in two periods.
    - Relate each annual series' changes to Australians' filing, with the correction for 568 pairs.
  assumptions:
    - Eight years of changes is the least that can show a link.
  limits:
    - Short series cannot show any but very strong links, and changes from one year to the next depend on the years
      before, so they hold less information than their number suggests.
  next: >-
    Not carried as pairs; used as context in Stage 3.
  terms: [multiple-testing, growth-rate, no-association]
  related: [B36, B52, B56]

- id: B47
  lens: timeline
  about: system
  headline: Changes in the fees to obtain a right seldom moved filing beyond what comparison months show; only one break pointed the way a price would
  statement: >-
    18 changes of 10% or more in the cost of obtaining a right (12 rises, 6 cuts) were set against [[placebo|placebo]] months:
    34 pairs of a change and a filing series. Five moved filing beyond 95% of their placebo months (three rushes and two
    steps), against about 1.7 of each expected by chance. Only one of the five moved the way a price would: Australians'
    designs fell after the rise of July 1988. The clearest breaks came with new Acts, the Trade Marks Act 1995 and the
    Designs Act 2003.
  figures:
    - value: "5 of 34"
      label: pairs of a fee change and a filing series beyond 95% of placebo months
    - value: "1.7"
      label: rushes, and steps, each expected by chance alone
    - value: "36.59%"
      label: the rise in a trade mark's cost with the Trade Marks Act 1995, when filing paused
  points:
    - "**How a price would push:** filing brought forward before a rise and lower after it; before a cut, filing would
      wait, and rise after it."
    - "**The Trade Marks Act 1995** (January 1996): filing by Australians and overseas applicants fell before the rise
      (2.778% of placebo months as large), which is the Act's pause ({B37}), not a price."
    - "**Overseas applicants' standard patents** were filed early before the 15.31% cut of January 1998 (2.778%), the
      opposite of what a price would do."
    - "**The Designs Act 2003** (June 2004, a design's filing fee up 122.2%): overseas applicants' designs stepped up
      (none of 72 placebo months as large), against a price; that is the Act ({B37})."
    - "**The one in a price's direction:** Australians' designs after the 15.38% rise of July 1988 (2.778% of 36 placebo
      months). At the edge, also in a price's direction: overseas applicants' trade marks after the 40.48% cut of
      October 2016 (5.556%); Australians' did not move (63.89%)."
    - "**Windows can hold other changes:** July 2012's patent step for Australians includes the rush before Raising the
      Bar, and October 2020's the rush before the innovation patent closed."
  questions:
    - q: 4
      how: Official fees are IP Australia's most direct lever. Past changes in the fees to obtain a right seldom moved
        national filing beyond the ordinary, but the changes are few and several coincide with new Acts, so this cannot
        show how much fees matter.
    - q: 5
      how: Fee changes are candidate natural experiments, but most are small and some are confounded with Acts.
  sources: [frl_fees, iprapid, policy_events]
  chart:
    type: bar
    title: Fee changes of 10% or more followed by an unusual move in filing
    subtitle: Of 34 pairs of a change and a filing series, those beyond 95% of placebo months
    x: {type: category, values: [Rushes before the change, Steps after it]}
    y: {name: Pairs, min: 0}
    series:
      - name: Found
        data: [3, 2]
      - name: Expected by chance
        data: [1.7, 1.7]
        colour: muted
    source: Federal Register of Legislation (fee regulations); IP RAPID (lens timeline)
    note: A rough guide, since a change's Australian and overseas pairs share its cost.
  prep:
    - what: The cost of obtaining each right in each month, read from every version of the fee regulations ({U108}).
      why: A change in the fee is dated by the regulation that made it.
    - what: Series by origin count the filer's origin (ADR 0037), and each break is read for its direction against a
        price (ADR 0042).
      why: A break that goes the wrong way for a price cannot be put down to the price.
  steps:
    - Take each month in which the cost of obtaining a right changed by 10% or more.
    - Measure the rush and step in filing around it, as {B37} does for policy changes.
    - Compare each with up to 72 placebo months, and count those beyond 95% of them, by direction.
  assumptions:
    - Filers respond to the official fee, not the attorney's fee (not recorded), which is often larger.
  limits:
    - Several changes coincide with new Acts, so a break cannot be put down to the price alone.
    - A placebo share is a rank among overlapping windows, not a probability.
  next: >-
    {B48} relates the size of each change to the size of the step; {B49} looks at renewal fees.
  terms: [official-fees, placebo, log-change]
  related: [B48, B49, U108, U110]

- id: B48
  lens: timeline
  about: system
  headline: Bigger fee rises went with smaller steps in filing, but the interval includes no association
  statement: >-
    Across the 34 pairs, the change in the fees to obtain a right and the step in filing that follows have a rank
    [[correlation]] of -0.307 (95% interval -0.638 to 0.049). The direction is a price's, but with 18 changes, several
    of them coinciding with new Acts, it cannot be told apart from no association.
  figures:
    - value: "-0.307"
      label: fee change with the step in filing
    - value: "-0.638 to 0.049"
      label: the 95% interval, which includes no association
  points:
    - "The interval resamples whole fee changes, since a change's Australian and overseas pairs share its cost.
      Resampling the pairs gives much the same (-0.639 to 0.070)."
  chart:
    type: bar
    title: How fee changes went with the step in filing that followed
    subtitle: Rank correlation across 34 pairs from 18 changes, with the ends of its 95% interval
    x: {type: category, values: [Interval's lower end, Estimate, Interval's upper end]}
    y: {name: Rank correlation, min: -1, max: 1, format: ratio}
    series:
      - name: Rank correlation
        data: [-0.638, -0.307, 0.049]
    source: Federal Register of Legislation (fee regulations); IP RAPID (lens timeline)
    note: The interval runs from below zero to above it, so it includes no association.
  questions:
    - q: 5
      how: Too few fee changes to estimate how filing responds to price; a sharper test is needed.
  sources: [frl_fees, iprapid]
  prep:
    - what: The 34 pairs of {B47}, each with the size of its fee change and its step.
      why: Relates the size of a price change to the size of the response.
  steps:
    - Rank the fee changes and the steps, and correlate them.
    - Bootstrap the pairs for an interval.
  assumptions:
    - Fee changes, not pairs, are the independent units.
  limits:
    - 18 changes; Acts confound some.
  next: >-
    Not a lead; the right-level test in Stage 3 is sharper.
  terms: [correlation, bootstrap, interval]
  related: [B47, B49]

- id: B49
  lens: timeline
  about: system
  headline: After three changes in renewal fees, cessations rose more than in any comparison month; only one, trade marks after July 1993, survives every check
  statement: >-
    Cessations (registered rights let go) were compared before and after each change in the fees to keep a right,
    and at [[placebo|placebo]] months. After three changes they rose more than at any placebo month: patents after September
    2002 and trade marks after July 1992 and July 1993. Checked against each series' own trend, and in the window that
    fits how each series is dated, only trade marks after July 1993 (a 2.041% rise) still stand out, and why so small a
    rise would move cessations is not shown.
  figures:
    - value: "Three"
      label: renewal fee changes followed by more cessations than any placebo month
    - value: "One"
      label: still beyond every placebo month after both checks (trade marks, July 1993)
    - value: "38.89%"
      label: of placebo months as large as the September 2002 patent rise, once the trend is allowed for
  points:
    - "**Patents, September 2002** (15 anniversaries' renewals up or newly charged, a median rise of 15.3%): cessations
      in months 7 to 18 rose more than at any of 72 placebo months, but they were already rising; against the trend,
      38.89% of placebo months moved as much."
    - "**Other patent changes:** October 2020 (a median rise of 29.5%) 31.25% of placebo months as large, 12.5% against
      the trend; July 2012 66.67%; August 2010 came before a fall (6.944%)."
    - "**Trade marks**, whose cessations are dated at the anniversary: July 1993 none of 66 placebo months as large,
      with or without the trend; July 1992 5.556%, and 38.89% against the trend. The 40% cut of November 1998 and the
      33.33% rise of November 2016 show nothing beyond the ordinary."
    - "**Designs:** no change beyond the ordinary, including July 2004 ($55 to $275, when the 2003 Act's renewal
      replaced the first extension)."
    - "**The trend check is itself noisy:** against the trend, two other patent changes also stand out, in opposite
      directions (March 2007 up, August 2010 down), so passing it is a weak test."
    - "**What this can and cannot show.** A month's cessations mix rights at many anniversaries, so an effect smaller
      than the series' ordinary movement could not show here. Whether fees move renewal is for a test at each right's
      own anniversary, in Stage 3."
  questions:
    - q: 4
      how: In national counts, most changes in renewal fees show no response beyond ordinary variation, but this design
        could miss an effect smaller than the series' usual movement.
    - q: 5
      how: The renewal fee changes are candidates for a sharper test at each right's anniversary, in Stage 3.
  sources: [frl_fees, iprapid]
  chart:
    type: bar
    horizontal: true
    title: How unusual cessations were after changes in renewal fees
    subtitle: Share of placebo months with a change at least as large (lower is more unusual), two baselines
    x: {type: category, values: ["Patents, September 2002", "Patents, October 2020", "Trade marks, July 1992", "Trade marks, July 1993"]}
    y: {name: "% of placebo months as large", min: 0, max: 100, format: pct, digits: 2}
    series:
      - name: Against the year before
        data: [0, 31.25, 5.556, 0]
      - name: Against the trend
        data: [38.89, 12.5, 38.89, 0]
        colour: muted
    source: Federal Register of Legislation (fee regulations); IP RAPID (lens timeline)
    note: A bar of zero length means no placebo month moved as much. Trade marks are read in months 1 to 12 after a change, patents in months 7 to 18, to fit how each is dated.
  prep:
    - what: For each change in the fees to keep a right, the anniversaries whose fee changed and the median change
        ({U109}), and monthly cessations of granted rights.
      why: Holders decide at each renewal whether to keep paying, and IP RAPID records cessations apart from lapses.
    - what: Two checks - the window fitted to how each series is dated (patents' months 7 to 18, trade marks' 1 to 12),
        and a baseline that carries the two years before forward by their own trend (ADR 0041).
      why: A series that was already rising would look as if it rose after a change.
  steps:
    - Take each change in renewal fees.
    - Measure the change in cessations in the window after it, against the year before and against the trend.
    - Compare each with the same measure at placebo months.
  assumptions:
    - Holders respond within a year and a half, when renewals at the new fee fall due.
  limits:
    - National counts mix rights of every age; the right-level test is sharper.
    - A placebo share is a rank among overlapping windows, not a probability.
  next: >-
    Carried to Stage 3 as the right-level test of renewal at each anniversary a fee changed.
  terms: [renewal, cease, placebo, official-fees]
  related: [B47, B8, U109, U111]

- id: B52
  lens: timeline
  about: system
  headline: The dollar's value does not go consistently with filing from overseas; Australian interest rates and overseas applicants' filing move together
  statement: >-
    As changes from one year to the next, by quarter, the dollar against overseas applicants' standard patents is
    -0.215 in 1991 to 2008 and 0.261 after: the sign flips. The [[cash-rate|cash rate]] moves with overseas applicants'
    trade marks (0.46 and 0.198) and designs (0.293 and 0.348). Australians' filing barely moves with either (-0.172 to
    0.242 over six pairs).
  figures:
    - value: "-0.215 then 0.261"
      label: the dollar with overseas standard patents, before and after mid-2008
    - value: "0.46 and 0.198"
      label: the cash rate with overseas applicants' trade marks
  points:
    - "A dearer dollar goes with more overseas designs, not fewer (0.198 and 0.169). A shared business cycle would
      explain that and a price would not, but that is a hypothesis."
    - "**Weak readings.** These are rank correlations of changes that depend on the quarters before, with no interval
      or correction for many tests, so each is a weak reading."
    - "**For Stage 3:** the business cycle, here in the cash rate, is a [[third-factor]] for any before-and-after
      comparison ({B37}, {B47}); the exchange rate is not a usable price signal at this resolution."
  questions:
    - q: 5
      how: Points to a cycle that before-and-after comparisons of policy must allow for.
  sources: [rba, iprapid]
  chart:
    type: bar
    horizontal: true
    title: The Reserve Bank's series against overseas applicants' filing
    subtitle: Rank correlation of year-on-year changes by quarter, 1991 to mid-2008 and mid-2008 on
