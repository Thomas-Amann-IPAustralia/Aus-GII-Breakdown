# Stage 3, the firms lens (section 2 of the multivariate notebook). Rules as in ../stage3/rights.yaml. One row is one
# firm (ABN), so no clustering is needed; the two samples are the lens's halves. "A filing linked" is ip_record =
# 'filed' (ADR 0036): "no filing linked", never "never filed".

- id: M8
  lens: firms
  about: system
  headline: Older firms, bigger R&D spenders and public companies more often have a linked patent
  statement: >-
    Among 17,514 active R&D Tax Incentive claimants, claimants 20 years or more on the record are 23.1 points more
    likely to have a filing linked than those of 3 to 10, with spend, company form, state and postcode advantage
    [[held-together|held together]]. Spending above the median and being a public company go with having a standard
    patent (about 4 to 5 and 8 to 9 points held together), but much less with any filing. A city address goes with
    filing in one half only.
  figures:
    - value: "+23.1 points"
      label: "any filing linked, 20 years or more against 3 to 10, allowing for the rest (first half)"
    - value: "+4.3 and +4.7 points"
      label: "a standard patent, R&D spend above the typical claimant's, allowing for the rest"
    - value: "+8.0 and +9.4 points"
      label: "a standard patent, public against private company, allowing for the rest"
  points:
    - "**Age:** any filing linked +24.2 raw and +23.1 held together; +22.9 and +22.4. A standard patent +13.0 and +10.5;
      +12.0 and +9.0. Holds. Age is on the record at the build date, so an older firm has had longer to file: part of
      this is time, not kind."
    - "**R&D spend above the median** ($326,125, the median average claim): a standard patent +6.2 and +4.3, holds; any
      filing +6.0 and +2.4, weakened. The form and age of high spenders account for more than half of their higher
      filing."
    - "**Public against private company** (969 public, 16,510 private): a standard patent +15.5 and +8.0, holds (51.5%
      and 59.5% left); any filing +13.0 and +5.9, weakened."
    - "**Major city against elsewhere:** any filing +5.2 raw and +5.6 held in the first half, +2.2 and +0.5 in the
      second. It does not replicate."
  revisits:
    - id: B23
      signal: R&D spend and patenting among claimants
      verdict: holds
      what: "Above-typical spending goes with a standard patent at the same form, age and place (+4.3 and +4.7
            percentage points), weakly, as B23 found. With any filing the link weakens (+2.4 and +2.8)."
    - id: B22
      signal: Who files among R&D claimants
      verdict: mixed
      what: "Among claimants, age holds (+23.1 and +22.4 percentage points for any filing) and public companies hold
            for a standard patent (+8.0 and +9.4). A city address is not repeated in the second half (+5.6, then
            +0.5)."
  held: ["R&D spend (above or below the typical claimant's)", company form (public or private), age on the record, the state, "the
                                                                                                                postcode's
                                                                                                                tenth
                                                                                                                on the
                                                                                                                advantage
                                                                                                                score", "a major city or elsewhere"]
  verdicts:
    - signal: Age 20 years or more against 3 to 10, any filing linked
      detail: "+24.2 and +22.9 on its own; +23.1 and +22.4 allowing for the rest"
      verdict: holds
    - signal: "R&D spend above the typical claimant's, a standard patent"
      detail: "+6.2 and +6.6 on its own; +4.3 and +4.7 allowing for the rest"
      verdict: holds
    - signal: "R&D spend above the typical claimant's, any filing linked"
      detail: "+6.0 and +6.4 on its own; +2.4 and +2.8 allowing for the rest"
      verdict: weakened
    - signal: Public against private company, a standard patent
      detail: "+15.5 and +15.8 on its own; +8.0 and +9.4 allowing for the rest (51.5% and 59.5% left)"
      verdict: holds
    - signal: Public against private company, any filing linked
      detail: "+13.0 and +13.4 on its own; +5.9 and +6.4 allowing for the rest"
      verdict: weakened
    - signal: Major city against elsewhere, any filing linked
      detail: +5.6 held in the first half, +0.5 in the second
      verdict: does not replicate
  chart:
    type: effect
    title: Who has a filing linked among R&D Tax Incentive claimants
    subtitle: Difference in the share of claimants, in percentage points, raw and with spend, form, age, state and postcode advantage held together; first half; 95% intervals
    views:
      - label: Any filing linked
        x: {values: ["Age 20 years or more against 3 to 10", "R&D spend above the median", "Public against private company", "Major city against elsewhere (first half)", "Major city against elsewhere (second half)"]}
        y: {name: Difference (percentage points), format: signed}
        ref: 0
        ref_label: no difference
        series:
          - name: Raw (as Stage 2 compared)
            colour: muted
            data: [[24.2, 21.5, 26.8], [6.0, 3.9, 8.1], [13.0, null, null], [5.2, 1.7, 8.6], [2.2, -1.3, 5.6]]
          - name: Held together
            colour: 0
            data: [[23.1, 20.3, 25.9], [2.4, 0.3, 4.5], [5.9, 1.0, 10.8], [5.6, 1.7, 9.6], [0.5, -3.4, 4.5]]
      - label: A standard patent
        x: {values: ["Age 20 years or more against 3 to 10", "R&D spend above the median", "Public against private company"]}
        y: {name: Difference (percentage points), format: signed}
        ref: 0
        ref_label: no difference
        series:
          - name: Raw (as Stage 2 compared)
            colour: muted
            data: [[13.0, null, null], [6.2, 4.8, 7.5], [15.5, 11.4, 19.7]]
          - name: Held together
            colour: 0
            data: [[10.5, 8.4, 12.6], [4.3, 2.9, 5.7], [8.0, 4.5, 11.5]]
    source: IP Australia, IP RAPID; ATO, R&D Tax Incentive transparency; ABR (lens firms); notebook 3, section 2.1
  questions:
    - q: 2
      how: "Younger claimants are far less often linked to a filing at the same spend, form and place. This bears on
           which firms the IP system reaches."
    - q: 3
      how: "R&D spending goes only weakly with patenting (about 4 to 5 percentage points for above-typical spending).
           So R&D and IP are not the same activity measured twice."
    - q: 4
      how: Part of the sixth early signal, on which firms could be reached by an intervention.
  sources: [rdti, linkage, abr, iprapid, abs_regions]
  prep:
    - what: "Active business numbers that claimed the R&D Tax Incentive in the years recorded, with a recorded spend,
            in each half of the business data."
      why: The same claimants as Stage 2, with the halves as the sample and its check.
    - what: "Age is read from the record at the date the data were built. Undated firms, and those first seen when
            business numbers began, are kept as their own groups, never read as old (ADR 0039)."
      why: An age that is unknown is not an age.
  steps:
    - Compare claimants on each of four signals (spend, form, age, place), with nothing held.
    - "For each outcome (any filing linked; a standard patent), fit one model with all four factors, the state and the
      postcode's advantage, allowing for each at once."
    - Give each signal's outcome in each half.
  assumptions:
    - The R&D Tax Incentive covers companies only, so "form" compares kinds of company.
  limits:
    - "\"No filing linked\" is not \"never filed\": IP RAPID leaves many recent filers without an ABN (U45)."
    - Firm size and industry are not held; they are known only for employers of 100 or more.
  next: >-
    Part of the sixth early signal. Firm size and industry for small firms (OQ20), and the timing of filing against
    claims, are the gaps to fill. {M12} checks the counts against a name match.
  terms: [held-together, average-marginal-effect, rdti, halves, verdict-words]
  related: [B22, B23, M12, M29]

- id: M9
  lens: firms
  about: system
  headline: Suppliers with IP win about two and a half times the contracts of similar suppliers without
  statement: >-
    Among 52,884 active government suppliers, those with a filing linked hold 2.382 times as many contracts as those
    without (first half), and 2.969 times the contract value, with the entity group, age, state, remoteness and
    postcode advantage held together. On a log scale 60% to 73% of Stage 2's raw ratios remain.
  figures:
    - value: "2.382 and 2.603"
      label: "times as many contracts, allowing for the rest (on its own 3.950 and 4.742)"
    - value: "2.969 and 2.720"
      label: "times the contract value, allowing for the rest (on its own 4.437 and 5.352)"
    - value: "25.05%"
      label: of active suppliers with a filing linked
  points:
    - "**Contracts** ([[negative-binomial|negative binomial]] model): 63% and 61% of the raw ratio remains on a log scale.
      Holds."
    - "**Contract value** (a [[gamma|gamma model]], at each contract's latest amendment): 73% and 60% remains. Holds."
    - "**Not a cause in either direction:** larger suppliers may both file and win more, and firm size is not in the
      model (known only for employers of 100 or more)."
  revisits:
    - id: B24
      signal: Suppliers' contracts and IP
      verdict: holds
      what: "Suppliers with a filing linked hold 2.382 and 2.603 times the contracts, and 2.969 and 2.720 times the
            value. That allows for their type, age, state, remoteness and postcode advantage."
  held: [the entity group, age on the record, the state, remoteness, "the postcode's tenth on the advantage score"]
  verdicts:
    - signal: Number of contracts
      detail: "3.950 and 4.742 on its own; 2.382 and 2.603 allowing for the rest (63% and 61% left)"
      verdict: holds
    - signal: Contract value
      detail: "4.437 and 5.352 on its own; 2.969 and 2.720 allowing for the rest (73% and 60% left)"
      verdict: holds
  chart:
    type: effect
    title: Government suppliers with a filing linked, against those without
    subtitle: Ratios (how many times as many), raw and with form, age and place held together; 95% intervals
    x: {values: ["Contracts, first half", "Contracts, second half", "Contract value, first half", "Contract value, second half"]}
    y: {name: "Times as many, filing linked against none", format: ratio, digits: 2}
    ref: 1
    ref_label: the same
    series:
      - name: Raw (as Stage 2 compared)
        colour: muted
        data: [[3.950, 3.775, 4.133], [4.742, 4.534, 4.958], [4.437, 2.715, 7.250], [5.352, 3.209, 8.926]]
      - name: Held together
        colour: 0
        data: [[2.382, 2.272, 2.496], [2.603, 2.485, 2.728], [2.969, 2.117, 4.166], [2.720, 1.972, 3.750]]
    source: Department of Finance, AusTender; IP Australia, IP RAPID; ABR (lens firms); notebook 3, section 2.2
  questions:
    - q: 3
      how: Firms that file IP win more government business at the same form, age and place, one of the conditions under which IP goes with activity.
    - q: 4
      how: Procurement is a door through which an intervention could reach firms that file (the sixth early signal).
  sources: [austender, linkage, abr, iprapid, abs_regions]
  prep:
    - what: Active ABNs with a contract, in each half; contract value at each contract's latest amendment.
      why: The latest amendment is the contract's value as it stands.
  steps:
    - "Model the number of contracts and their total value, using models suited to counts and to dollar amounts. Each
      result is a ratio of suppliers with a filing linked to those without."
    - Hold the entity group, age, state, remoteness and postcode advantage together.
    - "Read how much of the ratio on its own is left, on a proportional scale, and give the outcome."
  assumptions:
    - "The business data hold every active supplier with a contract, so the comparison is among suppliers."
  limits:
    - Firm size is not held; larger suppliers may both file and win more.
    - Which came first, the filing or the contracts, is not read here.
  next: >-
    Part of the sixth early signal: firm size for small firms, and the timing of filing against contracts.
  terms: [held-together, negative-binomial, gamma, rate-ratio, austender, verdict-words]
  related: [B24, M29]

- id: M10
  lens: firms
  about: system
  headline: About two thirds of firms with both filed a trade mark before their first patent
  statement: >-
    Following firms by the year of their first public registration, rather than a window of filings, 64.04% to 69.48%
    of firms that have filed both a trade mark and a standard patent filed the trade mark first: a little less than
    Stage 2's 72.86%, and least in the cohort followed longest. Only 2.78% to 3.57% of each cohort's firms have filed
    both.
  figures:
    - value: "64.04% and 66.09%"
      label: trade mark first, firms first registered 2001 to 2005 (the two halves)
    - value: "68.68% and 69.48%"
      label: trade mark first, firms first registered 2011 to 2015
    - value: "72.86%"
      label: Stage 2's figure, from a window of filings
  points:
    - "**2001 to 2005:** 64.04% of 762 and 66.09% of 752 firms; a median 4.04 and 4.85 years between the two first
      filings. **2006 to 2010:** 68.01% and 68.30%; 3.61 and 2.96 years. **2011 to 2015:** 68.68% and 69.48%; 2.79 and
      2.92 years."
    - "Almost none filed both on the same day (0 to 3 firms a cohort)."
    - "**Why the cohorts differ:** Stage 2's window (both first filings in FY2010 to FY2026) favoured pairs filed close
      together. The later cohorts have had less time, so their shares still lean to pairs filed close together."
  revisits:
    - id: B25
      signal: Which comes first, a trade mark or a patent
      verdict: refined
      what: "Following firms from their registration, the order holds, but fewer filed a trade mark first (64.04% to
            69.48%, against 72.86%). The share is lowest among the firms followed longest, whose later second filings
            the earlier window had cut off."
  held: ["firms grouped by when they first registered, followed to the end of the data (instead of a window of
         filings)"]
  chart:
    type: bar
    title: Firms that filed a trade mark before their first standard patent, by cohort
    subtitle: Of firms with both, by the year of first public registration; the two halves of the lens
    x: {values: ["2001 to 2005", "2006 to 2010", "2011 to 2015"]}
    y: {name: Trade mark first, format: pct, min: 50, max: 80}
    series:
      - name: First half
        colour: 0
        data: [64.04, 68.01, 68.68]
      - name: Second half
        colour: 2
        data: [66.09, 68.30, 69.48]
    marks:
      y: [{at: 72.86, label: "Stage 2's window"}]
    source: IP Australia, IP RAPID; ABR; ASIC (lens firms); notebook 3, section 2.3
    note: The axis starts at 50% to show the differences between cohorts; every cohort is well above half.
  questions:
    - q: 2
      how: "Most firms that come to hold both kinds of right start with a brand. This bears on how firms come into the
           patent system."
  sources: [linkage, abr, asic, iprapid]
  prep:
    - what: Firms whose first public registration fell in 2001 to 2005, 2006 to 2010 or 2011 to 2015, and whose registration date is not truncated; a first filing dated before the registration is kept.
      why: The final review asked for an order that does not depend on a window of filings.
  steps:
    - "Take each group's firms that have filed both a trade mark and a standard patent, at any date."
    - "Measure the share whose first trade mark came first, with a likely range, in each half, and the typical years
      between the two."
    - "Count how many of each group filed both, so it is clear who is being compared."
  assumptions:
    - A firm's first observed filing is its first filing (filings before 2001, or without an ABN, are not seen).
  limits:
    - "Firms registered more recently have had less time to file their second kind of right."
  next: "Descriptive: it sharpens Stage 2's figure. The order is worth following up for how firms come to the patent
        system (Q2)."
  terms: [cohort, halves, interval]
  related: [B25]

- id: M11
  lens: firms
  about: system
  headline: Among large employers, the biggest file more, especially within the same industry
  statement: >-
    Over every employer of 100 or more reporting to WGEA, employers of 1,000 or more more often have a filing linked
    than those under 250 (65.3% against 48.3%), and the gap widens with the industry held: +19.1 and +20.3 points, from
    +17.0 and +18.0 raw. Large employers are in divisions that file less. R&D spend's link to patenting within size and
    industry does not replicate in this small group.
  figures:
    - value: "+19.1 and +20.3 points"
      label: any filing linked, 1,000 or more against under 250, industry held (raw +17.0 and +18.0)
    - value: "+12.1 and +16.0 points"
      label: a standard patent, industry held
    - value: "509"
      label: WGEA employers claiming the R&D Tax Incentive
  points:
    - "9,742 WGEA employers (latest report), 7,126 of them in the lens; those outside it are counted as having no filing
      linked."
    - "**A standard patent:** +7.4 raw and +12.1 held; +13.4 and +16.0. **A trade mark:** +17.1 and +19.0; +16.7 and
      +19.0. Holds."
    - "**R&D spend above the median** ($2,194,930) with size and division held: a standard patent +14.7 in the first
      half, +3.8 in the second, so it does not replicate; with about 250 employers a half, little can be detected
      either way."
    - "Size is known only for WGEA reporters, so these are large employers only, not the firms most IP filers are."
  revisits:
    - id: B50
      signal: Size and filing among large employers
      verdict: holds
      what: >-
        The size gap holds and widens with the industry held: +19.1 and +20.3 points for any filing linked, against
        +17.0 and +18.0 raw.
    - id: B51
      signal: R&D within size among large employers
      verdict: does not replicate
      what: "Above-typical R&D spending goes with a standard patent in the first half (+14.7) but not the second
            (+3.8), allowing for size and industry. Each half has only about 250 employers."
  held: ["the broad industry", "for R&D spend: the size band"]
  verdicts:
    - signal: Any filing linked, 1,000 or more against under 250
      detail: +17.0 and +18.0 raw; +19.1 and +20.3 held
      verdict: holds
    - signal: A standard patent
      detail: +7.4 and +13.4 raw; +12.1 and +16.0 held
      verdict: holds
    - signal: A trade mark
      detail: +17.1 and +16.7 raw; +19.0 and +19.0 held
      verdict: holds
    - signal: "R&D spend above the typical claimant's, a standard patent"
      detail: +14.7 held in the first half, +3.8 in the second
      verdict: does not replicate
  chart:
    type: effect
    title: Employers of 1,000 or more against those under 250
    subtitle: Difference in the share with a filing linked, in percentage points, over every WGEA employer; raw and with the industry held; 95% intervals
    x: {values: ["Any filing linked, first half", "Any filing linked, second half", "A standard patent, first half", "A standard patent, second half", "A trade mark, first half", "A trade mark, second half"]}
    y: {name: Largest minus smallest employers (percentage points), format: signed}
    ref: 0
    ref_label: no difference
    series:
      - name: Raw (as Stage 2 compared)
        colour: muted
        data: [[17.0, 12.6, 21.3], [18.0, 13.7, 22.2], [7.4, 4.3, 10.5], [13.4, 9.9, 16.8], [17.1, null, null], [16.7, null, null]]
      - name: Industry held
        colour: 0
        data: [[19.1, 14.9, 23.3], [20.3, 16.2, 24.4], [12.1, 8.8, 15.5], [16.0, 12.5, 19.4], [19.0, 14.8, 23.3], [19.0, 14.9, 23.2]]
    source: WGEA; IP Australia, IP RAPID (lens firms); notebook 3, section 2.4
  questions:
    - q: 2
      how: Among large employers, size goes with filing more strongly within an industry than across all, so the industries large employers are in file less.
    - q: 3
      how: R&D spend's link to patenting within size is too weak to detect in about 250 employers a half.
  sources: [wgea, rdti, linkage, iprapid]
  prep:
    - what: "Every employer with a gender equality report, counting those missing from the business data as having no
            filing linked, as in B50. Only the reports' own details are allowed for."
      why: "Anything taken from the business data (age, place) is missing for exactly the employers with no link."
  steps:
    - Compare employers of 1,000 or more with those under 250, with nothing held (raw).
    - "Allow for the broad industry and compare again."
    - "Among reporting employers claiming the R&D Tax Incentive, compare above-typical spending, allowing for size
      band and industry."
  assumptions:
    - The latest WGEA report gives an employer's size and industry.
  limits:
    - Size is known only for employers of 100 or more (OQ20).
  next: >-
    Part of the sixth early signal; small firms' size and industry are the gap (OQ20).
  terms: [held-together, wgea, anzsic, verdict-words]
  related: [B50, B51]

- id: M12
  lens: firms
  about: data
  headline: Matching names recovers most missing business numbers accurately and changes no firm finding
  statement: >-
    Matching Australian organisations' rights that have no filer's ABN to the ABR's and ASIC's names recovers a known
    ABN for 66% to 85% of rights where the ABN was hidden for a test, with 1.1% to 4.8% of matches naming another ABN.
    Applied to rights with no ABN it links 17.7% to 35.3% of them. It closes most of the recent fall in standard
    patents linked to an ABN, and moves concentration and the claimants' figures by less than a point.
  figures:
    - value: "81.70%"
      label: "of standard patents' hidden business numbers recovered, 2009–10 to 2018–19 (2.06% of matches gave
             another number)"
    - value: "88.68% to 83.85%"
      label: "standard patents with a filer's business number, 2023–24 to 2025–26; 89.43% to 89.20% with the name
             matches"
    - value: "55.31% and 55.06%"
      label: of standard patents filed by the top 1% of firms, by ABN and with the matched links
  points:
    - "**The test:** standard patents FY2010 to FY2019, 83.41% matched and 81.70% recovered; FY2020 to FY2026, 68.95%,
      67.85% and 1.60% another ABN. Trade marks 78.89%, 76.59% and 2.91%. Designs filed FY2000 to FY2009 are the
      weakest, 9.84% another ABN. A \"wrong\" ABN can be a related company of the same group."
    - "**With the postcode as well**, 42.62% to 46.04% matched, with 2.34% to 4.71% another ABN: it halves the matches
      for no gain in accuracy, so it was dropped."
    - "**Rights with no ABN, FY2000 to FY2026:** 3,217 of 9,104 standard patents matched (35.34%), 20,845 of 117,531
      trade marks (17.74%), 6,183 of 18,317 provisionals, 2,171 of 8,275 designs; none of 3,220 plant breeder's rights."
    - "**Firms with a first observed linked standard patent:** 660 (FY2020) to 542 (FY2026) by the filer's ABN, 675 to
      616 with the matched links: about half of that fall is linking (an 18% fall becomes 9%). The fall in firms
      filing a first patent of any kind ({U45}) is not re-read here."
    - "**R&D claimants with no filing linked** fall from 48.48% to 47.70%; every signal of {M8} keeps its direction and
      verdict. Adopting the matched links into the counts is the owner's decision (OQ26)."
  revisits:
    - id: U45
      signal: Recent filers less often linked to an ABN
      verdict: refined
      what: "With the name matches, standard patents with a business number go from 89.43% (2023–24) to 89.20%
            (2025–26), against 88.68% to 83.85% without. Most of the recent fall is in linking. So is about half of
            the fall in firms with a first linked standard patent (an 18% fall becomes 9%); the fall in firms
            filing a first patent of any kind was not re-read."
    - id: U44
      signal: A few firms file most patents
      verdict: refined
      what: "Concentration barely moves with the name matches. The top 1% of firms file 55.31% of standard patents
            without them and 55.06% with them (trade marks 25.66% and 26.02%)."
  held: ["a name match to the business register's and the company regulator's names, kept apart from the counts"]
  verdicts:
    - signal: The match's accuracy, every type and decade but older designs
      detail: 1.14% to 4.83% of matches name another ABN (older designs 9.84%)
      verdict: refined
    - signal: The recent fall in standard patents linked to an ABN
      detail: 88.68% to 83.85% by ABN; 89.43% to 89.20% with the matched links
      verdict: refined
    - signal: Concentration of standard patents
      detail: 55.31% by ABN, 55.06% with the matched links
      verdict: refined
  chart:
    type: bar
    title: Australian organisations' rights linked to a business number, with and without the name match
    subtitle: Share with an ABN, FY2024 and FY2026; the matched links are read beside the counts, never added to them
    x: {values: ["Standard patents, FY2024", "Standard patents, FY2026", "Trade marks, FY2024", "Trade marks, FY2026", "Designs, FY2024", "Designs, FY2026"]}
    y: {name: Share with an ABN, format: pct, min: 80, max: 95}
    series:
      - name: By the filer's ABN
        colour: muted
        data: [88.68, 83.85, 92.34, 90.94, 92.27, 89.34]
      - name: With the name-matched links
        colour: 0
        data: [89.43, 89.20, 93.01, 92.91, 92.76, 90.72]
    source: IP Australia, IP RAPID; ABR; ASIC (lens rights and firms); notebook 3, section 2.5
    note: The axis starts at 80% to show the gap; most rights are linked either way.
  questions:
    - q: 2
      how: Firms' IP counts are lower bounds; the name match shows how far, and that no firm finding depends on the missing links.
    - q: 3
      how: The claimants' and suppliers' findings rest on the same links, and keep their direction with the matched ones.
  sources: [iprapid, abr, asic, linkage, ipa_register]
  prep:
    - what: "The filer's name is matched to the business register's main names and the company regulator's company
            names, current and former. A match is kept only if exactly one business number has the name and is
            registered in the filer's state (ADR 0045, 0047)."
      why: A name shared by several ABNs, or found in another state, is too likely to be the wrong firm.
    - what: The match is tested on rights whose ABN is known, with the ABN hidden.
      why: Shows how often the match is right before it is used where the ABN is missing.
  steps:
    - Run the match on rights with a known ABN, hidden, and measure the share recovered and the share naming another ABN.
    - Run it on rights with no ABN, and read U45's linked shares and first observed filers with and without it.
    - Read U44's concentration and M8's claimants with the matched links beside the counts.
  assumptions:
    - An organisation's name as filed, in its state, picks out one business.
  limits:
    - "A \"wrong\" ABN can be a related company of the same group, which the test cannot tell."
    - The match uses ABN main names and ASIC company names only, not trading or business names.
  next: >-
    For the owner (OQ26): whether to adopt the matched links into the counts. The gaps it leaves are the ABNs IP
    RAPID leaves out (OQ7) and trading and business names (ASIC's business names register).
  terms: [abn, abr, asic, name-match, lower-bound]
  related: [U44, U45, M8, U126]

- id: M29
  lens: firms
  about: system
  headline: Company type, age and a city address each go with suppliers' filing, but postcode advantage does not
  statement: >-
    Among 52,884 active government suppliers, public companies (+31.2 points), firms of 20 years or more (+14.6) and
    city addresses (+12.3) each go with a filing linked with the others and the state held, in both halves. The
    advantaged postcode's link is not detected once they are held. Large taxpayers with a filing linked do not report
    more income once their form, age and state are held.
  figures:
    - value: "+31.2 and +29.2 points"
      label: "public against private company, allowing for the rest (65.1% against 31.4% on its own)"
    - value: "-0.0 and -0.5 points"
      label: "the three most advantaged tenths of postcodes against the rest, allowing for the rest (on its own +4.6
             and +5.1)"
    - value: "0.824 and 0.961"
      label: "large taxpayers' income ratio, filing linked against none, allowing for the rest"
  points:
    - "**20 years or more against 3 to 10:** +21.5 raw and +14.6 held; +21.7 and +14.3. Holds (67.9% and 66.0% left).
      Age is on the record at the build date."
    - "**Major city against elsewhere:** +12.5 and +12.3; +13.6 and +13.2. Holds."
    - "**The advantaged postcode:** not detected once held. The suppliers' gradient by advantage of postcode is their
      form, age and city address."
    - "**Large taxpayers** (6,310 with a latest income; 40.45% and 41.20% with a filing linked): income ratio 1.393 raw
      and 0.824 held in the first half, reversed; 1.601 and 0.961 in the second, not detected once held."
  revisits:
