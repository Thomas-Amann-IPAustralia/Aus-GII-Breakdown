    (21.19% against 16.12%, FY2013 to FY2022), and the gap holds with the year, state and co-filers held: +5.56 points,
    and +6.63 in the earlier decade. On standard patents the organisations' apparent advantage is the field: with the
    field held, their inventors include fewer women in FY2010 to FY2019 (-2.82 points).
