name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Tests (including the committed data against data/manifest.json)
        run: uv run pytest -q
