      field cannot be held for provisionals: none has one in IP RAPID."
    - "**Standard patents** (inventors in Australia; 18,182 patents, 35,446 inventors with an estimate): FY2010 to
      FY2019, 12.18% against 11.13%, +1.05 raw (not detected) and -2.82 held, which appears once held; FY2000 to FY2009,
      +4.68 and -2.12, not detected either way."
    - "B17's filer gap (15.9% against 11.22%) is not detected once the filer is clustered, and turns negative with the
