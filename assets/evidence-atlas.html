<!--
EVIDENCE ATLAS · SINGLE-FILE DESIGN FRAMEWORK · 27 October 2026
For Claude Code: this is an implementable design direction, not a production data pipeline.
All CSS, JavaScript, icons, chart geometry and content are inline. No CDN, fonts, API calls,
tracking or dependencies. Opens directly from disk and works offline (external references need internet).

SOURCE CONTRACT
- Notebook: analysis/notebooks/01_univariate.ipynb, main retrieved 27 October 2026.
- Also read: docs/research-goal.md, docs/eda-plan.md, docs/stage-1-summary.md,
  config/sources.yaml, README.md and analysis/eda/build.py.
- ARCHIVE contains 99 numbered observations extracted from notebook markdown. U0 is replaced
  with an explicit discrepancy notice. The other notes preserve original wording, not an audit endorsement.
- CURATED contains editorial summaries and chart values transcribed from those observations.
  Charts are redesigned, NOT copied notebook plots. Data have NOT been independently recomputed.
- Question tags in CURATED are editorial navigation mappings, not causal conclusions.
- No synthetic empirical chart values. Absent detailed provenance stays visibly unresolved.

INTEGRATION STUBS / NEXT IMPLEMENTATION
1. Export an observation manifest from notebook execution: stable ID, lens, claim, evidence level,
   question IDs, population, period, denominator, input artifact hashes, run ID, output-cell ID,
   chart series, decisions, transformations, assumptions, limitations and next-stage links.
2. Bind that manifest to these views. Validate claim numbers against execution outputs. U0 currently
   conflicts with its preceding output: fail validation rather than silently choose either value.
3. Replace main-branch references with a pinned commit and publish a human-readable evidence page
   for each observation. Do not require readers to understand source code or open a notebook.
4. Resolve per-table physical storage and publisher release from data/manifest.json + catalogue.
   Never expose credentials, raw personal identifiers, signed URLs or individual-level sensitive data.
5. Curated source chains are explanatory summaries. Only U44 has a detailed arithmetic walkthrough.
   Catalogue-only records intentionally show a provenance integration notice, not fabricated lineage.
6. Persist bookmarking server-side if wanted; this prototype only holds a shortlist in memory.
   Production export should include frozen provenance. Prototype export clearly labels snapshot context.
7. Current chart switches change only presentation/selected series; do not imply notebook recomputation.
8. Run accessibility and device QA when integrating. Native dialog handles focus/escape; every chart has
   a data-table alternative, reduced motion is respected, and filtering is announced via a live region.
-->

<script>
'use strict';
const REPO='https://github.com/Thomas-Amann-IPAustralia/Aus-GII-Breakdown/blob/main/';
const NB=REPO+'analysis/notebooks/01_univariate.ipynb';
const ARCHIVE=[{"id": "U0", "lens": "corpus", "title": "The corpus at a glance: a summary awaiting reconciliation.", "body": "The U0 narrative reports 152 tables, 38 sources and 314,742,745 rows. The preceding stored output reports 162 tables, 41 sources and 317,792,796 rows. These do not agree. Reconcile the notebook narrative and its execution outputs before publishing a corpus headline.", "cell": 7}, {"id": "U1", "lens": "rights", "title": "One row per right, complete where it should be.", "body": "- The lens holds 4,368,006 rights in 74 columns: 29 core columns, profiled in 1.0 to 1.7, and 45 from its five\n  attachments (1.8.1 to 1.8.5: 12 from the parties, 11 from the events, 8 from the links, 6 from Google Patents and 8\n  from the inventors). No right appears twice (0 rows repeat a type and application number).\n- Type, sub-type, status, the applicant counts and `has_abn` are 100% filled. The application date is 98.58% filled,\n  the registration date 57.74% (it is empty when a right was never registered) and the end date 55.6%.\n- The emptiest columns are empty by design: the type of patent (40.12%, patents only), the technology area (30.71%,\n  patents only), the applicant's state and postcode (42.44% and 42.25%, mostly Australian first applicants) and the\n  ABN (28.89%).\n- Origin (`australian_applicant`) is known for 86.37% of rights.", "cell": 16}, {"id": "U2", "lens": "rights", "title": "Five repairs, made before the profiles below (ADR 0012).", "body": "The evidence for each is in IP RAPID's\nown tables above (the state's is in 1.7).\n1. **A placeholder end date.** 1,282 rights (1,279 trade marks and 3 designs) \"ended\" on 1 January 1970, though the\n   earliest of them was filed on 18 July 2013 (trade marks) or 3 March 2020 (designs). It is the zero of computer\n   dates standing in for an unknown date, so it is now empty.\n2. **A registration before the register began.** One trade mark is registered before 1904, earlier than the\n   register's first application (13 February 1904). Now empty.\n3. **Trade marks registered at filing.** Of the 122,980 trade marks registered before 1986, 121,207 (98.6%) were\n   registered on the day they were filed: IP RAPID holds only their filing date, as the timeline found (ADR 0010).\n   Their days to registration, almost always 0, are now empty; the registration date itself is kept.\n4. **A technology area that was really a class.** For all 2,335,057 trade marks and 248,748 designs with a\n   \"technology area\", it equals the main class: the Nice or Locarno class, repeated. It is now kept for patents only.\n5. **Attorneys.** IP RAPID's \"agent\" is the *address for service*. It names one for 100% of trade marks and of\n   Australian applicants' designs, but for Australian applicants it is often the applicant itself. Counting only an\n   agent who is not one of the right's applicants, attorney use by Australian applicants (FY2017 to FY2026) is 57.02%\n   for trade marks, 71.65% for designs, 82.62% for patents and 41.21% for plant breeder's rights. For overseas\n   applicants it barely changes (96.27% to 98.69% for trade marks, designs and patents). Counting only agents who act\n   for five or more different applicants gives 49.52% for Australian trade marks, so the repaired flag may still\n   include some agents who are not attorneys (a director, say, or a related business): up to about 8 points for\n   Australian trade marks.", "cell": 16}, {"id": "U3", "lens": "rights", "title": "Dates: two rushes, a few odd end dates, and 61,854 rights that cannot be placed in time.", "body": "- Applications run from 13 February 1904 to 17 October 2026.\n- The most common application date is 12 April 2013 (1,856 rights), the Friday before the Raising the Bar reforms\n  took effect (15 April 2013). The most common earliest filing date is 25 August 2021 (1,342 rights), the day before\n  innovation patents closed (26 August 2021). Both are rushes to file before a rule changed; Stage 2 measures them.\n- 14 end dates fall after the corpus was built (22 October 2026), the latest on 27 April 2029. They are left as\n  recorded; they are too few to matter.\n- 50,711 patents and 11,143 designs have no application date. Of the patents, 50,488 are standard patents, almost all\n  of unknown origin (50,442) and unknown status (49,737); 203 were ever registered (202 of them second-tier). Of the\n  designs, 11,126 are of unknown origin and 15 were registered. They are old records (1.3: the status \"unknown\" belongs\n  to patents filed before FY2000) that cannot be placed in time, so yearly counts leave them out: 2.9% of patents and\n  4.1% of designs.", "cell": 16}, {"id": "U4", "lens": "rights", "title": "Trade marks are most rights; standard patents are most patents.", "body": "- Trade marks are 53.5% of all rights (2,335,064), patents 40.12%, designs 6.153% (268,782) and plant breeder's rights\n  0.2686% (11,732).\n- Of patents, 82.17% are standard (1,439,947), 15.07% provisional applications (264,024) and 2.77% second-tier\n  (41,898 innovation and 6,559 petty patents).\n- Petty patents run from FY1980 to FY2001 and innovation patents from FY1999. Innovation patents still appear in\n  FY2027: divisionals and conversions of earlier applications, which the transitional rules allow (ADR 0010).\n- Trade marks other than ordinary ones are rare: 3,033 certification, 2,594 collective and 1,456 defensive marks, and\n  two combined sub-types since FY2020 and FY2022 (29 and 19 marks).\n- **Decision:** a count of \"rights\" across types is mostly a count of trade marks, so totals are always given by type,\n  and patent headlines use standard patents.", "cell": 20}, {"id": "U5", "lens": "rights", "title": "Applications over time.", "body": "- In FY2017 to FY2026 there were 28,798 to 32,960 standard patent applications a year, 72,652 to 98,189 trade marks,\n  7,347 to 10,388 designs and 255 to 413 plant breeder's rights.\n- In the chart, standard patents of \"origin unknown\" give way to \"overseas\" ones between about 1975 and 1990; from\n  FY1990 no more than 0.4% are of unknown origin (the table). The change is in what the register records, not\n  necessarily in who filed.\n- Second-tier patents peak at 7,150 in FY2021, the year innovation patents closed, and then fall to 232 (FY2023),\n  123, 68 and 52 (FY2026).\n- Provisional applications ran at 4,143 to 5,343 a year in FY2017 to FY2025, then doubled to 10,069 in FY2026 (U8).\n- **Correction (found with the timeline's profile, U23).** Before 1983 for trade marks, 1986 for designs and\n  September 1985 for provisional applications, IP RAPID holds only the rights still on the register when its records\n  were computerised, so the chart's earlier counts of those types are survivors and understate filings.", "cell": 28}, {"id": "U6", "lens": "rights", "title": "The latest years are complete.", "body": "FY2025 and FY2026 are not lower than earlier years for any type:\nstandard patents 29,950 and 31,136 (against 28,798 to 32,960 in FY2017 to FY2024); trade marks 92,470 and 98,189 and\ndesigns 10,126 and 10,388, the decade's highest. The lens counts an application when it is filed in Australia (for a\nPCT application, when it enters the national phase; ADR 0010), so there is no publication lag. FY2027 (8,357 standard\npatents to mid-October 2026) is partial and is left out.", "cell": 28}, {"id": "U7", "lens": "rights", "title": "Australian applicants' shares, where origin is recorded.", "body": "- **Standard patents:** 11.3% in FY1990 and 12.4% in FY1995, then about 8% to 11% (7.9% to 10.8% in the table's\n  years from FY2000; 9.3% in FY2026). About nine in ten standard patents come from overseas.\n- **Trade marks:** 62.9% (FY1995) to 69.5% (FY2005), then 55.8% to 62.4% in the table's years since FY2018.\n- **Provisional applications:** 91.8% to 98.1% Australian. They are the cheap first step Australians use to secure a\n  filing date.\n- **Second-tier patents:** 79.2% to 87.4% Australian in FY1990 to FY2010, down to 16.1% in FY2021, when overseas\n  applicants filed before the closure, and 61.8% to 75% in FY2024 to FY2026, on 52 to 123 filings a year.\n- **Plant breeder's rights:** 37.8% to 52.3% since FY1995.\n- **Designs:** origin is unknown for 20.3% to 23.3% of designs in FY1990 to FY2000 and for 4.0% to 6.3% since FY2018,\n  so a share can be given only in a few recent years (27.4% to 33.9% in FY2018 to FY2022). The unknown share is rising\n  again: 5.1%, 6.3% and 6.0% in FY2024 to FY2026.\n- **Decision:** in Stage 2, Australian shares are compared from FY1990, and a design share is always shown with its\n  unknown share beside it.", "cell": 28}, {"id": "U8", "lens": "rights", "title": "The rise in provisional applications is real, broad and partly concentrated.", "body": "- **When.** In March 2024 there were 345 provisionals (101 with an individual as first applicant). The rise starts in\n  early 2025 (481 in March 2025) and peaks in March and April 2026 (1,274 and 1,231, of which 740 and 721 by\n  individuals). By September 2026 it has eased to 750 (333 by individuals), still about twice March 2024's level.\n- **How much.** FY2026 had 10,069 provisionals, against 4,143 to 5,047 a year in FY2022 to FY2025. 5,399 had an\n  individual as first applicant, against 1,365 to 1,926.\n- **Not from businesses.** Distinct ABNs stayed flat (1,361 in FY2026; 1,333 to 1,431 before), and provisionals with an\n  ABN rose only from 2,329 to 2,619.\n- **Broad.** Individuals who filed a single provisional rose from 1,538 (FY2025) to 2,507 (FY2026).\n- **And concentrated.** 54 individuals filed 10 or more each (1,528 between them), against 9 who filed 183 in FY2025;\n  one filed 375. 45 organisations filed 10 or more (1,258), against 24 (566).\n- Why is outside these data. Stage 2 lines the months up against the policy and fee events, and IP Australia's own\n  published figures are the benchmark (the plan's item 4).", "cell": 28}, {"id": "U9", "lens": "rights", "title": "How rights end.", "body": "- **\"Lapsed\" and \"ceased\" differ, as the lead said.** Under 0.01% of lapsed patents, trade marks and designs were ever\n  registered, against 99.93% of ceased patents, 100% of ceased trade marks and 92.08% of ceased designs. A lapse is an\n  application abandoned; a cessation is a registered right let go.\n- **\"Unknown\" is old patents.** 408,957 patents have the status \"unknown\". All were filed between FY1904 and FY1999\n  (median FY1961), and none has a registration or end date: the register does not know what became of them. They are\n  27% of standard patents (393,027) and 6% of provisional applications (15,930).\n- **Old grants are under-recorded.** Only 68.9% of expired patents have a grant date, though only a granted patent can\n  expire (they were filed FY1904 to FY2025, median FY1993). So \"ever registered\" understates grants among old patents.\n- **Where rights stand today (all years):** trade marks 41% in force, 26% ended before registration and 28% after;\n  designs 24% in force and 66% ended after registration; standard patents 12% in force and 7% pending; provisional\n  applications 90% ended before grant, as they are meant to.", "cell": 33}, {"id": "U10", "lens": "rights", "title": "Grant and registration rates by year of application.", "body": "- **Standard patents:** 74.6% of FY1990's applications and 75.5% of FY2000's were granted, but only 54.4% of FY2008's;\n  then 61.4% (FY2010), 69.0% (FY2015) and 65.4% (FY2019).\n- **Trade marks:** 52.1% (FY1990), 63.2% (FY2000), 70.1% (FY2010) and 80.7% (FY2019).\n- **Designs:** 78.3% (FY1990) and 79.8% (FY2000), then about 95% from FY2010 (94.0% to 95.9%).\n- **Second-tier patents:** 90.0% to 98.4% from FY2008 to FY2024. This is not a pass rate: an innovation patent was\n  granted after a check of its formalities only, and examined only if certified later (the glossary). Its\n  certification comes with the events attachment.\n- **Still pending:** standard patents 2.0% of FY2021's applications, 12.2% of FY2022's and 49.1% of FY2024's; trade\n  marks 1.2% of FY2024's; plant breeder's rights 8.2% of FY2015's and 30.1% of FY2019's.\n- **Correction (U23).** In the chart, trade marks to FY1983 and designs to FY1986 show nearly all applications\n  registered because IP RAPID holds only the survivors of those years; their rates are not comparable with later\n  years'.\n- **Decision:** rates are compared only for years whose applications are nearly all decided: to FY2021 for standard\n  patents, FY2024 for trade marks, FY2026 for designs (1.7% pending) and about FY2010 for plant breeder's rights (2.6%\n  pending).", "cell": 33}, {"id": "U11", "lens": "rights", "title": "How long registration takes, for applications filed FY2010 to FY2019.", "body": "- **Standard patents:** median 980 days (about 2.7 years); the middle half take 681 to 1,318 days, and 99% are granted\n  within 2,156. The shape is one hump, slightly skewed to the right (skew 0.50), at every bin width.\n- **Trade marks:** median 223 days; the middle half take 211 to 298, with a long tail to the right (99% within 1,081\n  days; skew 3.7). A sharp peak at about 222 days holds the most common value of the whole column (222 days, 3.9% of\n  values, in the overview). It looks like the shortest path through examination and the opposition period: a lead to\n  confirm, not a finding.\n- **Designs** take a median 33 days, **second-tier patents** 21, and **plant breeder's rights** 1,296 (about 3.5\n  years), with the widest spread (the middle half 868 to 1,932 days). An innovation patent was granted after a check\n  of its formalities only, so its 21 days are not a time to examination and are not compared with standard\n  patents'.\n- 57 values remain negative (53 trade marks, 3 patents and 1 design), down from the 1,497 noted while building the\n  lens, after repair 3. They are left as recorded.", "cell": 41}, {"id": "U12", "lens": "rights", "title": "The typical time, by year of application.", "body": "- **Standard patents:** a median 2.59 years for FY1990's applications, 2.27 (FY2000), 3.96 (FY2005), 3.49 (FY2010),\n  2.32 (FY2015), 2.76 (FY2019) and 2.91 (FY2021).\n- **Trade marks:** 2.35 years (FY1990) and 1.13 (FY2000), then 0.60 to 0.69 since FY2005.\n- **Designs:** 0.52 to 0.65 years to FY2005, then 0.08 to 0.16 since FY2010.\n- **Plant breeder's rights:** from 1.57 years (FY1990) to 3.93 (FY2019).\n- Only applications later registered or granted count, so these are the times of successful applications.\n- **Decision:** times are compared only within the complete years of U10.", "cell": 41}, {"id": "U13", "lens": "rights", "title": "Who applied, FY2017 to FY2026.", "body": "- **Australian share (known origin):** standard patents 8.675%, so 91.3% came from overseas; trade marks 59.0%; designs\n  30.05% (with 5.062% of unknown origin); second-tier patents 33.75%; plant breeder's rights 43.79%; provisional\n  applications 94.45%.\n- **The first applicant's country, standard patents:** the United States 132,718 (43.5%), Australia 26,192 (8.6%),\n  China 20,727 (6.8%), Japan 16,130 (5.3%), Germany 13,166 (4.3%), the United Kingdom 12,973 (4.3%) and Switzerland\n  11,741 (3.8%).\n- **Individuals.** An individual is the first applicant on 20.59% of Australian standard patents, against 3.614% of\n  overseas ones; on 40.35% of Australian provisional applications, 41.63% of second-tier patents and 24.78% of trade\n  marks.\n- **ABNs.** 70.4% of Australian standard patents have an applicant with an ABN, and 87.98% of those filed by\n  Australian organisations; for Australian organisations' trade marks, 78.3%. So 12% to 22% of Australian\n  organisations' rights cannot reach the `firms` lens. Plant breeder's rights carry no ABN at all.\n- **Agents.** Australian applicants used an agent other than themselves for 86.79% of standard patents, 71.65% of\n  designs, 66.68% of second-tier patents, 57.02% of trade marks and 41.21% of plant breeder's rights; overseas\n  applicants for 89.91% to 99.12%. Most such agents are attorneys (1.8.1 separates them). Filing alone is common among\n  Australians, above all for trade marks, and rare from overseas.\n- **Applicants per right.** 85.56% to 98.59% of each type's rights (all years) have one applicant; 21.7% of second-tier\n  patents filed in FY2017 to FY2026 have two or more (6.694% of standard patents).\n- 91,979 rights have no applicant recorded, all of unknown origin: 5.308% of standard patents and 5.647% of designs\n  (all years).", "cell": 47}, {"id": "U14", "lens": "rights", "title": "What is protected, FY2017 to FY2026.", "body": "- **Standard patents:** medical technology 35,626 (11.7%), pharmaceuticals 32,681 (10.7%) and biotechnology 29,250\n  (9.6%), together 32.0%; then organic fine chemistry (6.1%), civil engineering (5.3%) and computer technology (5.1%).\n- **Trade marks:** advertising and business services (class 35) 97,146 (11.7%); education, entertainment and sport (41)\n  52,339 (6.3%); clothing (25) 52,276 (6.3%); scientific and electronic apparatus and software (9) 44,544 (5.4%).\n- **Designs:** means of transport (12) 7,337 (8.7%); recording, communication and computing equipment (14) 6,710\n  (8.0%); furnishing (06) 6,354 (7.6%).\n- **Plant breeder's rights (all years):** roses (*Rosa*) 980 (8.4%), stone fruit (*Prunus*) 881 (7.5%) and *Solanum*\n  (potatoes and tomatoes) 514 (4.4%); the other 559 values (genera, and the few rights with none) hold 55.4%.\n- **No class.** Every provisional application; standard patents filed before 1920 (99.9% to 100%) and 20.3% to 27.6% of\n  those filed in the 1920s to 1960s; under 1% from the 1980s to the 2010s, and 2.2% in the 2020s. Of the standard\n  patents with no application date, 94.3% have no class.\n- **Classes per right:** trade marks a median 1 (mean 1.803; 99% within 8; up to 45), standard patents a median 2 (mean\n  1.856; up to 19), designs a median 1 (up to 5).\n- **Decision:** technology fields describe standard patents from the 1970s (4.4% unclassified) onwards; earlier decades\n  are described with that gap stated.", "cell": 54}, {"id": "U15", "lens": "rights", "title": "Where Australian applicants were, FY2017 to FY2026.", "body": "- **Standard patents:** New South Wales 38.2%, Victoria 23.7%, Queensland 17.4%, Western Australia 11.0%, South\n  Australia 4.6%, the ACT 3.0%, Tasmania 0.8% and the Northern Territory 0.2%; 1.0% have no state.\n- **Trade marks:** New South Wales 35.8%, Victoria 29.5% and Queensland 18.7%. **Designs:** Victoria has 33.3%.\n- **Plant breeder's rights:** 24.8% have no state, and no postcode to take one from.\n- Shares against population or businesses are for Stage 2, through the `regions` lens.", "cell": 59}, {"id": "U16", "lens": "rights", "title": "The state repair, and how usable the postcodes are.", "body": "- IP RAPID leaves out the state for 34.96% of Australian standard patents filed from FY2024 and 13.65% of FY2023's,\n  against 8.561% before. Where both a state and a postcode are recorded, the postcode's postal area is in the\n  recorded state for 99.41% to 100% of rights in every sub-type and period (98.54% to 100% for plant breeder's\n  rights). So the missing state is now taken from the postcode (repair 5, ADR 0012).\n- Over all years, 99.3% of rights with an Australian first applicant have a usable postcode and 99.56% a state, across\n  3,535 distinct postcodes. The postcode is the key into the `regions` lens.\n- 3,857 rights have an Australian applicant who is not the first, so `applicant_postcode` is empty for them; the\n  filer's postcode from the parties attachment covers most such rights (1.8.1, U19).\n- For overseas applicants the state is kept as recorded (85 values), and \"wa\" for 3,135 overseas rights is most likely\n  Washington, not Western Australia. **Decision:** the state is read only where `applicant_country` is Australia.", "cell": 59}, {"id": "U17", "lens": "rights", "title": "The holder is often not the filer, and for old patents it cannot be told.", "body": "- Where the history is recorded, the current holder is not the founding applicant for 22.0% of standard patents filed\n  in the 2000s (from FY2003), 17.1% of the 2010s' and 7.0% of the 2020s'; for trade marks 20.8%, 15.7% and 10.4%; for\n  designs 14.9%, 12.8% and 6.1%; for provisional applications 3.5% to 5.0%. Newer rights have had less time to change\n  hands (the chart falls towards the present).\n- Trade marks filed in the 1990s (22.1%) changed hands more often than those of the 1980s (12.1%) and 1970s (4.1%),\n  so changes to old rights look less fully recorded.\n- **Patents filed before FY2003 have one set of applicants.** Their first applicant record starts a median 5,974 to\n  7,445 days after filing (FY1998 to FY2002), against 3 to 8 days from FY2003, though 14.61% to 16.1% of them have an\n  assignment event. The records were entered when the data moved between systems, so a change of holder was not\n  kept. `holder_changed` is empty for them (filled for 79.09% of rights in all), and their founding columns may\n  describe a later holder (ADR 0013).\n- Plant breeder's rights go the other way: 11.2% of those filed in the 2020s are held by someone other than the\n  filer, more than in any earlier decade. The data do not say why.", "cell": 72}, {"id": "U18", "lens": "rights", "title": "More Australian-filed rights moved overseas than came the other way.", "body": "Where the history is\nrecorded:\n- **Standard patents:** 3.212% of the 63,385 filed from Australia are now held overseas (2,036), against 0.1323% of\n  those filed from overseas now held in Australia (804). By decade of filing: 5.481% (2000s), 3.042% (2010s) and\n  1.34% (2020s).\n- **Trade marks:** 1.093% of 1,408,143 moved overseas (15,391), and 0.5457% came the other way (4,840).\n- **Designs:** 1.649% moved overseas (1,700), and 0.3637% came the other way (452).\n- These are counts of rights, not of their value; Stage 2 can relate them to technology, firm and the age of the\n  right.", "cell": 72}, {"id": "U19", "lens": "rights", "title": "The filer's postcode differs from the holder's for about a tenth of rights (the review's N02).", "body": "For rights filed FY2003 to FY2026 from Australia and still held in Australia:\n- Postcodes differ for 11.13% of trade marks, 10.1% of standard patents, 7.7% of designs, 6.26% of second-tier patents\n  and 2.061% of provisional applications; states differ for only 1.585% to 2.672% (0.4425% for provisionals), so most\n  moves are within a state.\n- ABNs differ for 5.912% to 7.202% of each type where both exist.\n- The filer's postcode is known for 99.72% to 99.99% of each type (plant breeder's rights 69.14%), and 4,019 of the\n  4,085 rights whose first founding applicant is not Australian, though another is, now have one.\n- The review measured 7% (patents) and 11% (trade marks) for 2000 to 2026; patents filed before FY2003 cannot differ,\n  which explains the lower patent figure.\n- **Decision:** in Stage 2, \"where and who files\" uses the founding columns, and \"who holds\" the applicant columns.\n  The `regions` and `firms` lenses count applications by the current holder today; each switches to the filer in its\n  own section (ADR 0013).", "cell": 72}, {"id": "U20", "lens": "rights", "title": "Overseas filers almost always use an attorney; Australian individuals often file alone.", "body": "FY2017 to FY2026:\n- **Overseas filers:** an attorney for 99.0% of standard patents, 95.8% of designs and 88.2% of trade marks (8.1%\n  through another agent, 3.7% alone).\n- **Australian filers:** an attorney for 85.4% of standard patents (13.2% alone), 68.5% of designs (29.1% alone),\n  62.2% of second-tier patents (33.3% alone) and 49.7% of trade marks (42.9% alone, 7.4% through another agent).\n- **Individuals file alone most:** 37.1% of Australian individuals' standard patents (6.7% of organisations'),\n  48.7% of their designs (24.0%) and 62.4% of their trade marks (36.4%).\n- **The threshold matters for trade marks, not patents.** Counting agents of at least 1, 5 or 100 applicants,\n  Australian standard patents are represented 86.81%, 85.41% and 84.4% of the time; Australian trade marks 57.08%,\n  49.67% and 42.59%; overseas trade marks 96.32%, 88.22% and 66.19%.\n- **Plant breeder's rights** show many \"other agents\" (16.8% of Australian filers' and 37.7% of overseas filers'). The\n  register is small (11,732 rights in all), so a specialist agent may act for fewer than five applicants; for these\n  rights, attorney and other agent are read together.\n- **Decision:** Stage 2 uses `representation` (five or more applicants), with the shares at 1 and 20 applicants as\n  bounds for trade marks.", "cell": 72}, {"id": "U21", "lens": "rights", "title": "Patent attorneys are concentrated; trade mark representation is not.", "body": "FY2017 to FY2026,\nrights filed through an attorney:\n- **Standard patents:** 363 attorneys; the top 5 handle 63.96% and the top 10 79.56%; 4 handle half and 27 handle 90%.\n  Spruson & Ferguson 64,343 (21.6%), Griffith Hack 47,747 (16.0%), Davies Collison Cave 30,383 (10.2%), FB Rice\n  26,605 (8.9%) and Phillips Ormonde Fitzpatrick 21,655 (7.3%).\n- **Designs:** 615 attorneys; the top 5 handle 45.17%, and 7 handle half.\n- **Trade marks:** 9,754 attorneys; the top 5 handle 17.51% and the top 10 25.08%; 65 handle half and 1,753 handle 90%.\n- Counted by firm name, this is a lower bound: some of these firms belong to the same corporate groups, which IP RAPID\n  does not record.", "cell": 72}, {"id": "U22", "lens": "timeline", "title": "One row per month, with each series where it can be read.", "body": "- The lens holds 1,473 months (January 1904 to September 2026) in 35 columns: five calendar columns, 28 monthly\n  series, the CPI and the policy changes. The calendar columns are complete; months have 28 to 31 days.\n- After the repairs, the series begin between January 1904 (standard patents of unknown origin) and December 2003\n  (patent oppositions), as the table above shows. None has a gap inside its span. The last months are empty only\n  where the register is still recording: six months for trade mark and design cessations, three for designs by\n  origin.\n- The busiest month of standard patent applications from Australian and overseas applicants alike is April 2013\n  (1,018 and 5,407), when Raising the Bar took effect; of second-tier applications, August 2021 (2,789), when\n  innovation patents closed; of provisional applications, March 2026 (1,274).", "cell": 204}, {"id": "U23", "lens": "timeline", "title": "Fifteen series started too early, and one policy change was missing (ADR 0014).", "body": "- **Survivors.** By quarter of filing, 2.0% of trade marks filed in early 1981 were never registered, 22.6% in the\n  third quarter of 1982 and 52.0% from the first quarter of 1983 (51.0% at the end of 1988). Of designs, 0.4% and 0.7%\n  in the second half of 1985, then 26.3% in the first quarter of 1986. Provisional applications run at 251 to 355 a\n  quarter in the quarters shown before mid-1985, and 1,372 in the last quarter of 1985. A register that keeps only what survived records almost no\n  failures, so the earlier months count survivors, not filings: 44,207 trade marks from Australian applicants and\n  75,506 from overseas ones over the 921 months from April 1906 (3.2% and 8.4% of each series).\n- **Batches.** Patent cessations were dated in batches to April 1995: 29.8% of the 104 months from September 1986 hold\n  none, and others hold several months' worth (46,671 cessations, 11% of the series). Expiries to December 1994 hold\n  29.4% of their series. Both are dated weekly or daily since (the chart).\n- **Partial records.** IP RAPID records grants only for patents filed from 1979: 1.0% to 1.9% of standard patents\n  filed in 1976 to 1978 have a grant date, against 68.5% of those filed in 1979. So the 16,557 grants before 1985 are\n  some of the grants made (2.5% of the series).\n- **What remains real.** Patent expiries all but stop from July 1995 and resume in July 1999 (the chart; measured in\n  5.4). Australia raised the standard patent term from 16 to 20 years on 1 July 1995, for every patent still\n  in force, so patents filed from July 1979 expired four years later than they would have. The policy register now\n  holds this change, checked against the Act (the Patents (World Trade Organization Amendments) Act 1994), and its\n  note on the Patents Act 1990, which said the 1990 Act brought in 20-year patents, is corrected: the 1990 Act's term\n  was 16 years.\n- The rights lens keeps every right; only counts by year of filing are affected. Section 1's note is corrected (U5).", "cell": 204}, {"id": "U24", "lens": "timeline", "title": "The shape of the monthly counts, FY2017 to FY2026.", "body": "- **Steadiest:** standard patent applications from overseas (median 2,310 a month; a standard deviation 0.08 of the\n  mean), trade mark cessations (0.12), design cessations (0.14) and trade mark applications (0.15 from Australian and\n  overseas applicants alike).\n- **Most variable:** second-tier patents (1.82, from the rush to file before their closure and the near-silence\n  after), plant breeder's rights granted (0.79), extensions of term (0.72) and design lapses (0.69).\n- **Outliers** (the box-plot rule): 12 months each for provisional applications (the rise of 2025 and 2026) and\n  second-tier patents (2021), 7 for patent cessations (a pause in February 2020, 5.5) and 7 for plant breeder's\n  rights granted.\n- **Small series:** patent oppositions (median 5 a month; 2.5% of months none), extensions of term (5; 7.5% none) and\n  plant breeder's rights granted (13.5; 0.83% none). The \"origin unknown\" series are mostly zero (95.83% of months for\n  standard patents, 45.83% for trade marks), as they should be once origins are recorded.\n- **Decision:** in Stage 2, series with a median under 10 a month are compared by quarter or year, not by month.", "cell": 204}, {"id": "U25", "lens": "timeline", "title": "Growth has slowed for standard patents and quickened for trade marks and designs.", "body": "- **Standard patents:** 2,926 applications in 1930, 3,748 in 1950, 13,160 in 1970 and 14,990 in 1990, then 21,995\n  (2000), 32,399 (2021, the highest) and 30,448 (2025). Average growth per year: 3.9% in the 1990s, 1.3% from 2000 to\n  2010, 2.0% from 2010 to 2019 and 0.4% from 2019 to 2025. Overseas applicants set the pace (4.2%, 1.2%, 2.1% and\n  0.3%); Australian applications grew 1.1%, 2.3%, 1.0% and 1.1% a year.\n- **Trade marks:** 22,028 (1990) to 97,343 (2025), growing 6.9%, 3.3%, 2.7% and 4.3% a year. In the chart, applications\n  from Australians stay above those from overseas throughout.\n- **Designs:** 4,190 (1990) to 10,303 (2025): 0.2%, 3.2%, 2.7% and 5.5% a year. In the chart, the growth is almost all\n  from overseas applicants; Australians' applications stay near 2,000 to 2,700 a year.\n- **Provisional applications:** 7,434 in 2000, falling 2.6% and 1.5% a year to 4,036 in 2022, then 6,874 in 2025\n  (U8 has the rise of FY2026).\n- **Second-tier patents:** 276 (1990), 7,833 (2021) and 52 (2025): the closure (5.4).\n- **Plant breeder's rights:** 134 (1990) and 350 (2000), then 264 to 374 a year (10.1% a year in the 1990s, about\n  −1% since).\n- **Falls:** in 2009, standard patents fell 10.9% (26,598 to 23,707), designs 15.2% (6,060 to 5,136) and trade marks\n  4.5% (59,271 to 56,612), the year after the global financial crisis began; in 2022, trade marks fell 11.2% from the\n  2021 peak (88,751 to 78,844).", "cell": 207}, {"id": "U26", "lens": "timeline", "title": "Australians file less in January; the office has rhythms of its own.", "body": "- **January is the quiet month for Australian filers** (2010 to 2019): standard patents 75% of an ordinary month,\n  provisional applications 70%, trade marks 75%, designs 66% and plant breeder's rights 71%. Overseas applicants barely\n  pause: 95% for standard patents, 90% for trade marks and 95% for designs.\n- **The lull is deepening for patents:** January's share for Australian standard patents was 80 (1990s), 78, 75 and\n  73 (2020 to 2025); for provisional applications 73, 72, 70 and 63. For Australian trade marks it is steady (77, 79,\n  75, 77).\n- Australian trade marks also dip in December (82) and peak in August (115).\n- **The office's output has its own calendar:** trade mark registrations run at 133% of an ordinary month in January\n  and 68% in December; patent grants at 56% in April and 80% in December. These follow the office's working days and\n  processing, not demand.\n- **Plant breeder's rights granted** cluster in some months (September 170, March 91 against January 47, February 45\n  and July 51): quarters, not months, are the unit (U24).\n- **Decision:** in Stage 2, months are compared with the same month a year earlier, or as 12-month totals, never with\n  the month before.", "cell": 210}, {"id": "U27", "lens": "timeline", "title": "Outcomes over time.", "body": "- **Patent grants** peaked in 2016 (25,687), three years after the rush to file before Raising the Bar (5.4), and\n  were 15,739 in 2023 and 19,612 in 2025.\n- **Trade mark registrations** rose from 19,578 (1996) to 70,634 (2021, the peak) and 70,616 (2025).\n- **Lapses** (applications that ended): patents peaked in 2010 (13,945) and were 12,294 in 2025; trade marks peaked\n  in 2017 (19,767).\n- **Cessations** (registered rights let go) rose for trade marks from 7,240 (1996) to 35,484 (2025, the peak), and for\n  patents from 8,202 to 18,919 (2021, the peak) and 15,244 (2025). Design cessations were 6,218 to 6,612 in each year\n  shown since 2016.\n- **Expiries** of patents rose from 30 (1996) and 861 (2000) to 4,019 (2025), as patents filed under the 20-year term\n  reach it (U23).\n- **Ownership transfers:** trade mark assignments rose from 9,389 (1996) to 18,370 (2019, the peak); patent\n  assignments from 1,802 to 6,015 (2015, the peak), and 3,910 in 2025.\n- **Oppositions:** trade marks 824 (1996) to 2,309 (2025, the peak); patents 50 to 112 in the years shown since 2005,\n  and 154 at their peak (2015).\n- **Extensions of term** for pharmaceutical patents peaked at 114 in 2000, the first full year of the 1999 regime,\n  and have run at 14 to 76 a year since.\n- **A lead:** trade mark cessations fell from 7,847 (2000) to 3,773 (2002), while lapses rose from 8,026 to 16,718 and\n  registrations from 18,310 to 29,902. The events attachment (B5) can show when in each mark's life these fall\n  (a quirk of recording, or a group of marks reaching renewal); whether the Trade Marks Act 1995 changed them is a\n  before-and-after question for Stage 2.", "cell": 213}, {"id": "U28", "lens": "timeline", "title": "Four kinds of response, and changes with none visible.", "body": "All compare the average month in the\n12 months after a change's month with the 12 months before; trends and seasons are not allowed for.\n- **Rushes to file before a change.** Raising the Bar (April 2013): 1,018 standard patent applications from\n  Australians (4.39 times their average month in the year before) and 5,407 from overseas (2.66 times); in the year\n  after, 34.0% and 7.6% fewer a month. The innovation patent's closure (August 2021): 2,789 applications (4.31 times),\n  then 95.9% fewer (26.25 a month). Anticipation shows after each enactment: second-tier applications rose 176.4% in\n  the year after the phase-out was enacted, and Australian standard patents 45.3% in the year after Raising the Bar\n  was.\n- **Steps.** Patent expiries fell 98.4% (289.5 to 4.67 a month) when the term rose to 20 years. Extensions of term\n  went from 0.08 a month to 11.17 under the 1999 regime (60 in December 1999, the chart). Second-tier applications\n  rose 71.5% (50.58 to 86.75 a month) when the innovation patent replaced the petty patent. Under the Designs Act\n  2003, design applications from overseas rose 34.1% and registrations 24.5%; Australians' applications 6.5%.\n- **Pauses at commencement.** The Trade Marks Act 1995: no trade mark registrations in January 1996, 4,021 in March\n  (5.5), and Australians' applications at 0.49 times their usual month in January 1996; assignments published rose\n  79.3%. The Patents Act 1990: 113 patent grants in June 1991, against about 1,025 a month (5.5).\n- **None visible:** Australia joining the PCT (March 1980; entries through it come about 30 months after filing\n  abroad); the plain packaging of tobacco (Australian trade marks −3.9%, overseas +5.2%, and no series counts tobacco\n  marks); the Productivity Commission responses of 2018 and 2019 (trade mark oppositions +3.1%); the designs grace\n  period (2022: Australians −16.5%, overseas +0.2%). Overseas trade marks fell 16.4% in the year after Australia\n  joined the Madrid Protocol (July 2001), but the chart shows them falling from early 2000. Plant breeder's rights\n  applications rose 22% after the 1994 Act, on 21 to 25 a month: too few to read.\n- **Decision:** Stage 2's candidates are the two rushes, the four steps and the two pauses, each with placebo dates.\n  The register still lacks fee changes (R3), the other lever IP Australia holds.", "cell": 216}, {"id": "U29", "lens": "timeline", "title": "What still stands out, and what it is.", "body": "The table lists 42 months in 12 series.\n- **Rushes, kept:** April 2013 (Australian standard patents, 5.36 times the median of the two years around it) and\n  August 2021 (second-tier patents, 6 times). They are the policy responses of U28.\n- **The register's first months:** standard patents of unknown origin run at 0 to 35 a month from January to May 1904\n  and 394 in June 1904. Applications could be lodged from February 1904, before the Patents Act 1903 took effect on\n  1 June 1904, so the months before June are a start-up, best left out of any comparison.\n- **Pauses and their backlogs, kept:** patent grants in June 1991 (113, after the Patents Act 1990 commenced) and in\n  October and November 1998 (248, then 3,373); trade mark registrations in January and March 1996 (0, then 4,021, the\n  Trade Marks Act 1995); patent cessations in December 2006 (82) and February 2020 (7). February 2020 is also the\n  month the innovation patent's phase-out was enacted, but the pause is in cessations of every kind of patent, so\n  nothing in the data links the two.\n- **Single low months in steady series:** trade mark registrations in January 1987 (151) and September 1991 (339),\n  design registrations in January 1992 (77), trade mark lapses in October 1986, August 1987 and April 1996 (122, 94\n  and 243), and patent assignments in February 1992, August 1998, January 2000 and March 2026 (42 to 75); patent\n  assignments were also high in June 1994 (347).\n- **A recurring low:** design lapses fall to 0 to 16 in April in six of the seven years from 1996 to 2002, and to 0 in\n  October 2002, in a series of 59 to 76 a month. A lead, too small to matter elsewhere.\n- **The origin field, not the count:** trade marks of unknown origin fall to 14 to 40 a month from November 1983 to\n  May 1984 (and 87 in July 1985), against about 240. Australian and overseas trade marks are not flagged in those\n  months, so what changed is the origin recorded.\n- **An effect of the method:** patent expiries in February 1995 (240, 3.22 times) stand out only because the two years\n  around them include the near-empty months after July 1995 (U23).\n- **A transfer of many patents at once:** patent assignments in July 2015 (1,603, 4.2 times the median), published\n  over the month's five weekly issues (395, 646, 325, 163 and 73); the patents assigned on 2 July 2015 are now held\n  mostly in Finland (198) and the United States (170). One transfer of a portfolio fits this; the data do not name it.\n- **Decision:** no further months are removed. Stage 2 pools each pause with its backlog (for example, patent\n  cessations in February and March 2020) or uses 12-month totals; rushes are studied, not removed; the months before\n  June 1904 are left out.", "cell": 219}, {"id": "U30", "lens": "timeline", "title": "The CPI is complete, quarterly, from 1948.", "body": "- 312 quarters, from the September quarter 1948 to the June quarter 2026, with none missing.\n- Its base is the month of September 2025 (= 100), as the ABS labels it. A quarter is the average of its three months\n  (July to September 2025: 99.63, 99.55 and 100.0), so the September quarter 2025 is 99.73.\n- Prices rose about 40-fold: from 2.59 (September quarter 1948) to 102.31 (June quarter 2026).\n- The median change over four quarters was 3.0% from 1949 to 1969 (highest 25.6%, to the December quarter 1951), 8.7%\n  from 1970 to 1989 (17.5%, March quarter 1975), 2.3% from 1990 to 2019 and 3.6% from 2020 to 2026 (7.9%, December\n  quarter 2022). Prices fell in 13 quarters.\n- **Decision:** money series are deflated with this quarterly index, and shown as recorded beside it, with the base\n  stated. `abs_prices` also holds the monthly CPI from April 2024 (29 months); it is not attached, as one series\n  must serve the whole span.", "cell": 222}, {"id": "U31", "lens": "rights", "title": "The new columns rest on five checks of IP RAPID as published (ADR 0015).", "body": "- **No grant column.** A patent's grant event falls on its `registered_date` for 99.99% of granted patents.\n- **Assignments are counted once.** 99.78% of patents with an assignment have it published twice, as an assignment and\n  as a party change; the lens counts the first.\n- **Only standing events.** 4.76% of patent lapse events are not standing, and 60.47% of the patents with one are now\n  granted, expired or ceased: the lapse was reversed.\n- **When a term starts.** Of ceased trade marks whose earliest filing date differs from their application date (mostly\n  Madrid marks), 92.19% end a whole number of years after the earliest filing date and 1.65% after the application date,\n  so a trade mark's term runs from its earliest filing date. 84.59% of standard patents ceased since 1996 end 6 to 7\n  months after an anniversary of their date of patent, at the end of the grace period, so a patent's years in force\n  include it.\n- **When ends are complete.** Trade marks' recorded ends fall from 3,213 in March 2026 to 776 in April and 0 from May;\n  designs' from 627 in March 2026 to 251 to 399 a month from April; patents run at 1,442 to 1,820 a month throughout.\n  Trade marks and designs are therefore observed to 31 March 2026, patents and plant breeder's rights to 22 October\n  2026.\n- **Left out:** 3,154 events dated 1 January 1970 (a placeholder), and 171 dated before the right's earliest filing (26\n  of them trade mark oppositions dated 1909).", "cell": 77}, {"id": "U32", "lens": "rights", "title": "Each milestone is recorded from a different date, so shares compare only within those years.", "body": "- **Standard patents:** examination requests are recorded for 0.27% of those filed in the 1970s and 54.21% of the 1980s'\n  (the chart: they rise through the early 1980s), then 85.5% to 91.2% a decade; acceptances from patents filed in about\n  1979, as their other outcomes are (ADR 0014).\n- **Trade marks:** acceptances for 0.26% of marks filed in the 1970s, 30.88% in the 1980s and 75.88% to 79.05% since\n  2000.\n- **Designs:** examination requests only from 2013, so 7.05% of designs filed in the 2010s have one but 15.56% were\n  certified. Certification is the better measure of a design's examination.\n- **Petty patents** filed FY1986 to FY1988 mostly have no acceptance recorded (the chart's dip), though many were\n  registered.\n- **Second-tier patents:** examination was requested for 19.52% to 21.97% of those filed each decade since 2000, and\n  13.99% to 16.97% were certified.\n- **Oppositions** reach 1.69% to 2.62% of the trade marks filed each decade since the 1990s and 0.11% to 0.31% of\n  standard patents (recorded from April 2003).", "cell": 77}, {"id": "U33", "lens": "rights", "title": "The steps take months to years, and the patent steps have lengthened and shortened.", "body": "Medians,\nby financial year of filing, among rights that reached the step:\n- **Standard patents, filing to examination request:** 192 days (FY2000), 652 (FY2005), 552 (FY2010), 309 (FY2015) and\n  553 (FY2021). For FY2013 it is 44 days: applicants asked for examination before Raising the Bar took effect on\n  15 April 2013, which kept their applications under the old law (the most common request date in the register is\n  12 April 2013).\n- **Standard patents, examination request to acceptance:** 408 days (FY1990), up to 755 (FY2006), then 422 to 516\n  since FY2014.\n- **Trade marks, filing to acceptance:** 666 days (FY1990), 270 (FY2000), and 52 to 184 from FY2005 to FY2021.\n- **Certification:** 123 to 208 days after grant for innovation patents and 73 to 276 days after registration for\n  designs (FY2005 to FY2021).\n- The latest years are still in progress, so their medians are understated.", "cell": 80}, {"id": "U34", "lens": "rights", "title": "More patent applicants ask for speed; trade mark requests fell in November 2018, a lead.", "body": "- **Expedited examination:** standard patents 1.87% of those examined (FY2005), 3.66% (FY2010), 6.65% (FY2015),\n  8.59% (FY2020) and 10.31% (FY2026); designs 2.48% to 4.05% since FY2015.\n- **Trade marks:** 16.67% to 19.69% of marks filed in FY2000 to FY2018 asked for expedited examination, against\n  3.08% to 3.97% since FY2020. Requests fell from 1,373 to 1,548 a month (July to October 2018) to 604 in November,\n  240 in December and 156 to 294 a month in 2019. November 2018 is when IP RAPID's trade mark records moved between\n  systems (its \"historical\" events are dated 10 November 2018), so the fall may be a change in recording, in practice,\n  or both. A lead for Stage 2; until then, trade mark shares are compared only on one side of November 2018.\n- **Oppositions:** 1.98% to 2.93% of accepted trade marks are opposed in the years shown (FY1990 to FY2024); standard\n  patents 0.92% (FY2005), falling to 0.14% to 0.38% since FY2015. In all, 44,744 trade marks, 1,802 standard patents\n  and 63 second-tier patents have been opposed.", "cell": 80}, {"id": "U35", "lens": "rights", "title": "About one in seven standard patents and one in five trade marks is assigned, and assignments fill most of the gap in `holder_changed` before FY2003 (U17).", "body": "- **How often:** standard patents filed in the 1990s 13.99% and the 2000s 15.1%; trade marks 20.63% and 18.1%; designs\n  10.05% and 10.16%; second-tier patents 5.47% and 6.1%. Newer rights have had less time to be assigned (the 2020s:\n  3.18% to 5.23%), and patents filed in the 1980s (5.1%) come before the assignment records are complete (ADR 0014).\n- **More than once:** 2.24% (1990s) and 2.31% (2000s) of standard patents; 6.74% and 4.4% of trade marks.\n- **The gap before FY2003.** From FY2003, where both are known, 83.02% to 97.07% of assigned standard patents have a\n  holder who is not the filer, and 64.68% to 74.66% of the patents whose holder changed have an assignment (the rest\n  changed without a recorded assignment; a change of name can also count as a change, U17). The assigned share runs on\n  smoothly across the gap: 14.48% (FY1995), 15.48% (FY2000), 15.4% (FY2002), 16.41% (FY2003).\n- **Decision:** for patents filed before FY2003, Stage 2 uses `assignment_count` as the measure of a change of owner,\n  labelled as covering about two-thirds of the changes `holder_changed` sees from FY2003.", "cell": 82}, {"id": "U36", "lens": "rights", "title": "Owners keep standard patents longer than they used to; about half of trade marks are renewed at ten years.", "body": "From the survival curves, by cohort (where the records are complete):\n- **Standard patents** (by year of the date of patent): the median years in force rose from 10.7 (1980s) and 11.5\n  (1990s) to 13.5 (2000s and 2010s). In force after 10 years: 54.3%, 56.3%, 71.2% and 70.9%; after 15 years: 28.3%,\n  32.1%, 43.7% and 44.1%; kept to just before the 20-year end: 12.9%, 15.5% and 21.3% (1980s to 2000s).\n- **Trade marks** (by earliest filing): 67.3% of those filed 1983 to 1989 were in force after 10 years (their first term\n  under the 1955 Act was 7 years), against 56.4% (1990s), 46.9% (2000s) and 47.5% (2010s). The median fell from 21 to 17\n  and then 10 years. A mark renewed once is rarely dropped before its next renewal.\n- **Designs:** under the Designs Act 2003 (5 years, renewable once), 64.8% of designs filed in the 2000s were renewed at\n  5 years, 58.0% in the 2010s and 61.8% so far in the 2020s. Older designs' curves step at about 1, 6, 11 and 16 years.\n- **Second-tier patents:** innovation patents 39.3% in force after 5 years (median 3.5 years); petty patents 70.7%\n  (median 6).\n- **Plant breeder's rights** have no steps (their fees are annual): 42.4% (1990s), 47.8% (2000s) and 59.7% (2010s) in\n  force after 10 years.\n- These are descriptive, and they are lifetimes on the register, not value. Stage 2 compares them by origin, applicant\n  and technology, within cohorts.", "cell": 85}, {"id": "U37", "lens": "rights", "title": "Extensions of term are rare and come in a 1999 wave and a steady flow since.", "body": "1,450 standard\npatents (0.24% of those granted) had their term extended. Grants of extension numbered 108 in 1999 and 114 in 2000 (the\nregime of 1999), against 1 to 30 a year in 1991 to 1998, and 14 to 76 a year since. Of the extended patents that have\nended, the median lasted 24.09 years (longest 25.01); 616 ended after more than 20 years, and 701 are still in force.", "cell": 85}, {"id": "U38", "lens": "rights", "title": "Trade marks in 2002 (U27): the fall in cessations is the gap between two Acts' first terms, and the rise in lapses follows the filing peak of 2000.", "body": "- **Cessations by age:** marks ceasing at 7 years (the first term under the Trade Marks Act 1955) numbered 4,045\n  (2000), 2,161 (2001), 14 (2002) and none after; those ceasing at 10 years (the first term under the 1995 Act) only\n  built up from 303 (2002) to 1,167 (2003) and 7,589 (2005). Later renewals held steady at 3,242 to 3,786 a year.\n- **Lapses by year of filing:** 10,247 of 2002's lapses are of marks filed in 2000 and 5,433 of marks filed in 2001.\n  Filings peaked in 2000 (42,907), and more of them lapsed (34.4%, against 27.8% to 32.7% in 1997 to 2003).\n- So the 2002 lead comes from the register's terms and the 2000 filing peak, not from processing. Stage 2 treats 2002\n  as a known feature of both series.", "cell": 88}, {"id": "U39", "lens": "rights", "title": "Design lapses in April, 1996 to 2002 (U29): how lapses were dated, not fewer lapses.", "body": "- Taking those seven years together, April holds 101 lapses dated on 32 days, against 365 to 671 dated on 56 to 91\n  days in every other month. Designs lapse a median 637.5 to 680 days after filing, the same in April (644).\n- Designs filed 21 months before April were no fewer (2,586, against 1,827 to 2,950), and every month of filing lost a\n  similar share of its designs to lapse (18.1% to 21.6%). The lapses that would fall in April are dated in other\n  months.\n- So monthly design lapses in those years are pooled across months in Stage 2 (as for other pauses, U29).", "cell": 88}, {"id": "U40", "lens": "rights", "title": "Placeholder dates are few and are handled.", "body": "1 January 1800, 1900 and 1970 appear on 7, 1 and\n3,154 of IP RAPID's 49.35 million events (all left out of the lens), on 8 and 26 of its 3.69 million links, and on 101\nand 4 of its 12.52 million parties' start dates. The parties attachment uses those start dates only to order a right's\nfounding applicants (ADR 0013), so at most 105 rows could be ordered first. The open item is closed for all three\ntables; the links attachment rechecks its own dates.", "cell": 90}, {"id": "U41", "lens": "firms", "title": "The lens is the firms that used one of five schemes, not all businesses, and its IP counts are lower bounds.", "body": "- **Who is in it:** 398,450 ABNs. 253,719 (63.68%) are in IP RAPID alone, 54,552 (13.69%) in AusTender alone, 50,790\n  (12.75%) linked to IP by IPLORD alone, 8,033 (2.02%) in the R&D Tax Incentive alone and 3,139 (0.79%) in the tax\n  transparency reports alone; the rest are in two or more. Rates computed on the lens are rates among these firms.\n- **Active ABNs** run from 47.02% of the IPLORD-only firms and 59.62% of the IP RAPID-only firms to 92.02% of the R&D\n  claimants and 95.35% of firms in both IP RAPID and the R&D Tax Incentive: many firms that once filed for IP have\n  since closed.\n- **Filer against holder:** where both ABNs are known, they differ for 2.17% of standard patents, 7.11% of trade marks\n  and 5.25% of designs; 6.04% to 7.25% of rights with a holder's ABN have no filer's ABN.\n- **IPLORD-only firms** used the IP system (to FY2020) but IP RAPID gives none of their rights an ABN, so their IP\n  counts are 0. IPLORD's own counts are not used: for the 152,683 ABNs with trade marks in both, 81.02% agree, but\n  IPLORD's 99th percentile is 7 times IP RAPID's, its total 1.84 times and its weighted total 0.42 times. They are\n  built differently.\n- **Coverage:** 63 ABNs are not in the ABR extract; 3,875 have no state; `first_seen` is missing for 6.88%.", "cell": 115}, {"id": "U42", "lens": "firms", "title": "Private companies dominate every source but AusTender.", "body": "Of each group's ABNs:\n- **Private companies** are 74.7% of all firms, 82.2% of IP filers, 94.5% of R&D claimants and 55.3% of government\n  suppliers. The R&D Tax Incentive is open to companies only, so it has no trusts, partnerships or sole traders (by its\n  rules, not by choice).\n- **Government suppliers** are the most varied: sole traders 16.2% (4.1% of IP filers) and trusts 12.9% (4.1%).\n- **Status:** 62.4% of private companies' ABNs are active, 71.8% of public companies' and 34.3% of partnerships'. Of\n  active ABNs, 79.5% of private companies and 55.1% of sole traders are registered for GST (a turnover of $75,000 or\n  more, roughly).", "cell": 118}, {"id": "U43", "lens": "firms", "title": "Firms are a median 13.6 years old on the record, with a spike at the ABN's start.", "body": "- Median 13.6 years, mean 16.32: a long tail of old companies (the oldest registered in 1817).\n- By the register that set the date: ASIC-registered companies a median 14.6 years; firms dated by GST 11.3; by the\n  ABN 18.4, of which 29.6% are truncated (first seen when ABNs began, so possibly older).\n- The most common first date is 1 November 1999, the ABN's start (5,279 firms, 1.42% of those dated): the hump at\n  about 27 years in the chart. 27,403 firms have no date.\n- **Decision:** Stage 2 uses age with `age_truncated`, and compares firms first seen from 2001 separately.", "cell": 121}, {"id": "U44", "lens": "firms", "title": "Most firms file once or twice; a few file most of the patents.", "body": "- **Standard patents:** 23,971 firms filed 183,989; the median firm filed 1, the 90th percentile 7, the most 3,811.\n  The top 1% of filing firms filed 55.3% of them.\n- **Trade marks:** 241,576 firms filed 883,165; median 1, 90th percentile 6; the top 1% filed 25.9%.\n- **Designs:** 12,554 firms filed 74,697 (top 1%: 35.8%); **provisional applications:** 24,905 firms (32.0%);\n  **second-tier patents:** 6,077 firms (12.2%).\n- **What firms hold now:** 260,292 firms hold 1,262,125 rights; 116,240 hold 430,305 rights in force (the top 1%\n  of those: 28.7%).\n- The spread is close to a straight line on log scales (the chart): a long tail, so Stage 2 uses medians, logs or\n  ranks for firm counts, never means alone.", "cell": 126}, {"id": "U45", "lens": "firms", "title": "The latest years' filers are less often linked to an ABN: a lead.", "body": "- Firms filing their first trade mark rose from 1,186 (FY1990) to 11,318 (FY2024), then fell to 8,741 (FY2025) and\n  7,384 (FY2026); first patent filers fell from 1,165 (FY2020) to 685 (FY2026).\n- But the share of Australian organisations' trade marks with a filer's ABN fell from 84.1% (FY2024) to 71.4%\n  (FY2025) and 59.9% (FY2026); for designs from 88.4% to 76.3%, for standard patents from 88.7% to 83.9%. So at least\n  part of the fall is in linking, not filing: ABNs may be attached late, or collected less.\n- **Decision:** firm-level filing by year is compared only to FY2024 until the cause is known (ADR 0016). It is a\n  question for IP Australia.", "cell": 126}, {"id": "U46", "lens": "firms", "title": "R&D claims are spread; contract value is concentrated in a few suppliers.", "body": "- **R&D Tax Incentive:** 18,718 firms (2021-22 to 2023-24); the median latest claim is $307,490, the 90th percentile\n  $1,996,666 and the largest $236,287,319; the top 1% claim 28.1%. 195 firms claimed $0 in their latest year.\n- **Tax transparency reports:** 6,602 firms, median latest income $201,600,950 (the reports cover $100 million or\n  more); 15 firms' latest income is under $100 million, from the reports' first years.\n- **AusTender:** 72,042 suppliers, a median 2 contracts and $110,000 in value; the top 1% hold 83.1% of the value and\n  55.9% of the contracts. 10 suppliers' totals are under $1.\n- Money is nominal: Stage 2 deflates by the CPI (U30) before comparing across years.", "cell": 129}, {"id": "U47", "lens": "firms", "title": "Filers and R&D claimants are more metropolitan and advantaged than firms in general; government suppliers less so.", "body": "- **State:** New South Wales has 35.9% of firms, 36.7% of IP filers and 36.3% of R&D claimants; Victoria 26.6%, 27.6%\n  and 27.8%. The ACT has 2.7% of firms but 9.7% of government suppliers.\n- **Remoteness:** 85.2% of firms are in major cities, 87.1% of IP filers, 89.9% of R&D claimants and 78.9% of\n  government suppliers.\n- **Advantage:** 34.0% of firms are in the most advantaged tenth of postcodes (decile 10), and 39.3% of R&D\n  claimants; 10.1% of firms are in the three least advantaged deciles.\n- An address is where the business is registered, often a head office or an accountant's: Stage 2 reads these as\n  where firms are registered, not where the work happens.", "cell": 132}, {"id": "U48", "lens": "regions", "title": "The lens covers 2,641 postal areas and 25,365,506 people; the filer's place differs from the holder's for about one right in fifteen.", "body": "- **Coverage:** SEIFA scores are missing for 17 areas (99.36% filled; 14 for the IEO), the Census medians for 1 to 34\n  areas (rent: 34 areas with no renters) and the share in major cities for 2; every count is complete.\n- **Filer against holder** (FY2017 to FY2026, both postcodes known): they differ for 6.05% of standard patents, 7.6% of\n  trade marks and 6.82% of designs. Filers' postcodes are filled slightly more often than holders' (26,661 standard\n  patents against 26,189).\n- **Who files:** individuals file 21.53% of standard patents, 24.97% of trade marks, 20.71% of designs, 41.07% of\n  provisional applications and 43.11% of second-tier patents. A rate per business counts organisations only.", "cell": 140}, {"id": "U49", "lens": "regions", "title": "One standard patent in eighteen is filed from a postcode that is not a postal area, most of them universities'.", "body": "- 94.45% of standard patents', 96.43% of trade marks' and 97.29% of designs' filer postcodes are postal areas.\n- **Post office box and large-volume ranges** (1000 to 1999 in New South Wales, 8000 to 9999 and others): 1.39% of\n  standard patents, 1.86% of trade marks. The largest, 1635 and 1235, are mostly individuals' (2% and 17% of their\n  patents and provisionals by organisations).\n- **Real codes with no residents,** in a delivery range and held by the ABR: 4.14% of standard patents and 4.71% of\n  provisionals, but 1.7% of trade marks. Of the twelve codes outside the postal areas with the most patents and\n  provisionals, seven are universities' (by the ABR's name for the largest filer with an ABN): 2052 (NewSouth\n  Innovations, 84.6% of its 749), 3800 (Monash University, 97.5% of 445), 2006 (the University of Sydney, 95.4% of\n  417), 3010 (the University of Melbourne, 87.2% of 352), 2109 (Macquarie University, 91.7% of 157), 5005 (the\n  University of Adelaide, 93.5% of 139) and 4072, the University of Queensland's postcode (360; its commercialisation\n  company UniQuest filed 6.1%, and most have no filer's ABN). Brisbane's and Sydney's GPOs (4001, 2001) are among the\n  rest.\n- Codes in no range, or held by no one: 0.02% or less.\n- **So** universities' patents are mostly missing from the postal-area counts (they stay in the state totals of the\n  `rights` lens). The `institutions` lens will count them directly; a lookup that places these codes waits for Stage 2\n  to show whether regional results are sensitive to them (ADR 0017).", "cell": 140}, {"id": "U50", "lens": "regions", "title": "Postal areas range from no residents to 129,883; a third have fewer than 1,000 people.", "body": "- **People:** median 3,508, a quarter under 690, the largest 129,883; 2 areas have no residents. The 818 areas with\n  fewer than 1,000 people hold 1.33% of the population.\n- **Businesses:** median 463 active GST-registered ABNs, a quarter under 116; skewed (skew 10.2), the largest 70,543.\n  295 areas have fewer than 50 (0.24% of people) and 579 fewer than 100 (0.8%).\n- **Business districts and industrial estates:** 18 areas have more businesses than residents (0.24% of people), such\n  as 6106 (12 people, 1,632 businesses) and 4009 (5 people, 640): per-person rates there are meaningless.", "cell": 144}, {"id": "U51", "lens": "regions", "title": "Most areas are outside the cities, most people and businesses inside; SEIFA deciles are tenths of areas, not of people.", "body": "- **Remoteness:** major cities have 37.7% of postal areas, 72.8% of people and 77.2% of businesses; remote and very\n  remote areas 11.9% of areas and 1.7% of people. By state, the median area has 8,011 people in New South Wales,\n  1,024 in Western Australia and 13,938 in the ACT, so an \"area\" means different things in different states.\n- **SEIFA:** each decile holds 262 or 263 postal areas: it ranks areas, not people, so decile 1 is the tenth of\n  postal areas, of any size, that are most disadvantaged. The disadvantage (IRSD) and economic resources (IER) scores\n  have a long tail of very disadvantaged areas (skew −1.4 and −1.3; lowest 492 and 510, against medians of 1,002).\n- **Census medians (2021 dollars):** personal income a median $754 a week (1% of areas under $425, the highest\n  $3,250); household income $1,495; rent $300; median age 43 (20 to 79).", "cell": 148}, {"id": "U52", "lens": "regions", "title": "Applications are concentrated in a few areas, and an area's patents are often one firm's.", "body": "- **Concentration:** the tenth of postal areas with the most standard patents (264) have 72.5% of them, but 29.2% of\n  people; for trade marks 60.8% (32.8% of people), designs 75.4%. (Corrected on 26 October 2026: 29.0% and 32.9%\n  before, when areas tied on their count were ordered as the lens file happened to hold them; ties now go by\n  postcode.) 1,166 areas filed no standard patent in ten years,\n  330 no trade mark.\n- **One filer:** in 2113 (North Ryde), 76.3% of 1,708 standard patents are Aristocrat Technologies'; in 2601\n  (Canberra), 88.1% of 521 are CSIRO's; in 2153, 64.1% of 220 are ResMed's; in 2010, 48.4% are Canva's; in 2015,\n  35.9% are Breville's. In the city centres (2000, 3000, 4000, 6000) the largest filer has 5.2% to 14.6%, and 15.0% to\n  39.4% of their standard patents have no filer's ABN.\n- **So** a postal area's patent count is often one firm's patent count. Stage 2 reads area counts beside the firms\n  behind them.", "cell": 152}, {"id": "U53", "lens": "regions", "title": "Areas differ far more than chance would make them; rates are shown where they mean something.", "body": "- **The funnels:** at the national rate (18.69 trade marks and 0.99 standard patents a year per 10,000 people), chance\n  would put 2.5% of areas above and 2.5% below the 95% limits. Instead 15.0% are above and 71.4% below for trade marks,\n  6.7% and 68.2% for standard patents. Most areas file less than the nation, and a few file far more.\n- **Pooled into 335 SA3s** the pattern holds (15.5% above, 72.5% below for standard patents), so it is not small-area\n  noise. Stage 2 models these counts with room for that spread (negative binomial, not Poisson).\n- **Rates shown** (ADR 0017): standard patents per person for 850 areas (82.73% of people), trade marks for 2,094\n  (99.46%), designs for 812 (81.16%); per business, 650, 2,048 and 608. 324 of the 335 SA3s would expect 10 or more standard\n  patents (99.8% of people).\n- **Medians and extremes:** trade marks a median 8.48 a year per 10,000 people (90th percentile 32.61) and 4.35 per\n  1,000 businesses. The highest per person is 2000, Sydney's centre (712.6, with 27,940 residents and 70,543\n  businesses); per business it is 26.4 there. For standard patents 2113 is highest (61.8 per 10,000 people).", "cell": 156}, {"id": "U54", "lens": "regions", "title": "Half of R&D claimants have never filed IP, and claimants are rarer outside the cities.", "body": "- 17,627 active claimants are placed in a postal area; 50.7% have never filed IP as a founding applicant with an ABN\n  (a lower bound on use, as firms' IP counts are, U41). They are in 1,436 areas; the tenth of areas with the most hold\n  69.0%.\n- **By remoteness:** 5.6 claimants per 1,000 businesses in major cities, 2.4 in inner regional, 1.8 in outer regional,\n  1.3 in remote and 0.6 in very remote areas; IP-filing firms 49.7 per 1,000 in the cities against 19.0 to 29.3\n  elsewhere. Claimants outside the cities have more often never filed IP (59.6% in outer regional areas, against\n  50.4% in the cities).\n- These are counts by the ABR's main business address: a head office, not necessarily where the R&D is done (U47).", "cell": 159}, {"id": "U55", "lens": "regions", "title": "The attachments hold 22,511,923 values: 8,874 indicator-periods from five sources, nearly every one for nearly every postal area.", "body": "- **Census:** 2,993 cells of 14 tables (2021), 99.43% of them counts. **Data by Region:** 774 items in 12 years (2011\n  to 2025; 2,497 item-years), 57.43% counts. **PHIDU:** 2,368 indicators over 22 periods, 45.86% counts. **CABEE:** 260\n  business counts for June 2023, 2024 and 2025. **Clean Energy Regulator:** 11 series over 26 years.\n- The median indicator reaches 2,634 to 2,641 of the 2,641 postal areas (the CER's 2,559). 0.05% of Data by Region's\n  values and 0.11% of PHIDU's are empty: levels whose only overlapping areas share no residents with the postal area.", "cell": 163}, {"id": "U56", "lens": "regions", "title": "Split values track the direct ones; CABEE counts a quarter fewer businesses than the ABR, in the same order.", "body": "- **People:** the Census's count (25,369,823) is the ASGS count (25,365,506) to within 0.02%, the gap being the ABS's\n  perturbation. Data by Region's 2021 estimated resident population, split from SA2s, is 1.3% higher in total (it\n  adds people the Census missed), and within 10% of the ASGS count for 99.34% of postal areas of 1,000 people or more\n  (Spearman 0.9999).\n- **Businesses:** CABEE's June 2025 count (2,713,177) is 0.742 of the ABR's active GST-registered ABNs (3,657,678);\n  the median area's ratio is 0.749 and only 2.96% of areas are within 10%, but the two rank areas almost alike\n  (Spearman 0.988). They count different things (businesses actively trading, against registrations), so a CABEE\n  count is never compared with an ABR count. Its employment and turnover tables give the same total (ratio 1.000).\n- **So** the residents-weighted split is sound for people. For businesses by postal area, the ABR (`active_gst_abns`)\n  is the count; CABEE's value is its split by size and industry, which the ABR lacks.", "cell": 163}, {"id": "U57", "lens": "regions", "title": "Many Census cells are small, and parts do not add exactly to totals.", "body": "- The detailed tables are mostly small numbers: half of the industry-by-age-by-sex cells (G54) are 0 (51.1%, median\n  0), 39.4% of the field-of-study cells (G50) and 37.4% of the occupation cells (G60); 3.0% to 8.3% of each table's\n  cells are 1 to 4. The summary tables are larger (G01 median 153, G43 221).\n- **Perturbation:** males plus females equal persons exactly in only 10.9% of postal areas (the largest gap 10). The\n  ABS adjusts small cells at random to protect privacy, so Stage 2 uses Census shares of whole groups, never single\n  small cells, and never checks parts against totals exactly.", "cell": 166}, {"id": "U58", "lens": "regions", "title": "Data by Region is a different set of items each year, and repeats the Census.", "body": "- Census years carry the most (225 items in 2011, 385 in 2016, 629 in 2021); other years 12 to 326. Its largest\n  topics are the estimated resident population (111 items, 2020 to 2025), Aboriginal and Torres Strait Islander\n  peoples (52), people born overseas (50) and personal income (29, 2019 to 2023, from tax returns).\n- Industry of employment, labour force status and others come from the 2011, 2016 and 2021 Censuses: for 2021, they\n  repeat the Census source, so the two are never added together.", "cell": 166}, {"id": "U59", "lens": "regions", "title": "Most businesses employ no one, and the share is rising.", "body": "In the lens's postal areas, CABEE\ncounts 2,574,558 businesses in June 2023 and 2,713,177 in June 2025. Non-employing businesses rose from 61.3% to\n63.6%; those with 1 to 4 employees fell from 27.2% to 25.3%; 200 or more employees are 0.1% (2,729 to 3,224). SA2s with\nno residents hold 0.05% of businesses (40 SA2s), so the mesh-block fallback matters little.", "cell": 171}, {"id": "U60", "lens": "regions", "title": "PHIDU's indicators are mostly rates for different periods.", "body": "54.14% of its indicators are levels,\nmostly standardised ratios (SR, 100 = the national rate after allowing for age) and percentages; the counts are mostly\nnumbers of people. Periods differ by indicator: 702 indicators are for 2022/23, 359 for 2021, 234 for the 2024\nestimated population, 225 for 2019 to 2023. Comparisons use one period at a time.", "cell": 171}, {"id": "U61", "lens": "regions", "title": "Small-scale energy installations moved from solar water heaters to solar panels to batteries.", "body": "Solar water heaters: 122,312 installations in 2009, 18,505 in 2025. Solar panels: 62,831 in 2009, 360,423 in 2011,\n370,287 in 2020, 272,395 in 2025. Heat pump water heaters: 131,881 in 2023. Batteries are recorded from July 2025:\n207,305 in its last six months and 339,457 in 2026 to September. 0.1% of installations are at postcodes that are not\npostal areas.", "cell": 171}, {"id": "U62", "lens": "regions", "title": "Government contracts are concentrated where suppliers have their offices, above all the ACT.", "body": "Contracts first published in FY2017 to FY2026: 54,798 suppliers, 521,968 contracts and $590,440,993,686 (nominal,\nover each contract's life) in 2,015 postal areas; the top 1% of areas hold 68.4% of the value and 51.1% of the\ncontracts. The ACT has 27.0% of the contracts and 20.5% of the value against 1.3% of businesses; South Australia 12.2%\nof the value against 6.1%. A supplier's postcode is often its head office, so these are where contracts are\naddressed, not where the work is done.", "cell": 171}, {"id": "U63", "lens": "national", "title": "The core holds 30 indicators for 229 places from 1960 to 2025; Australia's series are complete except for R&D people and spending.", "body": "- **Rows:** 135,597. The World Bank's 113,147 (217 countries), WIPO's 19,296 (201 countries, 6 former states and the\n  unknown origin) and the OECD's 3,154 (47 countries).\n- **Australia's gaps:** researchers in R&D end in 2010 and technicians in 2008; the World Bank's R&D spending ends in\n  2021 (the OECD's runs to 2023); tertiary enrolment starts in 2015. Over 2000 to 2024 Australia has 20% of the years\n  for technicians, 24% for researchers and 40% for tertiary enrolment, against 44.2%, 81.4% and 82.8% of OECD\n  member-years.\n- **Across the OECD,** the least complete series are technicians in R&D (44.2% of member-years), trade mark\n  applications (65.8%) and new business registrations (68.2%).", "cell": 177}, {"id": "U64", "lens": "national", "title": "Before 1995 WIPO cannot say where most applicants come from, so its counts by country are floors.", "body": "- Of WIPO's patent applications by origin (all offices), 34.35% had an unknown origin in 1980, 29.02% in 1990 and\n  32.24% in 1993, then 9.0% in 1994 and 1.12% in 2024. Former states held 22.59% in 1980 (the Soviet Union 1,729,188\n  applications to 1991).\n- **Australia's own series show the gap.** Australians' applications at every office were barely more than those at\n  home until 1993 (1,723 against 1,712 in 1990), then 4,351 in 1994; WIPO's patent grants to Australian residents were\n  2 to 6 a year in 1990 to 1993 and 1,451 in 1994; designs 1 a year in 1991 to 1993 and 266 in 1994.\n- **So** WIPO's series by country are compared from 1995 only (1994 at the earliest). Former states are never added\n  to their successors.", "cell": 177}, {"id": "U65", "lens": "national", "title": "Australia's R&D intensity rose to 2008 and has fallen since, below the OECD median; its manufacturing share fell twice as fast as the median member's.", "body": "- **Business R&D (BERD):** 0.50% of GDP in 1990, 1.37% in 2008, 1.00% in 2015 and 0.91% in 2023, against an OECD\n  median of 0.80%, 0.95%, 0.99% and 1.18%. **Gross R&D (GERD):** 1.26%, 2.24%, 1.87% and 1.68%, against 1.42%, 1.57%,\n  1.78% and 1.85%.\n- **Manufacturing:** 13.7% of GDP in 1990, 5.32% in 2025 (down 61%); the median member's 18.29% to 12.79% (down 30%).\n  **Exports:** 15.09% to 23.24% of GDP; the median's 26.76% to 45.37%.\n- **IP royalties:** Australia pays more for others' IP than it earns from its own in every year shown: payments $826\n  million (1990) to $12.4 billion (2025), receipts $162 million to $7.4 billion (current US dollars).\n- **Patents:** non-resident applications in Australia rose from 13,280 (1990) to 29,010 (2023) while the median\n  member's fell from 2,416 to 479 (Europe's offices hand much of that work to the European Patent Office); resident\n  applications rose from 1,712 to 2,511 against a falling median (1,868 to 1,028).\n- **Two series breaks to read past:** the share of the labour force with advanced education steps up to 86.33% in\n  2010 (80.42% in 2008, 82.09% in 2015), a jump the OECD median does not show; and net foreign direct investment was\n  −3.6% of GDP in 2005, a single year.", "cell": 179}, {"id": "U66", "lens": "national", "title": "Among OECD members Australia is near the top for filings from abroad and new businesses, and near the bottom for exports, manufacturing and business R&D.", "body": "- **Top:** new businesses registered (2nd of 30; 316,561 in 2024), non-resident patent applications (5th of 38;\n  27,945 against a median member's 425), non-resident trade mark classes (5th of 34), new business density (4th of 30;\n  18.06 per 1,000 people aged 15 to 64, median 5.83) and tertiary enrolment (4th of 22).\n- **Bottom:** exports of goods and services (34th of 35; 23.24% of GDP, median 45.37%), manufacturing (31st of 32;\n  5.32%, median 12.79%), business R&D (26th of 35; 0.91% of GDP, median 1.18%) and gross R&D (21st of 35; 1.68%,\n  median 1.85%).\n- **Counts rank by size:** Australia's population is 14th of 38 and its GDP 13th, so its counts of filings, articles\n  and royalties sit around the 60th to 75th percentile for
