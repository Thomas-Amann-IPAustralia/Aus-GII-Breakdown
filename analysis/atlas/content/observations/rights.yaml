    - "From FY2003, 64.68% to 74.66% of patents whose holder changed have an assignment. The assigned share runs on
      smoothly across FY2003 (15.4% in FY2002, 16.41% in FY2003): assignments were recorded consistently, but that
      does not show what share of earlier changes they capture."
    - "**Decision.** For patents filed before FY2003, Stage 2 uses assignments as an indicator of a change of owner,
      labelled incomplete: from FY2003 about two-thirds of recorded changes have one, and for earlier patents the
      share is unknown."
  questions:
    - q: 1
      how: An assignment can be a sale, which would show that a right is worth something to someone; the data do not
        say which assignments are sales.
    - q: 3
      how: Licensing and sale are routes to value that Q3 asks about.
  sources: [iprapid]
  chart: U35
  notebook_charts: [0]
  prep:
    - what: Assignments are counted from the register's ownership events, each once a day.
      why: The register publishes each patent assignment twice ({U31}).
  steps:
    - For each type and decade of filing, work out the share with at least one assignment.
    - For standard patents by year, compare the assigned share with the share whose holder changed.
    - "Check that the share with a recorded transfer has no break at 2002–03, where the history of owners begins."
  assumptions:
    - A recorded assignment is a change of owner.
  limits:
