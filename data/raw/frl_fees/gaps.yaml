        changes: {standard_examination: 290, sealing: null, standard_renewal_3: null, standard_renewal_4: null}
      - date: 2001-05-24
        instrument: F2001B00155
        provision: "SR 2001 No. 98, Schedule 1: innovation patent items inserted (petty patents end with the Patents Amendment (Innovation Patents) Act 2000)"
