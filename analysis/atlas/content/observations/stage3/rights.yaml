      - name: Held together
        colour: 0
        data: [[5.6, 4.6, 6.7], [2.8, 2.2, 3.4], [4.3, 2.8, 5.9], [2.2, 1.2, 3.3], [2.6, 1.5, 3.7], [0.05, -0.8, 0.9]]
