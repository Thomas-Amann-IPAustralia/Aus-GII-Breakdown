# Stage 3, the IP rights lens (section 1 of the multivariate notebook). Markup and rules as in ../firms.yaml: every
# number in a headline, statement, figure, point, verdict row, revisit or quoted chart must be on the notebook's page
# (the observation or the outputs above it). Stage 3 holds Stage 2's named third factors together in one model;
# nothing here is a cause. `revisits` names the earlier observations each page tests, with Stage 3's outcome for each
# (copied onto those pages by the build); `held` lists what was held together; `verdicts` gives each comparison.

- id: M1
  lens: rights
  about: system
  headline: Patents filed without an attorney are still granted far less often once the factors settled at filing are held together
  statement: >-
    Australian individuals' standard patents filed alone are granted 31.2 [[percentage-point|points]] less often
    than those filed with an attorney once the route, filing year, state and co-filers are [[held-together|held
    together]] (FY2010 to FY2019), against 35.8 points with nothing held: 87.2% of Stage 2's gap remains, and 86.2% in
    the earlier decade. Trade marks filed alone show the same gap for individuals and organisations alike, almost
    untouched by what is held.
  figures:
    - value: "-31.2 points"
      label: Australian individuals' patents filed alone, FY2010 to FY2019, held together (raw -35.8)
    - value: "87.2%"
      label: of the raw gap left once held together (86.2% in FY2000 to FY2009)
    - value: "91.9% to 99.9%"
      label: of the trade mark gaps left, individuals and organisations, both decades
  points:
    - "**Australian organisations' patents** hold in FY2010 to FY2019 (-40.0 raw, -35.3 held together) but not in FY2000
      to FY2009, where neither the raw nor the held figure is detected (+6.0, interval -18.5 to 30.6). That decade's
      1,149 lone applications came from 392 filers, the ten largest filing 59.8% of them: a few heavy filers, perhaps
      with their own patent staff, though the data do not say who they were."
    - "**A second reading** among applications that have a technology field, holding the field and number of classes
      too: -27.2 and -27.8 points. Among examined applications: -30.5 and -29.1."
    - "**Not a few filers' doing.** The ten heaviest lone filers hold 0.8% to 10.1% of the lone filings in every group
      but the older organisations'; Australian individuals' 1,642 lone patent applications came from 1,370 filers."
    - "**Not a cause.** Only what is known at filing is held. The filer's resources, experience and the merit of the
      invention are not in the data, and an application dropped early may never appoint an attorney, so the arrow can
      run backwards."
  revisits:
    - id: B6
      signal: Filing alone and grant
      verdict: holds
      what: >-
        Australian individuals' patents filed alone: -31.2 points with the route, year, state and co-filers held
        together, against -35.8 raw (FY2010 to FY2019); -31.7 against -36.8 in FY2000 to FY2009. Trade marks hold for
        individuals and organisations. Australian organisations' patents hold in FY2010 to FY2019 only.
  held: [the route of filing, the filing year, the filer's state, several founding applicants, "trade marks: the class and number of classes", "a second reading: the technology field"]
  verdicts:
    - signal: Australian individuals' standard patents, FY2010 to FY2019
      detail: -35.8 raw, -31.2 held together (87.2% left)
      verdict: holds
    - signal: Australian individuals' standard patents, FY2000 to FY2009
      detail: -36.8 raw, -31.7 held together (86.2% left)
      verdict: holds
    - signal: Australian organisations' standard patents, FY2010 to FY2019
      detail: -40.0 raw, -35.3 held together
      verdict: holds
    - signal: Australian organisations' standard patents, FY2000 to FY2009
      detail: +6.0 raw, +6.0 held together; both intervals include zero
      verdict: not detected either way
    - signal: Trade marks, Australian individuals and organisations, both decades
      detail: -21.3 to -23.3 held together; 91.9% to 99.9% of the raw gap left
      verdict: holds
  chart:
    type: effect
    title: The grant gap for filing alone, raw and with the factors settled at filing held together
    subtitle: Share granted or registered, filed alone minus with an attorney, in percentage points, with 95% intervals clustered by the filer
    x: {values: ["Australian individuals' patents, FY2010 to FY2019", "Australian individuals' patents, FY2000 to FY2009", "Australian organisations' patents, FY2010 to FY2019", "Australian organisations' patents, FY2000 to FY2009", "Australian individuals' trade marks, FY2010 to FY2019", "Australian individuals' trade marks, FY2000 to FY2009", "Australian organisations' trade marks, FY2010 to FY2019", "Australian organisations' trade marks, FY2000 to FY2009"]}
    y: {name: Alone minus with an attorney (points), format: signed}
    ref: 0
    ref_label: no difference
    series:
      - name: Raw (as Stage 2 compared)
        colour: muted
        data: [[-35.8, -37.8, -33.8], [-36.8, -38.9, -34.8], [-40.0, -45.6, -34.4], [6.0, -30.2, 42.3], [-24.3, null, null], [-23.2, null, null], [-23.7, null, null], [-21.3, null, null]]
      - name: Held together
        colour: 0
        data: [[-31.2, -34.0, -28.4], [-31.7, -34.5, -29.0], [-35.3, -40.6, -30.0], [6.0, -18.5, 30.6], [-22.3, -23.2, -21.5], [-22.6, -23.8, -21.4], [-23.3, -24.1, -22.6], [-21.3, -22.2, -20.4]]
    source: IP Australia, IP RAPID (lens rights); notebook 3, section 1.1
    note: The trade marks' raw figures are quoted without intervals. A dot left of the dashed line means filing alone goes with fewer grants.
  questions:
    - q: 2
      how: Shows that the grant gap for individuals who file alone is not explained by the route, year, place or co-filers, so who files alone stays a candidate group for who benefits less.
    - q: 4
      how: Keeps representation as a signal worth a design that separates the choice of an attorney from the outcome (the first of Stage 3's early signals).
  sources: [iprapid]
  prep:
    - what: Decided standard patents and trade marks filed FY2000 to FY2019, filed alone or with an attorney (agents who are not attorneys left out, as in B6); trade marks capped at 200,000 a group and decade by a hash of the application number.
      why: Only decided applications have an outcome, and the cap keeps the models quick while the hash makes the sample the same on every run.
    - what: Each application is grouped by its [[filers-party|filer's party]], so a filer with many applications counts as one source of evidence in the intervals ([[clustered|clustered intervals]]).
      why: A firm's thousand applications are not a thousand independent cases.
  steps:
    - Take Stage 2's comparison (filed alone against with an attorney) as the raw figure.
    - Fit one model of the yes or no outcome (granted or not) with the route, filing year, state and co-filers held together, and report the difference as an [[average-marginal-effect|average difference in points]].
    - Compare the held figure with the raw one, and give the outcome by Stage 3's rule (holds if at least half remains and the interval is clear of zero).
    - Repeat in the earlier decade, among applications with a field (holding the field), and among examined applications.
  assumptions:
    - What is settled at filing (route, year, state, co-filers, trade mark classes) is not itself caused by the choice to file alone, so holding it does not hide part of the gap.
  limits:
    - The technology field is assigned as an application is classified, and an application abandoned early may never get one, so the field is held only in a second reading among applications that have one.
    - The filer's resources and experience, and the invention's merit, are not in the data; they could explain the gap.
  next: >-
    The first of Stage 3's early signals (with {M2}): a design that separates the choice of an attorney from the
    outcome, such as the same filers' applications with and without one, or a change in what representation costs.
  terms: [held-together, average-marginal-effect, clustered, filers-party, attorney, verdict-words]
  related: [B6, B5, M2]

- id: M2
  lens: rights
  about: system
  headline: Trade marks and designs with no agent before the first renewal are less often in force after it, once other factors are held
  statement: >-
    With no agent recorded before the first renewal, 31.7% of Australians' trade marks filed FY2010 to FY2015 were in
    force after 10 years, against 50.8% with an attorney. With the filer's type, class, state, route and cohort held
    together the gap is 14.4 points, 75.5% of the raw 19.1; within individuals and within organisations it holds more
    fully. Designs show the same at their five-year renewal, almost untouched by what is held.
  figures:
    - value: "-14.4 points"
      label: trade marks in force after 10 years, no agent against an attorney, held together (raw -19.1)
    - value: "75.5%"
      label: of the raw trade mark gap left (72.2% in FY2003 to FY2009)
    - value: "97.4% and 97.6%"
      label: of the design gap left, in the two halves
  points:
    - "**Within each type of filer** the gap holds more fully (85.3% to 94.6% left): individuals -11.8 and -12.0 points,
      organisations -15.1 and -10.8. Part of the pooled gap is who files alone: individuals, whose marks are less often
      in force either way (22.3% and 35.6% in FY2010 to FY2015)."
    - "**Designs after 5 years**, FY2010 to FY2019: 30.0% against 46.7%, -16.7 raw and -16.3 held together in the first
      half; 32.4% against 46.8%, -14.5 and -14.1 in the second."
    - "B10's raw figures are reproduced (31.7% against 50.8%)."
    - "**Not a cause.** An owner who means to let a mark go may not appoint an agent before the renewal, so the arrow can
      run backwards; and a share in force is not a renewal decision or value."
  revisits:
    - id: B10
      signal: No agent before the first renewal
      verdict: holds
      what: >-
        Trade marks in force after 10 years: -14.4 points held together against -19.1 raw (FY2010 to FY2015), and
        -11.0 against -15.3 (FY2003 to FY2009); designs after 5 years -16.3 and -14.1, almost all of the raw gap.
  held: [the filer's type, the class, the number of classes, the filer's state, several founding applicants, the route of filing, the cohort year]
  verdicts:
    - signal: Trade marks after 10 years, FY2010 to FY2015
      detail: -19.1 raw, -14.4 held together (75.5% left)
      verdict: holds
    - signal: Trade marks after 10 years, FY2003 to FY2009
      detail: -15.3 raw, -11.0 held together (72.2% left)
      verdict: holds
    - signal: Designs after 5 years, first half then second
      detail: -16.7 and -14.5 raw, -16.3 and -14.1 held together (97.4% and 97.6% left)
      verdict: holds
  chart:
    type: effect
    title: In force after the first renewal, no agent before it against an attorney
    subtitle: Difference in the share in force, in percentage points, raw and with the factors settled at filing held together; 95% intervals
    x: {values: ["Trade marks, FY2010 to FY2015", "Trade marks, FY2003 to FY2009", "Trade marks, individuals only (FY2010 to FY2015)", "Trade marks, organisations only (FY2010 to FY2015)", "Designs, FY2010 to FY2019, first half", "Designs, FY2010 to FY2019, second half"]}
    y: {name: No agent minus an attorney (percentage points), format: signed}
    ref: 0
    ref_label: no difference
    series:
      - name: Raw (as Stage 2 compared)
        colour: muted
        data: [[-19.1, -20.1, -18.0], [-15.3, null, null], null, null, [-16.7, -25.9, -7.5], [-14.5, null, null]]
      - name: Held together
        colour: 0
        data: [[-14.4, -15.4, -13.4], [-11.0, -12.1, -9.9], [-11.8, -13.3, -10.3], [-15.1, -16.3, -13.9], [-16.3, -20.6, -11.9], [-14.1, -18.8, -9.4]]
    source: IP Australia, IP RAPID (lens rights); notebook 3, section 1.2
    note: The rows for individuals and organisations hold the other factors within each type of filer; no raw figure is quoted for them.
  questions:
    - q: 2
      how: Shows that owners without an agent keep their marks and designs less often even at the same class, route and cohort, which bears on who gets value from a right.
    - q: 4
      how: Joins M1 in the first early signal, where representation is a candidate lever for an intervention.
  sources: [iprapid]
  prep:
    - what: B10's definitions (ADR 0041) are kept. A right counts if it was registered; its cohort is the financial year its term began; "no agent before the renewal" means filed alone or with an agent first recorded after the renewal fell due; it is compared with an attorney recorded before it.
      why: The same rights as Stage 2, so the raw figure is B10's and the held one differs only by what is held.
    - what: Designs are read in FY2010 to FY2019 only, in two halves, because design agents were recorded differently before FY2010 (B5).
      why: An earlier decade would mix a change in recording with the signal.
  steps:
    - For each right, a yes or no for being in force after the renewal (10 years for trade marks, 5 for designs).
    - Fit one model with the filer's type, class, number of classes, state, co-filers, route and cohort held together, clustered by the filer.
    - Compare the held difference with the raw one, then repeat within individuals and within organisations.
  assumptions:
    - Every cohort used has had the full time to its renewal, so no right is cut short.
  limits:
    - A share in force is not a renewal decision or a measure of value (U36).
    - Whether an agent was appointed before the renewal may follow from the owner's plans for the mark, not the other way round.
  next: >-
    With {M1}, the first early signal of Stage 3: worth a design that separates representation from what the owner
    meant to do with the right.
  terms: [held-together, average-marginal-effect, renewal, attorney, verdict-words]
  related: [B10, M1]

- id: M3
  lens: rights
  about: system
  headline: Within the same reach, Australian organisations' patents are less likely to end than overseas organisations', with field, route and cohort held
  statement: >-
    Among standard patents reaching the same number of patent offices, Australian organisations' are less likely to
    end in any year to 10 years than overseas organisations': [[hazard-ratio|hazard ratios]] of 0.648 to 0.811 with
    the field, route, cohort, co-filers and classes held together, in both halves. Among patents filed only in
    Australia the halves disagree, so Stage 2's "no difference" there is neither confirmed nor overturned.
  figures:
    - value: "0.648 to 0.710"
      label: hazard ratio, five or more offices, held together (below 1 means less likely to end)
    - value: "0.772 to 0.811"
      label: hazard ratio, two to four offices, held together
    - value: "22.3% against 4.6%"
      label: granted patents that are Australia only, Australian against overseas organisations (first half)
  points:
    - "**Five or more offices:** 0.728 raw and 0.710 held together in the first half; 0.666 and 0.648 in the second.
      **Two to four offices:** 0.750 and 0.811; 0.757 and 0.772. Both hold."
    - "**Australia only:** 1.100 and 0.959 in the first half, not detected either way; 0.896 and 0.730 in the second,
      which appears once held in that half only."
    - "**All reach bands with reach held:** 0.773 and 0.701 in the first half; in the provisional FY2005 to FY2009
      cohorts, 0.758."
    - "**Why reach has to be held:** 35.7% and 36.4% of Australian organisations' granted patents reach five or more
      offices, against 75.2% and 75.4% of overseas organisations'. A share in force is not value, private or public."
  revisits:
    - id: B8
      signal: Staying in force within reach bands
      verdict: holds
      what: >-
        Within the same reach, hazard ratios of 0.648 to 0.811 with field, route, cohort, co-filers and classes held
        together: Australian organisations' patents are less likely to end. Among Australia-only patents the halves
        disagree (0.959, then 0.730), so B8's "no difference" there is neither confirmed nor overturned.
  held: [family reach (in bands), the technology field, the route of filing, the cohort, several founding applicants, the number of classes]
  verdicts:
    - signal: Five or more offices, first half then second
      detail: 0.728 and 0.666 raw; 0.710 and 0.648 held together
      verdict: holds
    - signal: Two to four offices, first half then second
      detail: 0.750 and 0.757 raw; 0.811 and 0.772 held together
      verdict: holds
    - signal: Australia only, first half
      detail: 1.100 raw, 0.959 held together; both intervals include 1
      verdict: not detected either way
    - signal: Australia only, second half
      detail: 0.896 raw (interval includes 1), 0.730 held together (0.546 to 0.976)
      verdict: appears once held
  chart:
    type: effect
    title: How likely Australian organisations' patents are to end, against overseas organisations', at the same reach
    subtitle: Hazard ratios to 10 years (below 1 means less likely to end), date of patent FY2010 to FY2016, with 95% intervals clustered by the filer
    x: {values: ["Five or more offices, first half", "Five or more offices, second half", "Two to four offices, first half", "Two to four offices, second half", "Australia only, first half", "Australia only, second half", "All bands, reach held, first half", "All bands, reach held, second half"]}
    y: {name: "Hazard ratio, Australian against overseas organisations", format: ratio, digits: 2}
    ref: 1
    ref_label: equally likely to end
    series:
      - name: Raw (as Stage 2 compared, within the band)
        colour: muted
        data: [[0.728, 0.610, 0.868], [0.666, 0.551, 0.805], [0.750, 0.627, 0.899], [0.757, 0.639, 0.896], [1.100, 0.876, 1.382], [0.896, 0.712, 1.127], [0.773, 0.673, 0.887], null]
      - name: Held together
        colour: 0
        data: [[0.710, 0.590, 0.853], [0.648, 0.531, 0.790], [0.811, 0.674, 0.977], [0.772, 0.649, 0.917], [0.959, 0.732, 1.256], [0.730, 0.546, 0.976], [0.701, 0.610, 0.804], null]
    source: IP Australia, IP RAPID; Google Patents (lens rights); notebook 3, section 1.3
    note: The "all bands" row quotes the first half's figures only.
  questions:
    - q: 1
      how: One of three readings of how Australian organisations' patents are used (with reach and citations, M4), which disagree and must be read together, never alone.
  sources: [iprapid, google_patents]
  prep:
    - what: Granted standard patents with cohorts by the financial year of the date of patent, FY2010 to FY2016 (the latest that have reached 10 years), in two halves; FY2005 to FY2009 as a provisional third reading, since older families' reach is incomplete (B55).
      why: Reach is reliable from FY2010; a patent needs 10 years to be followed to 10 years.
    - what: Each patent joins the count at its grant ([[survival-curve|delayed entry]]) and is followed from its date of patent, as Stage 2's survival curves were (ADR 0041).
      why: A patent cannot end before it is granted, so counting it from grant keeps the comparison fair.
  steps:
    - Within each reach band (Australia only, two to four offices, five or more), compare Australian with overseas organisations' patents as a hazard ratio (raw).
    - Fit a proportional hazards model with the field, route, cohort, co-filers and classes held together, clustered by the filer.
    - Give each band's outcome, in each half; then all bands together with reach held.
  assumptions:
    - The share in force is read as the share still on the register (ADR 0041), not as value or a decision to renew.
  limits:
    - Reach is held in three bands only, so part of a gap within a band could still be reach.
    - A hazard ratio is not a difference in shares, so the raw figure here is not B8's percentages, though both read the same way.
  next: >-
    The second early signal (with {M4}): validate each of the three readings as a sign of value against licensing,
    litigation or sale, and read them side by side.
  terms: [hazard-ratio, held-together, survival-curve, patent-family, clustered, verdict-words]
  related: [B8, M4, B55]

- id: M4
  lens: rights
  about: system
  headline: Australian organisations' patents reach fewer offices and are cited less, and neither gap goes once field, route and year are held
  statement: >-
    Australian organisations' standard patents filed FY2010 to FY2019 are far more often filed only in Australia
    (40.9% against 8.2% of overseas organisations') and far less often in five or more offices (22.2% against 69.7%).
    With the field, route, year and the rest held together, the five-office gap holds (-31.9 points); the
    Australia-only gap weakens to +9.3. Within five years of priority they are cited 4.44 times on average against
    14.22: reach accounts for about three fifths of that gap, but about 27% to 30% fewer citations remain at the same
    reach, field, route and year.
  figures:
    - value: "-31.9 points"
      label: five or more offices, held together (raw -47.5)
    - value: "0.729"
      label: citations within five years, rate ratio with every factor held (raw 0.312)
    - value: "62% and 61%"
      label: of the raw citation gap accounted for by reach (on a log scale)
  points:
    - "**Filed only in Australia:** +32.7 points raw, +9.3 held together (28.4% left), first half; +32.2 and +10.2 in
      the second. Weakened."
    - "**Five or more offices:** -47.5 raw, -31.9 held (67.3% left); -46.4 and -31.4. Holds."
    - "**Citations within five years:** rate ratio 0.312 raw, 0.645 with reach held, 0.729 with every factor held; in
      the second half 0.307, 0.633 and 0.700. Weakened, but not gone."
    - "**Three readings that still disagree:** fewer offices and fewer citations in the same field, route and year,
      yet more often in force at the same reach ({M3}). None is value, private or public."
  revisits:
    - id: B11
      signal: Reach by origin
      verdict: mixed
      what: >-
        Five or more offices holds (-31.9 points held together, against -47.5 raw); filed only in Australia weakens
        (+9.3 against +32.7, 28.4% left). Fewer offices remains at the same field, route and year.
    - id: B12
      signal: Citations by origin
      verdict: weakened
      what: >-
        Citations within five years of priority: rate ratio 0.312 raw, 0.729 with every factor held (0.700 in the
        second half). Reach accounts for about three fifths of the gap, but about 27% to 30% fewer citations remain.
  held: [the technology field, the route of filing, the filing year, several founding applicants, the number of classes, "for citations: reach, in bands"]
  verdicts:
    - signal: Filed only in Australia
      detail: +32.7 raw, +9.3 held together (28.4% left); +32.2 and +10.2 in the second half
      verdict: weakened
    - signal: Five or more offices
      detail: -47.5 raw, -31.9 held together (67.3% left); -46.4 and -31.4 in the second half
      verdict: holds
    - signal: Citations within five years (rate ratio)
      detail: 0.312 raw, 0.645 with reach held, 0.729 with every factor held; about 27% to 30% of the raw gap remains
      verdict: weakened
  chart:
    type: effect
    title: Reach and citations, Australian against overseas organisations' patents
    subtitle: Standard patents filed FY2010 to FY2019, first half; raw and with the field, route, year and the rest held together; 95% intervals
    views:
      - label: Reach (percentage points)
        x: {values: ["Filed only in Australia", "Five or more offices"]}
        y: {name: Australian minus overseas organisations (percentage points), format: signed}
        ref: 0
        ref_label: no difference
        series:
          - name: Raw (as Stage 2 compared)
            colour: muted
            data: [[32.7, 28.3, 37.0], [-47.5, -51.5, -43.5]]
          - name: Held together
            colour: 0
            data: [[9.3, 8.3, 10.3], [-31.9, -34.6, -29.3]]
      - label: Citations within five years (rate ratio)
        x: {values: ["Raw", "With reach held", "With every factor held", "Second half: with every factor held"]}
        y: {name: "Rate ratio, Australian against overseas organisations", format: ratio, digits: 2}
        ref: 1
        ref_label: as often cited
        series:
          - name: Rate ratio
            colour: 0
            data: [[0.312, 0.272, 0.359], [0.645, 0.577, 0.721], [0.729, 0.677, 0.784], [0.700, 0.634, 0.774]]
    source: IP Australia, IP RAPID; Google Patents (lens rights); notebook 3, section 1.3
    note: A rate ratio of 0.729 means about 27% fewer citing families at the same reach, field, route and year.
  questions:
    - q: 1
      how: Two of the three readings of how Australian organisations' patents are used; with M3 they disagree, so none can stand alone as a measure of value.
  sources: [iprapid, google_patents]
  prep:
    - what: Reach is the share of patents filed only in Australia and in five or more offices, for standard patents filed FY2010 to FY2019 with a known family, in two halves.
      why: Older Australian families' filings abroad are incomplete (B55), so reach is read from FY2010.
    - what: "Citations are counted at a [[fixed-age|fixed age]]: patent families citing the family and first filed within five years of its first priority, for families first filed by 22 April 2020."
      why: An older patent has had longer to be cited; the final review asked for a fixed-age window.
  steps:
    - Compare Australian with overseas organisations on each measure, with nothing held (raw).
    - Hold the field, route, year, co-filers and classes together; for citations, hold reach first, then everything.
    - Read how much of each raw gap is left, and give the outcome.
  assumptions:
    - A citation within five years is a reading of how a patent is used by later inventors, not of its value.
  limits:
    - Reach is held only in three bands, so part of a gap within a band could still be reach.
    - Citations come from Google Patents' families and depend on how other offices cite.
  next: >-
    The second early signal: validate reach, citations and staying in force against licensing, litigation or sale,
    and read the three together.
  terms: [held-together, rate-ratio, fixed-age, patent-family, citations, verdict-words]
  related: [B11, B12, M3]

- id: M5
  lens: rights
  about: system
  headline: Expedited examination's link with a longer life does not survive the filer, field and route held together; for individuals it goes with a shorter one
  statement: >-
    Stage 2 found expedited standard patents slightly more often in force at 10 years. Held together with the filer,
    field, route, cohort, co-filers and classes, that link is not detected in FY2010 to FY2016 and reverses in FY2003 to
    FY2009 (a [[hazard-ratio|hazard ratio]] of 1.124: more likely to end). Australian individuals' expedited patents
    are about a quarter more likely to end in a given year, in both periods.
  figures:
    - value: "1.021"
      label: "all filers, FY2010 to FY2016, held together (raw 0.958): not detected"
    - value: "1.124"
      label: "all filers, FY2003 to FY2009, held together (raw 0.782): reversed"
    - value: "1.264 and 1.249"
      label: Australian individuals, held together, in the two periods
  points:
    - "**Overseas organisations** (most of the patents): 0.945 raw and 1.004 held in FY2010 to FY2016; 0.598 and 0.957
      in FY2003 to FY2009, not detected once held."
