    type: effect
    title: The rise in divisionals, FY2000 to FY2009 against FY2010 to FY2019, read four ways
    subtitle: Difference in the share of organisations' standard patents that are divisionals, in percentage points, with 95% intervals clustered by the filer
    x: {values: ["Raw", "Held together (field, co-filers, classes)", "Held, without the ten filers with the most", "Within the same filers"]}
    y: {name: Change in the share that are divisionals (percentage points), format: signed}
    ref: 0
    ref_label: no change
    series:
      - name: Australian organisations
        colour: 0
        data: [[11.0, 1.2, 20.9], [10.7, 4.8, 16.6], [7.1, 6.0, 8.1], [19.18, 9.45, 28.91]]
      - name: Overseas organisations
        colour: 1
        data: [[8.5, 7.8, 9.3], [8.8, 8.1, 9.4], [8.4, 7.8, 9.0], [10.97, 10.10, 11.84]]
    source: IP Australia, IP RAPID (lens rights); notebook 3, section 1.7
  questions:
    - q: 4
      how: A change in how the same organisations use the system (more divisionals), which bears on examination and on how long claims stay pending (the twelfth early signal).
  sources: [iprapid]
  prep:
    - what: Applications with a field only, capped at 200,000 a group by the hash; the route cannot be held, because a divisional is a route.
