  next: >-
    A later study of medicines could link extended patents to the Pharmaceutical Benefits Scheme.
  terms: [extension-of-term]
  related: [U36, U28]

- id: U38
  lens: rights
  attachment: Events
  about: data
  headline: Fewer trade marks ended in 2002 because the old and new laws set different first terms
  statement: >-
    Trade marks ceasing at 7 years (the first term under the 1955 Act) numbered 4,045 in 2000, 2,161 in 2001 and 14 in
    2002, while those ceasing at 10 years (the 1995 Act's first term) only began in 2002 (303), building to 7,589 by
    2005. The gap between the two produced the dip.
  figures:
    - value: "4,045 → 14"
      label: trade marks ceasing at 7 years, 2000 to 2002
    - value: "42,907"
      label: trade marks filed in 2000, more than in any year from 1997 to 2002
  points:
    - "Lapses rose in 2002 with the large filing year of 2000: 10,247 of 2002's lapses were of marks filed in 2000, and
      34.4% of 2000's marks lapsed (against 27.8% to 32.7% in 1997 to 2003). 2003's filings (44,634) were higher
      still."
    - "So 2002 is a known feature of both series, accounted for by the register's terms and the large 2000 filing
      year, not by processing."
  questions:
    - q: 5
      how: Explains a feature of the record that could otherwise be mistaken for the effect of a policy.
  sources: [iprapid]
  chart: U38
  notebook_charts: [0]
  prep:
    - what: Cessations are grouped by the mark's age when it ceased; lapses by the year the mark was filed.
      why: Age at cessation shows which renewal point a mark failed to pass.
  steps:
    - Count trade mark cessations in 1998 to 2006 by the mark's age at the time.
    - Count lapses in the same years by the year each mark was filed.
    - Compare with each year's filings and the share that lapsed.
  assumptions:
    - A mark's age is measured from its earliest filing date, as its term is ({U31}).
  limits:
    - It explains a dip in the timeline; it is not itself a finding about the IP system.
  next: >-
    Stage 2 treats 2002 as a known feature of the trade mark series.
  terms: [cease, lapse, renewal]
  related: [U27, U29]

- id: U39
  lens: rights
  attachment: Events
  about: data
  headline: Design lapses seem to vanish in April from 1996 to 2002 because of how they were dated
  statement: >-
    Over 1996 to 2002, April holds 101 design lapses dated on 32 days, against 365 to 671 dated on 56 to 91 days in
    every other month. Designs filed 21 months before April were no fewer, and every month of filing lost a similar
    share to lapse (18.1% to 21.6%), so April's lapses were dated in other months.
  figures:
    - value: "101"
      label: design lapses in April, 1996 to 2002 together
    - value: "18.1% to 21.6%"
      label: of each month's designs lapsed, a similar share every month
  points:
    - "Designs lapse a median 637.5 to 680 days after filing, the same in April (644)."
    - "So monthly design lapses in those years are pooled across months in Stage 2."
  questions:
    - q: 5
      how: Removes a false monthly pattern that could be mistaken for a seasonal or policy effect.
  sources: [iprapid]
  chart: U39
  prep:
    - what: Lapses from 1996 to 2002 are pooled by month of the year.
      why: Pooling seven years shows a pattern too small to see in one.
  steps:
    - Count design lapses by month of the year, and the number of days each month's lapses are dated on.
    - "Compare with the designs filed 21 months earlier (the typical age at lapse)."
    - Check the share of each month's filings that ever lapsed.
  assumptions:
    - Designs filed in each month are equally likely to lapse, unless the data show otherwise (they do not).
  limits:
    - Explains a recording pattern; it says nothing about designs themselves.
  next: >-
    Monthly design lapses in those years are pooled in Stage 2.
  terms: [lapse, batch-dates]
  related: [U29, U38]

- id: U40
  lens: rights
  attachment: Events
  about: data
  headline: Placeholder dates are few and are handled, but one date for patent agents is a bulk update
  statement: >-
    The placeholder dates 1 January 1800, 1900 and 1970 appear on 7, 1 and 3,154 of the register's 49.35 million
    events (all left out), on 8 and 26 of its 3.69 million links, and on 101 and 4 of its 12.52 million parties' start
    dates.
  figures:
    - value: "3,154"
      label: events dated 1 January 1970, left out
    - value: "49.35 million"
      label: events checked
  points:
    - "Parties' start dates are used only to order a right's filers, so at most 105 could be put in the wrong order."
    - "**One batch date.** The date an agent who is not an applicant first appears is 12 May 2018 for 362,490 rights,
      all but 5 of them patents (362,485 of the 1,049,459 patents with the date). That is a day IP RAPID's patent
      party records were written, not when an agent first acted, so the date is used for trade marks and designs
      ({B10}) and not for patents."
  questions:
    - q: 1
      how: Confirms that dates used for lifetimes and milestones are sound.
  sources: [iprapid]
  prep:
    - what: Every date column of the events, links and parties tables is checked for the three common placeholders.
      why: Placeholders stand in for unknown dates and would distort any time measured from them.
  steps:
    - For each date column, count the rows on each placeholder date.
    - "Compare with the column's total, and with how the table uses it."
  assumptions:
    - Dates other than the known placeholders are real.
  limits:
    - Other, less obvious false dates could remain.
    - For patents, the date an agent first appears cannot be used (the batch date above).
  next: "The open item is closed; the links table rechecks its own dates ({U88})."
  terms: [placeholder-date]
  related: [U2, U31]

# ------------------------------------------------------------------------------------------------- the links (1.8.3)

- id: U88
  lens: rights
  attachment: Links
  about: data
  headline: The register labels most international patent numbers as Australian, so the office is read from the number
  statement: >-
    IP RAPID labels 93.88% of its 614,973 international (PCT) numbers as Australian, and 15,568 of its 1,367,808
    priority claims carry another office's number under an Australian label. So a patent priority's office is read
    from the number itself. After that, only 0.7% of standard patents with a priority have an office that cannot be
    read.
  figures:
    - value: "93.88%"
      label: of PCT numbers labelled Australian in the register
    - value: "0.7%"
      label: of priorities whose office cannot be read, after the repair
  points:
    - "The route into Australia is filled for 93.67% of rights: every right but provisional applications and plant
      breeder's rights, which claim nothing."
    - "65.8% of rights claim no priority; the most claimed priority office is the United States (44.6% of rights with
      one)."
    - "8 link dates are placeholders (1800, 1900) and are not used to order priorities."
  questions:
    - q: 1
      how: Where an invention was first filed says where it came from, which matters for where its value is created.
    - q: 2
      how: Without the repair, every international application would look Australian.
  sources: [iprapid]
  prep:
    - what: An Australian application number (ten digits, year first) is Australian; a PCT number names its receiving
        office; any other number labelled Australian has an unknown office.
      why: The register's country label is wrong for most international numbers (ADR 0022).
  steps:
    - Count the register's links by type and how often each is labelled Australian.
    - Check each labelled number against the pattern of an Australian number.
    - Read each patent priority's office from its number, and count those left unreadable.
  assumptions:
    - A number's format reliably shows the office that issued it.
  limits:
    - Trade mark and design priorities keep the register's label, which is sound for them.
  next: >-
    The routes and offices feed {U90} and {U91}.
  terms: [pct, priority]
  related: [U89, U90, U91]

- id: U89
  lens: rights
  attachment: Links
  about: data
  headline: Counts of international patent applications agree with WIPO's, year by year
  statement: >-
    From 1995 to 2024, the patents entering Australia through the international (PCT) route are a median 1.001 times
    WIPO's count of PCT entries at IP Australia (0.981 to 1.007 in every year), and the other standard patents are
    0.989 to 1.019 times WIPO's direct applications.
  figures:
    - value: "1.001"
      label: "typical ratio of the register's count of international applications to WIPO's"
    - value: "0.981 to 1.007"
      label: the ratio's range, 1995 to 2024
  points:
    - "So the links are complete for patents, and the register reproduces WIPO's split between the two routes."
  questions:
    - q: 1
      how: An independent check that the data on how inventions reach Australia can be trusted.
  sources: [iprapid, wipo_ipstats]
  chart: U89
  notebook_charts: [1]
  prep:
    - what: Two WIPO indicators (PCT national phase entries and direct applications at IP Australia) were added to the
        corpus for this check.
      why: An independent count is the best test of completeness (ADR 0022).
  steps:
    - Count standard and second-tier patents by calendar year and route, from the register.
    - Take WIPO's counts for the same office and years.
    - Divide one by the other, year by year, and summarise the ratios.
  assumptions:
    - WIPO's counts, which IP Australia reports to it, are an independent benchmark.
  limits:
    - Agreement in totals does not prove every individual link is right.
  next: >-
    The routes can be used in Stage 2 with confidence.
  terms: [pct, national-phase, ratio, wipo]
  related: [U88, U90, U67]

- id: U90
  lens: rights
  attachment: Links
  about: system
  headline: Overseas applicants mostly use the international route; Australians now rely less on provisionals
  statement: >-
    The international (PCT) route carried 81.1% of overseas applicants' standard patents in FY2010 and 69.4% in FY2026,
    while divisionals rose to 19.8%. Among Australian filers, those claiming only an Australian application (usually a
    provisional) fell from 81.2% (FY1985) to 11.4% (FY2026), and direct filing, claiming nothing, reached 28.3% in
    FY2026.
  figures:
    - value: "81.1%"
      label: "of overseas standard patents came through the international route in 2009–10"
    - value: "28.3%"
      label: "of Australians' standard patents filed directly in 2025–26, worth following up"
  points:
    - "Australians' use of the PCT rose from 7.8% to 45.2% (FY2020) and 34.4% (FY2026); divisionals from 2.0% to 22.5%."
    - "Overseas applicants claiming a priority abroad without the PCT fell from 81.0% (FY1985) to 10.0%."
    - "Trade marks: Australians' are 97.9% to 99.2% direct; from overseas, the Madrid system carried 37.9% in FY2005,
      57.5% in FY2020 and 44.0% in FY2026."
    - "Designs from overseas claim a priority abroad for 70.8% (FY1985) to 88.7% (FY2010) and 75.9% (FY2026)."
    - "The rise in Australians' direct filing (11.4% in FY2020) is a lead, not a finding: it may be a change in
      practice, or priority claims recorded late."
  questions:
    - q: 1
      how: How inventions reach Australia shows how the system connects to others, and where Australian inventions start.
    - q: 3
      how: Routes into other markets (PCT, Madrid) are part of how Q3's "access to international markets" works.
  sources: [iprapid]
  chart: U90
  notebook_charts: [0]
  prep:
    - what: Each right's route is the first that applies, in the order PCT, divisional, priority abroad, Australian
        priority, direct (Madrid for trade marks).
      why: A right can claim several things; one route each keeps the shares adding to 100%.
    - what: Origin is the filer's, from the applicants named at filing (ADR 0037).
      why: The current holder's origin would move these shares by up to 1.2 points.
  steps:
    - Give each right its route.
    - Count rights by type, origin, filing year and route.
    - Work out each route's share of each year's applications.
  assumptions:
    - The order of routes reflects how the application actually entered Australia.
  limits:
    - "Recent direct filings may still have claims to earlier applications added, so the 2025–26 figure may change."
  next: >-
    Stage 2 compares routes by origin, applicant and technology.
  terms: [pct, divisional, priority, madrid, provisional]
  related: [U88, U89, U91]

- id: U91
  lens: rights
  attachment: Links
  about: system
  headline: Most overseas inventions patented here were first filed in the United States
  statement: >-
    Of standard patents filed FY2017 to FY2026 from overseas, the earliest priority was filed in the United States for
    53.43%, at the European Patent Office for 10.45%, in China 7.76%, Japan 5.36% and the United Kingdom 5.24%. 91.64%
    of Australians' international (PCT) applications were filed at IP Australia.
  figures:
    - value: "53.43%"
      label: of overseas inventions first filed in the United States
    - value: "91.64%"
      label: of Australians' PCT applications filed at IP Australia
  points:
    - "88.55% of Australians' priorities are Australian applications (8.1% American)."
    - "Overseas applicants' PCT applications were filed in the United States for 44.37%, at the European Patent Office
      19.26%, in China 8.61% and at WIPO's International Bureau 6.99%."
    - "Australian trade marks used as the basis of an international (Madrid) application numbered 268 (filed 2001),
      1,941 (2015), 2,258 (2020) and 1,455 (2025), 1.01% to 4.49% of Australians' marks; WIPO counts 2,064 (2015) and
      2,151 (2020) Madrid applications by Australian holders. The two agree in size, though a mark is counted in the
      year it was filed and WIPO counts the international application. Recent marks have had less time to be taken
      abroad."
  questions:
    - q: 1
      how: Shows where the inventions protected in Australia originate.
    - q: 3
      how: Australian brands taken abroad through Madrid are one measure of reaching international markets.
  sources: [iprapid, wipo_ipstats]
  chart: U91
  notebook_charts: [2]
  prep:
    - what: The earliest priority's office is read from its number ({U88}).
      why: The register's label is unreliable for patents.
  steps:
    - "For standard patents filed in 2016–17 to 2025–26, count the office of the earliest claimed filing, by origin."
    - Count the receiving office of each PCT application.
    - Count Australian trade marks that became the basis of a Madrid application, and compare with WIPO.
  assumptions:
    - The office of first filing shows where the applicant first sought protection; it is read as no more than that.
  limits:
    - Where an invention was first filed is not always where it was made ({U96}).
  next: >-
    Stage 2 relates first-filing offices to inventors' locations and technology.
  terms: [priority, pct, madrid]
  related: [U88, U90, U96]

# ------------------------------------------------------------------------------------------------- Google Patents (1.8.4)

- id: U92
  lens: rights
  attachment: Google Patents
  about: data
  headline: Google Patents finds the overseas family of nearly every patent filed since the 1980s
  statement: >-
    The family is found for 98.78% of standard patents filed in the 1980s, 98.99% (1990s), 94.81% (2000s), 99.23%
    (2010s) and 98.14% (2020s). Provisional applications, which are rarely published, are almost never found.
  figures:
    - value: "99.23%"
      label: of 2010s standard patents have their family found
    - value: "23.14%"
      label: "of standard patents filed in 2009–10 to 2018–19 share a family with another Australian application"
  points:
    - "734 Australian application numbers fall in two families; the lower family number is taken, so every build agrees."
    - "Sharing a family is mostly through divisionals (88.29%), so family measures repeat across those applications."
    - "Five years of citations are complete for every family filed to FY2019, for 96.12% of FY2021's and 16.31% of
      FY2024's."
  questions:
    - q: 1
      how: Family reach and citations, the next two observations, are only usable because families are found this reliably.
  sources: [google_patents, iprapid]
  chart:
    type: bar
    title: Standard patents whose worldwide family is found
    subtitle: By decade of filing
    x: {type: category, values: [1970s, 1980s, 1990s, 2000s, 2010s, 2020s]}
    y: {name: "% found in Google Patents", min: 0, max: 100, format: pct, digits: 2}
    series:
      - name: Found
        data: [81.17, 98.78, 98.99, 94.81, 99.23, 98.14]
    source: Google Patents Public Data, joined to IP RAPID (lens rights)
  prep:
    - what: Each Australian application is matched to its Google Patents family by its Australian application number,
        with designs left out.
      why: Google converts the old numbering schemes, so one key reaches every era (ADR 0022).
    - what: The five-year citation count is left empty where five years have not yet passed.
      why: A family filed recently has had less time to be cited; comparing it with older ones would mislead.
  steps:
    - Match each Australian patent application to a Google Patents family.
    - Work out the share found, by type and decade.
    - Count applications that share a family, and why.
  assumptions:
    - Google Patents' families group the same invention correctly.
  limits:
    - A family's measures are the whole family's, so divisionals share their parent's.
  next: "Overseas reach and citations are compared among patents of the same age in Stage 2."
  terms: [patent-family, citations, divisional]
  related: [U93, U94]

- id: U93
  lens: rights
  attachment: Google Patents
  about: system
  headline: Overseas applicants typically file an invention in six countries' offices, Australians in two
  statement: >-
    Of standard patents filed FY2010 to FY2019, overseas applicants' families reach a median 6 offices, 68.94% reach
    five or more, and 66.67% are granted in the United States. Australians' reach a median 2 offices; 45.12% are filed
    only in Australia, 19.77% in five or more, and 29.58% are granted in the United States.
  figures:
    - value: "6 vs 2"
      label: "typical number of offices reached, overseas against Australian applicants"
    - value: "45.12%"
      label: of Australians' standard patents filed only in Australia
  points:
    - "Australian individuals filed 60.12% of theirs only in Australia, organisations 40.68%."
    - "8.26% of overseas applicants' patents were filed only in Australia."
    - "Reach is chosen by the applicant and costs money in every office, so it is a common sign of expected value in
      the research literature; it is not a measure of value itself."
  questions:
    - q: 1
      how: How widely an invention is protected is a widely used sign of its expected private value.
    - q: 2
      how: Australians, and individuals most, protect more narrowly, which bears on who gets value from inventing.
  sources: [google_patents, iprapid]
  chart: U93
  notebook_charts: [0]
  prep:
    - what: "Standard patents filed in 2009–10 to 2018–19 are used."
      why: They are nearly all decided, and five years of citations are complete for most.
  steps:
    - For each standard patent, take the number of offices its family reached and whether the US granted it.
    - Summarise by the filer's origin (ADR 0037), and for Australians by individual or organisation.
  assumptions:
    - Filing in more offices reflects higher expected value, as the literature commonly assumes.
  limits:
    - Reach also depends on markets and budgets; a small firm may value a patent it can afford to file only here.
  next: "Stage 2 uses overseas reach beside years in force and citations, among patents of the same age and field."
  terms: [patent-family, median]
  related: [U36, U92, U94]

- id: U94
  lens: rights
  attachment: Google Patents
  about: system
  headline: Australians' patents are cited less by later inventions than overseas applicants' patents
  statement: >-
    Within five years, standard patents filed FY2010 to FY2019 by overseas applicants were cited by a median 6 later
    patent families, and 13.28% were not cited at all. Australians' were cited by a median 1, and 43.64% were not cited
    at all.
  figures:
    - value: "6 vs 1"
      label: "typical number of citing families in five years, overseas against Australian"
    - value: "43.64%"
      label: of Australians' standard patents not cited within five years
  points:
    - "The spread is a long tail: the 99th percentile is 136 citing families for overseas applicants' patents and 44 for
      Australians'."
    - "A family filed in more offices is more often cited, so citations are compared beside family size."
  questions:
    - q: 1
      how: Citations are a common, imperfect sign that later inventions build on a patent, one route to wider public
        value.
  sources: [google_patents, iprapid]
  chart: U94
  prep:
    - what: Citations are counted as distinct later families citing the family within five years of its first filing.
      why: A fixed window treats old and new patents alike; the count is empty where the window is not complete.
  steps:
    - "For standard patents filed in 2009–10 to 2018–19, take each family's five-year citation count."
    - "Describe by origin: the typical count, the share never cited, and the count only 1% exceed."
  assumptions:
    - A citation means the later invention builds on, or is close to, the cited one.
  limits:
    - Citations reflect family size, field and examiners' practice, not only importance.
  next: "Stage 2 compares citations by rank or on a proportional scale, among patents of the same age and field,
        beside family size."
  terms: [citations, patent-family, long-tail, log-scale]
  related: [U85, U93]

# ------------------------------------------------------------------------------------------------- inventors (1.8.5)

- id: U95
  lens: rights
  attachment: Inventors
  about: data
  headline: Inventors' countries are missing for most patents filed only in Australia
  statement: >-
    An inventor's country is known for 87.57% to 97.06% of overseas filers' standard patents each decade, but for only
    11.71% (1990s), 22.3% (2000s), 56.98% (2010s) and 64.27% (2020s) of Australian filers'. Of Australian filers' patents
    with inventors but no country, 94.33% to 99.18% were filed only in Australia, where Google's records give no inventor
    countries.
  figures:
    - value: "56.98%"
      label: of Australian filers' 2010s patents have an inventor's country
    - value: "3"
      label: "inventors named on the typical standard patent"
  points:
    - "Inventors are named for 25.76% of rights (patents with a family that names them); standard patents filed FY2017 to
      FY2026 name a median 3 (22.46% name one)."
    - "**So** \"invented in Australia\" describes Australian filers' patents that were also filed abroad, and leaves out
      most of those filed only here."
  questions:
    - q: 2
      how: Limits what can be said about who invents in Australia, and for which patents.
  sources: [google_patents_inventors, google_patents, iprapid]
  chart: U95
  prep:
    - what: Inventors come from one publication per family, the one naming the most, with countries borrowed from the
        rest of the family.
      why: Counting every publication's names nearly doubled the inventors (ADR 0008).
  steps:
    - For each patent, count its inventors and those with a known country.
    - Work out the share with a known country, by type, origin and decade.
    - For those with inventors but no country, check how many were filed only in Australia.
  assumptions:
    - An inventor's recorded country is where they lived when the invention was made.
  limits:
    - Patents filed only in Australia, half of Australians', mostly cannot be placed.
  next: >-
    Stage 2 reads "invented in Australia" only among patents whose inventors' countries are known.
  terms: [patent-family]
  related: [U96, U97]

- id: U96
  lens: rights
  attachment: Inventors
  about: system
  headline: Inventions filed from Australia are almost all made here; few filed from overseas are
  statement: >-
    Of standard patents filed FY2017 to FY2026 whose inventors' countries are known, 94.47% of those filed from
    Australia have an inventor in Australia (16,062), against 0.85% of those filed from overseas (2,278).
  figures:
    - value: "94.47%"
      label: of Australian-filed patents have an inventor in Australia
    - value: "0.85%"
      label: of overseas-filed patents have one
  points:
    - "Overseas filers' patents with an inventor in Australia numbered 28 (FY1990), 222 (FY2010), 212 (FY2020) and 222
      (FY2026)."
  questions:
    - q: 1
      how: Where inventions are made matters for where the knowledge and jobs behind them are; very little of what
        overseas applicants patent here is invented here.
    - q: 2
      how: Australian inventors working for overseas firms are a group whose benefit from the system may be indirect.
  sources: [google_patents_inventors, iprapid]
  chart: U96
  prep:
    - what: A patent is "invented in Australia" if any inventor with a known country is in Australia.
      why: One Australian inventor is enough for the invention to involve work here.
  steps:
    - "Take standard patents filed in 2016–17 to 2025–26 whose inventors' countries are known."
    - Split by whether the filer is Australian, and count those with an inventor in Australia.
    - Repeat by year for overseas filers.
  assumptions:
    - The inventor's country is where the inventive work was done.
  limits:
    - Most patents filed only in Australia are left out, because their inventors' countries are unknown ({U95}).
  next: >-
    Stage 2 relates where inventions are made to who owns them and the route they take.
  terms: [patent-family]
  related: [U90, U95, U71]

- id: U97
  lens: rights
  attachment: Inventors
  about: data
  headline: Guessing gender from names matches WIPO's figure for Australia, but not for most other countries
  statement: >-
    For inventors of international applications, the share estimated to be women is 14.6% for Australia, against
    WIPO's published 13.8%. But the median country is 4.5 points too high, and China (34.6% against 23.4%) and Korea
    (37.0% against 15.7%) far too high. So estimates are read for inventors in Australia only.
  figures:
    - value: "14.6% vs 13.8%"
      label: Australia, estimated against WIPO's share of women inventors
    - value: "+21.3 points"
      label: Korea's estimate above WIPO's
  points:
    - "The Netherlands, Spain, New Zealand, Finland and Ireland are within 2 points."
    - "The United States 20.0% against 15.3%; Germany 16.6% against 10.7%; Japan 16.3% against 9.0%."
    - "For China, 49.1% of names are between 10% and 90% likely to be a woman's; in Korea only 53.3% of inventors get
      an estimate."
    - "**Decision.** Estimates are read as levels for inventors in Australia only; for other countries only within one
      country over time; for China and Korea not at all."
  questions:
    - q: 2
      how: Q2 asks how outcomes vary by gender where reliable data exist; this check is what makes the Australian figure usable.
  sources: [google_patents_inventors, wgnd, wipo_ipstats]
  chart: U97
  notebook_charts: [1]
  prep:
    - what: Each inventor's chance of being a woman comes from WIPO's World Gender-Name Dictionary, by first name and
        country.
      why: Gender is not recorded anywhere; a name-based probability is the only route, and must be checked.
    - what: WIPO's share of women among PCT inventors by country was added to the corpus for the check.
      why: An independent benchmark is needed before using any estimate (ADR 0022).
  steps:
    - For inventors of PCT families first filed 2015 to 2022, average their probabilities by country.
    - Compare with WIPO's published share for 2016 to 2023, country by country.
    - For Australia, compare year by year.
  assumptions:
    - Summed over many inventors, name-based probabilities give a fair count of women, where names are informative.
  limits:
    - An estimate says nothing about any individual.
    - Recent Australian estimates run above WIPO's (17.2% against 14.4% in 2023).
  next: >-
    Stage 2 compares women's estimated share among inventors in Australia by field and filer.
  terms: [gender-estimate, wipo]
  related: [U95, U98]

- id: U98
  lens: rights
  attachment: Inventors
  about: system
  headline: About one inventor in seven in Australia is estimated to be a woman
  statement: >-
    Of the inventors in Australia named on standard patents filed FY2017 to FY2026, an estimated 14.33% are women on
    patents filed by Australian organisations, 12.42% on those filed by Australian individuals and 12.75% on those
    filed from overseas.
  figures:
    - value: "14.33%"
      label: estimated women among inventors on Australian organisations' patents
  points:
    - "It is an expected count from names, not a record of anyone's gender."
  questions:
    - q: 2
      how: A first, checked measure of gender among inventors in Australia, which Q2 asks about directly.
  sources: [google_patents_inventors, wgnd, iprapid]
  chart:
    type: bar
    horizontal: true
    title: Estimated women among inventors in Australia
    subtitle: Standard patents filed FY2017 to FY2026, by who filed them; each inventor counted once per patent
    x: {type: category, values: [Australian organisations, Australian individuals, Overseas filers]}
    y: {name: "% estimated to be women", min: 0, format: pct, digits: 2}
    series:
      - name: Estimated women
        data: [14.33, 12.42, 12.75]
    source: Google Patents Public Data; WIPO World Gender-Name Dictionary; IP RAPID (lens rights)
  prep:
    - what: Only inventors in Australia are counted, each once per patent.
      why: Australia is the one country whose estimates WIPO's figures confirm ({U97}).
  steps:
    - "Take the inventors in Australia on standard patents filed in 2016–17 to 2025–26."
    - Average their probability of being a woman, by who filed the patent.
  assumptions:
    - The name-based estimate is as accurate for these patents as for the PCT inventors it was checked on.
  limits:
    - Covers patents with known inventor countries, which leaves out most patents filed only in Australia ({U95}).
  next: >-
    Stage 2 compares the share by technology field and filer.
  terms: [gender-estimate]
  related: [U97]

- id: U99
  lens: rights
  attachment: IP Australia's register
  about: data
  headline: IP Australia's own register fills gaps in the research data for trade marks and designs
  statement: >-
    IP Australia's [[register|register]] holds what IP RAPID leaves out. Where IP RAPID has no [[abn|ABN]] for the
    filer, the register fills one for 134,995 trade marks and 3,097 designs. Designs of unknown origin fall from 30,215
    to 5,539, while trade marks barely move (39,836 to 39,030). And the register's own history records an expedite
    event for 332,446 trade marks.
  figures:
    - value: "134,995"
      label: trade marks given a filer's ABN by the register
    - value: "30,215 → 5,539"
      label: designs of unknown origin, before and after
  points:
    - "73,181 of the trade marks' ABNs come through the company number (ACN) the register gives, matched to its ABN in
      the Australian Business Register; for designs 384. In all, 31.67% of rights now have a filer's ABN."
    - "Origin is filled only while a right has not changed hands, since the register gives the current owner, not the
      filer."
    - "The register was first checked against IP RAPID: IP RAPID is complete to within a week, and its fields agree
      with the register's for nearly every record of a random sample. So the register adds to IP RAPID; it does not
      correct it."
    - "Patents are not filled: only trade marks and designs (and provisional applications' inventors) were read from
      the register whole."
  questions:
    - q: 2
      how: "Who uses the system can now be counted for recent years, which the research data's missing business
           numbers had prevented."
    - q: 4
      how: What IP Australia records but does not publish is itself something it can change.
  sources: [ipa_register, ipa_api, iprapid, abr]
  chart:
    type: bar
    title: Rights of unknown origin, before and after IP Australia's register fills the gaps
    subtitle: Rights whose filer has no known country
    x: {type: category, values: [Designs, Trade marks]}
    y: {name: Rights of unknown origin, min: 0, format: int}
    series:
      - name: IP RAPID alone
        data: [30215, 39836]
        colour: muted
      - name: Filled from the register
        data: [5539, 39030]
    source: IP RAPID; IP Australia's register, 27 October 2026 (lens rights)
  prep:
    - what: Every trade mark and design was read from IP Australia's register through its APIs on 27 October 2026.
      why: A sample can check accuracy, but filling gaps needs every record, so that every year is filled alike.
    - what: A filled value keeps IP RAPID's and takes the register's only where IP RAPID has none.
      why: IP RAPID stays the base, and its own values can always be compared with the filled ones.
  steps:
    - Check IP RAPID against the register, field by field, on a random sample of each right.
    - Read every trade mark and design from the register.
    - Where IP RAPID has no ABN, country or expedite event, take the register's, keeping IP RAPID's beside it.
  assumptions:
    - The register's current owner is the filer while a right has not changed hands, so a filer's ABN is filled only
      for those rights.
  limits:
    - The register is as it stood on 27 October 2026; it can be read again with the project's code.
  next: >-
    Stage 2 uses the filled columns for who files and where they come from, with IP RAPID's beside them.
  terms: [register, filled, iprapid, abn]
  related: [U100, U102, U103, U104]

- id: U100
  lens: rights
  attachment: IP Australia's register
  about: data
  headline: With the register's business numbers, most of the recent fall in linked filings disappears
  statement: >-
    In IP RAPID, Australian organisations' trade marks with the filer's [[abn|ABN]] fell from 84.1% in FY2024 to 59.9%
    in FY2026. [[filled|Filled]] from IP Australia's register, the share is 92.3% in FY2024, 91.4% in FY2025 and 90.9%
    in FY2026. So most of the fall is in what IP RAPID publishes, not in the firms filing. Shares are of
    applications, not of distinct firms.
  figures:
    - value: "92.3% → 90.9%"
      label: "Australian organisations' trade marks with the filer's business number, with the register's numbers,
             2023–24 to 2025–26"
    - value: "84.1% → 59.9%"
      label: the same in IP RAPID alone
  points:
    - "Designs: 88.4% against 92.3% filled (FY2024), 76.3% against 89.3% (FY2026)."
    - "The register itself records more business numbers in recent years: of the trade marks IP RAPID leaves without
      one, it fills 23% to 29.2% of those filed to FY2019, 44.5% to 51.9% in FY2022 to FY2024, and 69.9% and 77.4% in
      FY2025 and FY2026. So the filled share is comparable from FY2024 on, and a lower bound earlier."
    - "Why IP RAPID lacks the numbers (late publication, a field not carried across, or something else) is not shown
      here; it is a question for IP Australia (OQ7)."
  questions:
    - q: 2
      how: "Who is newly using the system can now be followed up to 2025–26."
    - q: 4
      how: IP Australia collects the numbers but does not publish them, which it could change (OQ7).
  sources: [ipa_register, iprapid, abr]
  chart:
    type: bar
    title: Australian organisations' trade marks with the filer's ABN
    subtitle: IP RAPID alone, and filled from IP Australia's register, by financial year of filing
    x: {type: category, values: [FY2024, FY2025, FY2026]}
    y: {name: "% with the filer's ABN", min: 0, format: pct, digits: 1}
    series:
      - name: IP RAPID
        data: [84.1, 71.4, 59.9]
      - name: Filled from the register
        data: [92.3, 91.4, 90.9]
    source: IP RAPID; IP Australia's register, 27 October 2026; ABR (lens rights)
  prep:
    - what: The share is worked out among Australian organisations only, as for U45.
      why: Individuals usually have no ABN, so including them would mix who files with how they are linked.
  steps:
    - For each year, take Australian organisations' trade marks and designs.
    - Count those with the filer's ABN in IP RAPID, and those with one once filled from the register.
  assumptions:
    - The register's ABN for a right's current owner is the filer's while the right has not changed hands.
  limits:
    - "The register records more business numbers in recent years, so the filled-in series is not one consistent
      method before 2023–24."
  next: "Yearly filing by firms is compared up to 2025–26 with the register's numbers. The question to IP Australia
        now asks why the published data leave the numbers out (OQ7)."
  terms: [abn, register, filled]
  related: [U45, U101]

- id: U101
  lens: rights
  attachment: IP Australia's register
  about: system
  headline: More firms filed their first known trade mark in 2025–26, most with no earlier link to IP
  statement: >-
    A firm's first observed filing is its earliest application linked to its business number, not necessarily its
    first ever. Counted by IP RAPID's business numbers, firms with a first observed trade mark fell from 11,318 in
    FY2024 to 7,384 in FY2026. With the register's numbers [[filled|filled]] in, they rose: 14,728 in FY2024, 15,818 in
    FY2025 and 19,730 in FY2026.
  figures:
    - value: "19,730"
      label: "firms with a first known trade mark in 2025–26, with the register's numbers"
    - value: "852"
      label: of them already had some earlier link to IP
  points:
    - "First designs: 414 against 535 filled (FY2024), 342 against 608 (FY2026)."
    - "**Some are not new.** 2.45% to 5.76% of each year's first observed filers already had an earlier trade mark on
      another record (483 of 19,730 in FY2026), and 4.32% to 9.1% had some earlier link to IP (852 in FY2026). The
      counts overstate new filers by about that much."
    - "**And some are missed.** A firm whose first filing carries no business number anywhere is missed, or counted
      in a later year. So the counts are neither upper nor lower bounds on new filers: both errors are present."
    - "The filled counts rise every year from FY2018 (10,143) to FY2021 (14,626), partly because the register records
      more business numbers from FY2019 ({U100}), so part of that rise is better recording, not new filers."
  questions:
    - q: 2
      how: First observed filings are the closest these data come to counting businesses that start to use the system
        each year; they are not a count of entry.
  sources: [ipa_register, iprapid, linkage]
  chart:
    type: bar
    title: Firms with a first observed trade mark, by year
    subtitle: Counted by IP RAPID's business numbers alone, and with IP Australia's register filled in
    x: {type: category, values: [FY2024, FY2025, FY2026]}
    y: {name: Firms, min: 0, format: int}
    series:
      - name: IP RAPID alone
        data: [11318, 8741, 7384]
        colour: muted
      - name: Filled from the register
        data: [14728, 15818, 19730]
    source: IP RAPID; IP Australia's register; ABR (lens rights and firms)
    note: First observed is not first ever; some of these firms had an earlier link to IP.
  prep:
    - what: Each firm's first observed trade mark and first observed design are dated by financial year, using the
        filled filer's ABN.
      why: The earliest application linked to a business number is the first time the data can see that firm file
        (ADR 0039); its earlier filings may carry no number.
  steps:
    - Credit each application to the filer's ABN, filled from the register where IP RAPID has none.
    - Count, for each year, the firms whose first linked application of a kind was filed that year.
    - Check how many of them had an earlier trade mark on another record, or any earlier link to IP.
  assumptions:
    - A firm's business number on its applications identifies it; a firm whose earlier applications carry no number
      looks new later.
  limits:
    - "The first known filing is not always the first ever, and the jump across 2018–19 mixes new filers with better
      recording in the register."
  next: "Stage 2 follows firms' first known filings by year up to 2025–26, and compares them with what IP Australia
        reports."
  terms: [filled, abn, register]
  related: [U45, U100]

- id: U102
  lens: rights
  attachment: IP Australia's register
  about: system
  headline: Nearly every design's country of origin is now known, and Australia's share is higher
  statement: >-
    Of designs filed FY2017 to FY2026, 32.64% are Australian with the register's countries [[filled|filled]] in, and
    only 0.083% remain of unknown origin. In IP RAPID alone the share was 30.44%, with 5.058% unknown.
  figures:
    - value: "32.64%"
      label: "designs filed in 2016–17 to 2025–26 by Australian applicants, with the register's countries"
    - value: "5.058% → 0.083%"
      label: designs of unknown origin
  points:
    - "By year: FY2025 29.89% Australian against 26.59% in IP RAPID (unknown 0.05% against 6.25%); FY2021 35.81%
      against 33.72%."
    - "IP RAPID's shares were lower bounds: IP Australia counts about three in four of IP RAPID's \"origin unknown\"
      designs as Australian (the review against IP Australia's evidence), and the filled share is about 2 points
      higher, as that predicts."
  questions:
    - q: 1
      how: How much of design protection in Australia serves Australian businesses.
  sources: [ipa_register, iprapid]
  chart:
    type: bar
    title: Designs filed by Australians, IP RAPID alone against filled from the register
    subtitle: Australian share of designs of known origin
    x: {type: category, values: [FY2017 to FY2026, FY2021, FY2025]}
    y: {name: "% Australian", min: 0, max: 50, format: pct, digits: 2}
    series:
      - name: IP RAPID alone
        data: [30.44, 33.72, 26.59]
        colour: muted
      - name: Filled from the register
        data: [32.64, 35.81, 29.89]
    source: IP RAPID; IP Australia's register (lens rights)
  prep:
    - what: Where IP RAPID gives no applicant a country, the register's owner's country is used, but only while the
        design has not changed hands (ADR 0037).
      why: "The register holds the country for nearly every design the research data leave unknown. But it gives the
           current owner, who is the filer only until a design is sold."
  steps:
    - For each design, keep IP RAPID's origin where it has one.
    - Where it has none, take whether any owner the register gives is in Australia.
    - Work out the Australian share and the share still unknown.
  assumptions:
    - The register's current owners stand for the filers where IP RAPID records no country and the design has not
      changed hands.
  limits:
    - A design that has changed hands keeps IP RAPID's origin, unknown or not.
  next: >-
    Stage 2 compares design shares with the filled origin; IP Australia is asked whether IP RAPID could publish it
    (OQ14).
  terms: [filled, register, share-of-known]
  related: [U7, U13]

- id: U103
  lens: rights
  attachment: IP Australia's register
  about: system
  headline: Trade marks claiming an earlier overseas filing were fast-tracked every year; the 2018 drop is a records change
  statement: >-
    Almost every trade mark claiming an overseas filing date ([[priority|convention priority]]) has a fast-track event:
    97.82% of those filed in FY2018 and 99.55% in FY2020, taking IP RAPID and IP Australia's register together. IP
    RAPID records it to FY2018 and the register from FY2019, which is why IP RAPID's series fell in November 2018.
  figures:
    - value: "97.82% → 99.55%"
      label: "trade marks claiming an earlier overseas filing with a fast-track event, 2017–18 and 2019–20, in either
             record"
  points:
    - "IP RAPID: 97.81% (FY2018) then 0.16% (FY2020). The register: 0.06% (FY2018) then 99.53% (FY2020)."
    - "Other marks: the fast-tracks applicants ask for run 4.81% (FY2018) and 4.48% (FY2019), with no break."
    - "The register also marks 14.95% (FY2019) to 26.69% (FY2026) of other marks 'Examination expedited', mostly
      without a request. What that means is a question for IP Australia (OQ6)."
  questions:
    - q: 4
      how: Fast-tracked examination is a service IP Australia runs; it now appears to fast-track priority claims itself.
  sources: [ipa_register, iprapid]
  chart:
    type: bar
    title: Priority-claiming trade marks with a fast-track event
    subtitle: By financial year of filing, in IP RAPID, in IP Australia's register, and in either
    x: {type: category, values: [FY2018, FY2020]}
    y: {name: "% of marks", min: 0, format: pct, digits: 2}
    series:
      - name: IP RAPID
        data: [97.81, 0.16]
      - name: The register
        data: [0.06, 99.53]
      - name: Either
        data: [97.82, 99.55]
    source: IP RAPID events; IP Australia's register, 27 October 2026 (lens rights)
  prep:
    - what: The register's own history of each trade mark is searched for fast-track events.
      why: IP RAPID's events stop recording priority claims' fast-tracks at the November 2018 records move.
  steps:
    - For each trade mark, note whether IP RAPID or the register records a fast-track event.
    - Work out the shares by year and by whether the mark claims convention priority.
  assumptions:
    - The two records describe the same practice on either side of the records move.
  limits:
    - What the register's unrequested "Examination expedited" means is not known yet.
  next: >-
    Fast-track requests are compared across November 2018 with IP RAPID's events; priority-claiming marks with either
    record; the unrequested ones are kept apart until IP Australia explains them.
  terms: [expedited, priority, register]
  related: [U34]

- id: U104
  lens: rights
  attachment: IP Australia's register
  about: data
  headline: 11,098 design records with nothing in them are left out
  statement: >-
    11,098 design records numbered 1973 to 1982, all "ceased", have no date, owner or class in IP RAPID and none in IP
    Australia's register either. They are [[design-shell|shells]] and are dropped from the lenses, with a list of them
    kept.
  figures:
    - value: "11,098"
      label: empty design records dropped
  points:
    - "The lens now holds 257,684 designs. Yearly counts do not change, because the shells had no date."
    - "Totals and shares across all rights change slightly."
  questions:
    - q: 1
      how: A record with no information cannot say anything about the system, so leaving it out loses nothing.
  sources: [iprapid, ipa_register]
  prep:
    - what: A design is dropped only if neither IP RAPID nor the register gives it a date, owner or class.
      why: Then there is nothing to analyse; any information keeps a record in.
  steps:
    - Find designs with no date, applicant or class in IP RAPID.
    - Keep only those the register also gives no owner, date or class.
    - Drop them, and list them in the repository.
  assumptions:
    - These records were never filled in when the old registers were computerised.
  limits:
    - They may have been real designs; nothing in either record says what they were.
  next: >-
    The list is kept (analysis/eda/dropped/design_shells.csv), so the drop can be reversed.
  terms: [design-shell, register]
  related: [U1, U3, U99]

- id: U105
  lens: rights
  attachment: IP Australia's register
  about: data
  headline: IP Australia's register confirms the research data hold every provisional application
  statement: >-
    Of 264,260 provisional application numbers asked, IP Australia's [[register|register]] holds 264,250: 264,014
    that IP RAPID also has and 236 filed since IP RAPID's release. None of 300 numbers missing from IP RAPID's yearly
    sequences is in the register, so those numbers were never used.
  figures:
    - value: "264,250"
      label: provisional applications in the register
    - value: "0 of 300"
      label: missing numbers that turned out to exist
  points:
    - "10 numbers are not found in the register."
  questions:
    - q: 1
      how: A count of provisional applications from IP RAPID is complete, so it can be relied on.
  sources: [ipa_provisionals, iprapid]
  prep:
    - what: Every provisional is asked for by number, as the register's patent search cannot list them.
      why: It is the only way to read every provisional.
  steps:
    - Ask the register for every provisional number IP RAPID has, and for numbers past each recent year's last one.
    - Probe a random 300 of the numbers missing inside IP RAPID's yearly sequences.
  assumptions:
    - A number the register does not know was never used.
  limits:
    - The register is as it stood in October 2026.
  next: >-
    Provisional counts by year come from IP RAPID; the register adds their inventors ({U106}).
  terms: [provisional, register]
  related: [U106, U107]

- id: U106
  lens: rights
  attachment: IP Australia's register
  about: data
  headline: Provisional applications name their inventors from 2002–03, but a fifth since 2023–24 name none
  statement: >-
    IP Australia's register names 181,469 inventors on [[provisional|provisional applications]], which Google Patents
    never sees. 98.53% to 100% of those filed FY2003 to FY2023 name at least one, and none filed before FY2003 does.
    Since FY2024 fewer do: 78.79% (FY2024), 76.38% (FY2025) and 84.69% (FY2026).
  figures:
    - value: "181,469"
      label: inventors named on provisional applications
  points:
    - "A provisional names 1.18 to 1.58 inventors on average, by year: many are filed by one person."
    - "Whether inventors are added later, or are no longer recorded for some provisionals, the data cannot say."
  questions:
    - q: 2
      how: Who invents, including the many inventions that are never followed by a full patent.
  sources: [ipa_provisionals]
  chart:
    type: bar
    title: Provisional applications that name an inventor
    subtitle: Share of each year's provisionals with at least one inventor in IP Australia's register
    x: {type: category, values: [FY2003 to FY2023 (lowest year), FY2024, FY2025, FY2026]}
    y: {name: "% naming an inventor", min: 0, max: 100, format: pct, digits: 2}
    series:
      - name: Name an inventor
        data: [98.53, 78.79, 76.38, 84.69]
    source: IP Australia's register (lens rights)
  prep:
    - what: The inventors are taken as the register names them on each provisional.
      why: Provisionals are never published, so no other source has their inventors.
  steps:
    - Count, for each year, the provisionals naming at least one inventor, and how many they name.
  assumptions:
    - The register's inventors are the provisional's inventors as filed.
  limits:
    - "Coverage since 2023–24 is lower, for reasons not yet known."
  next: "The gender analysis uses provisionals from 2002–03, with each year's coverage beside its figure."
  terms: [provisional, register]
  related: [U105, U107, U95]

- id: U107
  lens: rights
  attachment: IP Australia's register
  about: system
  headline: About one inventor in five on provisional applications is estimated to be a woman
  statement: >-
    Of the inventors named on provisional applications filed FY2017 to FY2026, an estimated 21.24% are women on those
    filed by Australian organisations and 15.58% on those filed by Australian individuals. By year the share rose from
    19.1% (FY2003) to 24.38% (FY2012), fell to 16.83% (FY2014), recovered to 22.08% (FY2023) and was 14.56% in FY2026.
  figures:
    - value: "21.24%"
      label: "estimated share of women among inventors on Australian organisations' provisionals, 2016–17 to 2025–26"
    - value: "14.56%"
      label: "estimated share of women among provisionals' inventors in 2025–26"
  points:
    - "It is an expected count from names, not a record of anyone's gender. All but 2.97% of inventors have an
      estimate."
    - "FY2026 is the year provisional filing doubled, mostly from individuals ({U8}); among Australian filers,
      individuals' provisionals have a lower estimated share of women than organisations'. Among overseas filers it is
      the other way (individuals 21.76%, organisations 9.52%)."
    - "The step from FY2013 to FY2014 comes with more inventors per provisional (1.22 to 1.37); its cause is not known."
    - "Not like for like with standard patents (14.33% on Australian organisations' patents, {U98}): provisionals'
      inventors take the applicant's country, not their own."
  questions:
    - q: 2
      how: A measure of gender among inventors that includes provisional applications, which the patent data leave out.
  sources: [ipa_provisionals, wgnd, iprapid]
  chart:
    type: bar
    horizontal: true
    title: Estimated women among provisional applications' inventors
    subtitle: Provisionals filed FY2017 to FY2026, by who filed them
    x: {type: category, values: [Australian organisations, Australian individuals, Overseas organisations, Overseas individuals]}
    y: {name: "% estimated to be women", min: 0, format: pct, digits: 2}
    series:
      - name: Estimated women
        data: [21.24, 15.58, 9.52, 21.76]
    source: IP Australia's register; WIPO World Gender-Name Dictionary; IP RAPID (lens rights)
  prep:
    - what: Each inventor's chance of being a woman is estimated from the given name and the first applicant's country.
      why: The register gives no inventor's country, and the applicant's is the nearest stand-in.
  steps:
    - Estimate each named inventor's chance of being a woman with WIPO's name dictionary.
    - Add the chances up by year and by who filed, and divide by the inventors with an estimate.
  assumptions:
    - The applicant's country is the inventor's, which is likely for Australian filers.
  limits:
    - The method was checked against WIPO's figures only for patents, so these estimates are less tested.
  next: >-
    The research owner's gender analysis compares provisionals with standard patents, by field and filer.
  terms: [gender-estimate, provisional, register]
  related: [U98, U106, U8]

