# The source register: every source in the corpus, where it comes from, its licence, and what it is for.
# `id` is the module in src/corpus/sources/ and the folder in data/raw/ and data/processed/. `questions` are the
# research goal's core questions (docs/research-goal.md §3) the source serves; `tier` is from docs/data-plan.md.
# What each run fetched and wrote (SHA-256, size, rows, repo or R2) is in data/manifest.json.

sources:
  # Tier 1: the spine --------------------------------------------------------------------------------------------------
  - id: iprapid
    title: IP RAPID (IP Australia's open IP data, updated weekly; the successor to IPGOD)
    publisher: IP Australia
    tier: 1
    questions: [1, 2, 3, 4]
    url: https://data.gov.au/data/dataset/iprapid
    licence: CC BY 4.0
    coverage: Every application from 1904 to the current weekly release (patents, trade marks, designs, plant breeder's rights)

  - id: iplord
    title: Intellectual Property Longitudinal Research Data (IPLORD) 2020
    publisher: IP Australia
    tier: 1
    questions: [2, 3]
    url: https://data.gov.au/data/dataset/intellectual-property-longitudinal-research-data-2020
    licence: CC BY 4.0
    coverage: Applicants by financial year, 1904 to 2020, with ABN where known

  - id: abr
    title: ABN Bulk Extract
    publisher: Australian Business Register
    tier: 1
    questions: [2, 3]
    url: https://data.gov.au/data/dataset/abn-bulk-extract
    licence: CC BY 3.0 AU
    coverage: Every ABN (current and cancelled) as at the extract date

  - id: asic
    title: ASIC Company Dataset
    publisher: Australian Securities and Investments Commission
    tier: 1
    questions: [2, 3]
    url: https://data.gov.au/data/dataset/asic-companies
    licence: CC BY 3.0 AU
    coverage: Every registered and deregistered company, as at the extract date

  - id: rdti
    title: Research and Development Tax Incentive, report of entity data
    publisher: Australian Taxation Office
    tier: 1
    questions: [3, 4]
    url: https://data.gov.au/data/dataset/research-and-development-tax-incentive
    licence: CC BY 3.0 AU

  - id: abs_bcs
    title: Business Characteristics Survey and characteristics of Australian business (innovation, barriers, finance)
    publisher: Australian Bureau of Statistics
    tier: 1
    questions: [1, 3, 4]
    url: https://data.api.abs.gov.au/
    licence: CC BY 4.0

  - id: abs_cabee
    title: Counts of Australian Businesses, including Entries and Exits
    publisher: Australian Bureau of Statistics
    tier: 1
    questions: [2, 4]
    url: https://www.abs.gov.au/statistics/economy/business-indicators/counts-australian-businesses-including-entries-and-exits
    licence: CC BY 4.0

  - id: abs_regions
    title: SEIFA 2021, Data by Region and ASGS correspondences
    publisher: Australian Bureau of Statistics
    tier: 1
    questions: [2, 4]
    url: https://data.api.abs.gov.au/
    licence: CC BY 4.0

  - id: concordances
    title: Classification concordances (IPC to technology fields and industries; Nice classes; IPC Green Inventory)
    publisher: WIPO and others
    tier: 1
    questions: [1, 2]
    url: https://www.wipo.int/
    licence: see each file's entry in data/raw/concordances/README.md

  - id: wgnd
    title: World Gender-Name Dictionary 2.0
    publisher: WIPO (Harvard Dataverse)
    tier: 1
    questions: [2]
    url: https://doi.org/10.7910/DVN/MSEGSJ
    licence: CC0 1.0

  # Context --------------------------------------------------------------------------------------------------------------
  - id: gii
    title: Global Innovation Index 2026, data file and Appendix III
    publisher: WIPO
    tier: context
    questions: [4]
    url: https://www.wipo.int/global_innovation_index/en/
