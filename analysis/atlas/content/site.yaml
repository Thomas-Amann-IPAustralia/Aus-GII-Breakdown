      questions: [4, 5]
      next: "Owners' payment dates (early payment at the old fee), and the fee's share of a patent's cost of keeping, to read fees as a lever"
    - signal: "FY2025's fall in provisionals followed up within 12 months is in new and heavy individual filers; filers seen before followed up about as often"
      ids: [U8, B38, M35]
