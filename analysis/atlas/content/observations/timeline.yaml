- id: U111
  lens: timeline
  about: system
  headline: A standard patent's renewal fees have moved towards its last years
  statement: >-
    The renewal fee at a patent's 19th anniversary was 4.69 times the 5th's in January 1992 and 8.94 times in June
    2026. The share of the full term's renewals paid from the 15th anniversary rose from 48.7% to 62.1%.
  figures:
    - value: "4.69 → 8.94"
      label: the 19th anniversary's fee against the 5th's
    - value: "48.7% → 62.1%"
      label: of full-term renewals paid from the 15th anniversary
  points:
    - "5.56 in January 2003 and 3.6 in January 2010."
    - "The first renewal fell due at the 3rd anniversary to October 1998, the 5th from November 1998 and the 4th from
      July 2012."
  questions:
    - q: 4
      how: Renewal fees now weigh most on old patents, which bears on how long owners keep them.
  sources: [frl_fees]
  chart:
    type: bar
    title: The last renewal fee against an early one
    subtitle: A standard patent's fee at the 19th anniversary, as a multiple of the 5th's
    x: {type: category, values: [January 1992, January 2003, January 2010, June 2026]}
    y: {name: Times the 5th anniversary's fee, min: 0, format: ratio}
    series:
      - name: Ratio
        data: [4.69, 5.56, 3.6, 8.94]
    source: Federal Register of Legislation (fee regulations) (lens timeline)
  prep:
    - what: Patent renewals by anniversary, one series each.
      why: Renewal fees differ by the patent's age.
  steps:
    - Compare the 19th anniversary's fee with the 5th's at four dates.
    - Find the share of the full term's renewals paid from the 15th anniversary.
  assumptions:
    - As {U108}.
  limits:
    - Describes the fee schedule, not owners' response to it.
  next: >-
    Stage 2 tests filing and lapsing around each change ({B47} to {B49}).
