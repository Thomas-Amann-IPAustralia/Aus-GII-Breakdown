      signal: Who files among government suppliers
      verdict: mixed
      what: >-
        Among suppliers, form, age and a city address hold with the others held (+31.2, +14.6 and +12.3 points); the
        advantaged postcode is not detected once held (+4.6 raw, -0.0 held).
    - id: B24
      signal: Large taxpayers' income and IP
      verdict: mixed
      what: "Large taxpayers with a filing linked do not report more income at the same form, age and state. Allowing
            for these, the ratios are 0.824 (reversed) and 0.961 (no link), against 1.393 and 1.601 on their own."
