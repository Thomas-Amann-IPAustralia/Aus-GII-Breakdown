[project]
name = "ipholmes-corpus"
version = "0.1.0"
description = "The research corpus behind IP Australia's research goal: what public value the IP system creates, for whom, and where intervention could add more."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "python-calamine>=0.3",
  "pycountry>=24.6",
  "pyyaml>=6.0",
  "pyarrow>=26.0.0",
  "boto3>=1.43.117",
  "requests>=2.34.2",
  "openpyxl>=3.1.5",
  "duckdb>=2.0.0",
  "lxml>=6.1.3",
  "beautifulsoup4>=4.15.0",
  "html5lib>=1.1",
  "google-cloud-bigquery>=3.46.2",
  "db-dtypes>=1.8.0",
  "google-cloud-bigquery-storage>=2.43.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.13"]

[project.scripts]
corpus = "corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
