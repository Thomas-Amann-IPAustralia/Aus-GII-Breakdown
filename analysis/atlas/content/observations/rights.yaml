# ------------------------------------------------------------------------------------------------- the events (1.8.2)

- id: U31
  lens: rights
  attachment: Events
  about: data
  headline: Events such as grants and transfers were added only after five checks of how they are recorded
  statement: >-
    Eleven columns of milestones (examination, acceptance, opposition, assignment, extension, lifetime) rest on five
    checks of IP RAPID's event records. Among them: trade marks' recorded ends fall from 3,213 in March 2026 to 0 from
    May, probably because an end is recorded only after the grace period for renewal, so trade marks and designs are
    treated as observed only to 31 March 2026.
  figures:
    - value: "99.99%"
      label: of granted patents have their grant event on the registration date
    - value: "3,213 → 0"
      label: trade marks' recorded ends, March 2026 to May 2026
  points:
    - "**No separate grant column.** A patent's grant event falls on its registration date for 99.99% of granted
      patents."
    - "**Assignments counted once.** 99.78% of patents with an assignment have it published twice, as an assignment
      and as a party change; the first is used."
    - "**Only standing events.** 4.76% of patent lapse events were later reversed, and 60.47% of the patents with one
      are now granted, expired or ceased."
    - "**When a term starts.** 92.19% of ceased trade marks whose two filing dates differ (mostly international ones)
      end a whole number of years after the earliest; 84.59% of standard patents ceased since 1996 end 6 to 7 months
      after an anniversary, at the end of the grace period."
    - "**Left out:** 3,154 events dated 1 January 1970 (a placeholder) and 174 dated before the right was filed (26 of
      them trade mark oppositions dated 1909)."
  questions:
    - q: 1
      how: Lifetimes and sales are signs of a right's private value; they are only usable because these checks hold.
  sources: [iprapid]
  chart: U31
  prep:
    - what: Each milestone is the first event of its kind that the register still holds as standing.
      why: A lapse that was later reversed did not end the right (ADR 0015).
    - what: Trade marks and designs are observed to 31 March 2026, patents and plant breeder's rights to 22 October
        2026.
      why: "Recorded ends of trade marks and designs thin out after March 2026 (trade marks 3,213 in March, 776 in
           April, none from May). Patents' ends run on at 1,442 to 1,820 a month. The likely reason is that an end is
           recorded only once the grace period for renewal has passed."
  steps:
    - Compare each grant event's date with the registration date.
    - Count how often assignments are published twice.
    - Find lapse events that are not standing, and what became of those rights.
    - Measure each ended right's life from its filing and patent dates, to see which date its term runs from.
    - Count ends recorded per month in 2026 to see where the record stops being complete.
  assumptions:
    - A right whose end has not been recorded by the cut-off date is still in force.
  limits:
    - "Some early events were dated in batches, so early milestones are less precise ({U23})."
  next: "The lifetimes feed the measure of how long rights stay in force ({U36}), which the owner has adopted as a
        working measure for Stage 2."
  terms: [grace-period, assignment, placeholder-date]
  related: [U32, U36, U40]

- id: U32
  lens: rights
  attachment: Events
  about: data
  headline: Older register entries leave out many steps, so shares are compared only where recording is complete
  statement: >-
    Examination requests are recorded for 0.27% of standard patents filed in the 1970s, 54.21% of the 1980s' and 85.5%
    to 91.2% a decade since. Trade mark acceptances: 0.26% of the 1970s' marks, 30.88% of the 1980s' and 75.88% to
    79.05% since 2000. Designs' examination requests are recorded only from 2013.
  figures:
    - value: "54.21%"
      label: of 1980s standard patents have an examination request recorded
    - value: "2013"
      label: the year designs' examination requests start
  points:
    - "Petty patents filed FY1986 to FY1988 mostly have no acceptance recorded, though many were registered."
    - "Second-tier patents: examination was requested for 19.52% to 21.97% of those filed each decade since 2000,
      and 13.99% to 16.97% were certified."
    - "Oppositions reach 1.69% to 2.62% of trade marks filed each decade since the 1990s and 0.11% to 0.31% of standard
      patents (recorded from April 2003)."
  questions:
    - q: 4
      how: How applicants move through examination is part of the service IP Australia gives; this says from when it can be measured.
  sources: [iprapid]
  chart: U32
  notebook_charts: [0]
  prep:
    - what: The share of each year's applications with each milestone is worked out by financial year of filing.
      why: Following each year's applications shows when a milestone starts being recorded.
  steps:
    - For each type and filing year, work out the share with each milestone recorded.
    - Average the shares by decade, and look for the years where each one rises from near zero.
  assumptions:
    - "A milestone missing for most rights filed in an early year was not recorded, rather than not reached."
  limits:
    - Where a milestone is not recorded, its absence cannot be read as the step not happening.
  next: >-
    Stage 2 compares milestone shares only within the years each is recorded.
  terms: [examination, acceptance, opposition]
  related: [U31, U33]

- id: U33
  lens: rights
  attachment: Events
  about: system
  headline: Examination took up to 755 days for 2005–06 filings and has since shortened
  statement: >-
    The median time from a standard patent's examination request to its acceptance rose from 408 days (FY1990) to 755
    (FY2006), and has been 422 to 516 days since FY2014. Trade marks went from 666 days to acceptance (FY1990) to 52 to
    184 days from FY2005.
  figures:
    - value: "755 days"
      label: "from request to acceptance, standard patents filed in 2005–06"
    - value: "44 days"
      label: "from filing to request for 2012–13 filings, the rush before Raising the Bar"
  points:
    - "Filing to examination request, standard patents: 192 days (FY2000), 652 (FY2005), 552 (FY2010), 309 (FY2015) and
      553 (FY2021). For FY2013 it is 44 days: applicants asked for examination before Raising the Bar took effect, which
      kept their applications under the old law."
    - "Certification: 123 to 208 days after grant for innovation patents and 73 to 276 days after registration for
      designs."
    - "The latest years are still in progress, so their medians are understated."
  questions:
    - q: 4
      how: Examination time is part of what the office delivers; changes in it are candidate effects of policy and resourcing.
    - q: 2
      how: Stage 2 will ask whether waiting times differ by who applies.
  sources: [iprapid]
  chart: U33
  prep:
    - what: "Typical times are taken among rights that reached each step, by financial year of filing, from 1989–90 to
            2020–21."
      why: "Later years are still being examined, so their typical times would look too short."
  steps:
    - For each right, work out the days between its milestones.
    - "Take the typical time by financial year of filing, for each pair of steps."
  assumptions:
    - The applicant decides when to request examination; that part of the wait is the applicant's, not the office's.
  limits:
    - Only rights that reached a step count, so the times describe successful paths.
  next: >-
    Stage 2 compares times by origin and representation.
  terms: [median, examination, acceptance, raising-the-bar]
  related: [U11, U12, U34]

- id: U34
  lens: rights
  attachment: Events
  about: system
  headline: More patent applicants ask for faster examination; a 2018 fall for trade marks is a records change
  statement: >-
    Expedited examination was requested for 1.87% of standard patents examined (FY2005), rising to 10.31% (FY2026).
    For trade marks, IP RAPID's expedite events fell from 1,373 to 1,548 a month (July to October 2018) to 156 to 294
    a month in 2019. November 2018 is when IP RAPID's trade mark records moved between systems, and IP Australia's
    register shows the requests carried on there ({U103}).
  figures:
    - value: "10.31%"
      label: "of standard patents filed in 2025–26 and examined were fast-tracked on request"
    - value: "1.87%"
      label: "in 2004–05"
  points:
    - "**Trade marks that claim priority** carry an expedite event in IP RAPID to FY2018 and in IP Australia's register
      from FY2019: 97.82% (FY2018) and 99.55% (FY2020) in either record. Other marks' requests ran 4.81% (FY2018) and
      4.48% (FY2019), with no break."
    - "**Not every recorded event is a request.** From FY2019 the register also records an unrequested \"Examination
      expedited\" for 14.95% (FY2019) to 26.69% (FY2026) of these marks; what it means is a question for IP Australia
      (OQ6)."
    - "Designs: 2.48% to 4.05% were expedited since FY2015."
    - "Oppositions: 1.98% to 2.93% of accepted trade marks are opposed in the years shown; standard patents 0.92%
      (FY2005), falling to 0.14% to 0.39% since FY2015. In all, 44,744 trade marks, 1,802 standard patents and 63
      second-tier patents have been opposed."
  questions:
    - q: 4
      how: Demand for speed is a signal of what applicants need; expedited examination is a service IP Australia runs.
  sources: [iprapid]
  chart: U34
  prep:
    - what: Expedite requests are taken from the event records, by financial year of filing and, for trade marks, by month.
      why: A monthly count shows exactly when the trade mark series breaks.
  steps:
    - For each type and year, work out the share of examined applications with an expedite request.
    - Count trade mark expedite requests per month around 2018.
    - Compare the break's month with the date IP RAPID's trade mark records were moved (10 November 2018).
    - Set IP RAPID's events beside IP Australia's register for the same marks, to see where the requests went ({U103}).
  assumptions:
    - A request recorded in either IP RAPID's events or the register is a request; the register's unrequested
      "Examination expedited" is kept apart.
  limits:
    - What the register's unrequested "Examination expedited" means is not known (OQ6), so trade mark rates that
      include it are not compared across 2018.
  next: >-
    Trade mark fast-track requests are compared across November 2018 with IP RAPID's events, and priority-claiming
    marks with either record ({U103}). IP Australia is asked what the register's unrequested "Examination expedited"
    means (OQ6).
  terms: [expedited, opposition]
  related: [U33, U29]

- id: U35
  lens: rights
  attachment: Events
  about: system
  headline: About one patent in seven and one trade mark in five has a recorded change of owner
  statement: >-
    15.1% of standard patents filed in the 2000s and 13.99% of the 1990s' have a recorded assignment (a change of
    owner), as do 18.1% and 20.63% of trade marks. Before FY2003, assignments are the only record of a change of
    owner for patents ({U17}), and how many changes they capture is unknown.
  figures:
    - value: "15.1%"
      label: of 2000s standard patents assigned
    - value: "18.1%"
      label: of 2000s trade marks assigned
  points:
