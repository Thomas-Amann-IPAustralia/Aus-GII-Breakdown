      how: Which suppliers file is their form, age and city address, not their postcode's advantage.
    - q: 3
      how: "Large taxpayers that file report no more income than others of the same form, age and state. So among
           them, filing is not a sign of larger income."
    - q: 4
      how: Part of the sixth early signal, on which firms an intervention through procurement would reach.
  sources: [austender, ato_ctt, linkage, abr, iprapid, abs_regions]
  prep:
    - what: Active suppliers, in each half; each of four signals modelled with the others and the state held.
      why: The four go together (public companies are older and in cities), so each is read at the others' levels.
    - what: "Large taxpayers' latest total income, from the tax office's transparency reports, compared for those with
            a filing linked and those without, allowing for type, age and state."
      why: Income is skewed, so a ratio of averages is the natural reading.
  steps:
    - Compare suppliers on form, age, city and postcode advantage, each with nothing held.
    - "Fit one model with all four factors and the state, and give each outcome in each half."
    - Model large taxpayers' income with form, age and state held.
  assumptions:
    - "The business register's entity type gives a firm's form, and its first public registration gives its age."
  limits:
    - "Size is not allowed for; it is known only for employers who report to the Workplace Gender Equality Agency."
  next: >-
    Part of the sixth early signal: firm size for small firms (OQ20), and the timing of filing against contracts.
  terms: [held-together, average-marginal-effect, irsad, gamma, verdict-words]
  related: [B22, B24, M9, M8]

- id: M30
  lens: firms
  about: system
  headline: Patents filed before a firm was registered more often end up owned only overseas
  statement: >-
    Joined to the firm that filed them, Australian-founded patents filed before the firm's first public registration are
    more often now held only overseas than those of firms 10 years or more, with grant, reach, field, route and year
    held: +5.40 points (FY2003 to FY2011) and +6.21 (FY2012 to FY2021). Firms under 2 years old are not detected either
    way.
  figures:
    - value: "+5.40 and +6.21 points"
      label: "filed before first registration, against firms 10 years or more, allowing for the rest"
    - value: "7.77% against 2.33%"
      label: "now owned only overseas, 2011–12 to 2020–21, on its own"
    - value: "26,204"
      label: patents from 9,380 firms
  points:
    - "**Filed before first registration:** 7.01% against 3.24%, +3.77 raw and +5.40 held, FY2003 to FY2011; +5.44 and
      +6.21, FY2012 to FY2021. Holds."
    - "**Under 2 years old:** +2.55 raw and +3.66 held; +0.56 and +0.91. Not detected either way."
    - "Who filed before the firm was registered (a founder, or a business before its ABN) is not in the data. Two
      endpoints, not transfers."
  revisits:
    - id: B26
      signal: The filing firm's age and patents held overseas
      verdict: holds
      what: "Patents filed before the firm's first registration are more often now owned only overseas, allowing for
            grant, reach, field, route and year (+5.40 and +6.21 percentage points). Firms under 2 years old show no
            clear difference, as B26 found."
  held: [grant, family reach, the technology field, the route of filing, the filing year, "several original
                                                                                          applicants"]
  verdicts:
    - signal: Filed before the firm's first registration
      detail: "+3.77 and +5.44 on its own; +5.40 and +6.21 allowing for the rest"
      verdict: holds
    - signal: Firms under 2 years old
      detail: "+2.55 and +0.56 on its own; +3.66 and +0.91 allowing for the rest; every likely range includes zero"
      verdict: not detected either way
  chart:
