# The key fees in the versions of each fee regulation that the Federal Register of Legislation holds no text for.
# Compiled here (2026-10-28) by reading each amending instrument the Register lists for those versions; ADR 0031.
# Every other version is read from its compilation. Instruments that changed no key fee are listed under `checked`.
#
# For each title, `entries` are applied in date order to the state before them:
#   parse: substitute  - the instrument replaces the fee schedule (or the Part holding the key fees): its key fees,
#                        read from its tables by the same rules as a compilation, replace the title's
#   parse: update      - its key fees, read the same way, are added or replace those of the same name
#   changes            - fees set by hand from the instrument's "omit ..., substitute ..." items; null ends a fee;
#                        a patent renewal is named with its anniversary (standard_renewal_3)
# `date` is when the amendment commenced (its commencement clause), `instrument` the Register's id, `provision` where
# the change is made.

titles:
  F1996B02697:  # Patents Regulations 1991
    # Compilation 39 (C2004H02603, from 1 March 2001) already shows the innovation patent fees of SR 2001 No. 98,
    # which commenced on 24 May 2001; it differs from compilation 37A in nothing else, so it is not read.
    skip_compilations: [2001-03-01]
    entries:
      - {date: 1992-07-01, instrument: F1996B02699, provision: "SR 1992 No. 148, reg 6: Schedule 7 substituted", parse: substitute}
      - {date: 1993-07-01, instrument: F1996B02700, provision: "reg 7: Schedule 7 Parts 1 to 3 substituted", parse: substitute}
      - date: 1994-10-01
