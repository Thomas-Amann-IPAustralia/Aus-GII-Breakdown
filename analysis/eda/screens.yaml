    sfd_qld: {skip: "as gdp_cvm"}
    sfd_sa: {skip: "as gdp_cvm"}
    sfd_wa: {skip: "as gdp_cvm"}
    sfd_tas: {skip: "as gdp_cvm"}
    sfd_nt: {skip: "as gdp_cvm"}
    sfd_act: {skip: "as gdp_cvm"}
  groups: {}

industries:
  # 19 divisions: the screen compares divisions in FY2024 (the BERD survey's year) and again in FY2025, with each
  # count made a ratio to the division's businesses (section 6 of the notebook). Business R&D exists for FY2024 only,
  # so its pairs are held fixed in the second year, which tests the other member's stability only.
  key: division
  discovery: "fy = 2024"
  replication: "fy = 2025"
  columns:
    division: {skip: identifier}
    division_name: {skip: "the division's name"}
    fy: {skip: "the time axis"}
    patents_standard: {skip: in patents_per_1k_businesses}
    patents_standard_au: {skip: in patents_au_per_1k_businesses and patents_au_share}
    patents_second_tier: {skip: "innovation patents closed in 2021: too few by FY2024"}
    patents_standard_with_services: {skip: "the crosswalk with services: screened in its own run in place of patents_standard (6.4, gap A2)"}
    patents_standard_au_with_services: {skip: "as patents_standard_with_services"}
    trade_marks: {skip: in trade_marks_per_1k_businesses}
    trade_marks_au: {skip: in trade_marks_au_per_1k_businesses and trade_marks_au_share}
    businesses_start: {skip: "the denominator of the ratios; its size is in businesses"}
    businesses_end: {skip: "as businesses_start"}
    business_entries: {skip: in business_entry_rate}
    business_exits: {skip: in business_exit_rate}
    business_entry_rate: number
    business_exit_rate: number
    berd: {skip: in berd_per_business}
    wpi_index: {skip: in wages_growth}
    creative_gva: {skip: "in creative_gva_per_business"}
    gva_cvm: {skip: "the national accounts (gap B2): screened in its own run as value added per business (6.4)"}
  ratios:
    businesses: "businesses at the start of the year"
    patents_per_1k_businesses: "standard patent applications (expected) per 1,000 businesses"
    patents_au_per_1k_businesses: "Australian applicants' standard patent applications per 1,000 businesses"
    patents_au_share: "Australian applicants' share of standard patent applications"
    trade_marks_per_1k_businesses: "trade mark applications per 1,000 businesses"
    trade_marks_au_per_1k_businesses: "Australian applicants' trade mark applications per 1,000 businesses"
    trade_marks_au_share: "Australian applicants' share of trade mark applications"
    berd_per_business: "business R&D (FY2024) per business, $'000"
    wages_growth: "the Wage Price Index's change over the five years to the year, %"
    creative_gva_per_business: "cultural and creative value added per business, $m"
  groups:
    patents: [patents_per_1k_businesses, patents_au_per_1k_businesses, patents_au_share]
    trade_marks: [trade_marks_per_1k_businesses, trade_marks_au_per_1k_businesses, trade_marks_au_share]
    business_flows: [business_entry_rate, business_exit_rate]

institutions:
  # Institutions are compared over two seven-year periods (2017-2023, discovery; 2010-2016, replication; OpenAlex
  # starts in 2010), each count summed over the period and made a ratio to the institution's research works, since
  # every count grows with an institution's size; size itself is kept as works. Children (parent_ror) are kept as
  # their own rows: their counts are their own, never added to the parent's (U81).
  key: ror
  discovery: "year BETWEEN 2017 AND 2023"
  replication: "year BETWEEN 2010 AND 2016"
  columns:
    ror: {skip: identifier}
    institution: {skip: "the institution's name"}
    kind: category
    parent_ror: {skip: "an identifier (whether the institution is part of another is has_parent)"}
    state: category
    established: number
    ror_status: {skip: "two inactive institutions only"}
    year: {skip: "the period (summed over)"}
    works: number
    citations: {skip: in citations_per_work}
    works_patent_cited: {skip: in share_patent_cited}
    patent_citations: {skip: in patent_citations_per_kwork}
    patent_citations_au: {skip: in au_share_of_patent_citations}
    arc_grants: {skip: in arc_grants_per_kwork}
    arc_funding: {skip: "in arc_grants_per_kwork (funding follows grants)"}
    arc_industry_grants: {skip: in arc_industry_share}
    arc_industry_funding: {skip: "in arc_industry_share"}
    nhmrc_grants: {skip: in nhmrc_grants_per_kwork}
    nhmrc_funding: {skip: "in nhmrc_grants_per_kwork (funding follows grants)"}
    patents_standard: {skip: in patents_per_kwork}
    patents_standard_shared: {skip: in shared_patent_share}
    patents_provisional: {skip: in provisionals_per_kwork}
    patents_second_tier: {skip: "innovation patents closed in 2021; too few"}
    trade_marks: {skip: in trade_marks_per_kwork}
    designs: {skip: "too few (a handful a year)"}
    patent_families: {skip: in families_per_kwork}
    patent_families_us_granted: {skip: in us_granted_share}
    patent_family_citations_5y: {skip: in family_citations_per_family}
    contracts: {skip: in contracts_per_kwork}
    contract_value: {skip: "in contracts_per_kwork (value follows contracts)"}
  ratios:
    has_parent: "part of another institution"
    citations_per_work: "citations received per work"
    share_patent_cited: "share of works cited by US patents"
    patent_citations_per_kwork: "citations from US patents per 1,000 works"
    au_share_of_patent_citations: "share of US patent citations from patents with Australian links"
    arc_grants_per_kwork: "ARC grants per 1,000 works"
    arc_industry_share: "share of ARC grants with industry partners"
    nhmrc_grants_per_kwork: "NHMRC grants per 1,000 works"
    patents_per_kwork: "standard patent applications per 1,000 works"
    shared_patent_share: "share of standard patent applications filed with others"
    provisionals_per_kwork: "provisional applications per 1,000 works"
    trade_marks_per_kwork: "trade mark applications per 1,000 works"
    families_per_kwork: "patent families per 1,000 works"
    us_granted_share: "share of patent families granted in the US"
    family_citations_per_family: "citations to patent families within five years, per family"
    contracts_per_kwork: "government contracts per 1,000 works"
  groups:
    patents: [patents_per_kwork, families_per_kwork, provisionals_per_kwork]
    patent_citations: [share_patent_cited, patent_citations_per_kwork, au_share_of_patent_citations]

institution_rights:
  # The institutions lens's IP detail: one row per right and institution. Its pairs are about how rights were matched
  # and shared, screened over the two halves of the rows by a hash of the right and institution.
  key: "application_number || ror"
  discovery: half
  replication: half
  columns:
    ip_right_type: category
    application_number: {skip: identifier}
    ror: {skip: "identifier (the institution's kind is in the institutions lens)"}
    matched_by: category
    country_unknown: category
    shared: category
    shared_with_institution: category
  groups:
    shared: [shared, shared_with_institution]

