# The variable register: every column of every lens table, in plain English.
#
# label: what the column holds, as a chart axis should say it.
# kind:  id | category | binary | count | money | numeric | rate | date | year. It decides which univariate checks apply.
# unit:  the unit, where there is one.
# note:  how it was made, or what to watch for. Definitions of derived columns are in analysis/eda/build.py.

rights:
  application_number: {label: Application number, kind: id}
  ip_right_type: {label: Type of right, kind: category, note: "patent, trade_mark, design or pbr (plant breeder's right)"}
  ip_right_sub_type: {label: Sub-type of right, kind: category, note: "e.g. standard or innovation patent"}
  patent_type: {label: Type of patent, kind: category, note: "standard (complete), provisional, or second_tier (innovation and petty); empty for other rights. Count standard patents for headline figures: a provisional is usually followed by a standard application for the same invention. Second-tier patents span two regimes (petty to 2001, innovation from 24 May 2001 to 25 August 2021), so their series breaks in 2001"}
  status: {label: Current status, kind: category, note: "as IP RAPID records it today; 'unknown' is common for old rights"}
  application_date: {label: Application date, kind: date, note: "the date of filing in Australia; for a PCT application (614,951 standard patents), the date it entered the national phase, a median 909 days after its priority date (ADR 0010)"}
  earliest_filed_date: {label: Earliest filing date, kind: date, note: "as IP RAPID gives it: for a PCT application, the international filing date; for a Madrid trade mark, the international registration's; for a divisional, often the parent's; otherwise the application date. It is later than the application date for 125 rights (120 of them trade marks), a quirk of the register"}
  filing_fy: {label: Financial year of application, kind: year, note: "year ending 30 June, from application_date. Counts per year understate filings before 1983 for trade marks, 1986 for designs and September 1985 for provisional applications: IP RAPID holds only the earlier rights still on the register when its records were computerised (ADR 0014)"}
  priority_date: {label: Priority date, kind: date, note: "the earliest claimed filing anywhere"}
  registered_date: {label: Date registered or granted, kind: date, note: "empty if never registered. For a trade mark registered before 1986 it is the filing date: IP RAPID holds no date entered before then (ADR 0010). One placeholder (1 January 1901) is emptied (ADR 0012). For an innovation patent it is the grant after a check of formalities only, not after examination: examination came later, as certification, and is not this date"}
  days_to_registration: {label: Days from application to registration, kind: numeric, unit: days, note: "empty for trade marks registered before 1986, whose registration date is their filing date (ADR 0012). Negative for 57 rights, 53 of them trade marks registered after their earliest filing date but before the later date IP RAPID gives as their application date. Recent cohorts are still being examined, so their typical times are understated. For innovation patents it is the time to a grant without examination, so it is not comparable with standard patents' times"}
  retired_date: {label: Date the right ended, kind: date, note: "lapsed, expired, ceased, withdrawn or refused. The placeholder 1 January 1970 (1,282 rights, all filed from 2013) is emptied (ADR 0012); 14 ceased designs carry a date in 2028 or 2029, apparently the date their term would have ended"}
  applicant_count: {label: Number of applicants, kind: count}
  applicant_type: {label: Applicant type, kind: category, note: "organisation or individual (first applicant)"}
  applicant_country: {label: Applicant country, kind: category, note: "two-letter code (first applicant), as recorded"}
  applicant_state: {label: Applicant state, kind: category, note: "first applicant, as recorded; for an Australian applicant with no state recorded, the state of the postcode's postal area (ADR 0012). Overseas applicants' states are kept as recorded, so 'wa' can be Washington"}
  applicant_postcode: {label: Applicant postcode, kind: category, note: "Australian applicants only; cleaned to 4 digits"}
  applicant_postcode_raw: {label: Applicant postcode as recorded, kind: category, note: "first applicant, any country, uncleaned; overseas codes are not located yet"}
  applicant_countries: {label: Countries of all applicants, kind: category, note: "two-letter codes of every current applicant, space-separated; each applicant's address is in iprapid/party, by application number"}
  applicants_au: {label: Applicants in Australia, kind: count, note: "current applicants"}
  applicants_overseas: {label: Applicants overseas, kind: count, note: "current applicants with a country other than Australia"}
  applicants_country_unknown: {label: Applicants of unknown country, kind: count}
  applicant_abn: {label: Applicant ABN, kind: id, note: "the first applicant with an ABN"}
  has_abn: {label: An applicant has an ABN, kind: binary}
  australian_applicant: {label: An applicant is in Australia, kind: binary, note: "true if any current applicant is in Australia; false if at least one has a known country and none is; empty (origin unknown) if no applicant has a country, which is most patents filed before 1980 (ADR 0009)"}
  has_agent: {label: An attorney or agent acts, kind: binary, note: "an agent who is not one of the right's applicants or owners (by party id, or by name with case and punctuation removed) is on the record at any time. IP RAPID's agent is the address for service, which is often the applicant itself, so its own flag overstated attorney use (ADR 0012). Empty (unknown) for provisional applications: IP RAPID publishes no agents for them (ADR 0010)"}
  main_class: {label: Main class, kind: category, note: "IPC subclass for patents, Nice class for trade marks, Locarno class for designs, the plant genus or species for plant breeder's rights"}
  main_area: {label: Technology area, kind: category, note: "WIPO's 35 technology fields, patents only (IP RAPID repeats the Nice or Locarno class here for trade marks and designs, so those are emptied; so is WIPO's '99_unknown', ADR 0012)"}
  class_count: {label: Number of classes, kind: count}
  founder_count: {label: Number of founding applicants, kind: count, note: "applicants or owners IP RAPID marks as founding (who filed the right); 0 if none is marked (76,382 standard patents and 15,146 designs, almost all old records with no applicant at all, and 952 trade marks). The applicant columns above describe the current holder (ADR 0013)"}
  founder_type: {label: Founding applicant type, kind: category, note: "organisation or individual: the first founding applicant, as first recorded"}
  founder_country: {label: Founding applicant country, kind: category, note: "two-letter code of the first founding applicant, as first recorded"}
  founding_australian: {label: A founding applicant was in Australia, kind: binary, note: "three-valued like australian_applicant, but over the founding applicants, each as first recorded: who filed, not who holds"}
  founder_postcode: {label: Founding applicant postcode, kind: category, note: "the first founding applicant in Australia, cleaned to 4 digits; for a right filed jointly with an overseas applicant it is still the Australian one's"}
  founder_state: {label: Founding applicant state, kind: category, note: "the same applicant's state, or its postcode's postal area's where none (or no valid one) is recorded (as for applicant_state, ADR 0012)"}
  founder_abn: {label: Founding applicant ABN, kind: id, note: "the first founding applicant with an ABN"}
  register_abn: {label: Owner's ABN in IP Australia's register, kind: id, note: "trade marks and designs: an ABN the register gives a current owner, else the ABN of the ACN it gives (where the ABR gives that ACN one ABN). From ipa_register, as at 27 October 2026 (ADR 0029). Not IP RAPID's, which is applicant_abn"}
  register_abn_basis: {label: Where the register's ABN came from, kind: category, note: "register (the ABN it gives) or acn (through the ACN it gives and the ABR)"}
  filer_abn: {label: Filer's ABN (filled from the register), kind: id, note: "founder_abn; where IP RAPID has none, the register's (register_abn), as long as the right has not changed hands (holder_changed is not true), so that it is still the filer's. Firms are credited by this ABN (ADR 0029). Patents are not filled: only provisionals were taken from the register"}
  has_abn_filled: {label: An applicant has an ABN (filled from the register), kind: binary, note: "has_abn, or an ABN in the register (register_abn)"}
  register_country: {label: Owner's country in IP Australia's register, kind: category, note: "trade marks and designs: the first current owner's two-letter code, as the register gives it (ADR 0029)"}
  australian_applicant_filled: {label: An applicant is in Australia (filled from the register), kind: binary, note: "australian_applicant; where IP RAPID gives no applicant a country (origin unknown), the register's: true if any current owner it gives is in Australia, empty if it gives no country either. Fills 25,018 designs (V13); the remaining unknowns have no owner on record anywhere (ADR 0029)"}
  register_expedited: {label: Expedited in the register's history, kind: binary, note: "trade marks: the register's own history records an expedite event ('Examination expedited', 'Expedite Work Initiated', 'Expedite' and so on). Since November 2018 it records 'Examination expedited' for every mark claiming convention priority, which IP RAPID does not publish (V14); compare with exam_expedited, IP RAPID's. Empty for marks not in the register"}
  register_expedite_date: {label: Date of the register's first expedite event, kind: date}
  holder_changed: {label: Holder differs from the filer, kind: binary, note: "the current applicants or owners are not the founding ones (compared by party id, which IP RAPID keeps through changes of address); empty if either is missing, and for patents filed before FY2003, for which IP RAPID keeps one set of applicants, entered when records moved between systems (a median 21 years after filing), so the founding columns may describe a later holder. A change of name can count as a change"}
  agent_id: {label: Agent, kind: id, note: "the right's agent who is not one of its applicants and who acts for the most applicants across the register (an IP RAPID party id; individuals are pseudonymised)"}
  agent_name: {label: Agent name, kind: category, note: "the agent's name if it is an organisation, usually the attorney firm; empty for individuals"}
  agent_clients: {label: Applicants the agent acts for, kind: count, note: "distinct applicants or owners the agent acts for across the whole register, all years: a firm of attorneys acts for many"}
  representation: {label: Who represents the applicant, kind: category, note: "attorney (an agent of 5 or more applicants), other_agent (an agent who is not the applicant but acts for fewer: often a related company or in-house), or self (no agent but the applicant). Empty for provisional applications (ADR 0013)"}
  date_of_patent: {label: Date of patent, kind: date, note: "patents only: the date a patent's term runs from (IP RAPID's date_of_patent event), the filing date of the complete application; for a PCT application the international filing date, for a divisional often the parent's. Every milestone below is the first standing event of its kind (a reversed lapse or a withdrawn acceptance is not standing), dated 1904 to 22 October 2026 and not before the right's earliest filing (171 events are), leaving out the placeholder 1 January 1970 (ADR 0015)"}
  exam_requested_date: {label: Date examination was requested, kind: date, note: "patents and designs: the first request for examination, expedited or not, re-examination left out. A trade mark is examined without a request, so it is empty for them. For a PCT application it can fall shortly before the application date (the national phase entry)"}
  exam_expedited: {label: Expedited examination asked for, kind: binary, note: "true if the applicant asked for examination to be expedited; false for every other trade mark and every other patent or design with an examination request; empty otherwise"}
  accepted_date: {label: Date accepted, kind: date, note: "patents (standard and petty), trade marks and plant breeder's rights: the first acceptance, the decision that the application meets the requirements (for a plant breeder's right, the acceptance of the application for examination). Innovation patents and designs are not accepted"}
  certified_date: {label: Date certified, kind: date, note: "innovation patents and designs: the first certification, the examination after grant or registration that a right needs before it can be enforced"}
  opposed_date: {label: Date first opposed, kind: date, note: "patents and trade marks: the first opposition lodged to the grant or registration. Recorded for patents from April 2003 only; a trade mark's application for removal for non-use is not counted (the timeline's trade mark oppositions count both)"}
  assignment_count: {label: Assignments recorded, kind: count, note: "patents, trade marks and designs: recorded transfers of ownership, each counted once a day (patents: IP RAPID's published assignments, also published as party changes; trade marks and designs: ownership publications). Recorded from 1979 for patents, 1987 for trade marks and 1990 for designs (ADR 0014 for their earliest months); empty for plant breeder's rights, which have none in IP RAPID"}
  first_assigned_date: {label: Date first assigned, kind: date, note: "the date of the first recorded assignment (see assignment_count)"}
  term_extended_date: {label: Date the term was extended, kind: date, note: "standard patents: the date an extension of term was granted (pharmaceutical substances, up to five years)"}
  in_force: {label: Still in force, kind: binary, note: "for rights that were granted or registered: true if not ended by the date the register's record of ends is complete (31 March 2026 for trade marks and designs, whose ends are recorded only after a six-month grace period; 22 October 2026 for patents and plant breeder's rights). Empty for rights never granted, for 6,621 whose status ended them but has no end date, and for 26 dated to end before their term began (ADR 0015)"}
  years_in_force: {label: Years in force, kind: numeric, unit: years, note: "from the date the term runs from (the date of patent; a trade mark's or design's earliest filing date, the international registration's for a Madrid mark; a plant breeder's right's grant) to its end (retired_date), or to the date in in_force if it is still in force, when it is unfinished (censored). A patent's recorded cessation falls 6 to 7 months after an anniversary of its date of patent, at the end of the grace period. Rights filed before IP RAPID's records are complete are survivors (trade marks before 1983, designs before 1986), and patents' outcomes start with those filed in 1979 (ADR 0014), so lifetimes are compared from those cohorts. 104 rights exceed their type's longest term, a quirk of their dates"}
  filing_route: {label: How the right came to Australia, kind: category, note: "from IP RAPID's links (ADR 0022). Standard and second-tier patents: pct (the national phase of an international application), divisional (divided from an earlier Australian application), convention (claiming a priority filed abroad), australian_priority (claiming only an Australian application, usually a provisional) or direct (claiming nothing). Trade marks: madrid (an international registration designating Australia), divisional, convention or direct; designs: divisional (including a design excluded from an earlier application under the Designs Act 2003), convention or direct. The first that applies, in that order. Empty for provisional applications and plant breeder's rights"}
  priority_claims: {label: Priorities claimed, kind: count, note: "distinct earlier applications claimed as priority (patents' convention priorities and associated provisionals; trade marks' and designs' convention priorities). Empty for plant breeder's rights"}
  priority_office: {label: Office of the earliest priority, kind: category, note: "two-letter office code of the earliest priority claimed. For patents it is read from the number, because IP RAPID labels PCT numbers and many other offices' numbers au: au for an Australian application number (ten digits, year first) or an associated provisional; the receiving office for a PCT number; IP RAPID's label otherwise, or empty where that label is au or wo but the number is neither (ADR 0022)"}
  australian_priority: {label: Claims an Australian application, kind: binary, note: "patents: claims an earlier Australian application (usually a provisional) as priority, whatever its route"}
  divisional: {label: Divisional application, kind: binary, note: "divided from an earlier Australian application of the same type (for designs, also a design excluded from an earlier application). Empty for plant breeder's rights"}
  pct_number: {label: PCT application number, kind: id, note: "patents entering Australia through the PCT: the international application number, as IP RAPID gives it"}
  pct_office: {label: PCT receiving office, kind: category, note: "the office the international application was filed at, read from its number (ib is WIPO's International Bureau): usually the applicant's home office, or the European Patent Office"}
  madrid_export: {label: Basis of an international registration, kind: binary, note: "trade marks: the Australian mark is the basis of an application for international registration through the Madrid system, filed through IP Australia (an Australian mark taken abroad)"}
  family_id: {label: Patent family (Google Patents), kind: id, note: "patents: the Google Patents family of the application, matched on Google's Australian application number (au_application) with designs (kind S) left out; 734 numbers fall in two families, and the first is taken. Provisional applications are rarely published, so rarely matched (ADR 0022)"}
  family_priority_date: {label: Family's first priority date, kind: date, note: "the earliest priority date across the family's publications"}
  family_offices: {label: Offices the family was filed in, kind: count, note: "national and regional offices with a publication in the family, counting Australia and leaving out WIPO (WO) and the European Patent Office (EP), whose filings are not themselves protection; a family of 1 was filed only in Australia. A measure of how widely an invention is protected"}
  family_granted_us: {label: Family granted in the United States, kind: binary, note: "a publication in the family is a US grant"}
  family_citations: {label: Families citing the family, kind: count, note: "distinct patent families worldwide citing any publication of the family, to the October 2026 release: grows with the family's age, so compared within cohorts"}
  family_citations_5y: {label: Families citing it within five years, kind: count, note: "the same, counting only citing families first filed within five years of the family's first priority; empty for families first filed after 22 April 2020, whose five years (and the 18 months before citing applications are published) are not complete"}
  inventors: {label: Inventors named, kind: count, note: "the inventors of the patent's family, from the publication naming the most (ADR 0008), so a lower bound; empty where the family is not in Google Patents or names none. A family's inventors are counted for each of its Australian applications"}
  inventors_au: {label: Inventors in Australia, kind: count, note: "inventors whose country is Australia (from the publication, or the same name elsewhere in the family)"}
  inventors_abroad: {label: Inventors outside Australia, kind: count}
  inventors_country_unknown: {label: Inventors of unknown country, kind: count}
  invented_in_australia: {label: An inventor was in Australia, kind: binary, note: "true if any inventor is in Australia, false if at least one has a known country and none is in Australia, empty if no inventor's country is known"}
  inventors_women_expected: {label: Expected number of women among the inventors, kind: numeric, note: "the sum of each inventor's estimated probability of being a woman, from their first name and country (WIPO's World Gender-Name Dictionary): an expected count for groups, not anyone's stated gender (ADR 0022 checks it against WIPO's published shares by country)"}
  inventors_men_expected: {label: Expected number of men among the inventors, kind: numeric}
  inventors_gender_unknown: {label: Inventors with no gender estimate, kind: count, note: "initials, or names the dictionary lacks"}
  register_inventors: {label: Inventors named in IP Australia's register (provisionals), kind: count, note: "provisional applications only: the inventors the register names (ipa_provisionals, ADR 0029). Google Patents holds almost no provisionals, so `inventors` is empty for them; the register names inventors from about 2002. 0 where it names none"}
  register_inventors_women_expected: {label: Expected number of women among the register's inventors, kind: numeric, note: "the sum of each inventor's estimated chance of being a woman, from the given name and the first applicant's country in IP RAPID (the register gives no inventor's country), by the World Gender-Name Dictionary (ADR 0022, 0029); inventors with no estimate add nothing (count them in register_inventors_gender_unknown)"}
  register_inventors_men_expected: {label: Expected number of men among the register's inventors, kind: numeric, note: "as register_inventors_women_expected"}
  register_inventors_gender_unknown: {label: Register's inventors with no gender estimate, kind: count}

firms:
  abn: {label: ABN, kind: id}
  entity_type: {label: Entity type (ABR), kind: category}
  entity_group: {label: Entity group, kind: category, note: "entity_type grouped into eight kinds (APRA-regulated funds are super funds); see build.py"}
  abn_active: {label: ABN is active, kind: binary}
  gst_registered: {label: Registered for GST, kind: binary, note: "a rough marker of turnover of $75,000 or more"}
  state: {label: State, kind: category, note: "the ABR's state of the main business address; the ABR leaves it blank for 3,977 ABNs, of which 165 are filled from the postcode's postal area (ADR 0016)"}
  postcode: {label: Postcode, kind: category}
  remoteness: {label: Remoteness of postcode, kind: category, note: "ABS Remoteness Area of the postal area; empty for an area of people with no usual address"}
  irsad_decile: {label: Advantage of postcode (IRSAD decile), kind: numeric, note: "1 = most disadvantaged tenth of areas, 10 = most advantaged"}
  asic_type: {label: ASIC company type, kind: category}
  first_seen: {label: First seen (earliest public registration), kind: date, note: "the earliest of the ABN status date (active ABNs), GST registration and ASIC registration: the public registers give only current statuses, so a lower bound on the business's start"}
  age_years: {label: Years since earliest public registration, kind: numeric, unit: years, note: "from first_seen to the corpus build date (2026-10-22); not the founding age: see age_basis and age_truncated (ADR 0010)"}
  age_basis: {label: Register that set first_seen, kind: category, note: "asic (company registration), abn (ABN status date) or gst (GST registration)"}
  age_truncated: {label: Business may be older than its first public registration, kind: binary, note: "first seen before 2001 through its ABN or GST date: ABNs and GST began in 1999-2000, so an older business reads as that age"}
  in_iprapid_patent: {label: Applicant or owner of a patent (IP RAPID), kind: binary, note: "founding or current"}
  in_iprapid_trade_mark: {label: Applicant or owner of a trade mark (IP RAPID), kind: binary, note: "founding or current"}
  in_iprapid_design: {label: Applicant or owner of a design (IP RAPID), kind: binary, note: "founding or current"}
  in_iplord: {label: Linked to IP by IPLORD (to FY2020), kind: binary, note: "IP Australia's IPLORD panel links this ABN to trade marks, designs or plant breeder's rights filed to FY2020. 50,790 ABNs are in the lens only through IPLORD: IP RAPID gives none of their rights an ABN, so their IP counts here are 0, a lower bound (ADR 0016). IPLORD's own counts are built differently and are not used"}
  in_rdti: {label: Claimed the R&D Tax Incentive (2021-22 to 2023-24), kind: binary}
  in_austender: {label: Has a government contract (AusTender), kind: binary}
  in_ato_ctt: {label: In the ATO tax transparency reports, kind: binary, note: "large entities only: total income of $100m or more (Australian-owned private companies: $200m until 2021-22)"}
  patent_first_fy: {label: Financial year of first patent application, kind: year}
  trade_mark_first_fy: {label: Financial year of first trade mark application, kind: year}
  design_first_fy: {label: Financial year of first design application, kind: year}
  in_register: {label: An owner in IP Australia's register, kind: binary, note: "the register gives this ABN (or an ACN that has it) to a current owner of a trade mark or design (ADR 0029). Firms only the register links to IP are in the lens through it"}
  patent_first_fy_filled: {label: Financial year of first standard patent application (filled), kind: year, note: "from the rights lens: the first filing year of a standard patent credited to this ABN as filer_abn. patent_first_fy is IP RAPID's (any patent, by earliest filing date, from iprapid/applicant_year); the two are built differently, so compare a series within one"}
  trade_mark_first_fy_filled: {label: Financial year of first trade mark application (filled), kind: year, note: "as patent_first_fy_filled, for trade marks: the register's ABNs fill the years IP RAPID leaves out (V12), so firms' entry can be followed past FY2024 (ADR 0029)"}
  design_first_fy_filled: {label: Financial year of first design application (filled), kind: year, note: "as trade_mark_first_fy_filled, for designs"}
  ip_filed_total: {label: IP applications as a founding applicant, kind: count, note: "every right and patent sub-type (provisionals included), from IP RAPID's applicant panel; a right with two founding applicants counts once for each"}
  ip_filed_weighted: {label: IP applications as a founding applicant (shared ones split), kind: numeric, note: "as ip_filed_total, but a right with two founding applicants counts 0.5 for each, so the sum over firms is the number of rights (IPLORD's weighting)"}
  n_patents_standard: {label: Standard patent applications, kind: count, note: "filed by this ABN: where it is the filer (`filer_abn` in the rights lens: the first founding applicant with an ABN, else the register's owner while the right has not changed hands; ADR 0016, 0029), not the current holder. For patents filed before FY2003 the founding applicant may be a later holder (ADR 0013)"}
  n_patents_provisional: {label: Provisional patent applications, kind: count, note: "as n_patents_standard; not added to it, since a provisional is usually followed by a standard application"}
  n_patents_second_tier: {label: Innovation and petty patent applications, kind: count, note: "as n_patents_standard"}
  n_trade_marks: {label: Trade mark applications, kind: count, note: "as n_patents_standard"}
  n_designs: {label: Design applications, kind: count, note: "as n_patents_standard"}
  n_held: {label: Rights held now, kind: count, note: "rights of every type and status whose first current applicant or owner with an ABN is this ABN (`applicant_abn` in the rights lens): who holds, beside who filed (ADR 0016)"}
  n_held_in_force: {label: Rights held now and in force, kind: count, note: "as n_held, only rights in force (`in_force` in the rights lens): trade marks and designs as at 31 March 2026, the rest at 22 October 2026 (ADR 0015)"}
  rdti_years: {label: Years claiming the R&D Tax Incentive, kind: count, note: "0 to 3"}
  rd_expenditure_mean: {label: Average R&D spend claimed, kind: money, unit: AUD a year, note: "each year's claim as the latest report gives it, amended where it was (ADR 0010); nominal dollars"}
  rd_latest: {label: R&D spend claimed (latest year), kind: money, unit: AUD, note: "as rd_expenditure_mean"}
  ato_ctt_years: {label: Years in the tax transparency reports, kind: count}
  total_income_latest: {label: Total income (latest year reported), kind: money, unit: AUD, note: "the latest report's value for that year"}
  austender_contracts: {label: Government contracts, kind: count, note: "contracts, not notices: each counted once, with its supplier as its latest notice names it (ADR 0010)"}
  austender_value: {label: Contract value at latest amendment, kind: money, unit: AUD, note: "the sum of the contracts' values at their latest notice (an amendment carries the new total): each contract's total over its whole life as last amended (an amendment can lower it), not spending in a year; nominal dollars. Amendments made after August 2019 to contracts that had ended by then are not in the corpus. 8 firms' totals include a contract whose latest value is a likely keying error (100 times its previous notice; `austender/contracts.value_jump`, ADR 0011)"}
  wgea_year: {label: Latest WGEA report, kind: category, note: "the reporting year (2022-23 to 2024-25) of the employer's latest report to the Workplace Gender Equality Agency, which every private employer of 100 or more must make (wgea/employers, ADR 0032); empty for firms that did not report (smaller firms, the public sector, and some groups that report under one ABN)"}
  wgea_employees: {label: Employees (WGEA), kind: count, note: "headcount in the latest report (wgea_year), the sum of WGEA's workforce composition; in 2022-23 a submission group's whole headcount sits on its primary ABN"}
  wgea_size_band: {label: Employer size band (WGEA), kind: category, note: "as WGEA publishes it: <250, 250-499, 500-999, 1000-4999, 5000+ (from 2023-24 the employer's own; in 2022-23 its submission group's)"}
  wgea_division: {label: ANZSIC division (WGEA), kind: category, note: "the division (A to S) of the ANZSIC class the employer reported to WGEA"}
  wgea_anzsic_class: {label: ANZSIC class (WGEA), kind: category, note: "the four-digit ANZSIC 2006 class the employer reported to WGEA"}
  wgea_women_share: {label: Women among employees (WGEA), kind: rate, note: "women's share of the latest report's headcount"}

regions:
  poa_code: {label: Postal area, kind: id, note: "the ABS's postal area (2021), built from mesh blocks to approximate a postcode; post office box, university and other large-volume postcodes are not postal areas (S6, ADR 0017)"}
  state: {label: State, kind: category, note: "the eight states and territories, and Other Territories (Christmas Island, the Cocos (Keeling) Islands and Norfolk Island)"}
  remoteness: {label: Remoteness, kind: category, note: "the ABS Remoteness Area holding most of the postal area's people"}
  share_major_cities: {label: Share of people in major cities, kind: rate}
  sa3_code: {label: SA3, kind: id, note: "the Statistical Area Level 3 holding most of the postal area's people (for 89% of postal areas, 90% or more of them), for pooling small areas (ADR 0017)"}
  sa3_name: {label: SA3 name, kind: category}
  persons: {label: Population (2021 Census), kind: count, unit: people}
  irsad_score: {label: Socio-economic advantage and disadvantage (IRSAD score), kind: numeric}
  irsad_decile: {label: IRSAD decile, kind: numeric, note: "1 = most disadvantaged tenth of areas"}
  irsd_score: {label: Socio-economic disadvantage (IRSD score), kind: numeric}
  irsd_decile: {label: IRSD decile, kind: numeric}
  ier_score: {label: Economic resources (IER score), kind: numeric}
  ier_decile: {label: IER decile, kind: numeric}
  ieo_score: {label: Education and occupation (IEO score), kind: numeric}
  ieo_decile: {label: IEO decile, kind: numeric}
  median_age: {label: Median age, kind: numeric, unit: years, note: "2021 Census; empty where the Census gives 0 because there is no one to describe (ADR 0010)"}
  median_personal_income_weekly: {label: Median personal income, kind: money, unit: AUD a week, note: "as median_age; 2021 dollars"}
  median_household_income_weekly: {label: Median household income, kind: money, unit: AUD a week, note: "as median_age; 2021 dollars"}
  median_rent_weekly: {label: Median rent, kind: money, unit: AUD a week, note: "as median_age (34 postal areas have no renters); 2021 dollars"}
  average_household_size: {label: Average household size, kind: numeric, unit: people, note: "as median_age"}
  active_abns: {label: Active ABNs, kind: count, note: "includes many sole traders and inactive holders"}
  active_gst_abns: {label: Active GST-registered ABNs, kind: count, note: "the businesses denominator for the rates below (October 2026)"}
  patents_standard: {label: Standard patent applications FY2017-FY2026, kind: count, note: "by the filer's postcode: the first founding applicant in Australia (ADR 0017), not the current holder"}
  patents_provisional: {label: Provisional patent applications FY2017-FY2026, kind: count, note: "as patents_standard; not added to it. FY2026 is inflated by provisionals not yet followed up or dropped (U8)"}
  patents_second_tier: {label: Innovation and petty patent applications FY2017-FY2026, kind: count, note: "as patents_standard; innovation patents closed to new applications on 26 August 2021"}
  trade_marks: {label: Trade mark applications FY2017-FY2026, kind: count, note: "as patents_standard"}
  designs: {label: Design applications FY2017-FY2026, kind: count, note: "as patents_standard"}
  patents_standard_by_organisations: {label: Standard patent applications by organisations FY2017-FY2026, kind: count, note: "of patents_standard, those whose filer is an organisation, not an individual: the numerator for the rate per business"}
  trade_marks_by_organisations: {label: Trade mark applications by organisations FY2017-FY2026, kind: count, note: "as patents_standard_by_organisations"}
  designs_by_organisations: {label: Design applications by organisations FY2017-FY2026, kind: count, note: "as patents_standard_by_organisations"}
  ip_filing_firms: {label: Active firms that have ever filed IP, kind: count, note: "by the firm's ABR postcode (its main business address)"}
  rdti_firms: {label: Active firms claiming the R&D Tax Incentive, kind: count, note: "as ip_filing_firms"}
  rdti_firms_no_ip: {label: R&D Tax Incentive claimants that have never filed IP, kind: count, note: "as ip_filing_firms"}
  austender_suppliers: {label: Government suppliers FY2017-FY2026, kind: count, note: "distinct supplier ABNs on Australian Government contracts first published in FY2017 to FY2026, by the supplier's postcode on the contract at its latest notice (ADR 0018)"}
  austender_contracts: {label: Government contracts FY2017-FY2026, kind: count, note: "as austender_suppliers; each contract once"}
  austender_value: {label: Government contract value FY2017-FY2026, kind: money, unit: AUD, note: "the contracts' values at their latest notice (each over its whole life, as last amended), nominal dollars; empty where there are none. A supplier's postcode is often its head office"}
  patents_standard_per_10k_people: {label: "Standard patent applications a year per 10,000 people", kind: rate, note: "every filing, FY2017-FY2026, a year, per 2021 resident. Empty where fewer than 10 would be expected at the national rate (B3, ADR 0017): pool by sa3_code or shrink instead"}
  trade_marks_per_10k_people: {label: "Trade mark applications a year per 10,000 people", kind: rate, note: "as patents_standard_per_10k_people"}
  designs_per_10k_people: {label: "Design applications a year per 10,000 people", kind: rate, note: "as patents_standard_per_10k_people"}
  patents_standard_per_1k_businesses: {label: "Standard patent applications by organisations a year per 1,000 GST-registered businesses", kind: rate, note: "organisations' filings only (individuals are not businesses here), a year; empty as for the rates per person"}
  trade_marks_per_1k_businesses: {label: "Trade mark applications by organisations a year per 1,000 GST-registered businesses", kind: rate, note: "as patents_standard_per_1k_businesses"}
  designs_per_1k_businesses: {label: "Design applications by organisations a year per 1,000 GST-registered businesses", kind: rate, note: "as patents_standard_per_1k_businesses"}

# The regions lens's attachments (ADR 0018), long: one row per postal area, source, indicator and period, for every value
# of seven area sources. Query it in SQL with filters on source and indicator; never load it whole (29.0 million rows).
region_indicators:
  poa_code: {label: Postal area, kind: id, note: "the regions lens's key; only its 2,641 postal areas"}
  source: {label: Source, kind: category, note: "census (2021 Census General Community Profile, 14 tables), data_by_region (ABS Data by Region, SA2s, 2011 to 2025), cabee (ABS counts of businesses, SA2s, June 2023 to 2025), phidu (PHIDU's Social Health Atlas, PHAs) cer (Clean Energy Regulator, small-scale installations by postcode), ato_postcode (ATO taxation statistics, individuals by postcode, Table 6, income years 2012-13 to 2023-24; gap B3) or census_tsp (the 2021 Census Time Series Profile, five tables for the 2011, 2016 and 2021 Censuses on 2021 SA2s; gap B6). census_tsp's 2021 values repeat the census source's, apportioned from SA2s rather than published for postal areas: use census for 2021 and census_tsp for change"}
  topic: {label: Topic, kind: category, note: "the Census table, Data by Region's topic (the label before its first colon), CABEE's cube, PHIDU's workbook, CER's technology, the ATO's table or the time series' table"}
  indicator: {label: Indicator code, kind: category, note: "unique within a source: the Census table and cell (G01.Tot_P_P; the time series' table and cell without its year, T01.Tot_persons_P), Data by Region's item, CABEE's size measure, industry and size, PHIDU's workbook, sheet, indicator, sub-indicator and measure, CER's technology and series, or the ATO's item and unit"}
  label: {label: Indicator, kind: category, note: "the publisher's own name for it (Census: the DataPack's long name)"}
  period: {label: Period, kind: category, note: "the year (Census 2021; the time series' Census years 2011, 2016 and 2021; Data by Region and CER years), June of a year (CABEE), PHIDU's period or the ATO's income year (2012-13), as published"}
  value: {label: Value, kind: numeric, note: "units differ by indicator: compare within one indicator only. Never add a total to its parts, or one source's measure to another's"}
  unit: {label: Unit, kind: category, note: "as published (people for Census counts; Data by Region's unit; PHIDU's measure, such as SR or ASR per 100,000)"}
  additive: {label: A count, kind: binary, note: "true for a count, which is split among postal areas by residents and can be summed over areas; false for a level (median, mean, rate, percentage, index), which is a residents-weighted average of the areas overlapping the postal area and must never be summed"}
  method: {label: How it reached the postal area, kind: category, note: "direct (published for postal areas or postcodes: Census, CER, ATO), from SA2s (Data by Region, CABEE, the Census time series) or from PHAs (PHIDU), through 2021 residents by mesh block (an area with none is split by its mesh blocks). Values from SA2s or PHAs are estimates for the postal area, not published figures"}

# One row per country, year and indicator: the World Bank's 24 indicators, WIPO's filings by residents of each country at
# every office, and the OECD's R&D intensity. Its attachments are in `national_indicators` (ADR 0019).
national:
  iso3: {label: Country code, kind: id, note: "ISO 3166 alpha-3. Former states keep their ISO 3166-3 codes (SUN, DDR, CSK, YUG, ZAR, ANT) and WIPO's unknown origin is ZZZ (see entity); aggregates (regions, income groups, the OECD, the world) are left out"}
  country: {label: Country, kind: category, note: "one name per place: the World Bank's where it has the country"}
  year: {label: Year, kind: year}
  indicator: {label: Indicator code, kind: category, note: "the World Bank's codes (trade marks are IP.TMK.RSCT and IP.TMK.NRCT, 2004 on), WIPO.* (filings by residents at every office) and OECD.MSTI.G and .B (GERD and BERD, % of GDP). The World Bank's and the OECD's R&D series differ where they overlap: compare them side by side, never splice them (ADR 0010). The World Bank's trade mark and design series 'by count' count classes and designs, not applications: they equal WIPO's class and design counts at the office (U67)"}
  indicator_name: {label: Indicator, kind: category}
  value: {label: Value, kind: numeric, note: "units differ by indicator; compare within one indicator only"}
  status: {label: Value's status, kind: category, note: "the OECD's flag on its values (estimated, provisional, definition differs, time series break: 32.5% of its values here; every Australian GERD value from 2010 is an estimate); empty for the World Bank's and WIPO's, which publish none"}
  source: {label: Source, kind: category, note: "WDI, WIPO or OECD"}
  entity: {label: Kind of place, kind: category, note: "country; former state (WIPO's filings by residents of the Soviet Union, East Germany, Czechoslovakia, Yugoslavia, Zaire and the Netherlands Antilles, never added to their successors); or origin unknown (WIPO's filings whose applicant's country is not known). Filter to countries for comparisons between countries (ADR 0019)"}
  oecd: {label: OECD member, kind: binary}
  australia: {label: Australia, kind: binary}

# The national lens's attachments (ADR 0019), long: one row per place, source, indicator and period, for every value of
# the GII 2026, every OECD flow in the corpus, WIPO's other tables, Measuring What Matters and Closing the Gap. Query it
# in SQL with filters on source, dataset and indicator; never load it whole (41 million rows).
national_indicators:
  iso3: {label: Country code, kind: id, note: "as in national (former states and the unknown origin kept; aggregates left out); Measuring What Matters and Closing the Gap are Australia's only"}
  country: {label: Country, kind: category, note: "the World Bank's name where it has the country, otherwise the publisher's"}
  entity: {label: Kind of place, kind: category, note: "country, former state or origin unknown, as in national"}
  year: {label: Year, kind: year, note: "the calendar year the period ends in (a financial year 2018-19 is 2019; Closing the Gap's '2016 to 2021' is 2021). For the GII, an indicator's data year, and 2026 (the edition) for its composite scores and ranks. Empty for 35 Measuring What Matters values that are for groups, not periods"}
  period: {label: Period, kind: category, note: "as published: the OECD's and WIPO's year, the GII's data year or 'GII 2026', Measuring What Matters' row (a year, financial year or month such as 'Apr-06'), Closing the Gap's year (including trajectories to 2031)"}
  source: {label: Source, kind: category, note: "gii (the Global Innovation Index 2026), oecd (24 OECD flows), wipo (WIPO IP statistics), mwm (Measuring What Matters), ctg (Closing the Gap 2026), abs (CABEE's national tables 4 to 16, the ABS's R&D releases for business, government, non-profit and higher education, venture capital to 2018-19, and the Schools release's student to teaching staff ratios, 2006 to 2025), gii_supplementary (Australian values for four indicators the GII 2026 leaves blank for Australia, from the ABS: never part of the GII's own rows; ADR 0033) or bcarr (cultural and creative activity by domain, both releases); the ABS's and BCARR's tables by industry are in industry_indicators (ADR 0020)"}
  dataset: {label: Dataset, kind: category, note: "the OECD flow (msti, patents_coinventors, ...); WIPO's table (office_origin, office, pmh); the GII's sheet (data, economies); Measuring What Matters' theme and page; Closing the Gap's target (ctg08, ctg15, ctg16)"}
  indicator: {label: Indicator code, kind: category, note: "unique within a source. OECD.<FLOW>.<dimension codes>; WIPO.ORIGIN.<id>[.<breakdown>] (by origin, summed over every office), WIPO.AU.<id>[...] (at IP Australia, by origin), WIPO.OFFICE.<right>.<id> (by office), WIPO.PMH.<id> (PCT, Madrid and Hague, by origin); GIISUP.<GII code> (the supplementary values); ABS.SCHOOLS.T53A.<affiliation>.<level>; GII.<node>.score, .rank, .value, .strength_overall and .strength_income_group, and GII.ECONOMY.*; MWM.<page>.<table>[.<block>].<series>; CTG.<table>.<series>.<jurisdiction>"}
  label: {label: Indicator, kind: category, note: "the publisher's names for the indicator and its breakdowns, joined by commas (an OECD dimension that does not apply is left out)"}
  value: {label: Value, kind: numeric, note: "units differ by indicator: compare within one indicator only. Never add a total to its parts, or one source's measure to another's (MWM's patents and trade marks, and the OECD's patents, repeat counts held elsewhere)"}
  value_text: {label: Value as text, kind: category, note: "where the value is not a number: the OECD's IP tax regimes (mostly text), the GII's strengths and weaknesses (S or W), its income groups and regions, and Closing the Gap's '..', 'np' and 'na' (not available or not published) and assessments (High, Low)"}
  unit: {label: Unit, kind: category, note: "as published (the OECD's unit, multiplier and base period; WIPO's counts or days; the GII's score, rank or value; Closing the Gap's unit). Empty for Measuring What Matters, whose units are in the label"}
  status: {label: Value's status, kind: category, note: "the OECD's flags (estimated, provisional, break; a normal value has none, and a suppressed one, which the OECD publishes as 0, has an empty value); the GII's 'outdated' (older than the most common data year) and 'data minimum coverage not met'; Closing the Gap's trajectories (projected), regression estimates (modelled) and assessments. A projected value is not an observation; for gii_supplementary, 'supplementary (not in the GII)' and how the value differs from the GII's definition"}
  oecd: {label: OECD member, kind: binary}
  australia: {label: Australia, kind: binary}

# One row per ANZSIC 2006 division (A to S) and financial year, FY1990 to FY2026 (ADR 0020). IP applications are
# expected counts: each right's current classes are split over industries by the ALP crosswalks' probabilities, so a
# division's count is a sum of shares, not a count of whole rights. Its attachments are in `industry_indicators`.
industries:
  division: {label: Industry division, kind: category, note: "the ANZSIC 2006 division's letter, A to S"}
  division_name: {label: Industry division name, kind: category}
  fy: {label: Financial year, kind: year, note: "year ending 30 June"}
  patents_standard: {label: Standard patent applications (expected), kind: numeric, note: "by filing year; each application's current IPC subclasses share it equally, and each subclass is split over ANZSIC classes by the ALP crosswalk (Lybbert and Zolas), so the divisions sum to the applications with a known subclass (98.4% to 99.7% of them, FY1990 to FY2025; fewer for FY2026, not yet all classified). Subclasses the crosswalk does not know are first mapped to their predecessors (B6). A probability, not where the patent is used"}
  patents_standard_au: {label: Standard patent applications from Australian applicants (expected), kind: numeric, note: "as patents_standard, for applicants in Australia (the current applicant's country, as the World Bank and WIPO count residents, U67)"}
  patents_second_tier: {label: Innovation and petty patent applications (expected), kind: numeric, note: "as patents_standard; many petty patents before 2001 have no class (about half are carried in FY1990)"}
  patents_standard_with_services: {label: "Standard patent applications (expected, crosswalk with services)", kind: numeric, note: "as patents_standard, through ALP's IPC crosswalk that includes service industries (version 2209, `concordances/ipc4_anzsic_services`): a labelled comparison, never added to patents_standard. The authors recommend the version without services, which patents_standard uses; this one sends about 5% of the crosswalk's weight to services (gap A2)"}
  patents_standard_au_with_services: {label: "Standard patent applications from Australian applicants (expected, crosswalk with services)", kind: numeric, note: "as patents_standard_au, through the crosswalk with services (patents_standard_with_services)"}
  trade_marks: {label: Trade mark applications (expected), kind: numeric, note: "each application's current Nice classes share it equally, and each class is split over ANZSIC classes by the ALP crosswalk; 99.8% of applications are carried"}
  trade_marks_au: {label: Trade mark applications from Australian applicants (expected), kind: numeric, note: "as trade_marks, for applicants in Australia"}
  businesses_start: {label: Businesses operating at the start of the year, kind: count, note: "CABEE (the ABS's count of actively trading businesses), FY2023 to FY2026; with 'currently unknown' (in industry_indicators, division X) the divisions sum to the ABS's total"}
  businesses_end: {label: Businesses operating at the end of the year, kind: count, note: "as businesses_start"}
  business_entries: {label: Business entries in the year, kind: count, note: "births and other entries (CABEE)"}
  business_exits: {label: Business exits in the year, kind: count, note: "cancellations and other exits (CABEE)"}
  business_entry_rate: {label: Business entry rate, kind: rate, note: "entries as a % of businesses at the start of the year, as the ABS publishes it"}
  business_exit_rate: {label: Business exit rate, kind: rate, note: "as business_entry_rate"}
  berd: {label: Business expenditure on R&D, kind: money, unit: "$'000", note: "the ABS's BERD survey, 2023-24 only (FY2024), current dollars"}
  wpi_index: {label: Wage Price Index, kind: numeric, note: "total hourly rates of pay excluding bonuses, private and public sectors, original; the financial year's average of the four quarterly index numbers (2008-09 = 100); none for agriculture (A), which the index does not cover"}
  creative_gva: {label: Cultural and creative value added, kind: money, unit: "$m", note: "the cultural and creative activity in the division (BCARR's satellite account, the 2015-16 to 2024-25 release), FY2016 to FY2025; only divisions with such activity have a value. The older release is in industry_indicators, never spliced on"}
  gva_cvm: {label: Gross value added (chain volume), kind: money, unit: AUD million a year, note: "ABS national accounts (abs_national_accounts/ana_ind_gva; gap B2): the division's gross value added in chain volume terms, original, the financial year's four quarters summed; empty where a quarter is missing"}

# The industries lens's attachments (ADR 0020), long: one row per division, source, indicator and period, for every
# value the ABS and BCARR publish by industry. Query it in SQL with filters on source and indicator.
industry_indicators:
  division: {label: Industry division, kind: category, note: "A to S; TOTAL for all industries and X for an industry currently unknown. Never add TOTAL to the divisions"}
  source: {label: Source, kind: category, note: "cabee (counts of businesses: the national release's tables by division, and the cubes by state and class or subdivision, and by local government area), bcs (the business characteristics and innovation surveys, from the ABS Data API, to 2023), bcs_cubes (the same survey's 2024-25 release, from its data cubes; 17 divisions, the survey leaving out public administration and education; gap B4), berd (business R&D by subdivision, 2023-24), bcarr (cultural and creative value added, both releases), wpi (the Wage Price Index, quarterly) or ip (the core lens's standard patents and trade marks by ANZSIC subdivision, expected counts, the detail within a division)"}
  dataset: {label: Dataset, kind: category, note: "the cube, table or release"}
  indicator: {label: Indicator code, kind: category, note: "unique within a source and division: CABEE.<cube or table>.<measure|class or subdivision|state or area|size|unit>, BCS.<table>.<dimension codes>, BERD.<cube>.<sheet>.<sheet row>.<section|row|column>, BCARR.<release>.<table>.<series>.<unit>, WPI.<measure>.<index>.<sector>.<adjustment>, IP.PATENTS.<subdivision> and IP.TRADE_MARKS.<subdivision>"}
  label: {label: Indicator, kind: category, note: "the publisher's names, joined by commas"}
  period: {label: Period, kind: category, note: "as published: a financial year (2023-24), June of a year, a survival span, a survey year or a quarter (2025-Q4)"}
  fy: {label: Financial year, kind: year, note: "the financial year the period ends in (a quarter's financial year; the BCS's survey year, which the ABS labels by the year's end)"}
  value: {label: Value, kind: numeric, note: "units differ by indicator; compare within one indicator only"}
  value_text: {label: Value as text, kind: category, note: "BERD's cells that are not numbers ('np', not published; '-', nil)"}
  unit: {label: Unit, kind: category}
  status: {label: Value's status, kind: category, note: "the BCS's and WPI's flags (relative standard errors of 10% to 50% or more, 'not available for publication', in which case the value is empty)"}
  division_name: {label: Industry division name, kind: category, note: "empty for TOTAL and X"}

# One row per month, January 1904 to September 2026, for IP Australia's whole register (Australian and overseas
# applicants). A series is empty (not 0) before its records become continuous (the first month from which 9 of the next
# 12 have a record) and, for a few, in final months the register is still recording. Outcomes are counts of events,
# each event once. Definitions: TIMELINE_*, EVENT_DATE in build.py (ADR 0010).
# The institutions lens (ADR 0021): one row per Australian research institution (its ROR identifier) and calendar year,
# 1990 to 2026. The institutions, and the names and ABNs that link them to IP RAPID, the ARC and AusTender, are the
# reviewed files in analysis/eda/institutions/.
institution_rights:
  ip_right_type: {label: Type of right, kind: category, note: "as in rights"}
  application_number: {label: Application number, kind: id, note: "joins rights"}
  ror: {label: Institution (ROR), kind: id, note: "the ROR identifier of a research institution among the right's founding applicants; a right filed by two institutions has a row for each"}
  matched_by: {label: How the filer was matched, kind: category, note: "name (the founding applicant's name is one of the institution's: ROR's names and aliases, or the reviewed names), abn (only its ABN is one of the institution's), or both. A name decides over an ABN where they disagree"}
  country_unknown: {label: Filer's country unknown, kind: binary, note: "the matched founding applicant has no recorded country (mostly rights filed before 1990); those in Australia are kept, those overseas are not matched"}
  shared: {label: Filed with others, kind: binary, note: "the right has a founding applicant (organisation or individual) that is not this institution"}
  shared_with_institution: {label: Filed with another research institution, kind: binary, note: "another institution in the lens is also a founding applicant"}

institutions:
  ror: {label: Institution (ROR), kind: id, note: "the Research Organization Registry's identifier (without https://ror.org/)"}
  institution: {label: Institution, kind: category}
  kind: {label: Kind of institution, kind: category, note: "university, public research agency (Commonwealth or state), medical research institute, other research institute, health service, or other (academies, museums, foundations and others that hold an ARC or NHMRC grant), as reviewed (ADR 0021)"}
  parent_ror: {label: Parent institution (ROR), kind: id, note: "for an institution that is part of another (Data61 of CSIRO, the Royal Melbourne Hospital of Melbourne Health, the Australian Maritime College of the University of Tasmania). Its counts are its own: never add a child to its parent's OpenAlex counts, which overlap"}
  state: {label: State, kind: category, note: "ROR's location"}
  established: {label: Year established, kind: year, note: "as ROR gives it"}
  ror_status: {label: Status in ROR, kind: category, note: "active, or inactive for an institution that has closed or merged (the University of Adelaide and the University of South Australia, into Adelaide University in 2026)"}
  year: {label: Year, kind: year, note: "calendar year"}
  works: {label: Research works, kind: count, note: "OpenAlex's works with the institution among the authors' affiliations, by publication year, 2010 on (OpenAlex's counts by year); empty where the institution is not in OpenAlex. 2026 is a part year (the corpus's harvest)"}
  citations: {label: Citations received, kind: count, note: "OpenAlex: citations made in the year to any of the institution's works, 2010 on"}
  works_patent_cited: {label: Works cited by US patents, kind: count, note: "the institution's works published in the year that at least one USPTO patent cites (Reliance on Science, patents to 2025, and OpenAlex's cited works with an Australian institution). Recent works have had little time to be cited"}
  patent_citations: {label: Citations from US patents, kind: count, note: "USPTO patents' citations to the institution's works published in the year (front page or text, made by applicants or examiners)"}
  patent_citations_au: {label: Citations from US patents with Australian links, kind: count, note: "as patent_citations, from patents whose family has an Australian applicant or inventor (Google Patents)"}
  arc_grants: {label: ARC grants, kind: count, note: "ARC National Competitive Grants by the year funding starts, at the organisation that won it (the ARC's administering organisation at announcement), 2001 on. Grants to Adelaide University in 2026 are those announced to it"}
  arc_funding: {label: ARC funding, kind: money, unit: AUD, note: "the funding announced for those grants (current funding where none was announced), current dollars"}
  arc_industry_grants: {label: ARC grants with industry partners, kind: count, note: "the schemes for research with industry and other end users: Linkage Projects, the Industrial Transformation Training Centres and Research Hubs, and the industry fellowships (ARC_INDUSTRY_SCHEMES). Not the whole Linkage program, which also holds Centres of Excellence and infrastructure grants"}
  arc_industry_funding: {label: ARC funding with industry partners, kind: money, unit: AUD, note: "as arc_funding, for those schemes"}
  nhmrc_grants: {label: NHMRC grants, kind: count, note: "by application round, 2013 on (the corpus's workbooks), at the administering institution: its ROR from the 2025 round, its name before"}
  nhmrc_funding: {label: NHMRC funding, kind: money, unit: AUD, note: "the total awarded, current dollars"}
  patents_standard: {label: Standard patent applications, kind: count, note: "applications with the institution among their founding applicants (institution_rights), by the year of application_date (for a PCT filing, its national phase entry, ADR 0010)"}
  patents_standard_shared: {label: Standard patent applications filed with others, kind: count, note: "as patents_standard, with another founding applicant (a firm, another institution or a person)"}
  patents_provisional: {label: Provisional patent applications, kind: count}
  patents_second_tier: {label: Innovation and petty patent applications, kind: count}
  trade_marks: {label: Trade mark applications, kind: count}
  designs: {label: Design applications, kind: count, note: "plant breeder's rights are left out: IP RAPID gives their applicants' names as codes, with no ABNs, so they cannot be linked"}
  patent_families: {label: Patent families, kind: count, note: "the Google Patents families of the institution's Australian patent applications, by the year of the family's first priority. Families filed only abroad are missed (the review's F07)"}
  patent_families_us_granted: {label: Patent families granted in the US, kind: count}
  patent_family_citations_5y: {label: Citations to patent families within five years, kind: count, note: "families citing them within five years of their first priority (Google Patents); recent families have had less time"}
  contracts: {label: Government contracts, kind: count, note: "AusTender contracts with one of the institution's ABNs as supplier, by the year first published, each contract once at its latest notice, 2005 on"}
  contract_value: {label: Government contract value, kind: money, unit: AUD, note: "the contracts' value at their latest notice, current dollars"}
  nsrc_research_expenditure: {label: Research expenditure (NSRC), kind: money, unit: AUD, note: "the National Survey of Research Commercialisation (gap B9), 2000 to 2015, as the institution reported it; empty in a year it was not surveyed (the survey covered 50 to 100 participants a year). Matched by the participant's name (`analysis/eda/institutions/names.csv`, source nsrc); two of its participants in one year (the Florey's predecessors) are summed"}
  nsrc_commercialisation_staff: {label: Dedicated commercialisation staff (NSRC), kind: numeric, unit: FTE, note: "as nsrc_research_expenditure: full-time equivalent staff dedicated to commercialisation"}
  nsrc_invention_disclosures: {label: Invention disclosures (NSRC), kind: count, note: "as nsrc_research_expenditure: inventions researchers reported to the institution in the year"}
  nsrc_licences_executed: {label: Licences, options and assignments executed (NSRC), kind: count, note: "as nsrc_research_expenditure: LOAs signed in the year"}
  nsrc_licence_income: {label: Licence income (NSRC), kind: money, unit: AUD, note: "as nsrc_research_expenditure: income in the year from active LOAs, current dollars"}
  nsrc_startups_created: {label: Start-ups created (NSRC), kind: count, note: "as nsrc_research_expenditure: start-up companies created in the year"}

timeline:
  month: {label: Month, kind: date, note: "the first day of the month"}
  year: {label: Year, kind: year}
  month_of_year: {label: Month of the year, kind: category, note: "1 = January; for seasonal patterns"}
  fy: {label: Financial year, kind: year, note: "year ending 30 June"}
  days_in_month: {label: Days in the month, kind: count, note: "28 to 31; months differ in length, which affects monthly counts"}
  patents_standard_au: {label: Standard patent applications from Australian applicants, kind: count, note: "by application date: for PCT applications, the month they entered Australia's national phase; empty before July 1971, when applicants' countries began to be recorded continuously"}
  patents_standard_overseas: {label: Standard patent applications from overseas applicants, kind: count, note: "as patents_standard_au; empty before October 1969"}
  patents_standard_origin_unknown: {label: Standard patent applications of unknown origin, kind: count, note: "no applicant country recorded: most standard patents before 1980; its zeros since are real"}
  patents_provisional: {label: Provisional patent applications, kind: count, note: "placeholders, never granted themselves. The register keeps them after a complete application claims them (99.9% of claimed ones are present in every year); their rise from late 2025 is real (ADR 0010). Empty before September 1985: IP RAPID holds about a quarter of earlier ones (ADR 0014)"}
  patents_second_tier: {label: Innovation and petty patent applications, kind: count, note: "petty patents to 2001, innovation patents from 2001; new ones closed on 26 August 2021, after which only divisionals and conversions of earlier applications are filed (768 to October 2026)"}
  trade_marks_au: {label: Trade mark applications from Australian applicants, kind: count, note: "empty before January 1983: IP RAPID holds only the earlier trade marks still on the register when its records were computerised, not those that failed (ADR 0014)"}
  trade_marks_overseas: {label: Trade mark applications from overseas applicants, kind: count, note: "as trade_marks_au"}
  trade_marks_origin_unknown: {label: Trade mark applications of unknown origin, kind: count, note: "as trade_marks_au; its zeros since are real"}
  designs_au: {label: Design applications from Australian applicants, kind: count, note: "empty before January 1986, for the reason given for trade_marks_au (ADR 0014); the last three months are empty: recent designs' applicant countries are recorded weeks after filing"}
  designs_overseas: {label: Design applications from overseas applicants, kind: count, note: "as designs_au"}
  designs_origin_unknown: {label: Design applications of unknown origin, kind: count, note: "as designs_au"}
  pbr_applications: {label: Plant breeder's rights applications, kind: count}
  patents_granted: {label: Patents granted (events), kind: count, note: "by grant date; empty before January 1985, as IP RAPID records grants only for patents filed from 1979 (ADR 0014)"}
  trade_marks_registered: {label: Trade marks registered (events), kind: count, note: "by the date the registration was entered (IP RAPID's declared date). A trade mark is registered as from its filing date, which is its effective date, so counting by that would give the month of filing (ADR 0010). Empty before January 1986: IP RAPID records the date entered for every registration from then, and for under 2% before 1984"}
  designs_registered: {label: Designs registered (events), kind: count, note: "empty before January 1988, when designs filed from 1986 (the first complete year) have mostly been registered (ADR 0014)"}
  pbr_granted: {label: Plant breeder's rights granted (events), kind: count, note: "grants cluster in March, June and September (12% each in 2005 to 2025, against 5% to 9% in other months), and some months have none: compare quarters"}
  patents_lapsed: {label: Patents lapsed (events), kind: count, note: "applications that ended before grant (see the glossary: lapse); empty before 1989, when lapses were dated in irregular batches (ADR 0014)"}
  trade_marks_lapsed: {label: Trade marks lapsed (events), kind: count, note: "empty before October 1985, when lapses begin to be recorded (ADR 0014)"}
  designs_lapsed: {label: Designs lapsed (events), kind: count, note: "empty before 1994, when lapses were dated in irregular batches (ADR 0014)"}
  patents_ceased: {label: Patents ceased (events), kind: count, note: "granted patents that ended early, usually for unpaid renewal fees (see the glossary: ceased). Empty before May 1995, when cessations were dated in irregular batches (ADR 0014); February 2020 (7) and March 2020 (2,468) are a pause and its backlog"}
  trade_marks_ceased: {label: Trade marks ceased (events), kind: count, note: "by the date protection ended; empty before 1987 (ADR 0014); the last six months are empty, as a trade mark ceases on the record only after its six-month grace period for renewal"}
  designs_ceased: {label: Designs ceased (events), kind: count, note: "as trade_marks_ceased; empty before July 1990 (ADR 0014)"}
  patents_expired: {label: Patents expired (events), kind: count, note: "reached the end of their term; empty before 1995, when expiries were dated in irregular batches (ADR 0014). Almost none from July 1995 to June 1999: the term rose from 16 to 20 years for patents still in force"}
  patent_oppositions: {label: Patent oppositions lodged (published events), kind: count, note: "recorded from 2003"}
  trade_mark_oppositions: {label: Trade mark oppositions and non-use removal requests (events), kind: count}
  patent_extensions_of_term: {label: Pharmaceutical patent extensions of term granted (events), kind: count}
  patent_assignments: {label: Patent assignments (ownership transfers) published (events), kind: count, note: "empty before February 1992: January 1992 holds a backlog (ADR 0014)"}
  trade_mark_assignments: {label: Trade mark assignments (ownership transfers) published (events), kind: count, note: "empty before 1987 (ADR 0014)"}
  cpi: {label: Consumer Price Index (all groups), kind: numeric, unit: index (Sep 2025 = 100), note: "ABS, Australia (the eight capital cities), original, quarterly: in each quarter's last month only, and empty in the other two. Compare it at quarterly resolution, never spread across months (ADR 0007); use it to deflate money series"}
  policy_events: {label: IP policy changes taking effect, kind: category, note: "ids from policy_events/events, comma-separated, without the fee changes (fee_changes); dates checked against the Federal Register (ADR 0011)"}
  fee_patent_provisional: {label: Fee to file a provisional patent application, kind: money, unit: AUD, note: "the official fee in force on the first day of the month, from the Patents Regulations 1991 (frl_fees/key_fees, ADR 0031); paid the cheapest way offered (online, where the schedule prices paper higher: from August 2010 for this fee); nominal dollars. Empty before May 1991, when the Patents Act 1990 and its regulations began"}
  fee_patent_filing: {label: Fee to file a standard patent application, kind: money, unit: AUD, note: "as fee_patent_provisional; the base fee, without charges for pages or claims over a limit"}
  fee_patent_examination: {label: Fee to request examination of a standard patent, kind: money, unit: AUD, note: "as fee_patent_provisional; full examination (section 45), not the cheaper modified examination or a PCT application already examined abroad"}
  fee_patent_grant: {label: Fee at a standard patent's acceptance or sealing, kind: money, unit: AUD, note: "as fee_patent_provisional; a sealing fee to October 1998, none from November 1998 to August 2002, an acceptance fee since September 2002 (0 where none was charged)"}
  fee_patent_to_grant: {label: Official fees to obtain a standard patent, kind: money, unit: AUD, note: "fee_patent_filing + fee_patent_examination + fee_patent_grant: the fees on the usual path to grant, without a provisional, extra claims or a search"}
  fee_patent_renewals: {label: Renewal fees to keep a standard patent for its full term, kind: money, unit: AUD, note: "the sum of every anniversary's renewal (continuation) fee to the 19th, as in force that month. The first fee falls due at the 3rd anniversary to October 1998, the 5th from November 1998 and the 4th from July 2012; to June 1995 the term was 16 years, so the 16th to 19th were paid only on an extended term. Fees for the 20th to 24th (pharmaceutical extensions) are left out"}
  fee_patent_second_tier_filing: {label: Fee to file a petty or innovation patent application, kind: money, unit: AUD, note: "as fee_patent_provisional: the petty patent's to 23 May 2001, the innovation patent's from 24 May 2001 (still in the schedule after new filings closed on 26 August 2021)"}
  fee_tm_filing: {label: Fee to file a trade mark application (one class), kind: money, unit: AUD, note: "the official fee in force on the first day of the month, for one class, from the Trade Marks Regulations under the 1955 Act (from July 1989) and the Trade Marks Regulations 1995 (from January 1996; frl_fees/key_fees, ADR 0031); paid online (cheaper from July 2002) and, since March 2007, describing goods and services from IP Australia's pick list, which costs less (not the TM Headstart route); nominal dollars"}
  fee_tm_registration: {label: Fee to register a trade mark (one class), kind: money, unit: AUD, note: "as fee_tm_filing; abolished on 10 October 2016, when filing fees rose (0 from November 2016)"}
  fee_tm_to_register: {label: Official fees to obtain a trade mark (one class), kind: money, unit: AUD, note: "fee_tm_filing + fee_tm_registration"}
  fee_tm_renewal: {label: Fee to renew a trade mark (one class), kind: money, unit: AUD, note: "as fee_tm_filing; due every 10 years (7 years for marks under the 1955 Act's first term, 14 for its renewals)"}
  fee_design_filing: {label: Fee to file a design application (one design), kind: money, unit: AUD, note: "the official fee in force on the first day of the month, from the Designs Regulations 1982 (from April 1982) and 2004 (from 17 June 2004; frl_fees/key_fees, ADR 0031); paid the cheapest way offered; nominal dollars"}
  fee_design_examination: {label: Fee for a registered owner to request a design's examination, kind: money, unit: AUD, note: "as fee_design_filing; from 17 June 2004 (under the Designs Act 2003 examination is requested after registration)"}
  fee_design_renewal: {label: Fee to renew a design's registration, kind: money, unit: AUD, note: "as fee_design_filing: the renewal at 5 years under the Designs Act 2003 (from 17 June 2004); before that, the first extension of registration under the 1906 Act (registrations under it ran 1 year, extendable to 6, 11 and 16), a different step"}
  fee_pbr_application: {label: Fee to apply for a plant breeder's right (part 1), kind: money, unit: AUD, note: "the official fee in force on the first day of the month, from the Plant Breeder's Rights Regulations 1994 (from December 1994; frl_fees/key_fees, ADR 0031); paid the cheapest way offered; nominal dollars"}
  fee_pbr_examination: {label: Fee for a plant breeder's right's examination (detailed description), kind: money, unit: AUD, note: "as fee_pbr_application; a single variety tested by the applicant's qualified person, not at a centralised testing centre or several varieties together"}
  fee_pbr_grant: {label: Fee to grant a plant breeder's right, kind: money, unit: AUD, note: "as fee_pbr_application"}
  fee_pbr_to_grant: {label: Official fees to obtain a plant breeder's right, kind: money, unit: AUD, note: "fee_pbr_application + fee_pbr_examination + fee_pbr_grant"}
  fee_pbr_annual: {label: Annual fee to keep a plant breeder's right, kind: money, unit: AUD, note: "as fee_pbr_application; due on each anniversary of the grant"}
  fee_patent_to_grant_real: {label: Official fees to obtain a standard patent (real), kind: money, unit: AUD of the latest quarter, note: "fee_patent_to_grant in dollars of the latest quarter the CPI reaches (June 2026): multiplied by that quarter's CPI over the CPI of the month's own quarter"}
  fee_patent_renewals_real: {label: Renewal fees to keep a standard patent for its full term (real), kind: money, unit: AUD of the latest quarter, note: "fee_patent_renewals, deflated as fee_patent_to_grant_real"}
  fee_tm_to_register_real: {label: Official fees to obtain a trade mark (one class, real), kind: money, unit: AUD of the latest quarter, note: "fee_tm_to_register, deflated as fee_patent_to_grant_real"}
  fee_tm_renewal_real: {label: Fee to renew a trade mark (one class, real), kind: money, unit: AUD of the latest quarter, note: "fee_tm_renewal, deflated as fee_patent_to_grant_real"}
  fee_design_filing_real: {label: Fee to file a design application (real), kind: money, unit: AUD of the latest quarter, note: "fee_design_filing, deflated as fee_patent_to_grant_real"}
  fee_pbr_to_grant_real: {label: Official fees to obtain a plant breeder's right (real), kind: money, unit: AUD of the latest quarter, note: "fee_pbr_to_grant, deflated as fee_patent_to_grant_real"}
  fee_changes: {label: Rights whose key fees changed, kind: category, note: "the rights (patent, trade_mark, design, pbr) with a key fee change taking effect in the month, from policy_events/events (lever fees; ADR 0031); the changes are listed there and in frl_fees/fee_changes"}
  cash_rate_target: {label: Cash rate target, kind: rate, unit: per cent, note: "the Reserve Bank's target for the overnight cash rate, monthly average, from August 1990 (rba/series, table F1.1; gap B1)"}
  cash_rate_interbank: {label: Interbank overnight cash rate, kind: rate, unit: per cent, note: "monthly average, from May 1976 (rba/series, F1.1); before 1990 the only cash rate series"}
  aud_usd: {label: Australian dollar in US dollars, kind: numeric, unit: USD per AUD, note: "the RBA's rate at the end of the month (its last business day), from July 1969 (rba/series, F11)"}
  aud_twi: {label: Australian dollar trade-weighted index, kind: numeric, unit: index (May 1970 = 100), note: "end of month, from May 1970 (rba/series, F11)"}
  gdp_cvm: {label: Gross domestic product (chain volume), kind: money, unit: AUD million a quarter, note: "ABS national accounts (abs_national_accounts/ana_agg; gap B2): the quarter's GDP in chain volume terms (real), seasonally adjusted; quarterly, in each quarter's last month only, as the CPI"}
  gdp_current: {label: Gross domestic product (current prices), kind: money, unit: AUD million a quarter, note: "as gdp_cvm, in current prices (nominal)"}
  sfd_nsw: {label: "State final demand: New South Wales (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_vic: {label: "State final demand: Victoria (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_qld: {label: "State final demand: Queensland (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_sa: {label: "State final demand: South Australia (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_wa: {label: "State final demand: Western Australia (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_tas: {label: "State final demand: Tasmania (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_nt: {label: "State final demand: Northern Territory (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  sfd_act: {label: "State final demand: Australian Capital Territory (chain volume)", kind: money, unit: AUD million a quarter, note: "ABS national accounts (ana_sfd; gap B2): the state's final demand, all sectors, chain volume, seasonally adjusted; quarterly, in each quarter's last month only"}
  pbs_prescriptions: {label: PBS prescriptions, kind: count, note: "every PBS and RPBS prescription supplied in the month (the PBS's monthly workbook, by date of supply; gap B11), July 2022 on: Section 85, Section 100 (highly specialised drugs and chemotherapy through hospitals), the Repatriation PBS and an unknown remainder"}
  pbs_government_cost: {label: PBS government cost, kind: money, unit: AUD, note: "as pbs_prescriptions: the government's contribution, current dollars"}
  pbs_s100_prescriptions: {label: PBS Section 100 prescriptions, kind: count, note: "as pbs_prescriptions, Section 100 only"}
  pbs_s100_government_cost: {label: PBS Section 100 government cost, kind: money, unit: AUD, note: "as pbs_government_cost, Section 100 only: about 30% of the total"}
