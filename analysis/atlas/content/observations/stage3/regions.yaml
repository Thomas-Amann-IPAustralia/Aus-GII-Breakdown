  questions:
    - q: 2
      how: Separates what goes with filing beyond the advantage gradient (business counts by size and industry) from what only follows it (health, most of the Census).
  sources: [abs_census, phidu, abs_regions, abs_cabee, ato_postcode, abs_census_tsp, cer, iprapid]
  prep:
    - what: "B28's screen, each indicator in the period covering the most areas, counts as rates per 1,000 residents, now with all seven sources and with the components and remoteness held."
      why: Stage 2 asked which go with filing beyond the gradient.
  steps:
    - Screen every indicator against filing raw, as B28 did.
    - Screen them again as partial rank correlations with the components and remoteness held, under B28's rule for a lead (both halves).
    - Count the leads by source, and read the strongest.
  assumptions:
    - B28's rule (false discovery rate in the first half, the same sign and 0.1 or more in the second) marks a lead.
  limits:
    - Many indicators are versions of one another, so the leads are not independent.
