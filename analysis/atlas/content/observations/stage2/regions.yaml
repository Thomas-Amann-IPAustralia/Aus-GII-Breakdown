# Stage 2, the places lens (section 3 of the bivariate notebook). Markup and rules as in ../firms.yaml. Every pair
# here is between places, not people or firms ([[ecological]]).

- id: B27
  lens: regions
  about: system
  headline: Places that file one kind of IP file the others too, more in line with education than income
  statement: >-
    Postal areas that file more standard patents per person also file more provisionals (rank [[correlation]] 0.765)
    and trade marks (0.693). Of the four SEIFA indexes, education and occupation goes with filing most (0.675 with
    firms with a filing linked per business, 0.455 with standard patents per person); median personal income goes
    with standard patents at 0.287.
  figures:
    - value: "128"
      label: "distinct patterns worth following up, 79 of them about IP or R&D"
    - value: "0.675"
      label: the education and occupation index with firms with a filing linked, per business
    - value: "0.962"
      label: agreement between the two halves of the areas
  points:
    - "Areas with more GST-registered businesses per person file more standard patents (0.513; 0.626 in the other
      half)."
    - "Firms with a filing linked and R&D claimants, per business, are the strongest pair (0.879; 0.894)."
    - "**Claimants with no filing linked are rarer where filing is common:** the share of R&D claimants with no filing
      linked to their business number falls with designs (-0.253), firms with a filing linked (-0.241) and standard
      patents (-0.215) per business, and with government suppliers per business (-0.263)."
    - "Rates are shown only where 10 or more applications are expected ({U53}), so these pairs cover the larger areas
      (431 areas for standard patents per person in the first half). They compare places, not firms or people."
  chart:
    type: bar
    horizontal: true
    title: How the education and occupation index goes with filing across postal areas
    subtitle: Rank correlation with each rate, in one half of the areas and the other
    x: {type: category, values: [Firms with a filing linked (per business), Trade marks (per person), R&D claimants (per business), Provisional applications (per person), Standard patents (per person), Designs (per person)]}
    y: {name: Rank correlation, min: 0, max: 1, format: ratio}
    series:
      - name: First half
        data: [0.675, 0.64, 0.568, 0.534, 0.455, 0.409]
      - name: Second half
        data: [0.67, 0.679, 0.599, 0.579, 0.476, 0.415]
        colour: muted
    source: ABS SEIFA 2021 (IEO); IP RAPID; ABR; R&D Tax Incentive (lens regions)
    note: Median personal income goes with standard patents at 0.287, less than the education and occupation index.
  questions:
    - q: 2
      how: Filing is higher in places with more educated, professional residents; that describes places, not which
        people file or benefit.
    - q: 4
      how: Areas where R&D firms rarely file are where filing is rare generally.
  sources: [abs_regions, abs_census, abr, iprapid, rdti, linkage]
  prep:
    - what: Postal areas split into two halves by a fixed rule (1,377 and 1,264 areas).
      why: "Places have no second period to check against, so a random [[halves|half]] of the areas is held back as
           the [[replication|second sample]]."
  steps:
    - "Test every pair of the place measures in one half of the areas, and check each in the other half."
    - Read which kinds of IP go together, and which area characteristics go with each.
  assumptions:
    - A filer's postcode places its filing ({U47}).
  limits:
    - "Between places, not people: an area's residents and its filers need not be the same people."
  next: "The wider local measures are tested in {B28}; advantage and remoteness are modelled in {B29}."
  terms: [screen, irsad, ecological, postal-area]
  related: [B28, B29]

- id: B28
  lens: regions
  about: system
  headline: Most local measures go with filing along one broad line of advantage and education
  statement: >-
    6,406 area indicators from five sources were set against six filing rates: 24,947 pairs are leads in both halves.
    Standard patents per person go most with financial and professional businesses per resident, and are lowest where
    more single mothers receive Parenting Payment; trade marks go most with professional businesses and Year 12
    completion.
  figures:
    - value: "6,406"
      label: "local measures tested against filing"
    - value: "24,947"
      label: "patterns found in both halves"
    - value: "0.72"
      label: professional, scientific and technical businesses per resident with trade marks per person
  points:
    - "Standard patents per person (3,882 leads): financial and insurance businesses with a turnover of $200k to less
      than $2m per resident (0.595), professional businesses with $2m to less than $5m (0.593); most negative, single
      mothers receiving Parenting Payment (-0.482) and children whose mothers have low educational attainment
      (-0.477)."
    - "Trade marks per person: Year 12 completion (0.697), bachelor degrees (0.685), house prices (0.689); most negative,
      Year 9 as the highest year of school (-0.598) and land area (-0.594)."
    - "**So** the attachments describe one dimension of places (urban, educated, professional, business-dense,
      healthier) more than many separate signals. The Clean Energy Regulator's installations are the exception: 0 of
      its 11 indicators are leads with trade marks."
  chart:
    type: bar
    horizontal: true
    title: The indicators that go most with standard patents per person
    subtitle: Rank correlation across postal areas, the strongest at each end (first half)
    x: {type: category, values: ["Financial businesses ($200k to $2m turnover) per resident", "Professional businesses ($2m to $5m) per resident", "Financial and insurance businesses per resident", "Professional businesses per resident", "Women with a high-risk waist measurement", "Children whose mothers have low educational attainment", "Single mothers receiving Parenting Payment"]}
    y: {name: Rank correlation, min: -1, max: 1, format: ratio}
    series:
      - name: Rank correlation
        data: [0.595, 0.593, 0.575, 0.573, -0.473, -0.477, -0.482]
    source: ABS CABEE; PHIDU; IP RAPID (lens regions and region_indicators)
    note: Areas, not people; each pair held in the second half of the areas.
  questions:
    - q: 2
      how: Filing follows one broad gradient of place advantage, so who benefits from IP is tied to where people live.
    - q: 3
      how: Warns against reading any one area indicator as a driver of filing.
  sources: [abs_census, phidu, abs_regions, abs_cabee, cer, iprapid]
  prep:
    - what: "Each measure in the wider local data is set against the IP rates only, not against every other measure."
      why: Millions of indicator-to-indicator pairs would serve no question.
  steps:
    - Measure each indicator against each of six IP rates in one half; keep those past the threshold and the correction.
    - Check them in the second half.
    - Read the strongest at each end for patents and trade marks.
  assumptions:
    - The indicators are published for the same areas, or apportioned to them, as each source describes.
  limits:
    - "So many measures move together that none can be singled out. Stage 3 first boils them down to a few summary
      measures."
  next: "Stage 3 boils the measures down to a few summary measures before reading any one as a driver."
  terms: [census, cabee, multiple-testing, ecological]
  related: [B27, B29]

- id: B29
  lens: regions
  about: system
  headline: Filing rises steeply with local advantage and falls with remoteness
  statement: >-
    For each [[standard-deviation]] of advantage (the IRSAD score), a postal area files 1.717 times as many standard
    patents per person (1.857 in the second half; 1.884 with areas pooled into larger SA3s). Inner regional areas file
    at 0.259 of major cities' rate. Read together, advantage's ratio is 1.442 and inner regional areas still file at
    0.382 of the cities' rate at the same advantage (that combined reading was not repeated for SA3s).
  figures:
    - value: "1.717"
      label: "standard patents: how many times the rate, for each step up in advantage"
    - value: "0.259"
      label: inner regional areas' rate against major cities'
    - value: "1.442"
      label: the advantage ratio with remoteness allowed for
  points:
    - "Trade marks 1.648 (1.707; 1.477), designs 1.504, provisionals 1.582. Very remote areas file standard patents at
      0.173 of the cities' rate."
    - "**The shape is not a straight line:** standard patents run 0.33 to 0.75 a year per 10,000 people across deciles 1
      to 8, then 1.51 to 1.62 in deciles 9 and 10. Most of the gradient is in the most advantaged fifth of areas; trade
      marks rise more steadily (7.63 to 29.24)."
    - "The top tenth differs most between the halves (1.62 against 3.37 for standard patents) because its five
      heaviest filing areas, several of them mostly one firm's patents ({U52}), fall in the second half. Pooled rates
      there are fragile; the overall ratio is the steadier reading."
    - "The spread between areas is large (alpha 1.354 and 1.65 for standard patents), as {U53} found, which is why a
      [[negative-binomial|negative binomial]] model is used."
  questions:
    - q: 2
      how: Advantaged and city areas file far more, a measure of whose communities take part in the IP system.
    - q: 4
      how: Regional and disadvantaged areas are where filing is lowest, if access is the question.
  sources: [abs_regions, iprapid]
  chart:
    type: bar
    title: How much more advantaged areas file
    subtitle: Times as many filings per person for each standard deviation of advantage (IRSAD), by type of right
    x: {type: category, values: [Standard patents, Trade marks, Designs, Provisionals]}
    y: {name: Rate ratio, min: 0, format: ratio}
    series:
      - name: First half
        data: [1.717, 1.648, 1.504, 1.582]
      - name: Second half
        data: [1.857, 1.707, 1.639, 1.823]
        colour: muted
    source: IP RAPID; ABS SEIFA and remoteness (lens regions)
    marks: {y: [{at: 1, label: No difference}]}
  prep:
    - what: "Each area's count of applications is modelled against its number of residents, with a method that allows
            for extra spread between areas."
      why: Counts in small areas vary far more than chance alone would make them ({U53}).
  steps:
    - "Model each kind of filing against the area's [[irsad|advantage score]], then against remoteness, then against
      both."
    - "Repeat in the second half of the areas, and with areas pooled into larger districts."
    - "Compare pooled rates by tenth of advantage to see the shape."
  assumptions:
    - Applications are counted at the filer's postcode, and people from the Census.
  limits:
    - '[[third-factor|Third factors]]: business density and mix ({B31}), education ({B28}), and where firms register
      ({U47}).'
    - Between places, not people.
  next: >-
    Carried to Stage 3 with business mix and education held steady.
  terms: [negative-binomial, rate-ratio, standard-deviation, irsad, remoteness, sa3]
  related: [B30, B31, B58, U53]

- id: B30
  lens: regions
  about: system
  headline: The link with advantage does not depend on each area's biggest filer
  statement: >-
    Each area's largest filer holds 29.2% of the 24,879 Australian standard patents placed in 2,528 areas. Without
    it, the [[rate-ratio|rate ratio]] per standard deviation of advantage is 1.897 (interval 1.74 to 2.067), against
    1.717 with it; in the second half, 1.961 against 1.857.
  figures:
    - value: "29.2%"
      label: of patents held by each area's largest filer
    - value: "1.897 against 1.717"
      label: the advantage ratio without and with the largest filer
  points:
    - "Single large filers ({U52}) add noise to areas' counts, not the gradient."
    - "**Approximate.** A patent joins a filer by its first founding applicant with an ABN, which for a jointly filed
      patent need not be the party whose postcode places it (about one patent in 20 joined to firms is jointly filed,
      {B26}), so \"each area's largest filer\" is approximate."
  chart:
    type: bar
    title: The advantage gradient, with and without each area's largest filer
    subtitle: Times as many standard patents per person for each standard deviation of advantage, in each half of the areas
    x: {type: category, values: [First half, Second half]}
    y: {name: Rate ratio, min: 0, format: ratio}
    series:
      - name: All filers
        data: [1.717, 1.857]
        colour: muted
      - name: Largest filer taken out
        data: [1.897, 1.961]
    marks: {y: [{at: 1, label: No difference}]}
    source: IP RAPID; ABS SEIFA (lens regions)
  questions:
    - q: 2
      how: Shows the place gradient is not the work of a few big firms; it holds with each area's largest filer taken
        out.
  sources: [iprapid, abs_regions]
  prep:
    - what: Each area's applications with its largest filer removed.
      why: A single firm can dominate a small area's count ({U52}).
  steps:
    - Find each area's largest filer by standard patents.
    - Refit {B29}'s model without it, in both halves.
  assumptions:
    - A filer is identified by its ABN or, failing that, its name.
  limits:
    - Removes one filer per area only.
  next: >-
    The gradient is carried to Stage 3 as a property of places.
  terms: [rate-ratio, concentration]
  related: [B29, U52]

- id: B31
  lens: regions
  about: system
  headline: Areas with more finance and professional businesses file more per business
  statement: >-
    Across postal areas, organisations' standard patents per 1,000 businesses go with the share of businesses in
    finance (0.441), rental and real estate (0.439) and professional services (0.378), and against construction
    (-0.373) and transport (-0.397). Manufacturing's share shows no consistent link (0.119, then -0.022).
  figures:
    - value: "0.441"
      label: share of businesses in finance with patents per business
    - value: "-0.397"
      label: share in transport
    - value: "0.119 and -0.022"
      label: share in manufacturing, in the two halves
  points:
    - "Trade marks per 1,000 businesses: financial services 0.659, professional services 0.649, information media
      0.551; agriculture -0.623."
    - "**What this does not test:** whether manufacturers file the patents. The industries lens allocates patents to
      manufacturing by their technology, which says what they protect, not who files them ({U75})."
    - "A firm's business number address is often a head office ({U47}), and head offices sit among the services of the
      city centres. That is a possible reading of the pattern, not something shown here."
  questions:
    - q: 2
      how: Where filing is recorded reflects where firms register, a caution for any reading of who benefits by place.
    - q: 3
      how: The business mix of a place is a third factor for the advantage gradient.
  sources: [abs_cabee, iprapid, abs_regions]
  chart:
    type: bar
    horizontal: true
    title: Business mix against organisations' patents per business
    subtitle: Rank correlation across postal areas, in each half of the areas
    x: {type: category, values: [Financial and insurance services, "Rental, hiring and real estate", "Professional, scientific and technical", Manufacturing, Construction, Transport]}
    y: {name: Rank correlation, min: -0.5, max: 0.5, format: ratio}
    series:
      - name: First half
        data: [0.441, 0.439, 0.378, 0.119, -0.373, -0.397]
      - name: Second half
        data: [0.38, 0.376, 0.361, -0.022, -0.382, -0.302]
        colour: muted
    source: ABS CABEE; IP RAPID (lens regions)
  prep:
    - what: Each area's businesses by industry division from CABEE, as shares.
      why: Shows which kinds of business an area holds.
  steps:
    - Relate each division's share of an area's businesses to its filing per business, in both halves.
  assumptions:
    - CABEE places businesses at their registered address, as the IP records do.
  limits:
    - Registered addresses may be head offices, not where the work happens.
  next: >-
    Business mix is a [[third-factor]] for {B29} in Stage 3.
  terms: [cabee, anzsic, ecological]
  related: [B29, U47, U75]

- id: B58
  lens: regions
  about: system
  headline: Richer areas file more, even per person running a business
  statement: >-
    Across postal areas (2023-24), taxable income per individual goes with standard patents per 10,000 people at a
    rank [[correlation]] of 0.384 and with trade marks at 0.453. The share of people with business income goes with
    filing far less (0.145 and 0.194). Individuals' own applications per 1,000 people with business income rise from a
    median 3.84 in the most disadvantaged tenth of areas to 11.0 in the most advantaged.
  figures:
    - value: "0.453"
      label: taxable income per individual with trade marks per person
    - value: "3.84 → 11.0"
      label: individuals' applications per 1,000 people with business income, most to least disadvantaged tenth
    - value: "0.194"
      label: the share in business with trade marks per person
  points:
    - "The second half of the areas agrees: 0.405, 0.518, 0.229 and 0.212."
    - "Individuals' own filing per person in business barely moves with the share running a business (-0.078; -0.14)."
    - "**So** the advantage gradient is not only that advantaged areas have more business owners."
  chart:
    type: bar
    horizontal: true
    title: Income, and the share of people in business, against filing
    subtitle: Rank correlation across postal areas, 2023-24, in each half of the areas
    x: {type: category, values: ["Income per individual, with standard patents", "Income per individual, with trade marks", "Share with business income, with standard patents", "Share with business income, with trade marks"]}
    y: {name: Rank correlation, min: 0, max: 1, format: ratio}
    series:
      - name: First half
        data: [0.384, 0.453, 0.145, 0.194]
      - name: Second half
        data: [0.405, 0.518, 0.229, 0.212]
        colour: muted
    source: ATO taxation statistics by postcode; IP RAPID (lens regions)
  questions:
    - q: 2
      how: Income and advantage, not the number of people in business, go with an area's filing.
  sources: [ato_postcode, iprapid, abs_regions]
  prep:
    - what: The ATO's individual statistics by postcode for 2023-24 ({U117}), in areas of 100 or more people.
      why: Gives each area's incomes and the number of people with business income.
  steps:
    - Relate taxable income per individual, and the share with business income, to filing rates, in both halves.
    - Divide individuals' own applications by those with business income, and compare by tenth of advantage.
  assumptions:
    - People with business income are the pool from which individual filers come.
  limits:
    - Between places, not people.
  next: >-
    Carried to Stage 3 with {B29}.
  terms: [irsad, ecological, postal-area]
  related: [B29, B59, U117]

- id: B59
  lens: regions
  about: system
  headline: Areas that gained graduates or income over a decade were not seen to gain filing
  statement: >-
    The median area's share of people with a bachelor degree or higher rose 5.9 points from 2011 to 2021, and its
    residents' standard patents per person fell. Gaining graduates goes with the change in filing at -0.065 (patents)
    and -0.104 (trade marks); gaining income at -0.081 and -0.016. All are small (at most 0.147 in size, in either half
    of the areas) and all negative: [[no-association|no association detected]].
  figures:
    - value: "5.9 points"
      label: "rise in the typical area's share of graduates"
    - value: "-0.065 and -0.104"
      label: gaining graduates with the change in patents and trade marks
  points:
    - "The median area's income rose about 39% (dollars of the day); its patents per person fell, and its trade marks
      rose slightly."
    - "The 2011 share of graduates against the later change: -0.024 and -0.065 (-0.063 and -0.147 in the second half)."
    - "**So** levels go together ({B29}, {B58}) but changes were not seen to: the advantage gradient looks like a
      standing difference between places, not one that moves with them. That is not evidence that education or income
      has no effect."
  chart:
    type: bar
    horizontal: true
    title: Change in graduates and income against change in filing, 2011 to 2021
    subtitle: Rank correlation across postal areas of 1,000 or more people, in each half of the areas
    x: {type: category, values: ["More graduates, with change in patents", "More graduates, with change in trade marks", "More income, with change in patents", "More income, with change in trade marks"]}
    y: {name: Rank correlation, min: -0.5, max: 0.5, format: ratio}
    series:
      - name: First half
        data: [-0.065, -0.104, -0.081, -0.016]
      - name: Second half
        data: [-0.108, -0.137, -0.059, -0.016]
        colour: muted
    marks: {y: [{at: 0, label: No association}]}
    source: ABS Census time series; IP RAPID (lens regions)
  questions:
    - q: 2
      how: No association was detected between an area's rising education or income and a rise in its filing within a
        decade; that is not evidence of no effect.
    - q: 5
      how: The place gradient is not seen in changes over a decade, so any test of place-based programmes needs a
        design that comes after Stage 3.
  sources: [abs_census_tsp, iprapid, abs_regions]
  prep:
    - what: "Three Censuses, from 2011 to 2021, lined up to postal areas ({U118}), in areas of 1,000 or more people."
      why: Changes need the same measure in the same areas at two dates.
  steps:
    - Measure each area's change in graduates and income from 2011 to 2021, and in filing between the matching five-year windows.
    - Relate the changes, in both halves.
  assumptions:
    - "Sharing out small statistical areas to postal areas keeps the areas comparable across Censuses."
  limits:
    - A decade may be too short for education to reach invention.
  next: >-
    Carried to Stage 3: who lives and works in an area, and which firms are based there, are the candidates.
  terms: [census, log-change, percentage-point]
  related: [B58, B29, U118]
