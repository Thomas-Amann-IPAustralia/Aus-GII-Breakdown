# The evidence atlas's own pages: everything that is not one observation, a lens, a question or a glossary term.
# Plain English, Australian spelling, sentence case. Markup: **bold**, [[term]], {U44}, {B6}, OQ numbers.
# Numbers here come from docs/stage-1-summary.md, docs/stage-2-summary.md, the research goal and the notebooks; each
# is traceable to an observation, linked where it is named.

as_at: "2026-11-03"

hero:
  eyebrow: Stage 3 of 3 · exploratory data analysis · first pass done
  title: What Australia's IP data show so far, and how we know
  lead: >-
    This research asks how Australia's intellectual property system creates public value, and where IP Australia
    could add the most. Before answering, the data have been examined in three stages: every measure on its own, then
    every pair of measures, then the pairs that mattered with their other factors held together. These pages set out
    what each stage found, in plain English, and let you follow any finding back to the public data it came from.

stats:
  - value: "{n}"
    label: numbered observations, in three stages
  - value: "7"
    label: lenses (units of analysis)
  - value: "54"
    label: public data sources
  - value: "5"
    label: research questions, still to answer

banner: >-
  **Stage 1 describes; Stage 2 relates; Stage 3 tests what survives; none explains.** Stage 1's observations say what
  the data show. Stage 2's say which measures go together and whether the link holds in a second sample. Stage 3's say
  how much of each link is left once its other factors are held together, and what structure there is among places,
  countries, industries and institutions. None is a cause, and none answers a research question yet: anything causal
  needs designs that come after the exploration.

journey_intro: >-
  The analysis has three stages, each looking at the same data in a new way. Stage 3's first pass is done and its two
  tables (early signals and data gaps) await the research owner's review. Only then, with the owner's agreement, are
  the five questions answered.

stages:
  - n: "1"
    name: Each variable on its own
    status: Complete
    short: What each measure looks like, how complete it is, and its quirks. 128 observations (U0 to U127).
    href: "#/observations?stage=1"
  - n: "2"
    name: Pairs of variables
    status: Complete
    short: Which measures move together, how strongly, and for whom. 63 observations (B1 to B63).
    href: "#/observations?stage=2"
  - n: "3"
    name: Many variables together
    status: First pass done
    now: true
    short: Whether the signals survive once other factors are held together, and what structure there is. 38 observations (M1 to M38).
    href: "#/stage3"
  - n: "→"
    name: Answering the questions
    status: After the owner's review
    short: The five questions, with evidence proportionate to each claim.

featured:
  id: M1
  intro: >-
    Every observation can be followed from the published data to the finding, and a Stage 3 observation back to the
    Stage 2 signal it tests. This one shows how.
  title: Patents filed without an attorney are still granted far less often, once the factors settled at filing are held
  text: >-
    Stage 2 found that Australian individuals' standard patents filed alone are granted about 36 points less often
    ({B6}). Holding the route, filing year, state and co-filers together, 31.2 points of the gap remain (87.2%), in
    both decades. The chart sets each raw gap (grey) beside the held one (blue), with its interval. Open it to see
    the chain from Stage 2, the reasoning, and why this is an association and not a cause.

stage3:
  title: What Stage 3 found
  intro: >-
    Stage 3 took each signal Stage 2 carried forward and held its named third factors together in one model, to see how
    much of it is left. The bar counts every check by its outcome; the list gives the findings most worth knowing. All
    are associations or descriptions, not causes.
  items:
    - title: Filing without an attorney still goes with far fewer grants
      text: >-
        With the route, year, state and co-filers held together, Australian individuals' patents filed alone are
        granted 31.2 points less often (35.8 raw), in both decades; trade marks and designs with no agent before the
        first renewal are less often in force after it. Not a cause: an application dropped early may never appoint an
        attorney.
      ids: [M1, M2]
    - title: "Australian organisations' patents: three readings that still disagree"
      text: >-
        At the same reach they are less likely to end (hazard ratios 0.648 to 0.811), yet they reach fewer offices and
        are cited about 27% to 30% less at the same reach, field, route and year. None of the three is value; they
        must be read together.
      ids: [M3, M4]
    - title: Expedited examination is not a sign of a longer life
      text: >-
        Its link with staying in force does not survive the filer, field and route held together, and Australian
        individuals' expedited patents are about a quarter more likely to end in a given year.
      ids: [M5]
    - title: Some Australian invention ends up owned overseas, by two routes
      text: >-
        Granted Australian-founded patents are more often now held only overseas, at the same reach and filer type, and
        so are patents filed before the firm's first registration. Inventions made here and filed from overseas come in
        about equal numbers from international teams and from all-Australian ones.
      ids: [M6, M27, M30]
    - title: The same organisations file more divisionals
      text: >-
        Divisionals doubled within the same filers (+19.18 points for Australian organisations, +10.97 for overseas
        ones), not through a change in fields or filers.
      ids: [M26]
    - title: Fees look a weak lever
      text: >-
        Owners did not let rights go more often at the anniversary after any of nine renewal fee changes (for patents,
        within about 1.4 points either way), and with trend and season held most filing fee breaks do not behave as
        prices would.
      ids: [M28, M34]
    - title: "Among firms, age, form and size go with filing; R&D spend only weakly"
      text: >-
        Older R&D claimants and public companies more often have a filing linked, held together; government suppliers
        that file win about two and a half times the contracts; among large employers the size gap widens within an
        industry. Spending above the median goes with a standard patent by only 4 to 5 points.
      ids: [M8, M9, M11, M29]
    - title: "Places: one advantage gradient, and what lies beyond it"
      text: >-
        Advantage, income and education are mostly one measure. Beyond it, business density, manufacturing businesses
        and places with more degrees than their resources suggest go with filing; residents' incomes add nothing
        detectable; remoteness stays.
      ids: [M13, M14, M31, M32]
    - title: Across countries and industries, patents follow business R&D
      text: >-
        Across OECD members, patenting at home follows business R&D at the same income and size; across industries,
        patents allocated per business follow business R&D at the same value added. Australia is nearest Norway, New
        Zealand and Sweden on non-IP indicators.
      ids: [M17, M18, M22]
    - title: "Institutions: research that patents cite goes with their own patenting; licence income does not follow patents"
      text: >-
        Across every kind of institution, with kind and size held, research that patents cite goes with more patents
        per work. At the same research spend, more patents are not seen to go with more licence income.
      ids: [M38, M24]
    - title: "Raising the Bar's rush holds; the business cycle barely shows"
      text: >-
        With trend and season held, Raising the Bar's rush and Australians' lower level of patents after it hold, while
        the Designs Act's step does not stand apart from a control. With block resampling, the cycle shows only in
        overseas applicants' trade marks before 2008.
      ids: [M25, M36, M19]
  page_title: What held once other factors were allowed for
  lead: >-
    Stage 2 found pairs of measures that move together and named, for each, the other factors that might explain it.
    Stage 3 holds those factors together, signal by signal, and says how much of each is left. It also asks what
    structure there is among places, countries, industries and institutions. This page sets out how the test works,
    what its outcomes mean, and every check it made, each linked to its page.
  banner: >-
    **Held is not controlled.** Holding measured factors fixed is not an experiment: factors the data do not hold can
    still explain an association, and some associations run backwards. Every Stage 3 finding is observational or
    descriptive, and none answers a research question yet. Its two tables, early signals and data gaps, await the
    research owner's review.
  how_intro: >-
    Every Stage 3 page follows the same five steps, and shows the first three at its top as a chain: what Stage 2 found,
    what was held together, and what is left.
  how:
    - title: Start from a Stage 2 signal
      short: Signal
      sub: A pair that held in two samples
      text: >-
        A pair of measures that went together in Stage 2, in a first sample and again in a second: for example, filing
        without an attorney and fewer grants ({B6}).
    - title: Name its third factors
      short: Third factors
      sub: What else could explain it
      text: >-
        Stage 2 named, for each signal, the other factors that could make the two measures go together: the route of
        filing, the year, the field, the filer's type, a place's advantage.
    - title: Hold them together
      short: Held
      sub: One model, every factor at once
      text: >-
        One model holds every named factor fixed at once, so the signal is read among rights, firms or places alike in
        all of them. Intervals allow a filer's many rights to be alike, or resample neighbouring quarters in blocks.
    - title: Compare raw and held
      short: Compare
      sub: How much of the signal is left
      text: >-
        The raw figure (Stage 2's comparison, with nothing held) is set beside the held one. The charts show both: grey
        for raw, blue for held, each with its 95% interval.
    - title: Give the outcome, and check it again
      short: Outcome
      sub: Holds, weakened, not detected…
      text: >-
        Holds if at least half is left and the interval is clear of no difference; weakened if less than half is left;
        not detected once held if the interval includes no difference; reversed if it turns the other way. Each is read
        again in the second sample or period.
  example:
    id: M1
    title: "An example: filing without an attorney"
    intro: >-
      Stage 2 found Australian individuals' patents filed alone granted about 36 points less often ({B6}). Stage 3
      held the route, filing year, state and co-filers together.
    text: >-
      Grey dots are the raw gaps, blue the gaps with those factors held, each with its interval. For individuals 87.2%
      of the gap is left in FY2010 to FY2019, and 86.2% in the decade before: it holds. For Australian organisations in
      FY2000 to FY2009 both intervals cross the line of no difference: not detected either way.
  verdicts_intro: >-
    Each outcome is a word as well as a colour. The counts are of checks: a page can check several earlier
    observations, and an observation can be checked by more than one page.
  board_intro: >-
    Every earlier observation Stage 3 revisited, grouped by lens: what Stage 2 (or Stage 1) found, the outcome once other
    factors were held, and the Stage 3 page that made the check. Choose an outcome to see only those checks.
  structure_title: What Stage 3 found about structure
  structure_intro: >-
    Besides testing signals, Stage 3 asked which measures repeat each other and whether there are distinct kinds of
    place or country. These are descriptive.
  structure:
    - title: "Places' characteristics are mostly one advantage gradient"
      text: >-
        Across 2,525 postal areas the first component, advantage, carries 49.5% of the variation, and IRSAD can be
        predicted almost entirely from the other measures. No single measure (income, education) should be read as
        the one that matters.
      ids: [M13]
    - title: Places form a continuum, not kinds
      text: >-
        The best grouping of areas has a silhouette of 0.269, short of clear segments; one group of 288 advantaged,
        educated city areas holds 56% of the placed standard patents.
      ids: [M16]
    - title: Countries differ along several dimensions
      text: >-
        Across 35 OECD members the first component carries 24.7% of the variation. Australia is low on manufacturing
        and exports, high on education and new businesses, and nearest Norway, New Zealand and Sweden.
      ids: [M17]
    - title: Trends dominate the monthly series
      text: >-
        Trade marks' and overseas applicants' series are almost all trend; seasons are strong for provisionals and
        Australians' trade marks; what is left of different series moves together only moderately, perhaps the
        calendar.
      ids: [M20]
    - title: The name match recovers most missing business numbers
      text: >-
        Tested on rights with a known ABN, 1.1% to 4.8% of matches name another ABN. Applied, it closes most of the
        recent fall in patents linked to an ABN and changes no firm finding. Adopting it is the owner's decision
        (OQ26).
      ids: [M12, U126]
  next_intro: >-
    Stage 3 ends with two tables for the research owner's review: fifteen early signals worth investigating, each with
    its evidence, strength and a suggested next step, and thirteen gaps in the data with possible sources and costs.

verdict_words:
  holds: The same direction as the raw figure, its 95% interval clear of no difference, and at least half of the raw size left once the third factors are held together.
  weakened: The same direction and clear of no difference, but less than half of the raw size left, so much of the signal was its third factors.
  not detected once held: The interval with the factors held includes no difference. Not the same as no association; a moderate one may be missed.
  reversed: Clear of no difference, but the other way round from the raw figure.
  appears once held: The raw figure was not detected, but with the factors held an association is clear.
  not detected either way: Neither the raw nor the held figure is clear of no difference.
  does not replicate: Clear in one sample or period but not in the second, so not carried as a signal.
  mixed: The page's parts differ (one group or period holds, another does not); its text says which is which.
  refined: A description that sharpens or corrects an earlier one, rather than a test of a held signal.

stage2:
  title: What Stage 2 found
  intro: >-
    Stage 2 measured every pair of measures in each lens and kept only those that are at least small, survive the
    correction for the number of pairs tested, and hold in a second period or sample. Most such pairs are how the IP
    system works, or one broad gradient of development running through places and countries. These are the signals
    left once those are set aside: associations to test in Stage 3, not explanations. Stage 3 has since tested each;
    every one of their pages says what was left.
  items:
    - title: Filing without an attorney goes with poorer outcomes
      text: >-
        Australian individuals' standard patents filed alone are granted about 36 percentage points less often, in
        both decades and among examined applications too. Australians' trade marks with no agent before the first
        renewal stay in force less often (19.1 points). The arrow may run backwards: an application abandoned early
        may never appoint an attorney.
      ids: [B5, B6, B10]
    - title: Some inventions made here are filed or held overseas
      text: >-
        About one patent in seven with an inventor in Australia is filed from overseas. Australian-filed patents now
        held only overseas are more common among the wide and the granted, though by firm the youngest filers are not
        clearly different. Few of the US patents citing Australian research have an Australian party, but a citation
        is not use, so none of this shows where value is realised.
      ids: [B16, B19, B26, B46]
    - title: Australian organisations' patents reach fewer countries; the signals of value disagree
      text: >-
        Filed in the same number of countries, Australian organisations' patents more often stay in force for 10
        years than overseas organisations', except those filed only in Australia. But they reach fewer countries and
        are cited less, mostly because of that reach. Older Australian families' filings abroad are incomplete in the
        records, so these are read from FY2010.
      ids: [B8, B11, B12, B55]
    - title: Filing follows advantage and remoteness, not one firm
      text: >-
        Each step of area advantage goes with 1.7 to 1.9 times the standard patent rate, and the gradient holds with
        remoteness allowed for and with each area's largest filer taken out. Areas that gained graduates or income over
        a decade were not seen to gain filing, so it looks like a standing difference between places.
      ids: [B29, B30, B58, B59]
    - title: Among firms, filing goes with company form, age and, among large employers, size and industry
      text: >-
        R&D spend goes with patenting only weakly, even within size bands. About half of R&D claimants have no IP
        filing linked to their business number, mostly private companies of 3 to 10 years. Counting every large
        employer, the largest are 24.3 points more likely than the smallest to have a filing linked, and industry
        sorts patenting far more than size.
      ids: [B22, B23, B50, B51]
    - title: Across countries, IP follows R&D and income
      text: >-
        Across OECD members, patenting rises with business R&D almost one for one, and Australia filed about what its
        business R&D predicts in 2016 to 2020. Within a decade, changes in R&D were not seen to go with changes in
        patenting. Few of Australia's researchers work in business (31st of 37 members).
      ids: [B32, B33, B34, B61]
    - title: Policy changes broke series as the law required; few breaks show behaviour, and fee changes rarely moved filing
      text: >-
        Seven of eight policy changes moved a series further than any comparison month, but most of those breaks were
        certain by law. The rush before Raising the Bar is the clearest sign of applicants' behaviour. Of the changes in
        fees to obtain a right, only one break went the way a price would; of the changes in renewal fees, only one
        (trade marks, July 1993) survives every check.
      ids: [B37, B47, B49]
    - title: Women's share among inventors varies by field more than by filer
      text: >-
        From 4.2% in civil engineering to 26.9% in biotechnology, an order that holds across decades. On provisional
        applications, Australian organisations' inventors include more women than Australian individuals'.
      ids: [B17, B18]
    - title: Across industries, the patents allocated by technology follow R&D once services are counted
      text: >-
        Industry counts are applications allocated by what they protect, not what each industry's businesses file.
        Through the crosswalk with services, patents allocated per business follow business R&D per business. A
        division's share of innovating businesses showed no clear pattern with patenting in three surveys.
      ids: [B53, B54, B42, B60]
    - title: Institutions whose research US patents cite more also patent more
      text: >-
        Larger, more cited universities file more patents per work. Across institutions, disclosures go with patents and
        patents with licence income, partly because every measure is divided by the same research spend. No association
        was detected between industry-partnered grants and joint filing, though a moderate one is not ruled out.
      ids: [B44, B45, B62]

ten_title: Ten things Stage 1 found
ten_intro: >-
  Read together, Stage 1's observations point to a handful of patterns. Each is descriptive: a shape in the data
  worth testing, not an explanation. The numbers link to the observations behind them.

ten:
  - title: Patents are mostly filed from overseas; trade marks mostly from home
    text: >-
      About nine in ten standard patents filed in Australia come from overseas (the United States alone 43.6%), while
      Australians file 59.19% of trade marks. China now files as many patent applications here as Australians do, and
      three-quarters of Australians' own applications are made abroad.
    ids: [U13, U70, U93]
  - title: Almost everything is concentrated
    text: >-
      The top 1% of filing firms filed 55.3% of firms' standard patents; the tenth of postal areas with the most
      patents filed 72.5% of them with 29.2% of the people; five attorney firms handle 63.96% of standard patents;
      the Group of Eight hold two-thirds of ARC and NHMRC funding.
    ids: [U44, U52, U21, U83]
  - title: Places differ far more than chance would make them
    text: >-
      68.2% to 72.5% of areas file below what chance allows around the national rate, and 6.7% to 15.5% above it,
      in small areas and pooled ones alike. Later stages must model this spread rather than assume it away.
    ids: [U53]
  - title: Australians, above all individuals, often file without an attorney
    text: >-
      Overseas filers use an attorney for 99.0% of standard patents, Australian filers for 85.4%, and Australian
      individuals file 62.4% of their trade marks alone.
    ids: [U20, U48]
  - title: Provisional applications doubled in FY2026
    text: >-
      10,069 against 4,143 to 5,047 a year before, mostly from individuals but from organisations too, both broadly
      and through a few heavy filers. It is in the filings, not the recording. Why is a question for IP Australia.
    ids: [U8]
  - title: Around some policy changes, filing shows clear rushes, steps and pauses
    text: >-
      Rushes to file before a rule changed (Raising the Bar, 4.41 times Australians' usual month; the innovation
      patent's closure, 4.31 times), steps, and pauses when new Acts began; around other changes nothing stands out.
      These timings are the raw material for the natural experiments the later questions need.
    ids: [U28, U3]
  - title: Later standard patents more often stay in force; about half of trade marks are still in force after ten years
    text: >-
      Standard patents' median time in force rose from 10.6 years (granted in the 1980s and 1990s) to 13.5 (2000s and
      2010s). These are shares still on the register, not value; the research owner adopted years in force as a
      working measure for Stage 2, alongside other signals.
    ids: [U36]
  - title: US patents often cite Australian research, and R&D spending has fallen
    text: >-
      US patents often cite Australian research institutions' work; 93.6% of those citations come from patents with
      no Australian applicant or inventor, as most US patents have none. A citation is not use. Australia's R&D
      spending rose to 2008 as a share of GDP and has fallen since, below the OECD median.
    ids: [U85, U65, U66]
  - title: The register's history shapes what it can say
    text: >-
      Early years hold only the rights that survived until records were computerised; some events were dated in
      batches; patent ownership history starts in FY2003. Each is handled, but each limits comparisons over time.
    ids: [U23, U17, U34]
  - title: Links between datasets are the weakest point
    text: >-
      Firms' IP counts are lower bounds; IP RAPID links fewer recent filers to a business number (IP Australia's
      register restores most for trade marks and designs); only large employers have an industry; half the
      universities' patents carry a postcode that is not a place where people live.
    ids: [U41, U45, U75, U87]

reading:
  intro: >-
    Every observation page has the same parts, and each part looks different, so that a finding is never confused
    with the reasoning, assumptions or limits around it.
  parts:
    - kind: obs
      title: The observation
      text: The finding itself, in a green box with its number (U0 to U127 in Stage 1, B1 to B63 in Stage 2, M1 to M38 in Stage 3). Only this is a finding.
    - kind: step
      title: Reasoning steps
      text: How the data lead to the finding, one step at a time, in dashed grey. Steps are not findings.
    - kind: assume
      title: Assumptions
      text: Where the analysis takes something as given. Marked in amber, so you can judge them.
    - kind: limit
      title: Limits
      text: What the observation cannot tell you, in rose.
    - kind: explain
      title: Explainers
      text: Statistical or technical terms, explained in blue beside the text, and on any dotted word.
  strength_intro: >-
    The research goal asks every claim to say how strong its evidence is. There are four levels. Everything in
    Stage 1 is the first; most of Stages 2 and 3 is the second.
  strengths:
    - name: Descriptive
      now: true
      stages: [1, 2, 3]
      text: What the data show. How much, how often, for whom. No claim about why.
    - name: Observational
      now: true
      stages: [2, 3]
      text: Things go together, even with other factors held. There may be other explanations. Stages 2 and 3 produce these.
    - name: Causal
      text: One thing causes another. Needs a design, such as a natural experiment, that this exploration does not have.
    - name: Projected
      text: An estimate of the future, with its assumptions stated. Belongs to Question 5.

observations_intro: >-
  Every observation from the three stages, grouped by lens and the notebook's sections, which open and close. Stage
  1's (U numbers) describe one measure at a time; Stage 2's (B numbers) relate two measures and say whether the link
  held in a second sample; Stage 3's (M numbers) hold a Stage 2 signal's other factors together and say what is left.
  Filter by lens, question, stage or Stage 3's outcome, or search; an earlier observation that Stage 3 tested shows
  the page that tested it.

storage_text: >-
  **Kept as published.** Each publisher's file is downloaded and kept exactly as released (the "raw" copy), so any
  number can be traced back to the original.


  **Tidied, not changed.** Each raw file is converted into tidy tables in a standard format (Parquet), one row per
  record, with the publisher's values kept. Where a source had to be repaired, the repair is written into code and
  recorded in a decision record, and the raw file still holds the original.


  **Fingerprinted.** Every file gets a fingerprint (a SHA-256 hash: a code that changes if a single character of the
  file changes), its size, rows and location, in the project's manifest. Tests check the files against the
  fingerprints.


  **Stored in two places.** Small tables are kept in the GitHub repository itself. Large ones (IP RAPID's events, the
  business register and others) are kept in a private cloud storage bucket (Cloudflare R2), because they are too big
  for GitHub; the manifest records them in the same way.

lenses_page:
  intro: >-
    A lens is an analysis-ready table with one row per thing being described: an IP right, a firm, a place, a country
    in a year, a month, an industry in a year, or a research institution in a year. Every source in the corpus is
    attached to at least one lens.
  why: >-
    Two measures can only be compared if they describe the same thing. A patent count and a population cannot be set
    side by side until both are counted for the same place. So every table is brought to a lens's unit by a stated
    join or sum, and each lens keeps one row per unit (a test checks). Where two sources measure the same thing, one
    is the main measure and the other a labelled comparison; they are never added together.

questions_page:
  intro: >-
    The research asks five questions, from what public value the IP system creates to what interventions could
    achieve. Stages 1 and 2 do not answer them. They find out what the data can and cannot say about each, and which
    measures go together, so that the answers, when they come, rest on sound ground.
  caution: >-
    Each observation names the questions it moves closer to and says how. Those links are the analyst's guide, not
    findings: an observation about patents filed from overseas does not, on its own, say anything about who benefits.

data_page:
  intro: >-
    Every number on these pages starts in data that a public body published: IP Australia, the ABS, the ATO, the
    World Bank, WIPO, the OECD and others. Nothing is typed in by hand. This page follows a number from its publisher
    to an observation, and lists every source with its licence and where it is kept.
  sources_intro: >-
    The source register (54 sources). Observation {U0} describes the corpus as profiled on 25 October 2026 (41
    sources, 162 tables); the research institutions' register (ROR) was added the next day, IP Australia's own
    register after that, and the fee history, the Reserve Bank's rates, the national accounts, the ATO's statistics
    by postcode, WGEA's employers and others while filling the data gaps Stage 2 found. Open a source to see its
    tables, their size, where each is kept and its fingerprint.
  journey:
    - title: Published
      short: Published
      sub: A public body releases the data
      text: >-
        A publisher releases data on its website or an open data portal, under a licence (most here are Creative
        Commons, which allow reuse with credit).
    - title: Copied as published
      short: Copied
      sub: The raw file is kept unchanged
      text: >-
        The project downloads the file and keeps it exactly as released, with the date it was copied. Nothing is
        retyped.
    - title: Tidied into tables
      short: Tidied
      sub: One row per record, values kept
      text: >-
        Code (one module per source, in the repository) reads the raw file into tidy tables. Values are not changed;
        where a source needed repair, the repair is in code and recorded.
    - title: Fingerprinted and stored
      short: Stored
      sub: In GitHub, or cloud storage if large
      text: >-
        Each table's fingerprint, rows and location go into the manifest. Small tables live in the repository; large
        ones in a cloud storage bucket.
    - title: Built into a lens
      short: Lens
      sub: One row per right, firm, place…
      text: >-
        The build code joins the tables into seven lenses, one row per unit. Every derived column is defined in one
        file, so anyone can check exactly how it was made. Lenses are rebuilt in minutes, never edited by hand.
    - title: Profiled in the notebook
      short: Profiled
      sub: Queries, charts and outputs saved
      text: >-
        A notebook runs a query on a lens, and saves its output (a table or chart) with the notebook, so it can be
        read on GitHub without running anything. Stage 1's notebook profiles each measure; Stage 2's relates pairs;
        Stage 3's holds several together in one model.
    - title: Written as an observation
      short: Observation
      sub: Quoting the output above it
      text: >-
        The analyst writes the observation directly under the output, quoting its numbers. If a number is not on the
        page, it is not a finding. These pages are checked against the notebook in the same way.

limits:
  intro: >-
    The three stages are groundwork. They are honest about what they are: a careful description of each measure on its
    own, then of which measures go together, then of how much of each link is left once its other factors are held.
    This page gathers what they cannot do, the assumptions they make, where the data are weakest, and the mistakes
    found and corrected on the way.
  cannot_title: What the three stages cannot tell you
  cannot:
    - title: Why
      text: >-
        Stage 1's observations are descriptive and Stage 2's are associations. Stage 3 holds the measured third
        factors together, which is not an experiment: factors the data do not hold can still explain a link, and some
        links may run backwards (an application abandoned early may never appoint an attorney, {B6}, {M1}). Causal
        claims need designs, such as natural experiments, that come after the exploration.
    - title: What "not detected" means
      text: >-
        When Stage 3 says a link is not detected once held, its interval includes no difference. That is not evidence
        of no link: with 19 industries, about 40 universities or 36 countries, a moderate link can go undetected.
        Only for patents' renewal at each anniversary is the null precise (within about 1.4 points, {M28}).
    - title: Value
      text: >-
        Counts of rights, lifetimes, reach and citations are measures of activity and private value, not of public
        value. The research goal treats them as indicators, never as success.
    - title: People from places
      text: >-
        Stage 2's pairs across postal areas and countries describe the areas and countries, not the people or firms in
        them. Areas with more graduates file more; that does not show the graduates are the filers.
    - title: Small units
      text: >-
        Industries (19 divisions), OECD members (36 to 38) and research institutions (about 40 universities, 60 to 84
        institutions) are few, so their intervals are wide and their results are leads at most; a second period of the
        same units is a stability check, not a replication.
    - title: Everyone
      text: >-
        The firms lens holds businesses found in an IP, R&D, procurement or tax source, not all businesses, so shares of
        large employers that file are taken over every employer ({B50}). Individuals in IP RAPID are pseudonymised,
        so their gender cannot be estimated; only inventors' can, from names, and reliably only for inventors in
        Australia.
    - title: Small firms
      text: >-
        Size and industry are known only for employers of 100 or more (WGEA). Without the ABS's BLADE (linked business
        data, ruled out for now), small firms' size, industry, growth and survival are out of reach (OQ20). This limits
        how far Questions 3 and 5 can be answered.
    - title: The present
      text: >-
        The latest months of some records are incomplete because the register records them late (trade mark and
        design cessations, recent ABN links, perhaps priority claims, {B38}). Each observation says which years are
        safe to compare.
  assumptions:
    - Public data are taken to be what their publishers say they are. Where checks found otherwise (placeholder dates,
      mislabelled countries, numbers counted twice), the data were repaired and the repair recorded; elsewhere, the
      publisher's values stand.
    - A business is identified by its ABN. Related companies in a group have different ABNs and are counted apart.
    - A place is a postal area, reached through the postcode recorded on an application or in the business register.
      A registered address may be a head office or an adviser's, not where the work is done.
    - An industry is reached through what a right protects (its technology or goods classes), by published
      probabilities, because few firms in the corpus have an industry.
    - Gender is estimated from first names and countries, as a probability summed over many people; it says nothing
      about any one person, and is read only for inventors in Australia.
    - Money is shown as recorded (nominal) unless a page says otherwise; fees are also shown in June 2026 dollars,
      adjusted with the quarterly Consumer Price Index.
    - Where a series begins with only the survivors of an earlier system, or with partial records, those years are
      left out rather than estimated.
    - "Stage 2 measures every pair on one scale from 0 to 1 and calls a pair a lead only if it reaches 0.1, survives the
      correction for the number of pairs, holds in a second period or sample, and is not two versions of one measure
      (ADR 0030)."
    - "Stage 3 calls a signal held if, with its third factors held together, it keeps its direction, its 95% interval is
      clear of no difference and at least half of its raw size is left (ADR 0046). A filer's rights are one source of
      evidence (clustered by the filer's party), and quarterly changes are resampled in blocks."
  weak_intro: >-
    The binding limit on what this research can say is how well its datasets link together. These are the links the
    two stages found weakest.
  weak:
    - title: Firms
      text: Firms reach IP only through business numbers on applications, so firms' IP counts are lower bounds; IP RAPID's recent filings carry fewer, and IP Australia's register restores most for trade marks and designs ({U41}, {U45}, {U100}). A name match recovers most of the rest and changes no firm finding, but is kept apart from the counts ({M12}). Size and industry reach only employers of 100 or more ({U112}), the main third factor every firm signal lacks.
    - title: Industries
      text: Industries reach patents only through a crosswalk; the recommended one leaves out services, so a second one with services sits beside it ({U75}, {U114}).
    - title: Places
      text: Places reach IP only through postcodes, and half the universities' patents carry a postcode where no one lives ({U49}, {U87}).
    - title: Institutions
      text: Research institutions reach their IP through a reviewed list of names and business numbers that someone in the sector has yet to check ({U81}, OQ11).
    - title: Inventors and families
      text: Inventors' countries are known mostly for patents also filed abroad, gender only as an estimate that holds for Australia ({U95}, {U97}), and older Australian families' filings abroad are incomplete before FY2010 ({B55}, OQ21).
  corrections_intro: >-
    The record corrects its own mistakes when they are found, in the notebooks and in the summaries. These are the
    corrections made during the three stages and in building these pages.
  corrections:
    - when: 25 October 2026
      what: The policy register said the Patents Act 1990 brought in 20-year patents.
      now: Its term was 16 years until 1 July 1995; the change is now the 17th policy event ({U23}).
    - when: 25 October 2026
      what: Charts of trade marks before 1983 and designs before 1986 showed survivors without saying so.
      now: Corrected in {U5} and {U10}; the series start where records are complete.
    - when: 26 October 2026
      what: The World Bank's trade mark series was described as applications.
      now: It counts classes, as WIPO's do ({U67}).
    - when: 26 October 2026
      what: Five figures differed slightly between builds of the lenses, because two ties were broken arbitrarily.
      now: The ties are fixed, two builds agree row for row, and the figures are corrected ({U48}, {U49}, {U52}, {U53}).
    - when: 26 October 2026
      what: Three more figures depended on how ties fell (the share of people in the top tenth of areas; universities' postcodes).
      now: "Corrected ({U52}: 29.2% and 32.8% of people; {U87}: UNSW's 210, not 216)."
    - when: 27 October 2026
      what: Observation {U0} still gave the first corpus profile (152 tables from 38 sources) when the output above it gave the later one.
      now: The notebook's text now follows its output (162 tables from 41 sources), found while building these pages.
    - when: 29 October 2026
      what: "{B11} left open whether the fall in Australian organisations' patents filed only in Australia (73.0% to 40.68%) was a change in practice or in the records."
      now: Mostly the records. Older Australian families' filings abroad are incomplete ({B55}), so family measures for Australian applicants are read from FY2010.
    - when: 1 November 2026
      what: Firms that file were counted from IP RAPID's own records, which miss the business numbers IP Australia's register links.
      now: One flag now counts any linked filing; sole traders' and R&D claimants' shares moved, and "never filed" became "no filing linked" ({U42}, {U54}, {B23}).
    - when: 2 November 2026
      what: An application's origin and type were the current holder's.
      now: They are the filer's, IP Australia's definition of a resident application; most shares moved by a point or less ({U7}, {U13}, {U67}).
    - when: 2 November 2026
      what: Firms' first filings were read as their entry into the system, and changes of holder as transfers.
      now: They are first observed filings and two endpoints, filing and today ({U101}, {U18}, {B19}).
    - when: 2 November 2026
      what: Lifetimes counted every right from the start of its term, and were described as renewal.
      now: Each right is counted from its grant or registration, and read as the share still in force; expedited patents' link with lifetime reversed ({U36}, {B8}, {B10}, {B13}).
    - when: 2 November 2026
      what: Policy and fee breaks were read without controls, and against placebo dates as if those were probabilities.
      now: Each break is classed by kind and set beside series it should not have moved; most were certain by law ({B37}, {B47}, {B49}).
    - when: 2 November 2026
      what: A final review of both stages found 68 of 186 observations reading further than their numbers, or quoting a figure the output did not give.
      now: "Each is restated in the notebook with the earlier wording kept. The largest change: shares of large employers that file are taken over every employer, not only those in the firms table (48.6% to 72.9% by size, not 70.4% to 82.5%; {U112}, {B50}). Weak links are no longer written as absences, same-unit samples as replications, industry allocations as filing, or US patent citations as use ({B39}, {B32}, {B41}, {U85}, {B46})."
    - when: 2 November 2026
      what: These pages had fallen behind the notebooks for 131 observations, and four charts no longer matched the data.
      now: Every page was brought into line with its notebook, the charts now use the filer's origin and the current survival method, and 40 more pages have a chart (178 of 186).
    - when: 3 November 2026
      what: A review of all three stages found that Stage 3's first pass had left eighteen of Stage 2's carried signals untested, with renewal at each right's anniversary, while its table said all were taken up.
      now: "Each now has its test ({M26} to {M38}); two figures were corrected where they stood ({M1}'s verdict, {M16}'s lowest silhouette), and the labour market and the IP judgments, planned for the timeline, were attached ({U124}, {B63})."
    - when: 3 November 2026
      what: Stage 3's helper for yes or no outcomes returned a meaningless interval, silently, when two held factors picked out the same rows.
      now: It drops the repeated factor before fitting (a test covers it); the notebook was re-run in full and no earlier figure changed.
    - when: 3 November 2026
      what: These pages were frozen while Stage 3 ran, so 53 earlier observations that Stage 3 tested still read as Stage 2 left them.
      now: Every Stage 3 observation has a page, and each earlier page it tested says what was left once other factors were held, with a link to the test.

next:
  intro: >-
    The three stages have prepared the ground: every measure described, every pair related, and each pair that mattered
    tested with its other factors held together. Stage 3 ends with two tables for the research owner's review: early
    signals worth investigating and gaps in the data. Nothing here answers a research question; that comes only after
    the owner's review, with designs proportionate to each claim.
  stages:
    - name: Stage 2, pairs of variables
      when: Complete (28 October 2026; reviewed 2 November)
      asks: Which pairs of measures move together, in what shape, how strongly, and for whom?
      how: >-
        Within each lens, every pair of variables was screened on one scale. A pair counted as a lead only if it was at
        least small, survived the correction for the number of pairs tested, and held in a second period or sample;
        the planned pairs were then measured in plain units, with intervals.
      example: >-
        Postal areas with more advantaged residents file 1.7 to 1.9 times as many standard patents per person for
        each step of advantage, and the gradient is not one firm's ({B29}, {B30}).
      adds: >-
        The first **observational** evidence: associations that bear on who benefits (Q2) and on the conditions for
        value (Q3), each with its candidate third factors.
      done: Every pair within each lens screened; each lead with its size and interval, past the correction and held in a second sample.
    - name: Stage 3, many variables together
      when: First pass done (3 November 2026); tables await the owner's review
      now: true
      asks: Do the signals survive once other factors are held together? What structure and groups exist?
      how: >-
        Each signal Stage 2 carried was modelled with its named third factors held together, and its raw and held
        figures compared (holds, weakened, not detected once held, reversed). The methods the final review asked for
        were used throughout: intervals that allow a filer's rights to be alike, block resampling of quarterly
        changes, citations counted at a fixed age, industry comparisons through the crosswalk with services, and
        research spend as a base. Places' and countries' characteristics were reduced to a few components, and places
        grouped to see whether they form kinds.
      example: >-
        Is an area's patent rate still linked to advantage once its business mix and education are allowed for? Yes,
        but weaker: 35% to 39% of the ratio is left, and business density and degrees beyond resources matter too
        ({M14}).
      adds: >-
        Separates signals that hold from ones explained by something else, and produces two tables: fifteen early
        signals, with their evidence and strength, and thirteen data gaps, with possible sources and costs.
      done: When the owner has reviewed the two tables and decided on the name match (OQ26).
    - name: Answering the questions
      when: After the owner's review, with the owner's agreement
      asks: The five research questions.
      how: >-
        Analyses designed for each question: descriptive where that suffices, and natural experiments or other
        designs wherever an additional benefit is claimed.
      example: >-
        Using Raising the Bar as a natural experiment, following who rushed and what their rushed applications became,
        to estimate what a policy actually changed ({M25}).
      adds: Answers with evidence proportionate to each claim, as the research goal requires.
      done: When the owner adopts the findings.
  signals_title: Early signals that warrant further investigation
  signals_intro: >-
    Stage 3's first table, for the research owner's review (section 8 of the Stage 3 notebook). Each signal is an
    association that survived its third factors held together, in both samples unless marked; none is a cause, and
    adopting any as a conclusion is the owner's decision.
  signals:
    - signal: Filing alone goes with far fewer grants (Australian individuals' standard patents, about 31 points), and no agent before the first renewal with fewer trade marks and designs in force after it, with the factors settled at filing held
      ids: [B5, B6, B10, M1, M2]
      strength: Observational, holds in both decades
      questions: [2, 4]
      next: "A design that separates the choice of an attorney from the outcome: the same filers' applications with and without one, or a change in what representation costs"
    - signal: Within the same reach, Australian organisations' patents are less likely to end, yet reach fewer offices and are cited less at the same field, route and year
      ids: [B8, B11, B12, B55, M3, M4]
      strength: Observational (three readings that disagree)
      questions: [1]
      next: Validate each as a sign of value against licensing, litigation or sale; read the three together, never one alone
    - signal: Expedited examination is not a sign of a longer life once the filer, field and route are held; for Australian individuals it goes with a shorter one
      ids: [B13, M5]
      strength: Observational
      questions: [1, 4]
      next: Separate work-sharing requests from applicants' own (OQ25); ask what individuals expedite for
    - signal: Granted Australian-founded patents are more often now held only overseas, at the same reach and filer type; so are patents filed before the filing firm's first registration (+5.40 and +6.21 points)
      ids: [B16, B19, B26, M6, M30]
      strength: Observational, two endpoints
      questions: [1]
      next: Dated ownership changes and the holders' identities, to read moves rather than endpoints
    - signal: "Women among inventors: on provisionals more on organisations' than individuals'; on standard patents the field accounts for the filer gap"
      ids: [B17, B18, M7]
      strength: Observational
      questions: [2]
      next: Women by field within filers; the provisionals' recent coverage (OQ17)
    - signal: Among R&D claimants, older firms, higher spenders and public companies more often have a standard patent linked, held together; among suppliers, company form, age and a city address (not the postcode's advantage); suppliers that file win more contracts and value; among large employers the size gap widens within industry; large taxpayers that file report no more income
      ids: [B22, B23, B24, B50, B51, M8, M9, M11, M12, M29]
      strength: Observational
      questions: [2, 3, 4]
      next: Firm size and industry for small firms (OQ20); the timing of filing against contracts and claims
    - signal: Filing concentrates in advantaged, educated city areas, and beyond the advantage gradient goes with business density, degrees and R&D claimants beyond what resources predict, and manufacturing's share of businesses (where Stage 2 saw none); remoteness stays; most attached indicators are the gradient
      ids: [B27, B28, B29, B30, B31, M13, M14, M15, M16, M31, M32]
      strength: Observational, between areas
      questions: [2, 4]
      next: Where filers work against where they are registered; universities' postcodes ({U49}, {U87})
    - signal: Across OECD members, residents' patents follow business R&D at the same income and size, as do research effort's other measures among the attachments; Australia sits near the line, among Norway, New Zealand and Sweden on the non-IP indicators
      ids: [B32, B33, B34, B35, M17, M18, M33]
      strength: Observational, 36 countries (a lead)
      questions: [1, 4]
      next: Use the nearest members as the comparison set for Australia's IP system
    - signal: Patents allocated per business follow business R&D across divisions at the same value added; three survey items (ideas from within the business, work methods, small firms' focus on costs) and fewer business exits go with IP per business at the same size and value added
      ids: [B43, B53, B54, M22, M37]
